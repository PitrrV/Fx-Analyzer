name: RP+ER Backtest (MAE/MFE pro entry model)

# Jen ruční spuštění — diagnostický nástroj (scripts/backtest-rper-mae.js),
# appka ho nečte, engine se jím neupravuje. Na dostupném ~60denním
# intradenním (Yahoo) okně spočítá, jak hluboko cena typicky jde PROTI směru
# RP+ER obchodu (MAE), než se u výher otočí — podklad pro návrh entry
# modelu/SL. Viz hlavička scripts/backtest-rper-mae.js.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rper-backtest-mae
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Spustit MAE/MFE backtest
        run: node scripts/backtest-rper-mae.js
      - name: Commit při změně
        run: |
          git config user.name "rper-backtest-mae-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/backtest_rper_mae.json)" ]; then
            git add data/backtest_rper_mae.json
            git commit -m "chore: update RP+ER MAE/MFE backtest [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Beze změny."
          fi
