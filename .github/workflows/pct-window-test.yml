# Jednorázová analýza: srovnání COT percentilu (celá historie vs okno 78 týdnů).
# Jen ruční spuštění, nic nezapisuje — výsledky se čtou z logu jobu.
name: Pct Window Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/backtest-pct-window.js
