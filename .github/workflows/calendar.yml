name: Economic Calendar

on:
  schedule:
    - cron: "11 * * * *"   # každou hodinu (~1h zpoždění je OK)
  workflow_dispatch:        # ruční/API spuštění

permissions:
  contents: write

concurrency:
  group: calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Stáhnout kalendář
        run: node scripts/fetch-calendar.js
      - name: Commit při změně
        run: |
          git config user.name "calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/calendar.json)" ]; then
            git add data/calendar.json
            git commit -m "chore: update calendar [skip ci]"
            git push
          else
            echo "Beze změny, nic necommituju."
          fi
