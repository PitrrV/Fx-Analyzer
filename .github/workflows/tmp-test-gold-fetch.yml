name: TMP Test Gold Fetch Scripts (dispatch-only, no commit)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run fetch-gold-cot.js
        run: node scripts/fetch-gold-cot.js
      - name: Print data/gold_cot.json
        run: cat data/gold_cot.json | head -c 3000
      - name: Run fetch-gold-price.js
        run: node scripts/fetch-gold-price.js
      - name: Print data/gold_price.json
        run: cat data/gold_price.json
