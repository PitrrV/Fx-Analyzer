name: RP+ER Backtest

# Jen ruční spuštění — měřicí nástroj (scripts/backtest-rper.js), appka ho
# nečte, engine se jím neupravuje. Stejný princip jako calibration.yml
# (COT backtest). Stahuje si vlastní 2letou historii cen (Frankfurter/Yahoo),
# nezávislou na appčině krátké přírůstkové data/prices.json.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rper-backtest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Spustit RP+ER backtest
        run: node scripts/backtest-rper.js
      - name: Commit při změně
        run: |
          git config user.name "rper-backtest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/backtest_rper.json)" ]; then
            git add data/backtest_rper.json
            git commit -m "chore: update RP+ER backtest [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Beze změny."
          fi
