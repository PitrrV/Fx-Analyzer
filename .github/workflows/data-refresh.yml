name: Data Refresh (kalendář + VIX + ropa + AI radar)

# Sloučení 4 dřív samostatných workflow (calendar.yml, vix.yml, oil.yml,
# radar.yml) — všechny na cron */15 * * * *. GitHub měl na účtu s víc
# repozitáři a víc naplánovaných cronů reálně naplánovaná spouštění silně
# nespolehlivá (pozorováno: appka i Fundament-app dostávaly "Všechny úlohy
# byly zrušeny", a hodinový cron FX Prices se ve skutečnosti spouštěl jen
# ~jednou za 2-2,5 h místo jednou za hodinu) — problém není kolize mezi
# konkrétními workflow na stejné minutě, ale celkový POČET registrovaných
# scheduled triggerů na účtu. Sloučením 4 triggerů do 1 appka dělá stejnou
# práci, ale GitHubu eviduje jen jedno naplánované spuštění místo čtyř.
#
# Každý krok si zachovává PŮVODNÍ chování 1:1 — vlastní fetch skript, vlastní
# soubor(y), vlastní commit se stejnou zprávou jako předtím. continue-on-error
# na fetch krocích: selhání jednoho zdroje (např. výpadek ForexFactory) nesmí
# zablokovat commit ostatních tří — přesně jako když běžely jako 4 nezávislé
# workflow. timeout-minutes jako pojistka proti zaseknutému fetchi, co by
# jinak zdržel zbytek běhu (běžná doba jednoho kroku je řádově desítky vteřin).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Stáhnout kalendář
        timeout-minutes: 5
        continue-on-error: true
        run: node scripts/fetch-calendar.js
      - name: "Commit: kalendář při změně"
        if: always()
        run: |
          git config user.name "calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/calendar.json data/calendar_hist.json)" ]; then
            git add data/calendar.json data/calendar_hist.json
            git commit -m "chore: update calendar [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Kalendář beze změny, nic necommituju."
          fi

      - name: Stáhnout VIX (FRED historie + živá cena CBOE/Yahoo)
        timeout-minutes: 5
        continue-on-error: true
        run: node scripts/fetch-vix.js
      - name: "Commit: VIX při změně"
        if: always()
        run: |
          git config user.name "vix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/vix.json)" ]; then
            git add data/vix.json
            git commit -m "chore: update VIX risk regime [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "VIX beze změny."
          fi

      - name: Stáhnout cenu ropy (WTI)
        timeout-minutes: 5
        continue-on-error: true
        run: node scripts/fetch-oil.js
      - name: "Commit: ropa při změně"
        if: always()
        run: |
          git config user.name "oil-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/oil.json)" ]; then
            git add data/oil.json
            git commit -m "chore: update oil price [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Ropa beze změny."
          fi

      - name: Stáhnout a analyzovat zprávy (AI Market Radar)
        timeout-minutes: 8
        continue-on-error: true
        env:
          GEMINI_KEY: ${{ secrets.RADAR_GEMINI_KEY }}
          FINNHUB_KEY: ${{ secrets.RADAR_FINNHUB_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.RADAR_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.RADAR_TELEGRAM_CHAT_ID }}
        run: node scripts/fetch-radar.js
      - name: "Commit: AI radar při změně"
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="data/radar_feed.json data/radar_hist.json data/radar_cache.json data/radar_reports.json"
          EXISTING=""
          for f in $FILES; do [ -f "$f" ] && EXISTING="$EXISTING $f"; done
          if [ -n "$EXISTING" ] && [ -n "$(git status --porcelain $EXISTING)" ]; then
            git add $EXISTING
            git commit -m "chore: update AI Market Radar feed [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "AI radar beze změny, nic necommituju."
          fi

      # US100 (Nasdaq-100) makro komponenty — vlastní soubor (data/us100_macro.json),
      # nezávislý na krocích výš. FRED data se mění nanejvýš 1× denně, na 15min
      # cronu to prostě většinu běhů skončí na "beze změny" (idempotentní, levné).
      - name: "Stáhnout US100 makro (FRED: výnosy, dolar, sazby)"
        timeout-minutes: 5
        continue-on-error: true
        run: node scripts/fetch-us100-macro.js
      - name: "Commit: US100 makro při změně"
        if: always()
        run: |
          git config user.name "us100-macro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/us100_macro.json)" ]; then
            git add data/us100_macro.json
            git commit -m "chore: update US100 macro data [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "US100 makro beze změny."
          fi

      # Snapshot komponent skóre do data/engine_hist.json — dřív běžel jen 1×
      # denně (engine-snapshot.yml, 21:30 UTC), takže graf "Vývoj skóre" ukazoval
      # dnešní pohyb až večer, i když appka sama skóre přepočítává průběžně celý
      # den. scripts/snapshot-engine.js PŘEPISUJE (ne přidává) záznam pro dnešek
      # při každém běhu — takže na 15min cronu graf ukazuje aktuální dnešní
      # hodnotu prakticky live, starší dny zůstávají netknuté (viz komentář ve
      # skriptu). Přesunuto z vlastního workflow, ať se drží stejná zásada jako
      # kalendář/VIX/ropa/AI radar výš — jeden scheduled trigger na účtu, ne
      # další (GitHub s víc registrovanými cronů měl reálně nespolehlivé spouštění).
      - name: "Snapshot komponent skóre (Vývoj skóre graf, intraday)"
        timeout-minutes: 3
        continue-on-error: true
        run: node scripts/snapshot-engine.js
      - name: "Commit: snapshot skóre při změně"
        if: always()
        run: |
          git config user.name "engine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/engine_hist.json)" ]; then
            git add data/engine_hist.json
            git commit -m "chore: update engine snapshot [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Engine snapshot beze změny."
          fi

      # Telegram alert na výrazný pohyb skóre páru (|Δdiff| >= 1.0 od posledního
      # alertu) — počítá živé skóre ze stejného enginu jako appka nad daty, co
      # tenhle běh krok výš už osvěžil (kalendář/VIX/ropa), takže chytí i pohyb
      # UVNITŘ dne, ne jen jednou večer. Samostatný bot/chat (SCORE_TELEGRAM_*),
      # jiné secrets než Market Radar (RADAR_TELEGRAM_*).
      - name: "Skóre alert (Telegram, práh 1.0 od posledního alertu)"
        timeout-minutes: 3
        continue-on-error: true
        env:
          SCORE_TELEGRAM_BOT_TOKEN: ${{ secrets.SCORE_TELEGRAM_BOT_TOKEN }}
          SCORE_TELEGRAM_CHAT_ID: ${{ secrets.SCORE_TELEGRAM_CHAT_ID }}
        run: node scripts/score-alerts.js
      - name: "Commit: stav skóre alertů při změně"
        if: always()
        run: |
          git config user.name "score-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/score_alert_state.json)" ]; then
            git add data/score_alert_state.json
            git commit -m "chore: update score alert state [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Score alert state beze změny."
          fi

      # AI Smart Alerts — no-code pravidla z přirozeného jazyka (admin je píše
      # v index.html → OpenRouter → data/smart_alerts.json přes GitHub Contents
      # API). Tenhle krok jen VYHODNOCUJE (žádné psaní pravidel), stejný bot
      # jako skóre alert výš (SCORE_TELEGRAM_*).
      - name: "AI Smart Alerts (Telegram, no-code pravidla z přirozeného jazyka)"
        timeout-minutes: 3
        continue-on-error: true
        env:
          SCORE_TELEGRAM_BOT_TOKEN: ${{ secrets.SCORE_TELEGRAM_BOT_TOKEN }}
          SCORE_TELEGRAM_CHAT_ID: ${{ secrets.SCORE_TELEGRAM_CHAT_ID }}
        run: node scripts/smart-alerts.js
      - name: "Commit: stav AI Smart Alerts při změně"
        if: always()
        run: |
          git config user.name "smart-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/smart_alerts.json)" ]; then
            git add data/smart_alerts.json
            git commit -m "chore: update AI smart alerts state [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "AI smart alerts beze změny."
          fi
