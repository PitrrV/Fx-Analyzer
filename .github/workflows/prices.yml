name: FX Prices (jen ruční/debug — cron viz data-refresh.yml)

# Naplánovaný cron (dřív "17 * * * *", hodinově) přesunut do data-refresh.yml
# (16.9.2026) — stejný důvod jako u retail.yml (viz komentář tam): moc
# samostatně registrovaných scheduled triggerů na účtu dělalo spouštění
# nespolehlivé. Soubor zůstává kvůli workflow_dispatch pro ruční/debug běh.
on:
  workflow_dispatch:        # ruční/API spuštění

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Stáhnout FX ceny
        run: node scripts/fetch-prices.js
      - name: Commit při změně
        run: |
          git config user.name "prices-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/prices.json)" ]; then
            git add data/prices.json
            git commit -m "chore: update fx prices [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Beze změny."
          fi
