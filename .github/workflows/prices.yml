name: FX Prices

on:
  schedule:
    - cron: "17 * * * *"   # každou hodinu (commit jen při změně kurzů)
  workflow_dispatch:        # ruční/API spuštění

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Stáhnout FX ceny
        run: node scripts/fetch-prices.js
      - name: Commit při změně
        run: |
          git config user.name "prices-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/prices.json)" ]; then
            git add data/prices.json
            git commit -m "chore: update fx prices [skip ci]"
            git push
          else
            echo "Beze změny."
          fi
