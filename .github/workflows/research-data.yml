name: Research Data (audit skóre)

on:
  workflow_dispatch:        # jednorázový sběr — ne cron

permissions:
  contents: write

concurrency:
  group: research-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Stáhnout FRED + CFTC data
        run: node scripts/fetch-research-data.js
      - name: Commit
        run: |
          git config user.name "research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/research)" ]; then
            git add data/research
            git commit -m "chore: research data pro audit skóre [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Beze změny."
          fi
