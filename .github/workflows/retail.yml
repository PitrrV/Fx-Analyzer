name: Retail Sentiment

on:
  schedule:
    # každých 30 min jako dřív — volný limit Myfxbook API (100 req/24h) platí jen
    # na get-community-outlook.json, ne na login/logout; 48 běhů/den = 48 volání
    # outlooku/den, bezpečně pod limitem.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # ruční/API spuštění

permissions:
  contents: write

concurrency:
  group: retail
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Stáhnout retail sentiment
        env:
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
        run: node scripts/fetch-retail.js
      - name: Commit při změně
        run: |
          git config user.name "retail-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/retail_hist.json)" ]; then
            git add data/retail_hist.json
            git commit -m "chore: update retail sentiment [skip ci]"
            git push
          else
            echo "Beze změny."
          fi
