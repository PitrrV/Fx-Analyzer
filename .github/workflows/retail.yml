name: Retail Sentiment

on:
  schedule:
    # každých 30 min jako dřív — FXSSI Current Ratio je veřejný endpoint bez klíče
    # a bez rate limitu, sám se obnovuje ~10 min, takže 30min cron ho vzorkuje
    # s rezervou a data rostou po celý den.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # ruční/API spuštění

permissions:
  contents: write

concurrency:
  group: retail
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Stáhnout retail sentiment
        env:
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
        run: node scripts/fetch-retail.js
      - name: Commit při změně
        # data/gold_retail.json píše STEJNÝ krok výš (fetch-retail.js, viz
        # komentář u "Zapsáno data/gold_retail.json") — musí se stagovat/
        # commitnout spolu s retail_hist.json. Dřív se přidával jen
        # retail_hist.json, takže gold_retail.json zůstával jako unstaged
        # změna a `git pull --rebase` na něj spadl ("cannot pull with
        # rebase: You have unstaged changes", exit 128) pokaždé, když se
        # XAUUSD retail bod reálně změnil — appka pak celé hodiny neměla
        # čerstvý Myfxbook retail, protože KAŽDÝ běh selhal už na tomhle
        # kroku (živě ověřeno, run 34967881364).
        run: |
          git config user.name "retail-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/retail_hist.json data/gold_retail.json)" ]; then
            git add data/retail_hist.json data/gold_retail.json
            git commit -m "chore: update retail sentiment [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Beze změny."
          fi
      # US100 (Nasdaq-100) retail sentiment — samostatný krok, vlastní soubor
      # (data/us100_retail.json), nezávislý na kroku výš. continue-on-error, ať
      # případný výpadek tohohle kroku nezkazí zelený běh FX retail kroku nad ním.
      - name: "Stáhnout retail: US100"
        continue-on-error: true
        run: node scripts/fetch-us100-retail.js
      - name: "Commit: US100 retail při změně"
        if: always()
        continue-on-error: true
        run: |
          git config user.name "retail-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/us100_retail.json)" ]; then
            git add data/us100_retail.json
            git commit -m "chore: update US100 retail sentiment [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Beze změny."
          fi
