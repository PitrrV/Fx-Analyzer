name: FX Daily History (Seasonality)

on:
  schedule:
    - cron: "0 3 * * *"   # jednou denně v noci — historie se mění jen o 1 nový den
  workflow_dispatch:          # ruční/API spuštění

permissions:
  contents: write

concurrency:
  group: fx-daily-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Stáhnout denní historii párů (Stooq)
        run: node scripts/fetch-seasonality-daily.js
      - name: Commit při změně
        run: |
          git config user.name "fx-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/fx_daily)" ]; then
            git add data/fx_daily
            git commit -m "chore: update FX daily history [skip ci]"
            git push
          else
            echo "Beze změny."
          fi
