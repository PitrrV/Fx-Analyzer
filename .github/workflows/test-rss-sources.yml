name: Test RSS Sources (diagnostic, manual only)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test candidate RSS feeds
        run: node scripts/test-rss-sources.js
