name: Probe Retail Sources

# Dispatch-only diagnostika — žádný cron, nic necommituje. Slouží jen k ověření,
# které zdroje retail sentimentu jsou dostupné z GitHub Actions runneru.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Otestovat kandidátní zdroje
        run: node scripts/probe-retail-sources.js
      - name: Audit integrity retail sentimentu
        run: node scripts/audit-retail-integrity.js
      - name: Průzkum pokrytí párů
        run: node scripts/probe-retail-coverage.js
      - name: Myfxbook keep-alive test
        env:
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
        run: node scripts/probe-myfxbook-keepalive.js
      - name: Myfxbook cookie/POST test
        env:
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
        run: node scripts/probe-myfxbook-cookie.js
      - name: Myfxbook přes veřejné proxy
        env:
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
        run: node scripts/probe-myfxbook-proxied.js
