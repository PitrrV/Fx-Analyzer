name: COT History

on:
  schedule:
    - cron: "0 22 * * 5"   # pátek 22:00 UTC — po pátečním CFTC releasu (~15:30 ET)
    - cron: "0 12 * * 6"   # + sobota dopoledne (jistota, kdyby release byl pozdě)
    # Když pátek padne na americký svátek (např. 4.7.), CFTC report o týden
    # nezpozdí, ale o pár dní — vyjde v pondělí/úterý. Bez těchhle běhů by na
    # to appka čekala celý další týden do příštího pátku (viz reálný nález:
    # COT zaseklé na 23.6., zatímco 30.6. na CFTC už dávno bylo). fetch-cot.js
    # je idempotentní (commitne jen při změně), takže tyhle běhy navíc nic nekazí.
    - cron: "0 12 * * 0"   # neděle dopoledne
    - cron: "0 12 * * 1"   # pondělí dopoledne
    - cron: "0 22 * * 1"   # pondělí večer
    - cron: "0 12 * * 2"   # úterý dopoledne — poslední záchranná síť
  workflow_dispatch:        # ruční/API spuštění

permissions:
  contents: write

concurrency:
  group: cot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Stáhnout COT historii
        run: node scripts/fetch-cot.js
      - name: Commit při změně
        run: |
          git config user.name "cot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/cot_hist.json)" ]; then
            git add data/cot_hist.json
            git commit -m "chore: update COT history [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Beze změny."
          fi
      # US100 (Nasdaq-100) COT — samostatný krok, vlastní soubor
      # (data/us100_cot.json), nezávislý na kroku výš. continue-on-error, ať
      # případný výpadek tohohle kroku nezkazí zelený běh FX COT kroku nad ním.
      - name: "Stáhnout COT: US100"
        continue-on-error: true
        run: node scripts/fetch-us100-cot.js
      - name: "Commit: US100 COT při změně"
        if: always()
        continue-on-error: true
        run: |
          git config user.name "cot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/us100_cot.json)" ]; then
            git add data/us100_cot.json
            git commit -m "chore: update US100 COT [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Beze změny."
          fi
