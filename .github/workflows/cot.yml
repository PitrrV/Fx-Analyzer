name: COT History

on:
  schedule:
    # Dřív 6 samostatných cron řádků (pá/so/ne/po×2/út), aby appka chytila
    # CFTC report i když pátek padne na svátek a report vyjde o pár dní
    # později (reálný nález: COT zaseklé na 23.6., zatímco 30.6. na CFTC už
    # dávno bylo). GitHub ale registruje KAŽDÝ cron řádek zvlášť, i když jde
    # o jeden workflow — 6 registrací na jeden účet dělalo (spolu s dalšími
    # cron workflow appky) scheduled spouštění nespolehlivé (živě potvrzeno
    # 15.-16.9.2026: retail.yml i data-refresh.yml se na hodiny zasekly,
    # cot.yml mělo běh 4h16min pozdě). fetch-cot.js je idempotentní (commitne
    # jen při reálné změně), takže denní kontrola je STEJNĚ bezpečná jako
    # dřívější patchwork dnů — jen o 5 registrací míň a navíc pokryje
    # doslova každý den, ne jen předem vytipované.
    - cron: "30 13 * * *"   # jednou denně, mimo přesnou hodinu (viz doporučení GitHubu)
  workflow_dispatch:        # ruční/API spuštění

permissions:
  contents: write

concurrency:
  group: cot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Stáhnout COT historii
        run: node scripts/fetch-cot.js
      - name: Commit při změně
        run: |
          git config user.name "cot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/cot_hist.json)" ]; then
            git add data/cot_hist.json
            git commit -m "chore: update COT history [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Beze změny."
          fi
      # US100 (Nasdaq-100) COT — samostatný krok, vlastní soubor
      # (data/us100_cot.json), nezávislý na kroku výš. continue-on-error, ať
      # případný výpadek tohohle kroku nezkazí zelený běh FX COT kroku nad ním.
      - name: "Stáhnout COT: US100"
        continue-on-error: true
        run: node scripts/fetch-us100-cot.js
      - name: "Commit: US100 COT při změně"
        if: always()
        continue-on-error: true
        run: |
          git config user.name "cot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/us100_cot.json)" ]; then
            git add data/us100_cot.json
            git commit -m "chore: update US100 COT [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Beze změny."
          fi
      # Zlato (XAUUSD) COT — samostatný krok, vlastní soubor (data/gold_cot.json),
      # jiný CFTC dataset než FX/US100 (Disaggregated, ne TFF — viz hlavička
      # fetch-gold-cot.js). continue-on-error stejně jako US100 výš.
      - name: "Stáhnout COT: Zlato"
        continue-on-error: true
        run: node scripts/fetch-gold-cot.js
      - name: "Commit: Gold COT při změně"
        if: always()
        continue-on-error: true
        run: |
          git config user.name "cot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/gold_cot.json)" ]; then
            git add data/gold_cot.json
            git commit -m "chore: update Gold COT [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Beze změny."
          fi
