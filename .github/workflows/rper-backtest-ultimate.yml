name: RP+ER Backtest (finální kombinovaný filtr — trend + COT)

# Jen ruční spuštění — diagnostický nástroj (scripts/backtest-rper-ultimate.js),
# appka ho nečte, engine se jím neupravuje. Hledá nejlepší kombinaci
# potvrzovacích filtrů pro RP+ER na celém 2letém okně. Viz hlavička
# scripts/backtest-rper-ultimate.js.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rper-backtest-ultimate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Spustit finální kombinovaný backtest
        run: node scripts/backtest-rper-ultimate.js
      - name: Commit při změně
        run: |
          git config user.name "rper-backtest-ultimate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/backtest_rper_ultimate.json)" ]; then
            git add data/backtest_rper_ultimate.json
            git commit -m "chore: update RP+ER ultimate combined backtest [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Beze změny."
          fi
