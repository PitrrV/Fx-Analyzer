name: RP+ER Backtest (pokračování pohybu po uzavření)

# Jen ruční spuštění — diagnostický nástroj (scripts/backtest-rper-continuation.js),
# appka ho nečte, engine se jím neupravuje. Měří, jestli/kolik cena pokračuje
# ve směru obchodu i PO technickém uzavření RP+ER epizody. Viz hlavička
# scripts/backtest-rper-continuation.js.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rper-backtest-continuation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Spustit backtest pokračování pohybu
        run: node scripts/backtest-rper-continuation.js
      - name: Commit při změně
        run: |
          git config user.name "rper-backtest-continuation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/backtest_rper_continuation.json)" ]; then
            git add data/backtest_rper_continuation.json
            git commit -m "chore: update RP+ER continuation backtest [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Beze změny."
          fi
