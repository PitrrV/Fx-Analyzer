name: Engine Snapshot (ruční/debug)

# Vlastní denní cron (21:30 UTC) zrušen — krok "Snapshot komponent skóre" teď
# běží na 15min cronu přímo v data-refresh.yml (piggyback na existující
# trigger, ať appka drží zásadu z komentářů tam: víc registrovaných scheduled
# triggerů na účtu = GitHub je reálně nespouští spolehlivě). Tenhle workflow
# zůstává jen pro ruční/API spuštění při debugu.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engine-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Snapshot komponent skóre
        run: node scripts/snapshot-engine.js
      - name: Commit při změně
        run: |
          git config user.name "engine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/engine_hist.json)" ]; then
            git add data/engine_hist.json
            git commit -m "chore: update engine snapshot [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Beze změny."
          fi
