name: Engine Snapshot

on:
  schedule:
    # Denně po datových cronech (kalendář/ceny/ropa/retail běží přes den,
    # COT pá/so/ne/po/út). 21:30 UTC po-pá = po US session, data za den kompletní.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:        # ruční/API spuštění

permissions:
  contents: write

concurrency:
  group: engine-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Denní snapshot komponent skóre
        run: node scripts/snapshot-engine.js
      - name: Commit při změně
        run: |
          git config user.name "engine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/engine_hist.json)" ]; then
            git add data/engine_hist.json
            git commit -m "chore: update engine snapshot [skip ci]"
            # rebase před push — jiný datový cron mohl mezitím commitnout na main
            # (reálný nález: první běh spadl na souběhu s kalibračním cronem)
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Beze změny."
          fi

      # Telegram alert na výrazný denní pohyb skóre páru (|Δdiff| >= 1.0) — čte
      # jen data/engine_hist.json napsaný krokem výš, žádný nový fetch. Samostatný
      # bot/chat (SCORE_TELEGRAM_*), jiné secrets než Market Radar (RADAR_TELEGRAM_*).
      - name: "Skóre alert (Telegram, práh 1.0)"
        timeout-minutes: 3
        continue-on-error: true
        env:
          SCORE_TELEGRAM_BOT_TOKEN: ${{ secrets.SCORE_TELEGRAM_BOT_TOKEN }}
          SCORE_TELEGRAM_CHAT_ID: ${{ secrets.SCORE_TELEGRAM_CHAT_ID }}
        run: node scripts/score-alerts.js
      - name: "Commit: stav skóre alertů při změně"
        if: always()
        run: |
          git config user.name "score-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/score_alert_state.json)" ]; then
            git add data/score_alert_state.json
            git commit -m "chore: update score alert state [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && break
              echo "Push selhal (pokus $i/5), čekám a zkouším znovu…"
              sleep $((i*2))
            done
          else
            echo "Beze změny."
          fi
