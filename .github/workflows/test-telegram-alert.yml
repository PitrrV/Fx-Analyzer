name: "Test: ukázková Telegram zpráva (skóre alert)"

# Jen workflow_dispatch — spouští se ručně, jednorázově, ať uživatel vidí
# přesný formát/znění zprávy dřív, než začnou chodit ostré alerty ze
# scripts/score-alerts.js. Nezapisuje nic, nemění žádná data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Poslat testovací zprávu
        env:
          SCORE_TELEGRAM_BOT_TOKEN: ${{ secrets.SCORE_TELEGRAM_BOT_TOKEN }}
          SCORE_TELEGRAM_CHAT_ID: ${{ secrets.SCORE_TELEGRAM_CHAT_ID }}
        run: node scripts/send-test-alert.js
