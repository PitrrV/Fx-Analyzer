    onAdd({
      id:Date.now()+"_"+Math.random().toString(36).slice(2,7),
      pair:f.pair,dir:f.dir,entry:f.entry,sl:f.sl,tp:f.tp,riskPct:f.riskPct,
      outcome:f.outcome,rMultiple:rSigned,
      notes:f.notes,openedAt:now,closedAt:closed?now:null,updatedAt:now,
      ctx:captureContext(f.pair,pairs,scores,calData,upcoming,aiAnalyses)

    setF(Object.assign({},f,{entry:"",sl:"",tp:"",riskPct:"",outcome:"open",rMultiple:"",notes:""}));

    download("trading_journal.csv",[cols.join(",")].concat(rows).join("\n"),"text/csv");

    var rd=new FileReader();rd.onload=function(){try{var arr=JSON.parse(rd.result);if(Array.isArray(arr)){onImport(arr);}else alert("JSON není pole obchodů.");}catch(err){alert("Neplatný JSON soubor.");}};rd.readAsText(file);e.target.value="";
  }

  const bandSweet=jStat(closed.filter(function(t){return t.ctx&&t.ctx.band==="sweetspot";}));
  const bandWeak=jStat(closed.filter(function(t){return t.ctx&&t.ctx.band==="slabý";}));
  const bandStrong=jStat(closed.filter(function(t){return t.ctx&&t.ctx.band==="silný";}));
  const listWhite=jStat(closed.filter(function(t){return t.ctx&&t.ctx.listType==="white";}));
  const listGrey=jStat(closed.filter(function(t){return t.ctx&&t.ctx.listType==="grey";}));
  const listBlack=jStat(closed.filter(function(t){return t.ctx&&t.ctx.listType==="black";}));
  const vsConflict=jStat(closed.filter(function(t){return t.ctx&&t.ctx.dailyLevel==="conflict";}));
  const vsClear=jStat(closed.filter(function(t){return t.ctx&&t.ctx.dailyLevel!=="conflict";}));
  const inp={width:"100%",background:"#0d1117",border:"1px solid #1d2a36",borderRadius:7,color:"#e6edf3",fontSize:13,padding:"7px 9px",outline:"none",fontFamily:"inherit"};

// ════════════════════════════════════════════════════════════════
// BACKTEST / KALIBRACE — COT engine na reálných cenách
// Historicky máme jen COT (5 let). Forward ceny: Alpha Vantage FX_WEEKLY
// pro 7 USD-majorů, crossy dopočítány trianguláci přes USD (7 API volání).
// Datumy se porovnávají v UTC (obchází timezone problém).
// Měří se DIRECTIONAL forward-return edge (ne tradeable R se SL/TP).
// ════════════════════════════════════════════════════════════════
const BT_MAJORS=[
  {cur:"EUR",invert:false},{cur:"GBP",invert:false},
  {cur:"AUD",invert:false},{cur:"NZD",invert:false},
  {cur:"JPY",invert:true},{cur:"CAD",invert:true},{cur:"CHF",invert:true},
];
const BT_HORIZONS=[1,2,4,8];           // týdny dopředu
const BT_DIFFS=[0,1,1.5,2,2.5,3];      // prahy |COT diff|
const BT_MIN_TRADES=30;                // minimální vzorek pro důvěryhodnost

async function fetchBTWeekly(avKey,fromSym,toSym){
  const u="https://www.alphavantage.co/query?function=FX_WEEKLY&from_symbol="+fromSym+"&to_symbol="+toSym+"&outputsize=full&apikey="+avKey;
  const r=await fetch(u);const j=await r.json();
  if(j.Note||j.Information) throw new Error("Alpha Vantage limit (zkus za minutu / zítra)");
  const key=Object.keys(j).find(k=>k.startsWith("Time Series"));
  if(!key) throw new Error("AV nevrátil data");
  return Object.entries(j[key]).map(([date,v])=>({date,close:parseFloat(v["4. close"])}))
    .filter(x=>isFinite(x.close)).sort((a,b)=>a.date<b.date?-1:1); // staré → nové
}
// Vrátí usdValue[CUR] = pole {date, v} kde v = hodnota 1 jednotky měny v USD.
async function loadBTPrices(avKey,onProgress){
  const out={};const errors=[];const loaded=[];
  for(const m of BT_MAJORS){
    const ck="bt_fx_"+m.cur;let series=null,cached=false;
    try{const c=JSON.parse(localStorage.getItem(ck)||"null");if(c&&Date.now()-c.ts<7*86400000){series=c.data;cached=true;}}catch(e){}
    if(!series){
      try{
        const from=m.invert?"USD":m.cur,to=m.invert?m.cur:"USD";
        const raw=await fetchBTWeekly(avKey,from,to);
        series=raw.map(x=>({date:x.date,v:m.invert?1/x.close:x.close}));
        try{localStorage.setItem(ck,JSON.stringify({data:series,ts:Date.now()}));}catch(e){}
        await new Promise(r=>setTimeout(r,900)); // šetrně k AV rate limitu (5/min)
      }catch(e){errors.push(m.cur+": "+(e.message||e));}
    }
    if(series){out[m.cur]=series;loaded.push(m.cur);onProgress&&onProgress(m.cur,series.length,cached);}
  }
  return {usdValue:out,errors,loaded};
}
function btPriceOnOrAfter(series,targetMs){
  let lo=0,hi=series.length-1,ans=-1;
  while(lo<=hi){const mid=(lo+hi)>>1;const t=Date.parse(series[mid].date+"T00:00:00Z");
    if(t>=targetMs){ans=mid;hi=mid-1;}else lo=mid+1;}
  return ans<0?null:series[ans].v;
}
function btUsdValAt(usdValue,cur,targetMs){
  if(cur==="USD") return 1;
  const s=usdValue[cur];if(!s) return null;
  return btPriceOnOrAfter(s,targetMs);
}
function btPairPrice(usdValue,base,quote,targetMs){
  const b=btUsdValAt(usdValue,base,targetMs),q=btUsdValAt(usdValue,quote,targetMs);
  if(b==null||q==null||q===0) return null;
  return b/q;
}
// Rolling percentil COT skóre (jen z minulosti) — pro test contrarian extrémů.
function btBuildPercentiles(cotHist,dates){
  const pct={};CURRENCIES.forEach(c=>pct[c]={});
  CURRENCIES.forEach(c=>{
    const past=[];
    for(const d of dates){
      const v=cotHist[d]?.scores?.[c];
      if(typeof v!=="number"){continue;}
      pct[c][d]=past.length?Math.round(past.filter(x=>x<=v).length/past.length*100):50;
      past.push(v);
    }
  });
  return pct;
}
function btAggregate(trades){
  const n=trades.length;if(!n) return {n:0,wr:null,pf:null,avg:null};
  const wins=trades.filter(t=>t.ret>0).length;
  const gp=trades.filter(t=>t.ret>0).reduce((a,b)=>a+b.ret,0);
  const gl=Math.abs(trades.filter(t=>t.ret<0).reduce((a,b)=>a+b.ret,0));
  return{n,wins,wr:wins/n*100,pf:gl>0?gp/gl:(gp>0?Infinity:null),
    avg:trades.reduce((a,b)=>a+b.ret,0)/n,gp,gl};
}
// Jádro: projde COT historii × páry, spočítá forward výnos ve směru COT biasu.
function runCOTBacktest(usdValue,cotHist,pctMap,opts){
  const {horizonWeeks,diffThreshold,avoidExtremes}=opts;
  const dates=Object.keys(cotHist).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  const horizonMs=horizonWeeks*7*86400000;const trades=[];const byPair={};
  for(const pr of STANDARD_PAIRS){
    for(const d of dates){
      const sc=cotHist[d]?.scores;if(!sc) continue;
      const diff=(sc[pr.base]??0)-(sc[pr.quote]??0);
      if(Math.abs(diff)<diffThreshold) continue;
      if(avoidExtremes&&pctMap){
        const pb=pctMap[pr.base]?.[d],pq=pctMap[pr.quote]?.[d];
        const crowded=(pb!=null&&(pb>=88||pb<=12))||(pq!=null&&(pq>=88||pq<=12));
        if(crowded) continue;
      }
      // Vstup až po publikaci reportu (report_date=úterý, publikace pátek ~15:30 ET,
      // první obchodovatelný denní fix = pondělí) — stejná oprava look-ahead biasu
      // jako scripts/backtest-cot.js (ENTRY_LAG_DAYS).
      const t0=Date.parse(d+"T00:00:00Z")+6*86400000;
      const p0=btPairPrice(usdValue,pr.base,pr.quote,t0);
      const p1=btPairPrice(usdValue,pr.base,pr.quote,t0+horizonMs);
      if(p0==null||p1==null) continue;
      const dir=diff>0?1:-1;
      const ret=(p1/p0-1)*dir*100; // % výnos ve směru obchodu
      const tr={pair:pr.pair,date:d,diff,dir,ret};
      trades.push(tr);(byPair[pr.pair]=byPair[pr.pair]||[]).push(tr);
    }
  }
  const agg=btAggregate(trades);agg.byPair=byPair;return agg;
}
// Sweep přes prahy × horizonty + porovnání filtru extrémů.
function runBacktestSweep(usdValue,cotHist){
  const dates=Object.keys(cotHist).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  const pctMap=btBuildPercentiles(cotHist,dates);
  const grid=[];
  for(const h of BT_HORIZONS) for(const df of BT_DIFFS){
    const base=runCOTBacktest(usdValue,cotHist,pctMap,{horizonWeeks:h,diffThreshold:df,avoidExtremes:false});
    grid.push({horizon:h,diff:df,...base});
  }
  // nejlepší kombinace dle PF s dostatečným vzorkem
  const valid=grid.filter(g=>g.n>=BT_MIN_TRADES&&g.pf!=null&&isFinite(g.pf));
  const best=valid.slice().sort((a,b)=>b.pf-a.pf)[0]||grid.slice().sort((a,b)=>(b.n)-(a.n))[0];
  // porovnání filtru extrémů na nejlepším nastavení
  let extremeCompare=null;
  if(best){
    const withFilter=runCOTBacktest(usdValue,cotHist,pctMap,{horizonWeeks:best.horizon,diffThreshold:best.diff,avoidExtremes:true});
    extremeCompare={off:{n:best.n,wr:best.wr,pf:best.pf,avg:best.avg},on:btAggregate(withFilter.trades||[])};
  }
  return {grid,best,extremeCompare,weeks:dates.length,dateFrom:dates[0],dateTo:dates.at(-1)};
}

function btFmtPF(pf){return pf==null?"—":(pf===Infinity||pf>=999?"∞":pf.toFixed(2));}
function btFmtPct(x){return x==null?"—":Math.round(x)+"%";}
function btCellColor(wr,pf,n){
  if(n<BT_MIN_TRADES) return "#4a6a88";
  if(pf!=null&&pf>=1.5&&wr>=55) return "#2ed3a0";
  if(pf!=null&&pf>=1.1&&wr>=50) return "#d29922";
  return "#ff4d4d";
}

// ── FORWARD LOG CELÉHO ENGINU ─────────────────────────────────────
// Každý refresh uloží plný rozpad skóre všech měn. Později (až horizont
// dozraje) se to v backtestu spojí s reálnými cenami → měří edge CELÉHO
// enginu i jednotlivých komponent (ne jen COT). Roste postupně časem.
const ENGINE_LOG_FIELDS=["score","fund_score","cot_score","sent_score","season_score","yield_adj","policy_adj","momentum_adj","oil_adj"];
const ENGINE_COMP_LABELS={fund_score:"Fundamenty",cot_score:"COT",sent_score:"Retail sent.",season_score:"Sezónnost",yield_adj:"Real yield",policy_adj:"CB policy",momentum_adj:"Momentum",oil_adj:"Ropa (WTI)"};
function loadEngineLog(){try{return JSON.parse(localStorage.getItem("engine_log")||"{}");}catch(e){return{};}}
function saveEngineSnapshot(scores){
  try{
    const today=new Date().toISOString().split("T")[0];
    const log=loadEngineLog();const snap={};
    CURRENCIES.forEach(c=>{const s=scores[c]||{};const o={};
      ENGINE_LOG_FIELDS.forEach(f=>{o[f]=typeof s[f]==="number"?parseFloat(s[f].toFixed(3)):0;});snap[c]=o;});
    log[today]={ts:Date.now(),cur:snap};
    const keys=Object.keys(log).sort().slice(-400);const trimmed={};keys.forEach(k=>trimmed[k]=log[k]);
    localStorage.setItem("engine_log",JSON.stringify(trimmed));
  }catch(e){}
}
// Backtest forward-logu: total skóre + edge každé komponenty na horizont (týdny).
function runEngineLogBacktest(usdValue,engineLog,horizonWeeks){
  const dates=Object.keys(engineLog).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  const horizonMs=horizonWeeks*7*86400000;
  const comp=ENGINE_LOG_FIELDS.filter(f=>f!=="score");
  const sig={total:[]};comp.forEach(f=>sig[f]=[]);
  let evaluable=0,matured=0;
  for(const d of dates){
    const snap=engineLog[d]?.cur;if(!snap) continue;
    const t0=Date.parse(d+"T00:00:00Z");
    for(const pr of STANDARD_PAIRS){
      const b=snap[pr.base],q=snap[pr.quote];if(!b||!q) continue;
      const p0=btPairPrice(usdValue,pr.base,pr.quote,t0);if(p0==null) continue;
      evaluable++;
      const p1=btPairPrice(usdValue,pr.base,pr.quote,t0+horizonMs);if(p1==null) continue;
      matured++;
      const fwd=(p1/p0-1)*100;
      const td=(b.score||0)-(q.score||0);
      if(td!==0) sig.total.push({ret:fwd*(td>0?1:-1)});
      comp.forEach(f=>{const dd=(b[f]||0)-(q[f]||0);if(dd!==0) sig[f].push({ret:fwd*(dd>0?1:-1)});});
    }
  }
  const out={total:btAggregate(sig.total),components:{},days:dates.length,evaluable,matured,horizon:horizonWeeks};
  comp.forEach(f=>out.components[f]=btAggregate(sig[f]));
  return out;
}

                        <div style={{fontSize:9,color:"#4a6a88"}}>n {g.n||0}</div>
                      </td>;
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>}

        {/* Per-pair na nejlepším nastavení */}
        {result.best&&result.best.byPair&&<div className="pro-card" style={{padding:16}}>
          <div className="pro-panel-title" style={{marginBottom:10}}>Edge podle páru (diff≥{result.best.diff}, {result.best.horizon}t)</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:8}}>
            {Object.entries(result.best.byPair).map(([pair,trs])=>{
              const a=btAggregate(trs);const col=a.pf!=null&&a.pf>=1.3?"#2ed3a0":a.pf!=null&&a.pf>=1?"#d29922":"#ff4d4d";
              return <div key={pair} style={{background:"#0b111a",border:"1px solid "+col+"33",borderRadius:8,padding:"8px 10px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><b style={{fontSize:12}}>{pair}</b><span style={{fontSize:11,color:col,fontWeight:800}}>PF {btFmtPF(a.pf)}</span></div>
                <div style={{fontSize:10,color:"#8b949e",marginTop:3}}>WR {btFmtPct(a.wr)} · n {a.n} · {a.avg>0?"+":""}{a.avg?.toFixed(2)}%</div>
              </div>;
            })}
          </div>
          <div style={{fontSize:10,color:"#4a6a88",marginTop:10,lineHeight:1.5}}>
            Páry s PF&lt;1 jsou kandidáti na „blacklist" — COT na nich historicky směr netrefoval. Pozn.: měří se čistá směrová edge bez SL/TP a spreadu, takže reálné R bude o něco nižší.
          </div>
        </div>}

        {/* ── ENGINE FORWARD-LOG BACKTEST (celý engine + komponenty) ── */}
        {result.engine&&<div className="pro-card" style={{padding:16,marginTop:14}}>
          <div className="pro-panel-title" style={{marginBottom:4}}>🧪 Live engine forward-log — celý engine (horizont {result.engine.horizon}t)</div>
          <div style={{fontSize:11,color:"#8b949e",marginBottom:12}}>
            {result.engine.days} dní logu · {result.engine.matured} obchodů dozrálo (zbytek čeká na {result.engine.horizon}t horizont). Sbírá se automaticky při každém refreshi — užitečné od ~20+ dozrálých.
          </div>
          {result.engine.matured>=BT_MIN_TRADES
            ? <>
                <div style={{background:"rgba(94,124,251,.06)",border:"1px solid rgba(94,124,251,.2)",borderRadius:10,padding:"12px 14px",marginBottom:12}}>
                  <div style={{fontSize:12,color:"#8b949e",marginBottom:4}}>Celkové skóre enginu jako signál</div>
                  <div style={{display:"flex",gap:16,fontSize:14,flexWrap:"wrap"}}>
                    <span>WR <b style={{color:"#2ed3a0"}}>{btFmtPct(result.engine.total.wr)}</b></span>
                    <span>PF <b style={{color:"#7d95ff"}}>{btFmtPF(result.engine.total.pf)}</b></span>
                    <span>průměr <b style={{color:result.engine.total.avg>=0?"#2ed3a0":"#ff4d4d"}}>{result.engine.total.avg>0?"+":""}{result.engine.total.avg?.toFixed(2)}%</b></span>
                    <span style={{color:"#8b949e"}}>n {result.engine.total.n}</span>
                  </div>
                </div>
                <div className="pro-panel-title" style={{marginBottom:8,fontSize:12}}>Edge jednotlivých komponent — který faktor reálně trefuje směr</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(170px,1fr))",gap:8}}>
                  {Object.entries(result.engine.components).sort((a,b)=>(b[1].pf||0)-(a[1].pf||0)).map(([f,a])=>{
                    const col=a.pf!=null&&a.pf>=1.2?"#2ed3a0":a.pf!=null&&a.pf>=1?"#d29922":"#ff4d4d";
                    return <div key={f} style={{background:"#0b111a",border:"1px solid "+col+"33",borderRadius:8,padding:"8px 10px"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><b style={{fontSize:12}}>{ENGINE_COMP_LABELS[f]||f}</b><span style={{fontSize:11,color:col,fontWeight:800}}>PF {btFmtPF(a.pf)}</span></div>
                      <div style={{fontSize:10,color:"#8b949e",marginTop:3}}>WR {btFmtPct(a.wr)} · n {a.n}</div>
                    </div>;
                  })}
                </div>
                <div style={{fontSize:10,color:"#4a6a88",marginTop:10,lineHeight:1.5}}>
                  Komponenta s vysokým PF nese reálnou edge → zaslouží vyšší váhu. PF≈1 nebo níž = na datech nepomáhá. Tohle je podklad pro pozdější přeladění vah celého enginu (COT sweep výš kalibruje jen práh COT biasu).
                </div>
              </>
            : <div style={{fontSize:12,color:"#8b949e",padding:"8px 0"}}>Zatím málo dozrálých obchodů ({result.engine.matured}). Forward log se plní každý den, co necháš appku načíst — vrať se za pár týdnů, až {result.engine.horizon}t horizont dozraje na dostatečném vzorku.</div>
          }
        </div>}
      </>}
    </div>
  );
}

// ── HLAVNÍ APP ────────────────────────────────────────────
function App(){
  const [fhKey,setFhKey]=useState(null);
  const [avKey,setAvKey]=useState(null);
  // Appka jede i bez Finnhubu (ForexFactory + nahraná historie). "started" = uživatel
  // prošel úvodní obrazovkou; klíče jsou volitelné placené doplňky.
  const [started,setStarted]=useState(()=>{try{return localStorage.getItem("v5_started")==="1"||!!localStorage.getItem("fh")||!!localStorage.getItem("fmp");}catch(e){return false;}});
  const [showSet,setShowSet]=useState(false);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [scores,setScores]=useState({});
  const [pairs,setPairs]=useState([]);
  const [forecasts,setForecasts]=useState({});
  const [selected,setSelected]=useState(null);
  const [upcoming,setUpcoming]=useState([]);
  const [calData,setCalData]=useState([]);
  const [lastUp,setLastUp]=useState(null);
  const [calMeta,setCalMeta]=useState(null);   // {source, months, count, fwdDays}
  const [tab,setTab]=useState("pairs");
  const [cotData,setCotData]=useState(loadCOT());
  const [positions,setPositions]=useState(getAllPositions());
  const updatePosition=useCallback((pair,side)=>{setPosition(pair,side);setPositions(getAllPositions());},[]);
  const [notes,setNotes]=useState(loadNotes());
  const updateNote=useCallback((pair,text)=>{
    const t=(text||"").trim();const next=loadNotes();
    if(t) next[pair]=t; else delete next[pair];
    try{localStorage.setItem("pair_notes",JSON.stringify(next));}catch(e){}
    setNotes(next);
  },[]);
  const [journal,setJournal]=useState(loadJournal());
  const addTrade=useCallback(function(t){setJournal(function(prev){var n=[t].concat(prev);saveJournalArr(n);return n;});},[]);
  const updateTrade=useCallback(function(id,patch){setJournal(function(prev){var n=prev.map(function(t){return t.id===id?Object.assign({},t,patch):t;});saveJournalArr(n);return n;});},[]);
  // Smazání = tombstone (deleted:true), NE odebrání z pole — čistý filter by sync
  // (union-merge s cloudem) zase přitáhl zpátky, protože merge neumí "smazáno",
  // jen "přidáno/aktualizováno" (stejná třída bugu jako revert výsledku obchodu).
  const deleteTrade=useCallback(function(id){setJournal(function(prev){var n=prev.map(function(t){return t.id===id?Object.assign({},t,{deleted:true,updatedAt:new Date().toISOString()}):t;});saveJournalArr(n);return n;});},[]);
  const importTrades=useCallback(function(arr){setJournal(function(prev){var map={};prev.concat(arr).forEach(function(t){if(t&&t.id)map[t.id]=t;});var n=Object.keys(map).map(function(k){return map[k];});saveJournalArr(n);return n;});},[]);
  const [riskSentimentUI,setRiskSentimentUI]=useState(g_riskSentiment);
  const [riskManual,setRiskManual]=useState(()=>{try{return localStorage.getItem("v5_risk_sent_manual")==="1";}catch(e){return false;}});
  function setRiskSent(v){g_riskSentiment=v;setRiskSentimentUI(v);setRiskManual(true);try{localStorage.setItem("v5_risk_sent",String(v));localStorage.setItem("v5_risk_sent_manual","1");}catch(e){}}
  function setRiskAuto(){try{localStorage.removeItem("v5_risk_sent_manual");}catch(e){}setRiskManual(false);try{applyAutoRiskSentiment();}catch(e){}setRiskSentimentUI(g_riskSentiment);}

  const [aiAnalyses,setAiAnalyses]=useState(()=>{try{return JSON.parse(localStorage.getItem("ai_analyses_v1")||"{}");}catch(e){return {};}});
  function saveAIResult(pair,tf,result){const u={...aiAnalyses,[pair]:{...result,pair,tf,savedAt:Date.now()}};setAiAnalyses(u);try{localStorage.setItem("ai_analyses_v1",JSON.stringify(u));}catch(e){}}
  const [cotMeta,setCotMeta]=useState(loadCOTMeta());
  const [cotLoading,setCotLoading]=useState(false);
  const [historyLoading,setHistoryLoading]=useState(false);
  const [sentData,setSentData]=useState(loadSentiment());
  const [retailLoading,setRetailLoading]=useState(false);
  const [retailMeta,setRetailMeta]=useState(null);
  const [calLiveLoading,setCalLiveLoading]=useState(false);
  const [favs,setFavs]=useState(()=>new Set(loadFavoritePairs()));
  const [pairFilter,setPairFilter]=useState("all");
  const [calMsg,setCalMsg]=useState("");
  const timer=useRef(null);
  // Refy drží vždy nejnovější data — auto-refresh interval i loadData z nich čtou,
  // aby 5min refresh nepoužíval zastaralý COT/sentiment/AI z původní closure.
  const cotRef=useRef(cotData);cotRef.current=cotData;
  const sentRef=useRef(sentData);sentRef.current=sentData;
  const aiRef=useRef(aiAnalyses);aiRef.current=aiAnalyses;

  async function autoRetail(){
    setRetailLoading(true);setError("");
    try{
      const result=await fetchRetailSentiment();
      const {sentData:rs,source,timestamp,method,note,rawPairs={},pairsLoaded,errors}=result;
      setSentData(rs);saveSentiment(rs);saveRetailSnapshot(rs);
      setRetailMeta({source,timestamp,method,pairs:pairsLoaded||Object.keys(rawPairs).length,note});
      const oandaEnvLabel=(localStorage.getItem("oanda_env")||"practice")==="practice"?"Practice":"Live";
      const methodLabel={
        oanda_api:     "✅ OANDA "+oandaEnvLabel+" API",
        cftc_nonreport:"✅ CFTC Non-reportable (reálný retail)",
        myfxbook:      "✅ MyFxBook Community Outlook",
        cot_derived:   "⚠️ Odvozeno z COT dat (orientační)",
      }[method]||source;
      const detail=method==="oanda_api"
        ?" · "+(pairsLoaded||0)+" párů"+(errors?.length?" · "+errors[0]:"")
        :method==="cot_derived"?" · Přidej OANDA token v Settings pro přesná data":"";
      setError(`${methodLabel}${detail}`);
      await loadData(fhKey||"",cotData,rs);
    }catch(e){
      // Záloha: vždy nastavíme alespoň COT-derived hodnoty
      const derived=deriveRetailFromCOTData();
      setSentData(derived);saveSentiment(derived);saveRetailSnapshot(derived);
      setError("⚠️ Retail auto selhal, použita záloha z COT dat. Zkus ručně upravit slidery. Chyba: "+(e?.message||e));
    }
    setRetailLoading(false);
  }

  useEffect(()=>{
    const fh=localStorage.getItem("fh")||"",av=localStorage.getItem("av")||"";
    setAvKey(av);
    if(fh) setFhKey(fh);
  },[]);

  const loadData=useCallback(async(key,cot,sent,force=false)=>{
    setLoading(true);setError("");
    try{
      // Zdroje kalendáře: GitHub Action (forexfactory web, actual+plné pokrytí) → FMP → Finnhub → ForexFactory proxy.
      const fmpKey=(localStorage.getItem("fmp")||"").trim();
      let cal=[],calWarn="",calSource="",fmpErr="";
      // 0) PRIMÁRNÍ: server-side kalendář z GitHub Action (má actual, 14+ dní, bez proxy)
      try{ const fresh=await fetchActionCalendar(); cal=mergeFFHistory(fresh); calSource="action"; }
      catch(e){ /* fallback níže */ }
      // Pokud FMP klíč už jednou vrátil chybu plánu/klíče, neotravuj s ním každých
      // 5 min (zrychlejší load, žádná opakovaná červená chyba). Reset při změně klíče.
      const fmpBlocked=!!fmpKey&&localStorage.getItem("fmp_cal_block")===fmpKey;
      if(!cal.length&&fmpKey&&!fmpBlocked){
        try{ cal=await fetchFMPCalendar(fmpKey,15); calSource="fmp"; localStorage.removeItem("fmp_cal_block"); }
        catch(e){ fmpErr=(e?.message||String(e));
          if(/Error Message|Restricted|not available|Invalid API|Exclusive|subscription|plan|HTTP 40/i.test(fmpErr)) localStorage.setItem("fmp_cal_block",fmpKey); }
      }
      // Finnhub kalendář (jen pokud má klíč a není zablokovaný). Finnhub kalendář
      // je dnes placený → free klíč selže; zablokuj ho jako FMP, ať nezdržuje.
      if(!cal.length&&key){
        const fhBlocked=localStorage.getItem("fh_cal_block")===key;
        if(!fhBlocked){
          try{ cal=await fetchCalendar(key,15); calSource="finnhub"; localStorage.removeItem("fh_cal_block"); calWarn=fmpErr?"ℹ FMP nezabral — jede Finnhub 15 měs.":""; }
          catch(e){ if(/Error Message|Restricted|not available|Invalid|premium|subscription|access|plan|HTTP 40/i.test(String(e?.message||e))) localStorage.setItem("fh_cal_block",key); }
        }
      }
      if(!cal.length){
        try{
          const fresh=await fetchFFEventsCached(force);calSource="forexfactory";
          cal=mergeFFHistory(fresh);   // slij do trvalé zásoby + použij nasbíranou historii
        }catch(e2){
          cal=loadFFHistory();         // i kdyby feed teď spadl, využij dřív nasbíranou historii
          if(cal.length){calSource="forexfactory";}
          else{calWarn="⚠ Žádný zdroj kalendáře (FMP/Finnhub/ForexFactory) nevyšel. Skóre jede jen z COT/yield/policy. Detail: "+(e2?.message||e2);}
        }
      }
      // Action/FMP/Finnhub = plné pokrytí + actual → plná důvěra; FF proxy → dle historie.
      if(calSource==="action"||calSource==="fmp"||calSource==="finnhub"){ g_fundConfidence=1; }
      else if(calSource==="forexfactory"){
        g_fundConfidence=ffConfidence(cal);
        const span=ffHistorySpanMonths(cal);
        calWarn="ℹ Kalendář jede z ForexFactory ("+cal.length+" událostí, ~"+span.toFixed(1)+" měs historie, fundamenty "+Math.round(g_fundConfidence*100)+"% — roste s historií; COT/yield/policy drží bias)."+((fmpKey&&(fmpErr||fmpBlocked))?" Pozn.: FMP free tarif ekonomický kalendář nemá (jen placený plán) — proto FF.":"");
      } else { g_fundConfidence=FF_FUND_DAMP; }
      try{ g_calSource=calSource||"ff-hist"; }catch(e){}
      try{ cal=applyManualActuals(cal); }catch(e){}
      const calScoring=capEventsWindow(cal,FUND_HIST_WINDOW_WEEKS); // stejné okno pro skórování na každém zařízení — viz engine.js
      setCalData(cal);

      // AUTO-UPDATE: CB sazby, CPI, CB Policy stance z kalendáře (bez extra API)
      const{updated}=autoUpdateFromCalendar(cal);
      if(updated.length) console.log("Auto-aktualizováno:",updated.join(" | "));

      // Oil data (AV, cachuje se 6h)
      const currentAvKey=localStorage.getItem("av")||"";
      if(currentAvKey) await fetchOilPrice(currentAvKey).catch(()=>{});
      await fetchActionOil().catch(()=>{});
      await fetchActionPrices().catch(()=>{});
      await fetchActionVix().catch(()=>{});
      try{ applyAutoRiskSentiment(); setRiskSentimentUI(g_riskSentiment); }catch(e){}
      await fetchActionCOTHistory().catch(()=>{});
      await fetchActionRetail().catch(()=>{});

      // Kanonické vstupy (sdílená COT historie + retail ze serverového cronu, ne
      // per-zařízení live snapshoty) — ať PC/mobil/Classic počítají skóre ze
      // stejných čísel. Fallback na parametry jen než se poprvé stáhnou data.
      const liveCot=(typeof getLatestCOTScores==='function'&&getLatestCOTScores())||cot;
      const liveSent=(typeof getCanonicalSent==='function'&&getCanonicalSent())||sent;
      const sc={};
      CURRENCIES.forEach(c=>{sc[c]=scoreCurrency(calScoring,c,liveCot,liveSent);});
      setScores(sc);
      saveScoreHistory(sc);
      saveEngineSnapshot(sc); // forward log celého enginu (pro backtest komponent)
      try{ if(typeof saveScoreDeltaSnapshot==='function') saveScoreDeltaSnapshot(sc); }catch(e){}
      const ranked=rankPairs(sc,aiRef.current);
      setPairs(ranked);
      updateBiasFlips(ranked);
      setSelected(p=>p||ranked[0]);
      let up=[];
      if(calSource==="finnhub"){ try{ up=await fetchUpcoming14(key); }catch(e){} }
      else { up=deriveUpcomingFromEvents(cal); }
      setUpcoming(up);
      const fc={};ranked.forEach(p=>{fc[p.pair]=buildForecastV5(p,sc,calScoring,up);});
      setForecasts(fc);
      try{ if(typeof logForecastSnapshot==='function') logForecastSnapshot(fc); }catch(e){}
      setLastUp(new Date());
      // přehled stavu kalendáře pro hlavičku
      const nowMs=Date.now();
      const fwdDays=up.reduce((mx,e)=>{const d=(new Date(e.time).getTime()-nowMs)/86400000;return d>mx?d:mx;},0);
      const months=(calSource==="fmp"||calSource==="finnhub")?15:ffHistorySpanMonths(cal);
      setCalMeta({source:calSource||"none",months,count:cal.length,fwdDays:Math.max(0,Math.round(fwdDays)),conf:Math.round((g_fundConfidence||0)*100)});
      if(calWarn) setError(calWarn);
    }catch(e){setError(e.message);}
    setLoading(false);
  },[]);

  // Vyžádaný refresh přímo z živého ForexFactory feedu (bez GitHub cronu) —
  // funguje pro kohokoliv s internetem, ne jen pro vlastníka GH repa.
  const refreshCalendarLive=useCallback(async()=>{
    setCalLiveLoading(true);setCalMsg("");
    try{
      const fr=await fetchFFEventsCached(true);
      mergeFFHistory(fr);
      await loadData(fhKey||"",cotRef.current,sentRef.current);
      setCalMsg("✅ Kalendář obnoven z živého FF feedu ("+new Date().toLocaleTimeString("cs-CZ")+").");
    }catch(e){ setCalMsg("⚠ Live refresh selhal: "+String(e&&e.message||e)); }
    setCalLiveLoading(false);
  },[loadData,fhKey]);

  const setManualActual=useCallback(async(e)=>{
    const cur=(e.actual||"").toString();
    const v=window.prompt('Ruční hodnota Actual pro "'+e.event+'" ('+getEventCurrency(e)+'):',cur);
    if(v===null) return;
    try{ saveManualActual(ffHistKey(e),v); }catch(err){}
    await loadData(fhKey||"",cotRef.current,sentRef.current);
  },[loadData,fhKey]);

  const toggleFav=useCallback((pair)=>{
    setFavs(prev=>{
      const f=new Set(prev);
      if(f.has(pair))f.delete(pair);else f.add(pair);
      saveFavoritePairs([...f]);
      return f;
    });
  },[]);

  useEffect(()=>{
    if(!started) return;
    loadData(fhKey||"",cotRef.current,sentRef.current);
    // Cloud sync na pozadí při startu (když přihlášen): slije cloud → znovu načti. Tiché při selhání.
    if(window.Sync&&window.Sync.ready){ window.Sync.session().then(s=>{ if(s) window.Sync.syncNow().then(()=>loadData(fhKey||"",cotRef.current,sentRef.current)).catch(()=>{}); }).catch(()=>{}); }
    // Doplň lokální COT historii o týdny ze serverového cronu (data/cot_hist.json) —
    // doplňuje mezery, kdyby appka sama nestihla nějaký týden stáhnout. Tiché při selhání.
    fetchActionCOTHistory().catch(()=>{});
    // Po startu na pozadí dotáhni aktuální COT z CFTC API, když je uložený starší
    // než ~4 dny (nebo neznámé datum). Tiché při selhání – uložená data zůstanou.
    (async()=>{
      try{
        const m0=loadCOTMeta();
        const ageDays=m0&&m0.asOf?((Date.now()-new Date(m0.asOf).getTime())/86400000):NaN;
        if(!(ageDays<=4)){
          const {scores:cs,meta:m}=await fetchCOTAuto();
          setCotData(cs);setCotMeta(m);
          await loadData(fhKey||"",cs,sentRef.current);
        }
      }catch(e){/* tiché – uložený COT zůstává */}
    })();
    // interval čte nejnovější COT/sentiment z refů (ne ze zastaralé closure)
    timer.current=setInterval(()=>loadData(fhKey||"",cotRef.current,sentRef.current),5*60*1000);
    return()=>clearInterval(timer.current);
  },[started,fhKey]);

  async function autoCOT(){
    setCotLoading(true);setError("");
    try{
      const {scores:cs,meta}=await fetchCOTAuto();
      setCotData(cs);setCotMeta(meta);
      await loadData(fhKey||"",cs,sentData);
    }catch(e){setError("COT auto selhal: "+(e?.message||e));}
    setCotLoading(false);
  }


  async function loadCOTHistoryNow(){
    setHistoryLoading(true);setError("");
    try{
      const y=new Date().getFullYear();
      const years=Array.from({length:6},(_,i)=>y-i); // aktuální rok + 5 let zpět
      const {scores:cs,meta,records,yearsLoaded}=await fetchCOTHistoryYears(years);
      setCotData(cs);setCotMeta(meta);
      setError(`COT historie načtena: ${records} týdnů, ${yearsLoaded} ročních souborů. Score historie doplněna zpětně.`);
      await loadData(fhKey||"",cs,sentData);
    }catch(e){setError("Online COT historie selhala. Použij 📂 Import COT z PC. Detail: "+(e?.message||e));}
    setHistoryLoading(false);
  }

  async function loadLocalCOTHistory(files){
    setHistoryLoading(true);setError("");
    try{
      const {scores:cs,meta,records,filesLoaded,errors}=await loadCOTHistoryFromLocalFiles(files);
      setCotData(cs);setCotMeta(meta);
      const warn=errors?.length?` (${errors.length} souborů přeskočeno)` : "";
      setError(`Lokální COT historie načtena: ${records} týdnů, ${filesLoaded} souborů${warn}. Score historie doplněna zpětně.`);
      await loadData(fhKey||"",cs,sentData);
    }catch(e){setError("Lokální COT import selhal: "+(e?.message||e));}
    setHistoryLoading(false);
  }

  if(!started) return <Setup onSave={(fh,av)=>{if(fh)setFhKey(fh);setAvKey(av||"");try{localStorage.setItem("v5_started","1");}catch(e){}setStarted(true);}}/>;

// ── REACT ERROR BOUNDARY ─────────────────────────────────────
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null,info:null};}
  static getDerivedStateFromError(err){return{err};}
  componentDidCatch(err,info){this.setState({err,info});console.error("App crashed:",err,info);}
  render(){
    if(this.state.err){
      const e=this.state.err;
      return React.createElement('div',{style:{padding:"24px",color:"#f85149",background:"#0d1117",fontFamily:"monospace",whiteSpace:"pre-wrap",fontSize:"11px",lineHeight:"1.6"}},
        "🔴 CHYBA APLIKACE — zkopíruj text níže a pošli ho:\n\n"+
        (e.message||String(e))+"\n\n"+
        (e.stack||"")+"\n\n"+
        (this.state.info?.componentStack||"")
      );
    }
    return this.props.children;
  }
}

window.onerror=function(msg,src,line,col,err){
  var el=document.getElementById("root");
  if(el)el.innerHTML='<div style="padding:24px;color:#f85149;background:#0d1117;font-family:monospace;white-space:pre-wrap;font-size:12px">CHYBA: '+msg+'\nLine: '+line+'\n'+(err&&err.stack?err.stack:'')+'</div>';
  return false;
};
// ── Přístupová brána (uzavřený test — jen ADMIN_EMAIL) ─────────────────────
// Stejný princip a stejný účet jako v index.html — viz komentář tam. Appka
// nemá backend, tohle NENÍ skutečná bezpečnost, jen brání běžnému otevření.
function AppGate(){
  const [checking,setChecking]=useState(true);
  const [authorized,setAuthorized]=useState(false);
  const [email,setEmail]=useState(""), [pw,setPw]=useState("");
  const [busy,setBusy]=useState(false), [msg,setMsg]=useState("");
  useEffect(()=>{
    if(!(window.Sync&&window.Sync.ready)){ setChecking(false); setAuthorized(false); setMsg("⚠ Přihlašovací systém se nenačetl (internet/Supabase). Zkus obnovit stránku."); return; }
    const check=(s)=>{ const e=s&&s.user&&s.user.email?String(s.user.email).trim().toLowerCase():null; setChecking(false); setAuthorized(e===ADMIN_EMAIL); };
    window.Sync.session().then(check).catch(()=>{ setChecking(false); setAuthorized(false); });
    window.Sync.onAuth((s)=>check(s));
  },[]);
  async function login(){
    if(!email.trim()||pw.length<6){ setMsg("Zadej e-mail a heslo (min. 6 znaků)."); return; }
    setBusy(true); setMsg("⏳ Přihlašuji…");
    try{ await window.Sync.signInPassword(email,pw); } // úspěch → onAuth výš přepne authorized sám
    catch(e){ setBusy(false); setMsg("⚠ "+(e&&e.message||e)); }
  }
  const wrap={minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#07080c",fontFamily:"'Manrope',sans-serif"};
  if(checking) return <div style={{...wrap,color:"#8b93a3",fontSize:13}}>Načítám…</div>;
  if(authorized) return <ErrorBoundary><App/></ErrorBoundary>;
  const fld={width:"100%",padding:"11px 14px",background:"#0a0d13",border:"1px solid #1b2130",borderRadius:10,color:"#eaedf3",fontSize:13,fontFamily:"'Manrope',sans-serif",marginBottom:10,display:"block",outline:"none",boxSizing:"border-box"};
  const btn={width:"100%",padding:"12px",background:"linear-gradient(180deg,#5e7cfb,#4c63d9)",border:"1px solid #d4a72c",borderRadius:10,color:"#fff",fontSize:13,fontWeight:700,fontFamily:"inherit",cursor:"pointer"};
  return (
    <div style={{...wrap,padding:20}}>
      <div style={{width:"100%",maxWidth:360,background:"#0c0f16",border:"1px solid #1b2130",borderRadius:14,padding:"28px 26px",boxSizing:"border-box"}}>
        <div style={{fontSize:16,fontWeight:800,color:"#eaedf3",marginBottom:4}}>🔒 AT Trading FX</div>
        <div style={{fontSize:12,color:"#8b93a3",marginBottom:18,lineHeight:1.5}}>Analyzer je zatím v uzavřeném testu. Přihlas se svým účtem.</div>
        <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="e-mail" type="email" autoCapitalize="off" autoCorrect="off" style={fld}/>
        <input value={pw} onChange={e=>setPw(e.target.value)} placeholder="heslo" type="password" onKeyDown={e=>{if(e.key==="Enter")login();}} style={fld}/>
        <button type="button" disabled={busy} onClick={login} style={btn}>Přihlásit</button>
        {msg&&<div style={{fontSize:11.5,marginTop:12,color:/^⚠/.test(msg)?"#f2606e":"#8b93a3",lineHeight:1.5}}>{msg}</div>}
      </div>
    </div>
  );
}
try{
  ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><AppGate/></ErrorBoundary>);
}catch(err){
  document.getElementById("root").innerHTML='<div style="padding:24px;color:#f85149;background:#0d1117;font-family:system-ui">Aplikace spadla při startu: '+(err&&err.message?err.message:err)+'</div>';
}
</script>
</body>
