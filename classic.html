/* ── V4.3 PRO VISUAL SKIN ───────────────────────────── */
.pro-shell{min-height:100vh;background:radial-gradient(circle at 35% -10%,#162033 0,#0b111a 34%,#070b11 100%);}
.pro-card{background:linear-gradient(180deg,rgba(22,31,45,.92),rgba(10,15,23,.96));border:1px solid #263242;border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.03)}

.pro-tab{padding:13px 16px;background:none;border:0;border-bottom:2px solid transparent;color:#8b949e;font-weight:600;font-size:12px;letter-spacing:.02em;cursor:pointer;white-space:nowrap}

.pro-grid{display:grid;grid-template-columns:300px minmax(620px,1fr) 420px;gap:14px;align-items:start}

.pro-muted{color:#8b949e}.blue{color:#5e7cfb}.purple{color:#bf4cff}.green{color:#2ed3a0}.red{color:#ff4d4d}.orange{color:#d29922}
.pro-stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:1px solid #243142;border-bottom:1px solid #243142}

@media(max-width:1200px){.fx-status-bar{grid-template-columns:1fr}.fx-status-section{border-right:0;border-bottom:1px solid #1b2a35;flex-wrap:wrap}.coach-compact,.coach-compact>div{height:auto!important}}

/* ── INDIGO COMMAND THEME (mockup) — přebarvení, nemění strukturu ───────── */
:root{--cmd-green:#2ed3a0;--cmd-green2:#27c08a;--cmd-accent:#5e7cfb;--cmd-red:#ff5470;--cmd-border:#1b2130;}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;
const ADMIN_EMAIL='p.vospalek@gmail.com';

// ── KONFIGURACE ──────────────────────────────────────────
// ── ENGINE ── veškerá logika je ve sdíleném souboru engine.js
// (načtený jako <script> v hlavičce; stejný engine používá i mobilní m.html).

// ── SETUP ─────────────────────────────────────────────────
function Setup({onSave}){
  const [fh,setFh]=useState(localStorage.getItem("fh")||"");
  const [av,setAv]=useState(localStorage.getItem("av")||"");
  const [fmp,setFmp]=useState(localStorage.getItem("fmp")||"");
  function save(){
    localStorage.setItem("av",av.trim());
    if(fh.trim()) localStorage.setItem("fh",fh.trim()); else localStorage.removeItem("fh");
    if(fmp.trim()) localStorage.setItem("fmp",fmp.trim()); else localStorage.removeItem("fmp");
    if(typeof antKeySetup!=="undefined"&&antKeySetup.trim()) localStorage.setItem("ant_key",antKeySetup.trim());
    onSave(fh.trim(),av.trim());
  }
  const inp={width:"100%",padding:"9px 12px",background:"#0d1117",border:"1px solid #30363d",borderRadius:6,color:"#e6edf3",fontSize:14,marginBottom:14,display:"block"};
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}>
      <div style={{background:"#161b22",border:"1px solid #30363d",borderRadius:12,padding:"2rem",maxWidth:500,width:"100%"}}>
        <div style={{fontSize:28,marginBottom:8}}>📊</div>
        <h1 style={{fontSize:22,marginBottom:6}}>FX Fundamental Analyzer</h1>
        <p style={{color:"#8b949e",fontSize:13,marginBottom:8}}>Fundamenty · COT · Sentiment · Seasonalita · Tržní struktura</p>
        <p style={{color:"#2ed3a0",fontSize:12,marginBottom:18}}>✓ Jede zdarma na ForexFactory + nahrané historii. Všechny klíče níže jsou volitelné.</p>
        <label style={{color:"#8b949e",fontSize:12,display:"block",marginBottom:5}}>
          Finnhub API klíč <span style={{color:"#6e7681"}}>(volitelné)</span> — <a href="https://finnhub.io/register" target="_blank">finnhub.io</a>
        </label>
        <input value={fh} onChange={e=>setFh(e.target.value)} placeholder="pk_… (nepovinné)" style={inp}/>
        <label style={{color:"#8b949e",fontSize:12,display:"block",marginBottom:5}}>
          FMP klíč <span style={{color:"#6e7681"}}>(volitelné, placený kalendář)</span> — <a href="https://site.financialmodelingprep.com/developer/docs" target="_blank">financialmodelingprep.com</a>
        </label>
        <input value={fmp} onChange={e=>setFmp(e.target.value)} placeholder="FMP API key (nepovinné)" style={inp}/>
        <label style={{color:"#8b949e",fontSize:12,display:"block",marginBottom:5}}>
          Alpha Vantage klíč <span style={{color:"#6e7681"}}>(volitelné)</span> — <a href="https://alphavantage.co/support/#api-key" target="_blank">alphavantage.co</a> — tržní struktura
        </label>
        <input value={av} onChange={e=>setAv(e.target.value)} placeholder="ABCDEF123456 (nepovinné)" style={{...inp,marginBottom:20}}/>
        <button onClick={save} style={{width:"100%",padding:"10px",background:"#238636",border:"none",borderRadius:6,color:"#fff",fontSize:14,fontWeight:500,cursor:"pointer"}}>Spustit →</button>
        <p style={{color:"#6e7681",fontSize:11,marginTop:12,textAlign:"center"}}>Historii fundamentů nahraješ později v ⚙️ Nastavení → Import.</p>
      </div>
    </div>
  );
}

function SyncSection(){
  const [sess,setSess]=useState(null);
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [msg,setMsg]=useState("");
  const [busy,setBusy]=useState(false);
  const avail=window.Sync&&window.Sync.ready;
  const fld={width:"100%",padding:"8px 12px",background:"#0d1117",border:"1px solid #30363d",borderRadius:6,color:"#e6edf3",fontSize:13,marginBottom:8,display:"block"};
  const btn={width:"100%",padding:"9px",background:"#1f6feb",border:"none",borderRadius:6,color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer"};
  const sec={...btn,background:"#21262d",border:"1px solid #30363d",marginTop:6};
  async function doSync(reload){
    setBusy(true);setMsg("⏳ Synchronizuji…");
    try{ const st=await window.Sync.syncNow();
      setMsg(`✅ Sloučeno: ${st.events} událostí · ${st.cotWeeks} COT týdnů · ${st.trades} obchodů · ${st.keys} klíčů`+(reload?" — obnovuji…":""));
      if(reload) setTimeout(()=>location.reload(),1000);
    }catch(e){ setMsg("⚠ "+(e&&e.message||e)); }
    setBusy(false);
  }
  useEffect(()=>{ if(!avail)return; window.Sync.session().then(s=>setSess(s)); window.Sync.onAuth((s,event)=>{ setSess(s); if(s&&event==="SIGNED_IN") doSync(true); }); },[]);
  async function loginOrRegister(){
    if(!email.trim()||pw.length<6){setMsg("Zadej e-mail a heslo (min. 6 znaků).");return;}
    setBusy(true);setMsg("⏳ Přihlašuji…");
    try{ await window.Sync.signInPassword(email,pw); return; }
    catch(e){ const m=String(e&&e.message||e);
      if(/invalid login credentials/i.test(m)){
        try{ const d=await window.Sync.signUpPassword(email,pw);
          if(d&&d.session){ setMsg("✅ Účet vytvořen, přihlašuji…"); }
          else { setMsg("⚠ Vypni 'Confirm email' v Supabase a zkus znovu."); setBusy(false); }
        }catch(e2){ const m2=String(e2&&e2.message||e2);
          if(/already registered|already exists|User already/i.test(m2)) setMsg("⚠ E-mail už existuje. Dej 'Zapomenuté heslo' a nastav heslo.");
          else setMsg("⚠ "+m2); setBusy(false); }
      } else { setMsg("⚠ "+m); setBusy(false); }
    }
  }
  async function reset(){ if(!email.trim()){setMsg("Zadej e-mail.");return;} setBusy(true);setMsg(""); try{ await window.Sync.resetPassword(email); setMsg("📧 Odkaz na nastavení hesla poslán."); }catch(e){ setMsg("⚠ "+(e&&e.message||e)); } setBusy(false); }
  async function logout(){ await window.Sync.signOut(); setSess(null); setMsg("Odhlášeno."); }
  return (
    <div style={{borderBottom:"1px solid #21262d",paddingBottom:14,marginBottom:14}}>
      <div style={{fontSize:13,fontWeight:700,color:"#e6edf3",marginBottom:8}}>☁️ Cloud sync {sess?"· přihlášen":""}</div>
      {!avail&&<div style={{fontSize:11,color:"#8b949e"}}>Nedostupné (internet / Supabase se nenačetl).</div>}
      {avail&&!sess&&<>
        <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="e-mail" type="email" autoCapitalize="off" autoCorrect="off" style={fld}/>
        <input value={pw} onChange={e=>setPw(e.target.value)} placeholder="heslo (min. 6, stejné na PC i mobilu)" type="password" style={fld}/>
        <button disabled={busy} onClick={loginOrRegister} style={btn}>🔐 Přihlásit / Vytvořit účet</button>
        <button disabled={busy} onClick={reset} style={sec}>Zapomenuté heslo</button>
      </>}
      {avail&&sess&&<>
        <div style={{fontSize:11,color:"#8b949e",marginBottom:8}}>Přihlášen: <b style={{color:"#e6edf3"}}>{sess.user&&sess.user.email}</b></div>
        <button disabled={busy} onClick={()=>doSync(true)} style={btn}>🔄 Synchronizovat teď</button>
        <button onClick={logout} style={sec}>Odhlásit</button>
      </>}
      {msg&&<div style={{fontSize:11,marginTop:8,color:msg[0]==="⚠"?"#f85149":"#2ed3a0",lineHeight:1.5}}>{msg}</div>}
    </div>
  );
}
function SettingsOverlay({fhKey,avKey,onSave,onClose,onImported}){
  const [fh,setFh]=useState(fhKey);const [av,setAv]=useState(avKey||"");
  const [fmp,setFmp]=useState(localStorage.getItem("fmp")||"");
  const [impMsg,setImpMsg]=useState("");
  const [histInfo,setHistInfo]=useState(()=>{const h=loadFFHistory();return{n:h.length,span:ffHistorySpanMonths(h)};});
  function refreshHistInfo(){const h=loadFFHistory();setHistInfo({n:h.length,span:ffHistorySpanMonths(h)});}
  function doImportFile(file){
    if(!file)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const text=String(rd.result||"");
        let raw;
        if(/\.csv$/i.test(file.name)||(!/^\s*[\[{]/.test(text))) raw=parseEconomicCSV(text);
        else{const j=JSON.parse(text);raw=Array.isArray(j)?j:(Array.isArray(j.events)?j.events:[]);}
        const st=importEconomicEvents(raw);
        setImpMsg(`✓ Naimportováno ${st.normalized} událostí (přidáno ${st.added}). Zásoba: ${st.total} událostí, ~${st.span.toFixed(1)} měs historie.`);
        refreshHistInfo();
        if(onImported)onImported();
      }catch(e){setImpMsg("⚠ Import selhal: "+(e?.message||e));}
    };
    rd.onerror=()=>setImpMsg("⚠ Soubor se nepodařilo načíst.");
    rd.readAsText(file);
  }
  function doExport(kind){
    const h=loadFFHistory();
    if(!h.length){setImpMsg("Zásoba je prázdná — není co exportovat.");return;}

function StrengthBar({currency,score,change7d}){

  const color=score>2?"#2ed3a0":score<-2?"#f85149":"#d29922";
  const changeColor=change7d>0?"#2ed3a0":change7d<0?"#f85149":"#8b949e";
  const changeArrow=change7d>0?"↑":change7d<0?"↓":"→";
  return(
    <div style={{marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
        <span style={{fontWeight:500}}>{FLAGS[currency]} {currency} <span style={{color:"#8b949e",fontSize:12,fontWeight:400}}>{NAMES[currency]}</span></span>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {change7d!==0&&<span style={{fontSize:11,color:changeColor}}>{changeArrow} {Math.abs(change7d).toFixed(1)} (7d)</span>}

        </div>
      </div>
      <div style={{height:7,background:"#21262d",borderRadius:4,overflow:"hidden"}}>
        <div style={{width:`${pct}%`,height:"100%",background:color,borderRadius:4,transition:"width .5s"}}/>
      </div>
    </div>
  );
}

// ── COPY BUTTON ────────────────────────────────────────────────
function CopyBtn({text}){
  const [copied,setCopied]=useState(false);
  function doCopy(){
    const str=String(text||"");
    if(navigator.clipboard){
      navigator.clipboard.writeText(str).catch(()=>fallback(str));
    } else { fallback(str); }
    setCopied(true);
    setTimeout(()=>setCopied(false),1500);
  }
  function fallback(str){
    const ta=document.createElement("textarea");
    ta.value=str;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    document.execCommand("copy");document.body.removeChild(ta);
  }
  return(
    <span onClick={doCopy} title={"Kopírovat: "+text} style={{cursor:"pointer",fontSize:9,padding:"1px 5px",borderRadius:3,marginLeft:4,userSelect:"none",flexShrink:0,
      color:copied?"#2ed3a0":"#4a6a88",
      background:copied?"rgba(46,211,160,.12)":"rgba(255,255,255,.04)",
      border:`1px solid ${copied?"#2ed3a033":"#1d2a3688"}`,
      transition:"all .2s",display:"inline-block"}}>
      {copied?"✓":"⧉"}
    </span>
  );
}

  const statusColor=(dailyState&&dailyState.color)||ac;
  // Jednotné prahy s PC/mobilem (dřív tu byly vlastní >=5/>=2.5) — viz BAND_THRESHOLDS v engine.js
  const bandName=(typeof getDiffBand==="function")?getDiffBand(p.diff):null;

          <span style={{...mono,fontWeight:700,fontSize:10.5,letterSpacing:".06em",color:ac,background:buy?"rgba(46,211,160,.1)":"rgba(255,84,112,.1)",border:"1px solid "+ac+"38",borderRadius:6,padding:"2px 7px"}}>{p.dir}</span>

function ScoreBreakdown({currency,scores}){
  const s=scores[currency];if(!s) return null;
  const oilSt=getOilStatus();
  // Vážené příspěvky ze scoreCurrency().components — Σ řádků sedí přesně na
  // celkové skóre v hlavičce (dřív se ukazovaly nevážené hodnoty a Fundamenty
  // v sobě skrytě nesly Policy+Yield podruhé). Fallback na stará syrová pole,
  // dokud components nedorazí.
  const items=Array.isArray(s.components)&&s.components.length
    ? s.components.filter(x=>x.value!==0).sort((a,b)=>Math.abs(b.value)-Math.abs(a.value)).map(x=>({label:x.label,value:x.value,max:2}))
    : [
    {label:"Fundamenty (data)",value:s.fund_score,max:10},
    ...(s.yield_adj!==undefined?[{label:"Real yield diff",value:s.yield_adj,max:1.5}]:[]),
    ...(s.policy_adj!==undefined&&s.policy_adj!==0?[{label:`CB politika (${CB_POLICY_DATA[currency]?.label||""})`,value:s.policy_adj,max:1.5}]:[]),
    ...(s.risk_adj!==undefined&&s.risk_adj!==0?[{label:`Risk sentiment (${g_riskSentiment>0?"risk-on":g_riskSentiment<0?"risk-off":"neutral"})`,value:s.risk_adj,max:1.2}]:[]),
    {label:"COT (velcí hráči)",value:s.cot_score,max:3},
    ...(MOMENTUM_ENABLED&&s.momentum_adj&&s.momentum_adj!==0?[{label:"Score momentum",value:parseFloat((s.momentum_adj*0.3).toFixed(2)),max:1}]:[]),
    {label:"Retail sentiment",value:s.sent_score,max:2},
    {label:"Seasonalita (2%)",value:s.season_score,max:2},
    ...((currency==="CAD"||currency==="USD")&&s.oil_adj!==undefined&&s.oil_adj!==0

        <span style={{fontSize:16,fontWeight:700,color:tc}}>{total>0?"+":""}{total.toFixed(1)}</span>
      </div>
      {items.map(({label,value,max})=>{
        const c=value>0?"#2ed3a0":value<0?"#f85149":"#8b949e";
        const pct=((value+max)/(max*2))*100;
        return(
          <div key={label} style={{marginBottom:6}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:2}}>
              <span style={{color:"#8b949e"}}>{label}</span>
              <span style={{color:c,fontWeight:600}}>{value>0?"+":""}{value.toFixed(1)}</span>
            </div>
            <div style={{height:3,background:"#21262d",borderRadius:2,overflow:"hidden"}}>
              <div style={{width:`${pct}%`,height:"100%",background:c,borderRadius:2}}/>
            </div>
          </div>
        );
      })}
      {s.cot_pct!==null&&s.cot_pct!==undefined&&(
        <div style={{marginTop:8,paddingTop:7,borderTop:"1px solid #21262d",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:10,color:"#8b949e"}}>COT Percentil (okno 104 týdnů)</span>
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <div style={{width:50,height:4,background:"#21262d",borderRadius:2,overflow:"hidden"}}><div style={{width:`${s.cot_pct}%`,height:"100%",background:s.cot_pct>=85||s.cot_pct<=15?"#d29922":"#7d95ff",borderRadius:2}}/></div>
            <span style={{fontSize:11,fontWeight:700,color:s.cot_pct>=88||s.cot_pct<=12?"#d29922":"#8b949e"}}>{s.cot_pct}p{s.cot_pct>=88?" 🚨":s.cot_pct<=12?" 🚨":""}</span>

function MiniLineChart({values=[],height=120,color="#d29922"}){
  const w=520,h=height,pad=18;
  const pts=svgPolyline(values,w,h,pad);
  const min=Math.min(-10,...values),max=Math.max(10,...values),span=max-min||1;
  return <svg viewBox={`0 0 ${w} ${h}`} style={{width:"100%",height,display:"block",background:"transparent",borderRadius:6}}>
    <line x1={pad} x2={w-pad} y1={h/2} y2={h/2} stroke="#30363d" strokeDasharray="4 4"/>
    <line x1={pad} x2={w-pad} y1={pad} y2={pad} stroke="#21262d"/>
    <line x1={pad} x2={w-pad} y1={h-pad} y2={h-pad} stroke="#21262d"/>
    <polyline points={pts} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
    {values.map((v,i)=> i===values.length-1 ? <circle key={i} cx={pad+(values.length===1?0:i*(w-2*pad)/(values.length-1))} cy={h-pad-((v-min)/span)*(h-2*pad)} r="4" fill={color}/> : null)}
  </svg>;
}
function DualLineChart({a=[],b=[],height=260,colorA="#5e7cfb",colorB="#bf4cff",labelA="BASE",labelB="QUOTE",unit="score",independentScale=false,autoFit=false,dates=null}){
  const w=760,h=height,padL=46,padR=22,padT=22,padB=32;
  const aVals=a.filter(function(v){return Number.isFinite(v);});
  const bVals=b.filter(function(v){return Number.isFinite(v);});
  // Normalizace: pokud independentScale, každá série vlastní min/max
  // Bezpečná verze bez arrow v ternárním výrazu
  var minA,maxA,minB,maxB,gMin,gMax,gSpan;
  if(independentScale&&aVals.length>1&&bVals.length>1){
    minA=Math.min.apply(null,aVals); maxA=Math.max.apply(null,aVals);
    minB=Math.min.apply(null,bVals); maxB=Math.max.apply(null,bVals);
    gMin=Math.min(minA,minB); gMax=Math.max(maxA,maxB);
  }else{
    var allVals=aVals.concat(bVals);
    if(autoFit&&allVals.length){
      var lo=Math.min.apply(null,allVals), hi=Math.max.apply(null,allVals);
      var pad=Math.max(0.8,(hi-lo)*0.18);
      gMin=lo-pad; gMax=hi+pad;
    }else{
      gMin=Math.min.apply(null,[-10].concat(allVals));
      gMax=Math.max.apply(null,[10].concat(allVals));
    }
    minA=gMin; maxA=gMax; minB=gMin; maxB=gMax;
  }
  gSpan=gMax-gMin||1;
  var aSpan=maxA-minA||1;
  var bSpan=maxB-minB||1;
  function xPos(i,n){return padL+(n<=1?0:i*(w-padL-padR)/(n-1));}
  function yPosA(v){return h-padB-((v-minA)/aSpan)*(h-padT-padB);}
  function yPosB(v){return h-padB-((v-minB)/bSpan)*(h-padT-padB);}
  function ptsA(arr){return arr.map(function(v,i){return xPos(i,arr.length)+","+yPosA(v);}).join(' ');}
  function ptsB(arr){return arr.map(function(v,i){return xPos(i,arr.length)+","+yPosB(v);}).join(' ');}
  var grid=[0,.25,.5,.75,1];
  var dateTicks=[];
  if(dates&&dates.length){
    var nd=dates.length;
    var mode=nd<=21?"day":(nd<=95?"week":"month");
    var MON=["led","úno","bře","dub","kvě","čvn","čvc","srp","zář","říj","lis","pro"];
    for(var di=0;di<nd;di++){
      var dd=dates[di]; if(!dd) continue;
      var show=false,lbl="";
      if(mode==="day"){ show=(nd<=16)||(di%2===0); lbl=dd.getDate()+"."+(dd.getMonth()+1)+"."; }
      else if(mode==="week"){ show=(dd.getDay()===1); lbl=dd.getDate()+"."+(dd.getMonth()+1)+"."; }
      else { show=(dd.getDate()===1); lbl=MON[dd.getMonth()]; }
      if(show) dateTicks.push({x:xPos(di,nd),lbl:lbl});
    }
  }
  var hasDates=!!(dates&&dates.length);
  var lastA=a.length>0?a[a.length-1]:null;
  var lastB=b.length>0?b[b.length-1]:null;
  var lastALabel=lastA!==null?(lastA>0?"+":"")+lastA.toFixed(unit==="net"?0:1):"";
  var lastBLabel=lastB!==null?(independentScale?lastB.toFixed(0)+"%":(lastB>0?"+":"")+lastB.toFixed(1)):"";
  return <svg viewBox={"0 0 "+w+" "+h} style={{width:"100%",height:height,display:"block"}}>
    <defs>
      <linearGradient id="fillA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={colorA} stopOpacity=".24"/><stop offset="100%" stopColor={colorA} stopOpacity="0"/></linearGradient>
      <linearGradient id="fillB" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={colorB} stopOpacity=".20"/><stop offset="100%" stopColor={colorB} stopOpacity="0"/></linearGradient>
    </defs>
    <rect x="0" y="0" width={w} height={h} fill="transparent"/>
    {grid.map(function(g,i){var yy=padT+g*(h-padT-padB);return <g key={i}><line x1={padL} x2={w-padR} y1={yy} y2={yy} stroke={i===2?"#334155":"#1d2a3a"}/><text x="10" y={yy+4} fill="#8b949e" fontSize="11">{(gMax-g*gSpan).toFixed(0)}</text></g>;})}
    {hasDates
      ? dateTicks.map(function(t,i){return <g key={"dt"+i}><line x1={t.x} x2={t.x} y1={padT} y2={h-padB} stroke="#1a2738" strokeDasharray="3 4"/><text x={t.x} y={h-10} fill="#8b949e" fontSize="10" textAnchor="middle">{t.lbl}</text></g>;})
      : [0,.2,.4,.6,.8,1].map(function(g,i){return <line key={i} x1={padL+g*(w-padL-padR)} x2={padL+g*(w-padL-padR)} y1={padT} y2={h-padB} stroke="#142032"/>;})
    }
    {a.length>1&&<polyline points={padL+","+(h-padB)+" "+ptsA(a)+" "+xPos(a.length-1,a.length)+","+(h-padB)} fill="url(#fillA)"/>}
    {b.length>1&&<polyline points={padL+","+(h-padB)+" "+ptsB(b)+" "+xPos(b.length-1,b.length)+","+(h-padB)} fill="url(#fillB)"/>}
    {a.length>1&&<polyline points={ptsA(a)} fill="none" stroke={colorA} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>}
    {b.length>1&&<polyline points={ptsB(b)} fill="none" stroke={colorB} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>}
    {lastA!==null&&<g><circle cx={xPos(a.length-1,a.length)} cy={yPosA(lastA)} r="5" fill={colorA}/><text x={w-padR-36} y={yPosA(lastA)-8} fill="#fff" fontSize="12" fontWeight="700">{lastALabel}</text></g>}
    {lastB!==null&&<g><circle cx={xPos(b.length-1,b.length)} cy={yPosB(lastB)} r="5" fill={colorB}/><text x={w-padR-36} y={yPosB(lastB)+18} fill="#fff" fontSize="12" fontWeight="700">{lastBLabel}</text></g>}
    {!hasDates&&<text x={padL} y={h-10} fill="#8b949e" fontSize="11">starší</text>}
    {!hasDates&&<text x={w-padR-42} y={h-10} fill="#8b949e" fontSize="11">aktuální</text>}
  </svg>;
}

function getEventCurrency(ev){
  const country=(ev.country||"").toUpperCase();
  return Object.entries(CURRENCY_COUNTRIES).find(([,c])=>c.some(x=>country.includes(x)))?.[0]||ev.currency||ev.country||"";
}
function getImpactInfo(ev){
  const raw=(ev.impact||ev.importance||"").toString().toLowerCase();
  const w=getWeight(ev.event||"");
  if(raw.includes("high")||raw==="3"||w>=2.5) return {label:"HIGH",color:"#ff4d4d",bg:"rgba(255,77,77,.12)"};
  if(raw.includes("medium")||raw==="2"||w>=1.5) return {label:"MED",color:"#d29922",bg:"rgba(210,153,34,.12)"};
  return {label:"LOW",color:"#e3d21f",bg:"rgba(227,210,31,.10)"};
}
function getSurpriseInfo(ev){
  const actual=ev.actual;
  const forecast=ev.estimate??ev.forecast??ev.consensus;
  const previous=ev.prev??ev.previous;
  const hasActual=actual!==undefined&&actual!==null&&actual!=="";
  const hasForecast=forecast!==undefined&&forecast!==null&&forecast!=="";
  if(!hasActual) return {label:"PENDING",color:"#8b949e",bg:"rgba(139,148,158,.10)",bias:"Čeká se na výsledek"};
  if(!hasForecast) return {label:"ACTUAL",color:"#7d95ff",bg:"rgba(88,166,255,.10)",bias:"Výsledek bez forecastu"};
  const dir=eventDirection({...ev,estimate:forecast,prev:previous});
  if(dir>0) return {label:"BEAT",color:"#2ed3a0",bg:"rgba(46,211,160,.12)",bias:"bullish pro měnu"};
  if(dir<0) return {label:"MISS",color:"#ff4d4d",bg:"rgba(255,77,77,.12)",bias:"bearish pro měnu"};
  return {label:"INLINE",color:"#d29922",bg:"rgba(210,153,34,.12)",bias:"v souladu s odhadem"};
}
// Živý stav COT-diff kalibrace místo dřívějšího natvrdo zapsaného
// "Backtest 2018-2024: diff 2-3 → WR 65% PF 2.0" — ten aktuální data
// nereprodukují (viz data/calibration.json, po opravě look-ahead biasu).
// Ukazuje skutečný výsledek: nejlepší robustní buňku (PF>1 v obou
// polovinách období), nebo poctivé "bez edge".
function CalibrationBadge(){
  const [cal,setCal]=useState(null);
  useEffect(()=>{let live=true;
    fetch("data/calibration.json?h="+Math.floor(Date.now()/3600000),{cache:"no-store"})
      .then(r=>r.ok?r.json():null).then(j=>{if(live)setCal(j);}).catch(()=>{});
    return ()=>{live=false;};
  },[]);
  if(!cal||!Array.isArray(cal.grid)) return <span style={{color:"#8b949e"}}>⏳ kalibrace COT-diff…</span>;
  const when=(cal.updated||"").slice(0,10);
  const robust=cal.grid.filter(g=>g.robust);
  if(robust.length){
    const b=robust.slice().sort((a,x)=>(x.pf||0)-(a.pf||0))[0];
    return <span title={"COT-diff složka samostatně; celý engine se kalibruje z data/engine_hist.json. Přepočet "+when} style={{color:"#d29922",cursor:"help"}}>⚡ COT-diff kalibrace: |diff|≥{b.diff}, {b.horizon}t → WR {b.wr}% PF {b.pf} (robustní, {when})</span>;
  }
  return <span title={"Žádná kombinace prahu a horizontu nemá PF>1 v obou polovinách období (vstup až po publikaci reportu). Pásma SLABÝ/SWEETSPOT/SILNÝ ber jako orientační heuristiku. Přepočet "+when} style={{color:"#8b949e",cursor:"help"}}>ℹ COT-diff sám o sobě aktuálně edge neukazuje ({when}) — pásma jsou heuristika</span>;
}

  const results={ts:Date.now(),status:"OK",note:""};
  async function avJson(url){
    const r=await fetch(url,{cache:"no-store"});
    const j=await r.json();
    if(j?.Note||j?.Information){results.status="LIMIT";results.note=j.Note||j.Information||"Alpha Vantage limit";}
    return j;
  }
  try{
    const j=await avJson(`https://www.alphavantage.co/query?function=CURRENCY_EXCHANGE_RATE&from_currency=XAU&to_currency=USD&apikey=${avKey}`);
    const p=parseFloat(j?.["Realtime Currency Exchange Rate"]?.["5. Exchange Rate"]);
    if(p&&p>0){results.gold=p.toFixed(1);localStorage.setItem("market_gold",results.gold);}else results.gold=localStorage.getItem("market_gold")||"—";
  }catch(e){results.gold=localStorage.getItem("market_gold")||"ERR";}
  try{
    const j=await avJson(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=UUP&apikey=${avKey}`);
    const q=j?.["Global Quote"]||{};const p=parseFloat(q["05. price"]);const ch=q["09. change"]||q["10. change percent"]||"";
    if(p&&p>0){results.dxy=p.toFixed(2)+(String(ch).startsWith("-")?" ▼":" ▲");localStorage.setItem("market_dxy",results.dxy);}else results.dxy=localStorage.getItem("market_dxy")||"—";
  }catch(e){results.dxy=localStorage.getItem("market_dxy")||"ERR";}
  try{
    const j=await avJson(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=VIXY&apikey=${avKey}`);
    const q=j?.["Global Quote"]||{};const p=parseFloat(q["05. price"]);const ch=q["09. change"]||q["10. change percent"]||"";
    if(p&&p>0){results.vix=p.toFixed(2)+(String(ch).startsWith("-")?" ▼":" ▲");localStorage.setItem("market_vix",results.vix);}else results.vix=localStorage.getItem("market_vix")||"—";
  }catch(e){results.vix=localStorage.getItem("market_vix")||"ERR";}
  if(results.status==="OK" && [results.dxy,results.vix,results.gold].some(v=>!v||v==="—"||v==="ERR")) results.status="PARTIAL";
  try{localStorage.setItem(CK,JSON.stringify(results));}catch(e){}
  return results;
}

function ConvictionSummary({pair,scores,aiAnalyses}){
  if(!pair) return null;
  const ai=aiAnalyses&&aiAnalyses[pair.pair];
  const aiDir=ai?(ai.bias==="BULLISH"||ai.entry_setup?.direction==="BUY"?"BUY":"SELL"):null;
  const fundDir=pair.dir;
  const diff=pair.diff||0;
  const sb=scores&&scores[pair.base]||{};
  const sq=scores&&scores[pair.quote]||{};
  const factors=[
    {label:"Fundamenty",ok:diff>=2.0,detail:"Score diff "+diff.toFixed(1)+(diff>=2.5?" silny":" slaby")+" signal"},
    {label:"CB Policy", ok:Math.abs((sb.policy_adj||0)-(sq.policy_adj||0))>0,
     detail:(CB_POLICY_DATA[pair.base]&&CB_POLICY_DATA[pair.base].label)||"hold"},
    {label:"COT",       ok:Math.abs((sb.cot_score||0)-(sq.cot_score||0))>0.3,
     detail:"COT diff "+((sb.cot_score||0)-(sq.cot_score||0)).toFixed(1)},
    {label:"Real Yield",ok:Math.abs((sb.yield_adj||0)-(sq.yield_adj||0))>0.2,
     detail:"Yield diff "+((sb.yield_adj||0)-(sq.yield_adj||0)).toFixed(2)+"%"},
    {label:"AI Analyza",ok:aiDir===fundDir,
     detail:ai?ai.tf+": "+ai.bias+" "+ai.confidence+"%":"Neni nactena"},
  ];
  const okCount=factors.filter(function(f){return f.ok;}).length;
  const conflict=aiDir&&aiDir!==fundDir;
  const boxColor=conflict?"#f85149":okCount>=4?"#2ed3a0":okCount>=3?"#d29922":"#8b949e";
  const boxBg=conflict?"rgba(248,81,73,.07)":okCount>=4?"rgba(46,211,160,.07)":okCount>=3?"rgba(210,153,34,.07)":"rgba(100,100,100,.05)";
  const icon=conflict?"KONFLIKT":okCount>=4?"SOUHLASI":"CASTECNE";
  const emoji=conflict?"⚠️":okCount>=4?"✅":"➡️";
  const mainMsg=conflict
    ?"Fundamenty "+fundDir+" ale AI "+aiDir+" — cekej"
    :okCount>=4?"Vetsina faktoru shodne "+fundDir+" — silna confluence"
    :okCount>=3?"Castecna shoda "+fundDir+" — stredni confluence"
    :"Faktory nesouhlasi — signal je slaby";
  return (
    <div style={{background:boxBg,border:"1.5px solid "+boxColor+"44",borderLeft:"4px solid "+boxColor,borderRadius:10,padding:"12px 16px",marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:16}}>{emoji}</span>
          <b style={{fontSize:14,color:boxColor}}>{icon}: {mainMsg}</b>
        </div>
        <span style={{fontSize:12,color:"#8b949e"}}>{okCount}/5 faktoru</span>
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {factors.map(function(f){
          return <span key={f.label} title={f.detail} style={{
            fontSize:10,padding:"3px 8px",borderRadius:4,
            background:f.ok?"rgba(46,211,160,.12)":"rgba(100,100,100,.1)",
            border:"1px solid "+(f.ok?"rgba(46,211,160,.3)":"rgba(100,100,100,.2)"),
            color:f.ok?"#2ed3a0":"#8b949e",
          }}>{f.ok?"✓":"○"} {f.label}</span>;
        })}
      </div>
    </div>
  );
}

  if(!s||!s.flippedAt||Date.now()-s.flippedAt>36*3600000) return null;
  const ev=mergeEvents(calData,upcoming);
  const b=getShortTermFundScore(pair.base,ev,DAY_WINDOW);
  const q=getShortTermFundScore(pair.quote,ev,DAY_WINDOW);
  const driver=(b.count>=q.count&&b.count>0)?pair.base:(q.count>0?pair.quote:null);
  const items=driver===pair.base?b.items:driver===pair.quote?q.items:[];
  const dtxt=driver
    ?`Spouštěč: ${FLAGS[driver]} ${driver} ${items.map(i=>i.event+" "+(i.beat?"BEAT":"MISS")).slice(0,2).join(", ")}.`
    :"Bez čerstvých dat — posun ze score/COT driftu.";

function DailyBriefPanel({pair,scores,calData,upcoming,positions,onPosition}){
  const pos=(positions&&positions[pair.pair])||"none";
  const c=detectFundamentalConflict(pair,scores,calData||[],upcoming||[],DAY_WINDOW);
  const fd=getPairFundamentalDay(pair,calData||[],upcoming||[]);
  const ltDir=c.ltDir;
  const conflict=c.hasData&&c.conflict;
  const confirm=c.hasData&&!c.conflict&&c.stDir===ltDir;
  const hasPast=fd.todayPast.length>0, hasTodayUp=fd.todayUpcoming.length>0, hasTomorrow=fd.tomorrow.length>0;
  const tm=e=>evDate(e).toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"});
  const evList=arr=>arr.slice(0,4).map(e=>`${COUNTRY_FLAGS[(e.country||"").toUpperCase()]||""}${tm(e)} ${e.event}${(e.actual!=null&&e.actual!=="")?` = ${e.actual}`:((e.estimate??e.forecast)!=null&&(e.estimate??e.forecast)!=="")?` (odh. ${e.estimate??e.forecast})`:""}`).join("  ·  ");
  // PRIMÁRNÍ stav = DNEŠEK (překvapení > dnes přijde > dnes proběhlo > nic). Zítřek = podtext.
  const col=conflict?"#ff4d4d":confirm?"#2ed3a0":hasTodayUp?"#d29922":hasPast?"#7d95ff":"#2ed3a0";
  const head=conflict?`⚠️ DAILY BRIEF — ${pair.pair}: 14d ${ltDir}, dnes krátkodobě PROTI`
    :confirm?`✅ DAILY BRIEF — ${pair.pair}: dnešní data potvrzují ${ltDir}`
    :hasTodayUp?`⏳ DAILY BRIEF — ${pair.pair}: dnes ještě přijdou důležité fundamenty`
    :hasPast?`🔵 DAILY BRIEF — ${pair.pair}: dnes proběhly velké zprávy`
    :`🟢 DAILY BRIEF — ${pair.pair}: dnes žádné velké fundamenty`;
  const releasedTxt=c.hasData?(conflict
    ?`14denní výhled zůstává ${ltDir}, ale dnešní data tlačí ${pair.pair} krátkodobě na ${c.stDir==="BUY"?"posílení":"oslabení"}. Dnes bych nehledal agresivní ${ltDir==="BUY"?"longy":"shorty"} — počkal na uklidnění a potvrzení ${ltDir} scénáře.`
    :confirm?`Dnešní data potvrzují směr ${ltDir} i krátkodobě — můžeš jet ve směru biasu.`
    :`Dnešní data jsou smíšená, bez jasného krátkodobého směru.`):null;
  let posTxt=null;
  if(pos!=="none"){
    const posDir=pos==="LONG"?"BUY":"SELL";
    if(conflict){
      posTxt=posDir===ltDir
        ?`Držíš ${pos} (ve směru 14d biasu), ale dnešek jde krátkodobě proti. Zvaž zajištění části zisku nebo SL na break-even. Spíš pullback než hluboký obrat.`
        :`Držíš ${pos} proti 14d biasu. Dnešek ti krátkodobě nahrává, ale dlouhodobě jdeš proti — ber zisk do biasu a netlač pozici.`;
    }else if(hasTodayUp){
      posTxt=`Držíš ${pos} a dnes ještě přijdou data → vyšší volatilita oběma směry. Zvaž zajištění části / SL na BE / sniž expozici.`;
    }
  }
  const lc=s=>s>0.5?"#2ed3a0":s<-0.5?"#ff4d4d":"#8b949e";
  const mk=(cur,st)=>st&&st.items.length?`${FLAGS[cur]} ${cur}: `+st.items.map(i=>i.event+" "+(i.beat?"BEAT":"MISS")).join(", "):null;
  return(
    <div style={{background:col+"12",border:"1px solid "+col+"44",borderLeft:"4px solid "+col,borderRadius:10,padding:"12px 16px",marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}>
        <div style={{fontSize:13,fontWeight:800,color:col}}>{head}</div>
        <PosToggle pair={pair.pair} pos={pos} onSet={s=>onPosition(pair.pair,s)} color={col}/>
      </div>
      {releasedTxt&&<div style={{fontSize:12,color:"#c9d1d9",lineHeight:1.5,marginBottom:6}}>{releasedTxt}</div>}
      {!c.hasData&&!hasPast&&!hasTodayUp&&<div style={{fontSize:12,color:"#8b949e",lineHeight:1.5,marginBottom:6}}>Žádná čerstvá data — můžeš ve směru 14d biasu ({ltDir}).</div>}
      {hasPast&&!c.hasData&&<div style={{fontSize:12,color:"#8fb8e0",lineHeight:1.5,marginBottom:6}}>🔵 Dnes proběhlo: {evList(fd.todayPast)} — zatím bez výrazného překvapení vs. odhad; sleduj reakci trhu.</div>}
      {hasTodayUp&&<div style={{fontSize:12,color:"#d6c089",lineHeight:1.5,marginBottom:6}}>⏳ Dnes ještě přijde: {evList(fd.todayUpcoming)}. Před zprávou bývá trh opatrný a volatilní.</div>}
      {hasTomorrow&&<div style={{fontSize:11,color:"#6e8aa0",lineHeight:1.5,marginBottom:6,borderTop:"1px solid rgba(255,255,255,.05)",paddingTop:6}}>📅 Zítra: {evList(fd.tomorrow)}</div>}
      {posTxt&&<div style={{fontSize:12,color:conflict?"#ffb3b3":"#d6c089",lineHeight:1.5,marginBottom:6,background:"rgba(255,255,255,.04)",borderRadius:6,padding:"6px 8px"}}>🎯 {posTxt}</div>}
      {c.hasData&&(mk(pair.base,c.stB)||mk(pair.quote,c.stQ))&&
        <div style={{fontSize:11,color:"#8b949e",lineHeight:1.6,borderTop:"1px solid rgba(255,255,255,.06)",paddingTop:6}}>
          {mk(pair.base,c.stB)&&<div>{mk(pair.base,c.stB)} <b style={{color:lc(c.stB.score)}}>({c.stB.score>0?"+":""}{c.stB.score})</b></div>}
          {mk(pair.quote,c.stQ)&&<div>{mk(pair.quote,c.stQ)} <b style={{color:lc(c.stQ.score)}}>({c.stQ.score>0?"+":""}{c.stQ.score})</b></div>}
        </div>}
    </div>
  );
}

v><div>Liquidity<br/><b className="green">HIGH</b></div><div>Trend<br/><b style={{color:ac}}>{pair.dir==="BUY"?"Bullish":"Bearish"}</b></div><div>Risk<br/><b className="orange">Medium</b></div></div></div><AIAnalysisStatusPanel pair={pair} aiAnalyses={aiAnalyses}/></div>

function AIAnalyzerTab({scores,selected,pairs,onSave,aiAnalyses={}}){
  const TF_LIST=["M1","M5","M15","M30","H1","H4","D1","W1"];
  const [imgFile,setImgFile]=useState(null);
  const [imgSrc,setImgSrc]=useState(null);
  const [selPair,setSelPair]=useState(selected?.pair||"EURUSD");
  const [tf,setTf]=useState("H4");
  const [price,setPrice]=useState("");
  const [notes,setNotes]=useState("");
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);
  const [error,setError]=useState("");
  const [drag,setDrag]=useState(false);
  const aiFileRef=useRef();
  const imgUrlRef=useRef(null); // pro revokaci object URL (zabránění memory leaku)

  useEffect(()=>{if(selected?.pair)setSelPair(selected.pair);},[selected?.pair]);
  // Cleanup posledního object URL při odmountování komponenty
  useEffect(()=>()=>{if(imgUrlRef.current)URL.revokeObjectURL(imgUrlRef.current);},[]);

  const pairData=pairs.find(p=>p.pair===selPair);

  const handleAIFile=useCallback(f=>{
    if(!f||!f.type.startsWith("image/")){setError("Nahrej obrázek (PNG/JPG/WebP)");return;}
    if(imgUrlRef.current)URL.revokeObjectURL(imgUrlRef.current); // uvolni předchozí
    const url=URL.createObjectURL(f);imgUrlRef.current=url;
    setImgFile(f);setError("");setImgSrc(url);setResult(null);
  },[]);

  const onAIDrop=useCallback(e=>{e.preventDefault();setDrag(false);handleAIFile(e.dataTransfer.files[0]);},[handleAIFile]);

  async function runAIAnalysis(){
    if(!imgFile){setError("Nejprve nahrej screenshot grafu.");return;}
    setLoading(true);setError("");setResult(null);
    try{
      const b64=await fileToBase64(imgFile);
      const mt=imgFile.type||"image/png";
      const ctx=[
        `Pair: ${selPair}, Timeframe: ${tf}`,
        price?`Current price: ${price}`:null,
        pairData?`Fundamental bias from FX Analyzer: ${pairData.dir}, diff: ${pairData.diff.toFixed(2)}, ${pairData.base} score: ${(scores[pairData.base]?.score||0).toFixed(1)}, ${pairData.quote} score: ${(scores[pairData.quote]?.score||0).toFixed(1)}`:null,
        notes?`Context: ${notes}`:null,
        "Return ONLY the JSON."
      ].filter(Boolean).join("\n");
      const orKey=localStorage.getItem("or_key")||"";
      if(!orKey){setError("Chybí OpenRouter API klíč — přidej ho v ⚙️ Settings (zdarma na openrouter.ai)");setLoading(false);return;}

      // ── Krok 1: Stáhni aktuální seznam free vision modelů z OpenRouter ──
      let visionModels=[];
      try{
        const mResp=await fetch("https://openrouter.ai/api/v1/models",{
          headers:{"Authorization":`Bearer ${orKey}`}
        });
        const mData=await mResp.json();
        visionModels=(mData.data||[])
          .filter(m=>m.id.endsWith(":free")&&(m.architecture?.modality||"").includes("image"))
          .sort((a,b)=>(b.context_length||0)-(a.context_length||0))
          .map(m=>m.id);
      }catch(e){console.warn("Models fetch failed:",e);}

      // ── Krok 2: Sestav seznam — manuální výběr + live modely + záloha ──
      const manualModel=localStorage.getItem("or_model")||"";
      const FALLBACK=["meta-llama/llama-3.2-11b-vision-instruct:free","meta-llama/llama-3.2-90b-vision-instruct:free","qwen/qwen-2-vl-7b-instruct:free"];
      const OR_MODELS=[manualModel,...visionModels,...FALLBACK]
        .filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);

      if(OR_MODELS.length===0){setError("OpenRouter nemá momentálně žádné free vision modely. Zkus to za chvíli.");setLoading(false);return;}

      // ── Krok 3: Zkus modely postupně ──
      let raw="",usedModel="",lastErr="";
      for(const model of OR_MODELS){
        try{
          const r=await fetch("https://openrouter.ai/api/v1/chat/completions",{
            method:"POST",
            headers:{"Content-Type":"application/json","Authorization":`Bearer ${orKey}`,"HTTP-Referer":"https://attrading.netlify.app","X-Title":"AT Trading FX Analyzer"},
            body:JSON.stringify({model,messages:[{role:"system",content:AI_SYSTEM_PROMPT},{role:"user",content:[{type:"image_url",image_url:{url:`data:${mt};base64,${b64}`}},{type:"text",text:ctx}]}],max_tokens:2048})
          });
          const d=await r.json();
          if(d.error){lastErr=`${model}: ${d.error.message||JSON.stringify(d.error)}`;continue;}
          const candidate=d.choices?.[0]?.message?.content||"";
          if(candidate){raw=candidate;usedModel=model;break;}
        }catch(e){lastErr=`${model}: ${e.message}`;continue;}
      }
      if(!raw) throw new Error("Žádný free vision model není momentálně dostupný. Zkus to znovu za pár minut nebo zvol model ručně v Settings.\nDetail: "+lastErr);
      console.log("✓ AI analýza dokončena, model:",usedModel);
      const clean=raw.replace(/```json|```/g,"").trim();
      const si=clean.indexOf("{"),ei=clean.lastIndexOf("}");
      const parsed=JSON.parse(si>=0&&ei>si?clean.slice(si,ei+1):clean);
      setResult(parsed);
      if(onSave&&parsed){onSave(selPair,tf,parsed);}
    }catch(e){setError("Analýza selhala: "+(e?.message||String(e)));}
    setLoading(false);
  }

  const biasColor=result?.bias==="BULLISH"?"var(--cmd-green)":result?.bias==="BEARISH"?"var(--cmd-red)":"#d29922";
  const inp={width:"100%",padding:"7px 10px",background:"#080d14",border:"1px solid #1d2a36",borderRadius:6,color:"#e6edf3",fontSize:12,outline:"none",fontFamily:"inherit"};

  return(
    <div style={{display:"grid",gridTemplateColumns:"300px 1fr",gap:14,alignItems:"start"}}>
      {/* ── LEFT: Controls ── */}
      <div style={{display:"flex",flexDirection:"column",gap:10}}>

        {/* Upload */}
        <div className="pro-card" style={{padding:14}}>
          <div className="pro-panel-title" style={{marginBottom:9}}>📊 Screenshot grafu</div>
          <div onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={onAIDrop}
            onClick={()=>aiFileRef.current?.click()}
            style={{border:`2px dashed ${drag?"var(--cmd-green)":imgSrc?"rgba(46,211,160,.4)":"#263242"}`,borderRadius:9,minHeight:imgSrc?0:110,padding:imgSrc?0:"18px 12px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",transition:"border-color .2s",background:drag?"rgba(46,211,160,.04)":"transparent",overflow:"hidden"}}>
            {imgSrc?<img src={imgSrc} alt="chart" style={{width:"100%",borderRadius:7,display:"block"}}/>
              :<><div style={{fontSize:24,marginBottom:5}}>📈</div><div style={{fontSize:11,color:"#8b949e",textAlign:"center"}}>Přetáhni screenshot<br/>nebo klikni pro výběr</div></>}
          </div>
          <input ref={aiFileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{if(e.target.files[0])handleAIFile(e.target.files[0]);e.target.value="";}}/>
          {imgSrc&&<button onClick={()=>{if(imgUrlRef.current){URL.revokeObjectURL(imgUrlRef.current);imgUrlRef.current=null;}setImgSrc(null);setImgFile(null);setResult(null);}} style={{marginTop:4,background:"none",border:"none",color:"#8b949e",fontSize:10,cursor:"pointer"}}>✕ Odebrat</button>}
          <div style={{marginTop:6,fontSize:10,color:"#8b949e"}}>PNG · JPG · WebP · TradingView / MT4/5</div>
        </div>

        {/* Pair + TF */}
        <div className="pro-card" style={{padding:14}}>
          <div className="pro-panel-title" style={{marginBottom:9}}>⚙️ Parametry</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <div><div style={{fontSize:10,color:"#8b949e",marginBottom:3}}>PÁR</div>
              <select value={selPair} onChange={e=>setSelPair(e.target.value)} style={{...inp,cursor:"pointer"}}>
                {STANDARD_PAIRS.map(p=><option key={p.pair} value={p.pair}>{FLAGS[p.base]}{FLAGS[p.quote]} {p.pair}</option>)}
              </select></div>
            <div><div style={{fontSize:10,color:"#8b949e",marginBottom:3}}>TIMEFRAME</div>
              <select value={tf} onChange={e=>setTf(e.target.value)} style={{...inp,cursor:"pointer"}}>
                {TF_LIST.map(t=><option key={t} value={t}>{t}</option>)}
              </select></div>
          </div>
          <div><div style={{fontSize:10,color:"#8b949e",marginBottom:3}}>AKTUÁLNÍ CENA (volitelné)</div>
            <input value={price} onChange={e=>setPrice(e.target.value)} placeholder="1.08450" style={inp}/></div>
        </div>

        {/* Fund context auto-filled */}
        {pairData&&<div style={{background:"#0b1420",border:"1px solid #1d2a36",borderRadius:10,padding:12}}>
          <div style={{fontSize:10,color:"#8b949e",marginBottom:5}}>AUTO — FUNDAMENTÁLNÍ KONTEXT</div>
          <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:3}}>
            <span style={{fontSize:12,fontWeight:700}}>{FLAGS[pairData.base]}{FLAGS[pairData.quote]} {pairData.pair}</span>
            <span style={{fontWeight:900,color:pairData.dir==="BUY"?"var(--cmd-green)":"var(--cmd-red)"}}>{pairData.dir}</span>
            <span style={{fontSize:11,color:"#8b949e"}}>diff {pairData.diff.toFixed(2)}</span>
          </div>
          <div style={{fontSize:10,color:"#8b949e"}}>
            {pairData.base}: <b style={{color:"#e6edf3"}}>{(scores[pairData.base]?.score||0).toFixed(1)}</b>
            {" · "}{pairData.quote}: <b style={{color:"#e6edf3"}}>{(scores[pairData.quote]?.score||0).toFixed(1)}</b>
          </div>
        </div>}

        {/* Notes */}
        <div className="pro-card" style={{padding:14}}>
          <div style={{fontSize:10,color:"#8b949e",marginBottom:4}}>POZNÁMKY PRO AI (volitelné)</div>
          <textarea value={notes} onChange={e=>setNotes(e.target.value)}
            placeholder="Čekám na retest, news ve 14:30, minulý týden bearish..."
            style={{...inp,minHeight:56,resize:"vertical"}}/>
        </div>

        <button onClick={runAIAnalysis} disabled={loading||!imgFile}
          style={{padding:"11px",borderRadius:9,border:"none",cursor:loading||!imgFile?"not-allowed":"pointer",background:!loading&&imgFile?"linear-gradient(135deg,var(--cmd-green),#27c08a)":"#111a26",color:!loading&&imgFile?"#041007":"#4a6a88",fontSize:13,fontWeight:900,letterSpacing:".03em",boxShadow:!loading&&imgFile?"0 0 22px rgba(46,211,160,.28)":"none",transition:"all .2s"}}>
          {loading?"⟳ Analyzuji...":"⚡ SPUSTIT AI ANALÝZU"}
        </button>
        {aiAnalyses[selPair]&&<AIStatusBar ai={aiAnalyses[selPair]}/>}

        {error&&<div style={{background:"rgba(248,81,73,.08)",border:"1px solid rgba(248,81,73,.22)",borderRadius:7,padding:"8px 11px",fontSize:11,color:"#f85149"}}>⚠ {error}</div>}
      </div>

      {/* ── RIGHT: Results ── */}
      <div>
        {!result&&!loading&&<div className="pro-card" style={{padding:44,textAlign:"center",minHeight:440,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <div style={{fontSize:38,marginBottom:11}}>🤖</div>
          <div style={{fontSize:14,fontWeight:700,color:"#4a6a88",marginBottom:5}}>Nahrej graf a spusť analýzu</div>
          <div style={{fontSize:11,color:"#263242",maxWidth:320,lineHeight:1.7,marginBottom:16}}>AI (Claude Vision) identifikuje tržní strukturu, order bloky, FVG, liquidity pools a navrhne entry setup s SL a TP.</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"center"}}>
            {["Market Structure","Order Blocks","FVG","Liquidity","S/R Zones","BOS/CHoCH","Entry Setup","RR Ratio"].map(t=>(
              <span key={t} style={{background:"rgba(46,211,160,.06)",border:"1px solid rgba(46,211,160,.14)",color:"rgba(46,211,160,.45)",borderRadius:5,padding:"2px 7px",fontSize:9}}>✓ {t}</span>
            ))}
          </div>
        </div>}

        {loading&&<div className="pro-card" style={{padding:44,textAlign:"center",minHeight:440,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14}}>
          <style>{`@keyframes ai-spin{to{transform:rotate(360deg)}}`}</style>
          <div style={{width:48,height:48,borderRadius:"50%",border:"3px solid #1d2a36",borderTop:"3px solid var(--cmd-green)",animation:"ai-spin 1s linear infinite"}}/>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:"var(--cmd-green)",marginBottom:3}}>AI analyzuje graf...</div>
            <div style={{fontSize:11,color:"#8b949e"}}>Market Structure · Order Blocks · FVG · Liquidity · Entry</div>
          </div>
        </div>}

        {result&&<div style={{display:"flex",flexDirection:"column",gap:12}}>

          {/* Bias + Confidence + Summary */}
          <div className="pro-card" style={{padding:15}}>
            <div style={{display:"flex",gap:11,alignItems:"flex-start",flexWrap:"wrap",marginBottom:11}}>
              <div style={{background:result.bias==="BULLISH"?"rgba(46,211,160,.11)":result.bias==="BEARISH"?"rgba(255,63,95,.11)":"rgba(240,180,41,.11)",border:`1px solid ${biasColor}44`,borderRadius:9,padding:"9px 15px",textAlign:"center",minWidth:85,flexShrink:0}}>
                <div style={{fontSize:9,color:"#8b949e",letterSpacing:".06em"}}>AI BIAS</div>
                <div style={{fontSize:17,fontWeight:900,color:biasColor,marginTop:2}}>{result.bias==="BULLISH"?"▲ BULL":result.bias==="BEARISH"?"▼ BEAR":"◆ SIDE"}</div>
              </div>
              <div style={{background:"#0b1420",border:"1px solid #1d2a36",borderRadius:9,padding:"9px 13px",textAlign:"center",flexShrink:0,minWidth:68}}>
                <div style={{fontSize:9,color:"#8b949e"}}>KONF.</div>
                <div style={{fontSize:20,fontWeight:900,color:result.confidence>=70?"var(--cmd-green)":result.confidence>=45?"#d29922":"var(--cmd-red)"}}>{result.confidence}</div>
                <div style={{fontSize:9,color:"#8b949e"}}>/100</div>
              </div>
              <div style={{flex:1,minWidth:160}}>
                <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:6}}>
                  <span style={{background:"rgba(94,124,251,.1)",border:"1px solid rgba(94,124,251,.28)",color:"#5e7cfb",borderRadius:4,padding:"1px 7px",fontSize:9,fontWeight:700}}>{selPair}</span>
                  <span style={{background:"rgba(94,124,251,.1)",border:"1px solid rgba(94,124,251,.28)",color:"#5e7cfb",borderRadius:4,padding:"1px 7px",fontSize:9,fontWeight:700}}>{tf}</span>
                  {pairData&&<span style={{background:pairData.dir==="BUY"?"rgba(46,211,160,.09)":"rgba(255,63,95,.09)",border:`1px solid ${pairData.dir==="BUY"?"rgba(46,211,160,.25)":"rgba(255,63,95,.25)"}`,color:pairData.dir==="BUY"?"var(--cmd-green)":"var(--cmd-red)",borderRadius:4,padding:"1px 7px",fontSize:9,fontWeight:700}}>Fund: {pairData.dir}</span>}
                </div>
                <div style={{fontSize:11,color:"#8b949e",lineHeight:1.65}}>{result.summary}</div>
              </div>
            </div>
            {result.risk_warnings?.length>0&&<div style={{background:"rgba(240,180,41,.05)",border:"1px solid rgba(240,180,41,.18)",borderRadius:6,padding:"6px 10px",display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
              <span style={{fontSize:10,color:"#d29922",fontWeight:700}}>⚠</span>
              {result.risk_warnings.map((w,i)=><span key={i} style={{fontSize:10,color:"#b07a28"}}>{i>0?"· ":""}{w}</span>)}
            </div>}
          </div>

          {/* Market Structure + Classical TA */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div className="pro-card" style={{padding:14}}>
              <div className="pro-panel-title" style={{marginBottom:9}}>🏗 Market Structure</div>
              {result.market_structure?.trend&&<div style={{marginBottom:7}}>
                <span style={{background:result.market_structure.trend==="UPTREND"?"rgba(46,211,160,.11)":result.market_structure.trend==="DOWNTREND"?"rgba(255,63,95,.11)":"rgba(240,180,41,.11)",border:`1px solid ${result.market_structure.trend==="UPTREND"?"rgba(46,211,160,.28)":result.market_structure.trend==="DOWNTREND"?"rgba(255,63,95,.28)":"rgba(240,180,41,.28)"}`,color:result.market_structure.trend==="UPTREND"?"var(--cmd-green)":result.market_structure.trend==="DOWNTREND"?"var(--cmd-red)":"#d29922",borderRadius:5,padding:"3px 9px",fontSize:11,fontWeight:700}}>
                  {result.market_structure.trend}
                </span>
              </div>}
              <div style={{fontSize:11,color:"#8b949e",lineHeight:1.6,marginBottom:7}}>{result.market_structure?.description}</div>
              {result.market_structure?.bos_choch&&result.market_structure.bos_choch!=="None visible"&&
                <div style={{background:"rgba(94,124,251,.06)",border:"1px solid rgba(94,124,251,.18)",borderRadius:6,padding:"6px 9px",fontSize:10,color:"#7d95ff",marginBottom:7}}>🔷 {result.market_structure.bos_choch}</div>}
              {result.market_structure?.swing_points&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:5}}>
                {[{l:"HH",v:result.market_structure.swing_points.hh,c:"#2ed3a0"},{l:"HL",v:result.market_structure.swing_points.hl,c:"#2ed3a088"},{l:"LH",v:result.market_structure.swing_points.lh,c:"#f8514988"},{l:"LL",v:result.market_structure.swing_points.ll,c:"#f85149"}].map(({l,v,c})=>(
                  <div key={l} style={{background:"#080d14",border:`1px solid ${c}30`,borderRadius:6,padding:"5px 0",textAlign:"center"}}>
                    <div style={{fontSize:9,color:c,fontWeight:700}}>{l}</div>
                    <div style={{fontSize:15,fontWeight:900,color:c}}>{v??"—"}</div>
                  </div>
                ))}
              </div>}
            </div>
            <div className="pro-card" style={{padding:14}}>
              <div className="pro-panel-title" style={{marginBottom:9}}>📐 Classical TA</div>
              {[{l:"TRENDLINES",v:result.classical_ta?.trendlines},{l:"PATTERNS",v:result.classical_ta?.patterns},{l:"EMA STRUKTURA",v:result.classical_ta?.ema_structure},{l:"MOMENTUM",v:result.classical_ta?.momentum}].map(({l,v})=>
                v&&v!=="None identified"&&!v.toLowerCase().includes("not visible")?
                <div key={l} style={{marginBottom:8}}>
                  <div style={{fontSize:8,color:"#8b949e88",letterSpacing:".06em",fontWeight:700,marginBottom:2}}>{l}</div>
                  <div style={{fontSize:11,color:"#c0d0e0",lineHeight:1.5}}>{v}</div>
                </div>:null
              )}
            </div>
          </div>

          {/* Key Levels */}
          {result.key_levels?.length>0&&<div className="pro-card" style={{padding:14}}>
            <div className="pro-panel-title" style={{marginBottom:9}}>📏 Key Levels — S/R Zóny</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div><div style={{fontSize:9,color:"#f8514966",letterSpacing:".06em",marginBottom:5}}>RESISTANCE</div>
                {result.key_levels.filter(l=>l.type==="RESISTANCE").map((l,i)=>(
                  <div key={i} style={{background:"rgba(248,81,73,.04)",border:"1px solid rgba(248,81,73,.18)",borderLeft:"3px solid rgba(248,81,73,.6)",borderRadius:"0 6px 6px 0",padding:"5px 9px",marginBottom:5}}>
                    <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:9,fontWeight:700,color:"#f85149"}}>RES</span><span style={{fontSize:9,color:"#f8514955"}}>{l.strength==="STRONG"?"●●●":l.strength==="MEDIUM"?"●●○":"●○○"}</span></div>
                    <div style={{fontSize:11,color:"#c0d0e0",marginTop:2}}>{l.zone}</div>
                    {l.notes&&<div style={{fontSize:9,color:"#8b949e",marginTop:1}}>{l.notes}</div>}
                  </div>
                ))}</div>
              <div><div style={{fontSize:9,color:"#2ed3a066",letterSpacing:".06em",marginBottom:5}}>SUPPORT</div>
                {result.key_levels.filter(l=>l.type==="SUPPORT").map((l,i)=>(
                  <div key={i} style={{background:"rgba(46,211,160,.04)",border:"1px solid rgba(46,211,160,.18)",borderLeft:"3px solid rgba(46,211,160,.6)",borderRadius:"0 6px 6px 0",padding:"5px 9px",marginBottom:5}}>
                    <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:9,fontWeight:700,color:"#2ed3a0"}}>SUP</span><span style={{fontSize:9,color:"#2ed3a055"}}>{l.strength==="STRONG"?"●●●":l.strength==="MEDIUM"?"●●○":"●○○"}</span></div>
                    <div style={{fontSize:11,color:"#c0d0e0",marginTop:2}}>{l.zone}</div>
                    {l.notes&&<div style={{fontSize:9,color:"#8b949e",marginTop:1}}>{l.notes}</div>}
                  </div>
                ))}</div>
            </div>
          </div>}

          {/* ICT/SMC Row */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
            <div className="pro-card" style={{padding:14}}>
              <div className="pro-panel-title" style={{marginBottom:9}}>🟦 Order Blocks</div>
              {result.ict_smc?.order_blocks?.length?result.ict_smc.order_blocks.map((ob,i)=>{
                const bull=ob.type==="BULLISH",c=bull?"#2ed3a0":"#f85149";
                const sc=ob.significance==="HIGH"?"#d29922":ob.significance==="MEDIUM"?"#7d95ff":"#8b949e";
                return <div key={i} style={{background:"#080d14",border:`1px solid ${c}20`,borderRadius:7,padding:"6px 8px",marginBottom:5}}>
                  <div style={{display:"flex",gap:3,flexWrap:"wrap",marginBottom:3}}>
                    <span style={{background:`${c}14`,border:`1px solid ${c}30`,color:c,borderRadius:3,padding:"0 5px",fontSize:9,fontWeight:700}}>{bull?"🟢 BULL OB":"🔴 BEAR OB"}</span>
                    <span style={{background:`${sc}14`,border:`1px solid ${sc}28`,color:sc,borderRadius:3,padding:"0 5px",fontSize:9,fontWeight:700}}>{ob.significance}</span>
                    <span style={{background:"rgba(139,148,158,.08)",color:"#8b949e",borderRadius:3,padding:"0 5px",fontSize:9}}>{(ob.status||"").replace("_"," ")}</span>
                  </div>
                  <div style={{fontSize:10,color:"#8b949e"}}>{ob.location}</div>
                </div>;
              }):<div style={{fontSize:11,color:"#263242"}}>Žádné OB identifikovány</div>}
              {result.ict_smc?.premium_discount&&<div style={{background:"rgba(94,124,251,.05)",border:"1px solid rgba(94,124,251,.15)",borderRadius:6,padding:"5px 8px",marginTop:7}}>
                <div style={{fontSize:8,color:"#7d95ff77",fontWeight:700,letterSpacing:".06em"}}>PREMIUM/DISCOUNT</div>
                <div style={{fontSize:10,color:"#7d95ff",marginTop:1}}>{result.ict_smc.premium_discount}</div>
              </div>}
            </div>
            <div className="pro-card" style={{padding:14}}>
              <div className="pro-panel-title" style={{marginBottom:9}}>⬜ Fair Value Gaps</div>
              {result.ict_smc?.fvg?.length?result.ict_smc.fvg.map((fvg,i)=>{
                const bull=fvg.type==="BULLISH",c=bull?"#2ed3a0":"#f85149";
                const sc=fvg.status==="OPEN"?"#d29922":fvg.status==="PARTIALLY_FILLED"?"#7d95ff":"#8b949e";
                return <div key={i} style={{background:"#080d14",border:`1px solid ${c}18`,borderRadius:7,padding:"6px 8px",marginBottom:5}}>
                  <div style={{display:"flex",gap:3,marginBottom:3}}>
                    <span style={{background:`${c}14`,border:`1px solid ${c}28`,color:c,borderRadius:3,padding:"0 5px",fontSize:9,fontWeight:700}}>{bull?"FVG ▲":"FVG ▼"}</span>
                    <span style={{background:`${sc}14`,border:`1px solid ${sc}28`,color:sc,borderRadius:3,padding:"0 5px",fontSize:9}}>{(fvg.status||"").replace("_"," ")}</span>
                  </div>
                  <div style={{fontSize:10,color:"#8b949e"}}>{fvg.location}</div>
                </div>;
              }):<div style={{fontSize:11,color:"#263242"}}>Žádné FVG identifikovány</div>}
            </div>
            <div className="pro-card" style={{padding:14}}>
              <div className="pro-panel-title" style={{marginBottom:9}}>💧 Liquidity Pools</div>
              {result.ict_smc?.liquidity?.length?result.ict_smc.liquidity.map((liq,i)=>{
                const isBSL=liq.type==="BSL",c=isBSL?"#7d95ff":"#bf4cff";
                return <div key={i} style={{background:"#080d14",border:`1px solid ${c}20`,borderRadius:7,padding:"6px 8px",marginBottom:5}}>
                  <span style={{background:`${c}14`,border:`1px solid ${c}28`,color:c,borderRadius:3,padding:"0 6px",fontSize:9,fontWeight:700}}>{isBSL?"💧 BSL":"💧 SSL"}</span>
                  <div style={{fontSize:10,color:"#8b949e",marginTop:3}}>{liq.location}</div>
                  {liq.notes&&<div style={{fontSize:9,color:"#8b949e55",marginTop:1}}>{liq.notes}</div>}
                </div>;
              }):<div style={{fontSize:11,color:"#263242"}}>Žádné liquidity pools</div>}
            </div>
          </div>

          {/* Entry Setup */}
          {result.entry_setup&&<div className="pro-card" style={{padding:15}}>
            <div className="pro-panel-title" style={{marginBottom:11}}>🎯 Entry Setup</div>
            <div style={{display:"flex",gap:12,alignItems:"flex-start",marginBottom:13}}>
              <div style={{background:result.entry_setup.direction==="BUY"?"rgba(46,211,160,.09)":result.entry_setup.direction==="SELL"?"rgba(255,63,95,.09)":"rgba(240,180,41,.09)",border:`2px solid ${result.entry_setup.direction==="BUY"?"rgba(46,211,160,.36)":result.entry_setup.direction==="SELL"?"rgba(255,63,95,.36)":"rgba(240,180,41,.36)"}`,borderRadius:9,padding:"9px 16px",textAlign:"center",flexShrink:0,minWidth:76}}>
                <div style={{fontSize:9,color:"#8b949e"}}>DIR</div>
                <div style={{fontSize:18,fontWeight:900,color:result.entry_setup.direction==="BUY"?"var(--cmd-green)":result.entry_setup.direction==="SELL"?"var(--cmd-red)":"#d29922",marginTop:2}}>{result.entry_setup.direction}</div>
                <div style={{fontSize:10,color:"#8b949e",marginTop:2}}>RR {result.entry_setup.rr_estimate||"—"}</div>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:9,color:"#8b949e",marginBottom:2}}>ENTRY TRIGGER</div>
                <div style={{fontSize:11,color:"#e6edf3",marginBottom:9,lineHeight:1.5}}>{result.entry_setup.entry_trigger||"—"}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                  {[{l:"ENTRY ZONE",v:result.entry_setup.entry_zone,c:"#7d95ff"},{l:"STOP LOSS",v:result.entry_setup.stop_loss,c:"#f85149"},{l:"TP1",v:result.entry_setup.tp1,c:"#2ed3a0"},{l:"TP2",v:result.entry_setup.tp2,c:"#2ed3a066"}].map(({l,v,c})=>(
                    <div key={l} style={{background:"#080d14",border:`1px solid ${c}22`,borderRadius:6,padding:"5px 8px"}}>
                      <div style={{fontSize:8,color:c,fontWeight:700,letterSpacing:".06em"}}>{l}</div>
                      <div style={{fontSize:10,color:"#a0b8d0",marginTop:2,lineHeight:1.4}}>{v||"—"}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            {result.entry_setup.confluence_factors?.length>0&&<div style={{marginBottom:9}}>
              <div style={{fontSize:9,color:"#8b949e",marginBottom:4,letterSpacing:".06em"}}>CONFLUENCE FAKTORY</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                {result.entry_setup.confluence_factors.map((f,i)=>(
                  <span key={i} style={{background:"rgba(46,211,160,.05)",border:"1px solid rgba(46,211,160,.15)",color:"rgba(46,211,160,.75)",borderRadius:4,padding:"1px 6px",fontSize:9}}>✓ {f}</span>
                ))}
              </div>
            </div>}
            {result.entry_setup.invalidation&&<div style={{background:"rgba(248,81,73,.05)",border:"1px solid rgba(248,81,73,.16)",borderRadius:6,padding:"6px 9px"}}>
              <div style={{fontSize:8,color:"#f85149",fontWeight:700,letterSpacing:".06em",marginBottom:1}}>⚠ INVALIDATION</div>
              <div style={{fontSize:10,color:"#c07080"}}>{result.entry_setup.invalidation}</div>
            </div>}
          </div>}

        </div>}
      </div>
    </div>
  );
}

// AI COACH — Trading Mentor Chat
// ════════════════════════════════════════════════════════════════
function AIStatusBar({ai}){
  if(!ai) return null;
  const ah=Math.round((Date.now()-ai.savedAt)/3600000);
  return(
    <div style={{background:"rgba(46,211,160,.07)",border:"1px solid rgba(46,211,160,.2)",borderRadius:7,padding:"6px 9px",fontSize:10,color:"#2ed3a0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <span>{"✓ Uložena: "+ai.tf+" · "+(ah<1?"<1h":ah+"h zpět")}</span>

function AICoachTab({scores,pairs,forecasts,aiAnalyses,cotData,selected,upcoming,calData=[]}){
  const defaultCoachMessage={
    role:"assistant",
    content:"Ahoj! Jsem tvůj AI trading mentor. Mám přístup ke všem datům aplikace — fundamentálnímu scoringu, COT, conviction skóre i výsledkům AI analýzy grafů.\n\nNa co se chceš zeptat?",
    ts:Date.now()
  };
  const [messages,setMessages]=useState(()=>{
    try{
      const saved=JSON.parse(localStorage.getItem("ai_coach_messages")||"null");
      return Array.isArray(saved)&&saved.length?saved:[defaultCoachMessage];
    }catch(e){return [defaultCoachMessage];}
  });
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [activePair,setActivePair]=useState(selected?.pair||"");
  const bottomRef=useRef();
  const inputRef=useRef();

  // Auto-scroll + shared history between dashboard compact panel and full AI Coach tab
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});try{localStorage.setItem("ai_coach_messages",JSON.stringify(messages.slice(-40)));}catch(e){}},[messages]);

  // Sync selected pair
  useEffect(()=>{if(selected?.pair)setActivePair(selected.pair);},[selected?.pair]);

  // ── Build context for AI ──────────────────────────────────────
  function buildContext(){
    // Top 5 pairs with full data
    const topPairs=(pairs||[]).slice(0,8).map(p=>{
      const f=forecasts?.[p.pair]||{};
      const ai=aiAnalyses?.[p.pair];
      const brf=detectFundamentalConflict(p,scores,calData||[],upcoming||[],DAY_WINDOW);
      const upT=[...getUpcomingToday(p.base,upcoming),...getUpcomingToday(p.quote,upcoming)];
      return {
        pair:p.pair, dir:p.dir, diff:p.diff.toFixed(2),
        conviction:p.conviction||0,
        reasons:(p.convictionReasons||[]).slice(0,3),
        forecast:{dir:f.dir,prob:f.prob,newsLabel:f.newsLabel||""},
        aiAnalysis:ai?{
          bias:ai.bias, tf:ai.tf, confidence:ai.confidence,
          trend:ai.market_structure?.trend,
          keyLevels:(ai.key_levels||[]).slice(0,3).map(l=>l.type+" "+l.zone+" "+l.strength),
          entry:ai.entry_setup?{
            dir:ai.entry_setup.direction,
            zone:ai.entry_setup.entry_zone,
            sl:ai.entry_setup.stop_loss,
            tp1:ai.entry_setup.tp1,
            rr:ai.entry_setup.rr_estimate,
            trigger:ai.entry_setup.entry_trigger,
            invalidation:ai.entry_setup.invalidation
          }:null,
          summary:ai.summary
        }:null,
        crowded:p.cotCrowded?true:false,
        corrDuplicate:p.corrDuplicate?true:false,
        dailyBrief:{
          stDir:brf.hasData?brf.stDir:null,
          conflict:brf.hasData?brf.conflict:false,
          position:getPosition(p.pair),
          todayNews:upT.map(e=>e.event).slice(0,4)
        }
      };
    });

    // Currency scores
    const currencyScores={};
    const CURR=["USD","EUR","GBP","JPY","AUD","NZD","CAD","CHF"];
    CURR.forEach(c=>{
      const s=scores?.[c];
      if(s) currencyScores[c]={
        total:(s.score||0).toFixed(2),
        fund:(s.fund_score||0).toFixed(2),
        cot:(s.cot_score||0).toFixed(2),
        cot_pct:s.cot_pct!=null?s.cot_pct:null,
        policy_adj:(s.policy_adj||0).toFixed(2),
        momentum:(s.momentum_adj||0).toFixed(2)
      };
    });

    // CB Policy context
    const cbContext={};
    CURR.forEach(c=>{if(typeof CB_POLICY_DATA!=="undefined"&&CB_POLICY_DATA[c])cbContext[c]=CB_POLICY_DATA[c].label||"";});

    // Active pair AI analysis
    const activeAI=activePair&&aiAnalyses?.[activePair]?aiAnalyses[activePair]:null;

    // Risk sentiment
    const rsSentiment=typeof g_riskSentiment!=="undefined"?
      (g_riskSentiment>0?"RISK-ON":g_riskSentiment<0?"RISK-OFF":"NEUTRAL"):"NEUTRAL";

    // Ekonomické eventy s Previous/Forecast/Actual — bez tohohle Coach nemohl
    // odpovídat na "co znamená tenhle report", jen zopakovat bias z Analyzeru.
    let econEvents=[]; try{ econEvents=buildCoachEventContext(calData||[],upcoming||[]); }catch(e){}

    return {
      timestamp:new Date().toISOString(),
      riskSentiment:rsSentiment,
      activePair:activePair||"none",
      currencyScores,
      cbPolicy:cbContext,
      recentFlips:getRecentFlips(pairs,calData||[],upcoming||[]).map(f=>({pair:f.pair,from:f.from,to:f.to,driver:f.driver,news:f.driverItems.map(i=>i.event+" "+(i.beat?"BEAT":"MISS"))})),
      econEvents,
      topPairs,
      activeAIAnalysis:activeAI?{
        pair:activePair,
        timeframe:activeAI.tf,
        bias:activeAI.bias,
        confidence:activeAI.confidence,
        marketStructure:activeAI.market_structure,
        keyLevels:activeAI.key_levels,
        ictSmc:activeAI.ict_smc,
        classicalTA:activeAI.classical_ta,
        entrySetup:activeAI.entry_setup,
        riskWarnings:activeAI.risk_warnings,
        summary:activeAI.summary

    };

  // ── System prompt ─────────────────────────────────────────────
  function buildSystemPrompt(ctx){
    return `Jsi zkušený FX trading mentor s hlubokými znalostmi fundamentální analýzy, COT dat, ICT/SMC metodologie a risk managementu. Mluvíš česky.

AKTUÁLNÍ DATA Z FX ANALYZERU:
${JSON.stringify(ctx,null,2)}

PRAVIDLA ODPOVĚDÍ:
1. Nikdy neříkej "kup teď" nebo "prodej teď" bez podmínek
2. Formát: [bias] → [scénář] → [podmínky vstupu] → [invalidace] → [riziko]
3. Pokud vidíš konflikt (např. fundamenty BUY ale AI analýza BEARISH) — vysvětli ho
4. Buď přímý a stručný — max 3–4 odstavce (mimo strukturovanou odpověď na ekonomický report, viz pravidla níže)
5. Vždy zmiň kde je invalidace
6. Jsi mentor, ne signální služba
7. DAILY BRIEF (dnešní vrstva): U párů sleduj dailyBrief. Pokud conflict=true, upozorni, že dnešní data jdou proti 14d biasu → dnes nehledat vstupy ve směru biasu, počkat na uklidnění (spíš pullback než hluboký obrat). Pokud todayNews není prázdné, varuj před nadcházející volatilitou. Pokud position != "none", veď uživatele co s pozicí (zajistit část, SL na BE, počkat na pullback) — vždy jako upozornění, ne příkaz.
8. OTOČENÍ VÝHLEDU: Pokud recentFlips není prázdné, sám to zmíň — 14d bias se po čerstvých datech otočil (uveď měnu a výsledky). Otočení NENÍ pokyn obchodovat opačně hned; vítr se obrátil, ke vstupu je potřeba technické potvrzení.
9. PROAKTIVITA: Na začátku nebo při obecném dotazu sám zmiň páry s conflict, otočením nebo todayNews i bez přímého dotazu.

${COACH_ECON_REPORT_RULES}

STYL:
- Mluv jako zkušený trader, ne jako robot
- Pokud uživatel zmíní konkrétní pár, použij jeho data z kontextu
- Pokud není konkrétní pár, zaměř se na top conviction páry
- Buď upřímný o slabostech signálu`;
  }

  // ── Send message ──────────────────────────────────────────────
  async function sendMessage(text){
    const msg=text||input.trim();
    if(!msg||loading) return;
    setInput("");

    const userMsg={role:"user",content:msg,ts:Date.now()};
    const history=[...messages,userMsg];
    setMessages(history);
    setLoading(true);

    const orKey=localStorage.getItem("or_key")||"";

      setLoading(false);
      return;

      const ctx=buildContext();

  // ── Quick buttons ─────────────────────────────────────────────
  const QUICK=[

    {icon:"✅",label:"Pre-trade checklist",q:`Projdi pre-trade checklist pro ${activePair||"top pár"} — zkontroluj všechny faktory před vstupem.`},
    {icon:"⚠️",label:"Rizika a konflikty",q:`Jaké jsou hlavní konflikty a rizika v aktuálních datech? Kde vidíš nesoulad?`},
    {icon:"📊",label:"Vysvětli COT",q:`Vysvětli mi aktuální COT pozice — kde jsou hedge fondy a co to znamená?`},
    {icon:"🔄",label:"Scénář invalidace",q:`Pro ${activePair||"top pár"} — co musí cena udělat, aby se setup stal neplatným?`},
  ];

  // ── Format message content ────────────────────────────────────
  function formatMsg(text){
    // Convert **bold** and line breaks
    return text.split("\n").map((line,i)=>{
      const parts=line.split(/(\*\*[^*]+\*\*)/g);

          {parts.map((p,j)=>p.startsWith("**")&&p.endsWith("**")?

  const inp={
    flex:1,background:"#0d1117",border:"1px solid #30363d",borderRadius:8,

        </div>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>

            style={{background:"#0d1117",border:"1px solid #30363d",borderRadius:6,color:"#e6edf3",fontSize:12,padding:"4px 8px",cursor:"pointer"}}>
            <option value="">— žádný —</option>

              <option key={p.pair} value={p.pair}>
                {p.pair} {p.dir} {p.conviction>=3?"★".repeat(p.conviction):""}
              </option>
            ))}
          </select>
          {activePair&&aiAnalyses?.[activePair]&&(
            <span style={{fontSize:9,background:"rgba(46,211,160,.1)",border:"1px solid rgba(46,211,160,.25)",color:"#2ed3a0",borderRadius:4,padding:"2px 7px"}}>
              AI analýza {aiAnalyses[activePair].tf} načtena ✓
            </span>
          )}
        </div>
      </div>

      {/* ── Context preview ── */}
      {activePair&&<CoachContextBar activePair={activePair} pairs={pairs||[]} aiAnalyses={aiAnalyses||{}} forecasts={forecasts||{}}/>}

      {/* ── Messages ── */}
      <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:10,paddingRight:4}}>
        {messages.map((m,i)=>(
          <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",
            flexDirection:m.role==="user"?"row-reverse":"row"}}>
            <div style={{
              width:32,height:32,borderRadius:"50%",flexShrink:0,display:"flex",
              alignItems:"center",justifyContent:"center",fontSize:14,
              background:m.role==="user"?"rgba(94,124,251,.2)":"rgba(46,211,160,.15)",
              border:`1px solid ${m.role==="user"?"rgba(94,124,251,.3)":"rgba(46,211,160,.3)"}`
            }}>
              {m.role==="user"?"👤":"🧠"}
            </div>
            <div style={{
              maxWidth:"80%",background:m.role==="user"?"rgba(94,124,251,.08)":"rgba(13,20,30,.95)",

        {loading&&(

            <div style={{background:"rgba(13,20,30,.95)",border:"1px solid #21262d",borderRadius:"4px 12px 12px 12px",padding:"10px 14px",display:"flex",gap:5,alignItems:"center"}}>

function DailyBriefBar({pairs,scores,calData,upcoming,inline,positions}){
  const tops=(pairs||[]).slice(0,8);
  const ev=mergeEvents(calData,upcoming);
  const flips=getRecentFlips(pairs,calData,upcoming);
  const rel={};CURRENCIES.forEach(c=>{const st=getShortTermFundScore(c,ev,DAY_WINDOW);if(st.count>0)rel[c]=st;});
  const up={};CURRENCIES.forEach(c=>{const e=getUpcomingToday(c,upcoming);if(e.length)up[c]=e;});
  const conflictPairs=tops.filter(p=>getPairDailyState(p,scores,calData,upcoming).level==="conflict");
  const upPairs=tops.filter(p=>getPairDailyState(p,scores,calData,upcoming).level==="upcoming");
  const posMap=positions||getAllPositions();
  const posLines=Object.entries(posMap).map(([pr,side])=>{
    if(side==="none") return null;
    const p=(pairs||[]).find(x=>x.pair===pr);
    const stt=p?getPairDailyState(p,scores,calData,upcoming):{level:"none"};
    return{pair:pr,side,level:stt.level};
  }).filter(Boolean);
  const nothing=!flips.length&&!Object.keys(rel).length&&!Object.keys(up).length&&!posLines.length;
  const tm=e=>evDate(e).toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"});
  const now=new Date().toLocaleString("cs-CZ",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"});
  if(nothing) return(
    <div style={{...(inline?{}:{gridColumn:"1 / -1"}),background:"rgba(46,211,160,.05)",border:"1px solid rgba(46,211,160,.18)",borderRadius:10,padding:"10px 14px",marginBottom:4,fontSize:12,color:"#8b949e"}}>
      🌅 <b style={{color:"#e6edf3"}}>Dnešní přehled</b> · {now} — žádné velké fundamenty na sledovaných párech. Můžeš jet podle 14d biasu.
    </div>
  );
  return(
    <div style={{...(inline?{}:{gridColumn:"1 / -1"}),background:"linear-gradient(180deg,rgba(12,18,27,.96),rgba(7,11,17,.98))",border:"1px solid #1b2a35",borderRadius:12,padding:"12px 16px",marginBottom:4}}>
      <div style={{fontSize:13,fontWeight:900,color:"#e6edf3",marginBottom:10}}>🌅 DNEŠNÍ PŘEHLED <span style={{fontSize:11,fontWeight:400,color:"#8b949e"}}>· {now}</span></div>
      {flips.length>0&&<div style={{marginBottom:10,paddingBottom:8,borderBottom:"1px solid rgba(191,76,255,.2)"}}>

// ── TRADING DENÍK ─────────────────────────────────────────
function loadJournal(){try{return JSON.parse(localStorage.getItem("journal")||"[]");}catch(e){return[];}}
function saveJournalArr(arr){try{localStorage.setItem("journal",JSON.stringify(arr));}catch(e){}}
const PAIR_LIST_TYPE={EURUSD:"white",USDJPY:"white",GBPUSD:"white",AUDUSD:"grey",USDCAD:"grey",USDCHF:"black"};
function captureContext(pairSym,pairs,scores,calData,upcoming,aiAnalyses){
  const p=(pairs||[]).find(function(x){return x.pair===pairSym;})||null;
  const diff=p?p.diff:null;
  const band=(typeof getDiffBand==="function")?getDiffBand(diff):null; // jednotná hranice — viz BAND_THRESHOLDS v engine.js
  let dailyLevel="none",flip=false,cbdi=null,cbStage=null;
  try{ if(p) dailyLevel=getPairDailyState(p,scores,calData,upcoming).level; }catch(e){}
  try{ flip=isPairFlipped(pairSym); }catch(e){}
  try{ cbdi=calcCBDI(); }catch(e){}
  try{ cbStage=getCBCycleStage().stage; }catch(e){}
  const ai=(aiAnalyses||{})[pairSym]||null;
  return {diff:diff,dir:p?p.dir:null,conviction:p?p.conviction:null,band:band,dailyLevel:dailyLevel,flip:flip,cbdi:cbdi,cbStage:cbStage,aiBias:ai?ai.bias:null,aiConf:ai?ai.confidence:null,listType:PAIR_LIST_TYPE[pairSym]||"other"};
}
function jStat(list){
  var w=list.filter(function(t){return t.outcome==="win";}).length;
  var l=list.filter(function(t){return t.outcome==="loss";}).length;
  var be=list.filter(function(t){return t.outcome==="be";}).length;
  var dec=w+l; var wr=dec?Math.round(w/dec*100):null;
  var rs=list.map(function(t){return t.outcome==="be"?0:(typeof t.rMultiple==="number"?t.rMultiple:null);}).filter(function(x){return x!=null;});
  var sumR=rs.reduce(function(a,b){return a+b;},0);
  var avgR=rs.length?sumR/rs.length:null;
  var pos=rs.filter(function(x){return x>0;}).reduce(function(a,b){return a+b;},0);
  var neg=Math.abs(rs.filter(function(x){return x<0;}).reduce(function(a,b){return a+b;},0));
  var pf=neg>0?pos/neg:(pos>0?999:null);
  return {n:list.length,w:w,l:l,be:be,wr:wr,sumR:sumR,avgR:avgR,pf:pf};
}
function SliceBar({label,s}){
  const wr=s.wr;
  const col=wr==null?"#4a6a88":(wr>=60?"#2ed3a0":(wr>=50?"#d29922":"#ff4d4d"));
  return(
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6,fontSize:12}}>
      <div style={{width:130,color:"#b7c3d1"}}>{label}</div>
      <div style={{flex:1,height:8,background:"#0d1117",borderRadius:5,overflow:"hidden"}}>
        <div style={{width:(wr==null?0:wr)+"%",height:"100%",background:col,borderRadius:5}}/>
      </div>
      <div style={{width:120,textAlign:"right",color:"#8b949e"}}>
        {wr==null?"—":<b style={{color:col}}>{wr}% WR</b>} · {s.n} obch.{s.avgR!=null?" · "+(s.avgR>0?"+":"")+s.avgR.toFixed(2)+"R":""}
      </div>
    </div>
  );
}
function JournalTab({journal,scores,pairs,calData,upcoming,aiAnalyses,selected,onAdd,onUpdate,onDelete,onImport}){
  journal=(journal||[]).filter(function(t){return !t.deleted;}); // tombstone z deleteTrade — nezobrazovat/nepočítat/needportovat
  // Explicitní řazení nejnovější-první — pole ze storage NENÍ garantovaně v tomhle
  // pořadí po cloud mergi (viz stejná oprava v index.html buildJournal()).
  journal=journal.slice().sort(function(a,b){return (Date.parse(b.openedAt||0)||0)-(Date.parse(a.openedAt||0)||0);});
  const ALLP=["EURUSD","GBPUSD","USDJPY","USDCHF","USDCAD","AUDUSD","NZDUSD","EURGBP","EURJPY","GBPJPY","AUDJPY","EURAUD","AUDNZD","NZDCAD","CADCHF","AUDCHF","NZDJPY","CADJPY","CHFJPY"];
  const pairOptions=(pairs&&pairs.length?pairs.map(function(p){return p.pair;}):ALLP);
  const [f,setF]=useState({pair:(selected&&selected.pair)||pairOptions[0]||"EURUSD",dir:"LONG",entry:"",sl:"",tp:"",riskPct:"",outcome:"open",rMultiple:"",notes:""});
  const [openOnly,setOpenOnly]=useState(false);
  function upd(k,v){setF(function(prev){var n=Object.assign({},prev);n[k]=v;return n;});}

    const closed=f.outcome&&f.outcome!=="open";
