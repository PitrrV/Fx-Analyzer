// ══════════════════════════════════════════════════════════════════════════
// ADMIN.HTML — nový vzhled ("Command Center" styl), jen pro ADMIN_EMAIL.
//
// Samostatný, nezávislý frontend — stejný vzor jako index.html/m.html/
// classic.html (viz CLAUDE.md: "tři frontendy sdílí jen engine.js/sync.js,
// UI je duplikované nezávisle"). Tenhle soubor NENÍ propojený s index.html —
// jeho úpravy se nedotknou toho, co vidí "main" (běžní uživatelé).
//
// ROZSAH (fáze 1): sidebar (nav + OVERALL FX BIAS/RISK REŽIM/MOJE POZICE) +
// stránka "Síla měn" (ranking + centrální banky + hlavní faktory dne) — podle
// screenshotů, co poslal uživatel. Ostatní položky menu jsou zatím jen
// rozkreslené jako "brzy" — přibydou v dalších fázích, stejný vizuální jazyk.
//
// Datová vrstva je záměrně DUPLIKOVANÁ z index.html refreshData() (ne
// sdílená) — běží ale ve stejném prohlížeči/localStorage jako index.html,
// takže při stejných voláních (fetchActionCalendar, mergeFFHistory,
// capEventsWindow(...,FUND_HIST_WINDOW_WEEKS)...) vyjdou identická čísla —
// viz reálný nález a oprava nekonzistence server/appka dřív v týhle historii.
// ══════════════════════════════════════════════════════════════════════════
const ADMIN_EMAIL='p.vospalek@gmail.com';
const COUNTRY2CCY=(()=>{const m={};try{Object.entries(CURRENCY_COUNTRIES).forEach(([ccy,arr])=>arr.forEach(c=>{if(!m[c])m[c]=ccy;}));}catch(e){}return m;})();
function ev2ccy(e){const c=(e.country||"").toUpperCase();return COUNTRY2CCY[c]||e.currency||c;}
function impUp(s){s=String(s||"").toLowerCase();return s.includes("high")||s==="3"?"HIGH":s.includes("med")||s==="2"?"MEDIUM":"LOW";}
const CCY_FLAG={USD:'🇺🇸',EUR:'🇪🇺',GBP:'🇬🇧',JPY:'🇯🇵',AUD:'🇦🇺',NZD:'🇳🇿',CAD:'🇨🇦',CHF:'🇨🇭'};

const NAV_GROUPS=['ANALÝZA','KONTEXT','AI & TOOLS','NASTAVENÍ'];
const TABS=[
  {id:'dashboard',label:'Dashboard',group:'ANALÝZA'},
  {id:'strength',label:'Síla měn',group:'ANALÝZA'},
  {id:'cot',label:'COT & Sentiment',group:'ANALÝZA'},
  {id:'ai',label:'AI Analýza',group:'ANALÝZA'},
  {id:'fundcontext',label:'Fundamentální kontext',group:'KONTEXT'},
  {id:'season',label:'Sezónnost',group:'KONTEXT'},
  {id:'calendar',label:'Kalendář',group:'KONTEXT'},
  {id:'journal',label:'Trading deník',group:'KONTEXT'},
  {id:'coach',label:'AI Coach',group:'AI & TOOLS'},
  {id:'screener',label:'Screener',group:'AI & TOOLS'},
  {id:'settings',label:'Nastavení',group:'NASTAVENÍ'},
];
const NAV_ICONS={
  dashboard:'<path d="M3 12h6l2-7 3 14 2-7h5"/>',
  strength:'<path d="M4 20V10M10 20V4M16 20v-8M22 20v-5"/>',
  cot:'<path d="M4 8h16M4 16h16"/><circle cx="9" cy="8" r="2.4"/><circle cx="16" cy="16" r="2.4"/>',
  ai:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/>',
  fundcontext:'<path d="M5 4h13a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M9 9h7M9 13h7M9 17h4"/>',
  season:'<path d="M3 17c3-9 6 5 9-3s6 2 9-5"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  journal:'<path d="M5 4h13a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M9 9h7M9 13h7"/>',
  coach:'<path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/>',
  screener:'<path d="M4 5h16l-6 8v6l-4 2v-8z"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
};
const TITLES={dashboard:'Dashboard',strength:'Síla měn',cot:'COT & Sentiment',ai:'AI Analýza',fundcontext:'Fundamentální kontext',season:'Sezónnost',calendar:'Kalendář',journal:'Trading deník',coach:'AI Coach',screener:'Screener',settings:'Nastavení'};
const SUBS={dashboard:'Fundamentální bias · skóre, COT, sentiment, sezónnost',strength:'Ranking 8 měn na škále −10 až +10',cot:'Instituce vs retail · contrarian příležitosti',ai:'Foto grafu → ICT/SMC rozbor',fundcontext:'Makro snímek podle měny',season:'Reálná měsíční výkonnost z historických cen',calendar:'Příštích 14 dní · HIGH / MEDIUM / LOW impact',journal:'Statistiky, edge a historie obchodů',coach:'Tvůj parťák — vidí skóre, COT i pozice',screener:'Hledání setupů napříč páry',settings:'Cloud sync · stav dat'};

class AdminApp extends React.Component{
  constructor(p){
    super(p);
    const h=React.createElement; this.h=h;
    this.state={tab:'strength',pos:(()=>{try{return getAllPositions();}catch(e){return {};}})(),loaded:false,err:''};
    this.CUR=(typeof CURRENCIES!=='undefined')?CURRENCIES:['USD','EUR','GBP','JPY','AUD','NZD','CAD','CHF'];
    this.NAMES=(typeof NAMES!=='undefined')?NAMES:{};
    this.D={}; this.PAIRS=[]; this.cbdi=50; this._cal=[]; this._up=[];
    this.CUR.forEach(c=>{this.D[c]={score:0,cotPct:50,chg7d:null};});
    this.buildGauge();
  }
  componentDidMount(){
    this.refreshData();
    this._t=setInterval(()=>this.refreshData(),5*60*1000);
    this._clk=setInterval(()=>this.forceUpdate(),1000);
    if(window.Sync&&window.Sync.ready){ window.Sync.session().then(s=>{ if(s) window.Sync.syncNow().then(()=>this.refreshData()).catch(()=>{}); }).catch(()=>{}); }
  }
  componentWillUnmount(){ clearInterval(this._t); clearInterval(this._clk); }

  // Stejná sekvence volání engine.js jako index.html refreshData() (viz
  // komentář nahoře souboru) — jen ořezaná o části, co Fáze 1 (Síla měn +
  // sidebar) nepotřebuje (US100, forecast/prob per pár, deník, ceny párů…).
  // Přidávat postupně, jak přibydou další stránky.
  async refreshData(){
    try{
      let cal=[];
      try{ const fresh=await fetchActionCalendar(); cal=mergeFFHistory(fresh); }catch(e){}
      if(!cal.length){ try{ const fr=await fetchFFEventsCached(false); cal=mergeFFHistory(fr); }catch(e){ cal=loadFFHistory(); } }
      try{ cal=applyManualActuals(cal); }catch(e){}
      const calScoring=capEventsWindow(cal,FUND_HIST_WINDOW_WEEKS);
      try{ autoUpdateFromCalendar(cal); }catch(e){}
      try{ await fetchActionVix(); }catch(e){}
      try{ applyAutoRiskSentiment(); }catch(e){}
      try{ await fetchActionCOTHistory(); }catch(e){}
      try{ const rj=await fetchActionRetail(); if(rj&&Array.isArray(rj.points)) this._retailHist=rj.points; }catch(e){}
      const cot=(typeof getLatestCOTScores==='function'&&getLatestCOTScores())||loadCOT();
      const sent=(typeof getCanonicalSent==='function'&&getCanonicalSent())||loadSentiment();
      const sc={}; this.CUR.forEach(c=>{ sc[c]=scoreCurrency(calScoring,c,cot,sent); });
      const ranked=rankPairs(sc,{});
      this._cal=cal; this._scores=sc; this._up=deriveUpcomingFromEvents(cal);
      this.CUR.forEach(c=>{ const s=sc[c]||{}; this.D[c]={
        score:+(s.score||0),
        cotPct:(()=>{try{return getCOTPercentile(c);}catch(e){return 50;}})()||50,
        chg7d:(()=>{try{return (typeof getScoreChangeDetail==='function')?getScoreChangeDetail(c,7):null;}catch(e){return null;}})(),
      }; });
      this.PAIRS=ranked.map(p=>({pair:p.pair,base:p.base,quote:p.quote,dir:p.dir,diff:+p.diff}));
      try{ this.cbdi=(typeof calcCBDI==='function')?(calcCBDI().value!=null?calcCBDI().value:calcCBDI()):50; }catch(e){ this.cbdi=50; }
      if(typeof this.cbdi!=='number') this.cbdi=50;
      this.setState({loaded:Date.now(),err:''});
    }catch(e){ console.error('refreshData',e); this.setState({loaded:Date.now(),err:String(e&&e.message||e)}); }
  }

  setCBRate(c,v){ const n=parseFloat(v); if(isNaN(n))return; try{ const cur=JSON.parse(localStorage.getItem('v5_cb_rates')||'{}'); cur[c]=n; localStorage.setItem('v5_cb_rates',JSON.stringify(cur)); }catch(e){} try{ if(typeof CENTRAL_BANK_RATES!=='undefined')CENTRAL_BANK_RATES[c]=n; }catch(e){} this.refreshData(); }
  setCBPolicyScore(c,v){ const n=parseInt(v,10); if(isNaN(n))return; try{ const cur=JSON.parse(localStorage.getItem('v5_cb_policy')||'{}'); cur[c]=Object.assign({},cur[c],{score:n}); localStorage.setItem('v5_cb_policy',JSON.stringify(cur)); }catch(e){} try{ if(typeof CB_POLICY_DATA!=='undefined'&&CB_POLICY_DATA[c]) CB_POLICY_DATA[c].score=n; }catch(e){} this.refreshData(); }
  setPos(pair,side){ this.setState(s=>{const n=Object.assign({},s.pos,{[pair]:s.pos[pair]===side?'none':side}); try{setPosition(pair,n[pair]);}catch(e){} return {pos:n};}); }

  card(extra){ return Object.assign({background:'linear-gradient(180deg,#0f121a,#0b0d13)',border:'1px solid #1b2130',borderRadius:18,boxShadow:'0 18px 40px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.04)'},extra||{}); }
  mono(extra){ return Object.assign({fontFamily:"'JetBrains Mono',monospace"},extra||{}); }
  ptitle(t,sub){ const h=this.h; return h('div',{style:{marginBottom:14}}, h('div',{style:{fontSize:13.5,fontWeight:800,letterSpacing:'-.01em'}},t), sub&&h('div',{style:this.mono({fontSize:10.5,color:'#5a6273',marginTop:3,letterSpacing:'.02em'})},sub)); }
  sgn(v,d){ return (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(d==null?1:d); }
  scol(v){ return v>0.05?'#2ed3a0':v<-0.05?'#f2606e':'#e8ab3f'; }
  today(){ return new Date().toLocaleDateString('cs-CZ',{day:'numeric',month:'long',year:'numeric'}); }

  buildGauge(){ const self=this,h=this.h;
    this.Gauge=({val})=>{ const R=64,cx=80,cy=80,sw=11;
      const polar=(deg)=>{ const a=(deg-180)*Math.PI/180; return [cx+R*Math.cos(a),cy+R*Math.sin(a)]; };
      const arc=(d0,d1)=>{ const [x0,y0]=polar(d0),[x1,y1]=polar(d1); const large=(d1-d0)>180?1:0; return `M ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1}`; };
      const bands=[{a:0,b:63,c:'#f2606e'},{a:63,b:108,c:'#e8ab3f'},{a:108,b:180,c:'#2ed3a0'}];
      const needle=val*1.8,[nx,ny]=polar(needle), col=val>60?'#2ed3a0':val>35?'#e8ab3f':'#f2606e';
      return h('div',{style:{position:'relative',width:160,height:104,margin:'0 auto'}},
        h('svg',{viewBox:'0 0 160 96',width:160,height:96},
          h('path',{d:arc(0,180),fill:'none',stroke:'#161b27',strokeWidth:sw,strokeLinecap:'round'}),
          bands.map((bd,i)=>h('path',{key:i,d:arc(bd.a+(i?2:0),bd.b-(i<2?2:0)),fill:'none',stroke:bd.c,strokeWidth:sw,strokeLinecap:'round',opacity:.92})),
          h('line',{x1:cx,y1:cy,x2:nx,y2:ny,stroke:'#eef1f6',strokeWidth:2.4,strokeLinecap:'round'}),
          h('circle',{cx:cx,cy:cy,r:4.5,fill:'#0b0d13',stroke:'#eef1f6',strokeWidth:2})),
        h('div',{style:{position:'absolute',bottom:0,left:0,right:0,textAlign:'center'}},h('div',{style:self.mono({fontSize:26,fontWeight:700,color:col,lineHeight:1})},val),h('div',{style:{fontSize:9.5,color:'#5a6273',letterSpacing:'.1em',marginTop:2}},'DIVERGENCE')));
    };
  }

  StrengthChart(){ const self=this,h=this.h; const rows=this.CUR.map(c=>Object.assign({c},this.D[c])).sort((a,b)=>b.score-a.score); const max=10;
    return h('div',{style:{display:'flex',flexDirection:'column',gap:9}},rows.map(r=>{ const pos=r.score>=0,col=pos?'#2ed3a0':'#f2606e',w=Math.abs(r.score)/max*50;
      return h('div',{key:r.c,style:{display:'grid',gridTemplateColumns:'62px 1fr 66px',alignItems:'center',gap:12}},
        h('div',{style:{display:'flex',alignItems:'center',gap:7}},h('span',{style:self.mono({fontSize:13,fontWeight:700,color:'#eaedf3'})},r.c)),
        h('div',{style:{position:'relative',height:26,background:'#0a0d13',border:'1px solid #161b27',borderRadius:7}},
          h('div',{style:{position:'absolute',left:'50%',top:0,bottom:0,width:1,background:'#2a3242'}}),
          h('div',{style:{position:'absolute',top:3,bottom:3,borderRadius:5,left:pos?'50%':`calc(50% - ${w}%)`,width:w+'%',background:`linear-gradient(90deg,${pos?col+'30':col},${pos?col:col+'30'})`,boxShadow:`0 0 14px ${col}55`}})),
        h('div',{style:{textAlign:'right',display:'flex',flexDirection:'column',alignItems:'flex-end'}},h('span',{style:self.mono({fontSize:14,fontWeight:700,color:col})},self.sgn(r.score)),r.chg7d?h('span',{style:self.mono({fontSize:9,color:r.chg7d.delta>=0?'#2ed3a0':'#f2606e'})},(r.chg7d.delta>=0?'▲':'▼')+' '+Math.abs(r.chg7d.delta).toFixed(1)+' '+r.chg7d.spanDays+'d'):null)); }));
  }

  // Nejbližší 2 nadcházející rozhodnutí centrálních bank z kalendáře (30 dní
  // dopředu) — "Další významná rozhodnutí" řádek pod tabulkou CB.
  nextCBDecisions(){
    let full=[]; try{ full=mergeEvents(this._cal||[],this._up||[])||[]; }catch(e){ full=this._up||[]; }
    const horizon=Date.now()+30*86400000;
    const hits=full.filter(e=>{ const t=parseEventTime(e.time); if(isNaN(t)||t<Date.now()||t>horizon) return false; return /rate decision|interest rate/i.test(e.event||''); })
      .sort((a,b)=>parseEventTime(a.time)-parseEventTime(b.time)).slice(0,3);
    return hits.map(e=>{ const d=new Date(parseEventTime(e.time)); return d.getDate()+'.'+(d.getMonth()+1)+'. ('+ev2ccy(e)+' '+(e.event||'')+')'; });
  }

  renderCBTable(){ const self=this,h=this.h;
    const rates=(typeof CENTRAL_BANK_RATES!=='undefined')?CENTRAL_BANK_RATES:{}; const pol=(typeof CB_POLICY_DATA!=='undefined')?CB_POLICY_DATA:{};
    let last=null; try{last=JSON.parse(localStorage.getItem('cb_last_auto')||'null');}catch(e){}
    const nextDec=this.nextCBDecisions();
    const stanceLabel=ps=>ps>0?'JESTŘÁBÍ +'+ps:ps<0?'HOLUBIČÍ '+ps:'NEUTRÁLNÍ';
    return h('div',{style:self.card({padding:'20px 22px'})},
      self.ptitle('Centrální banky — postoj & sazby','Auto z kalendáře (rozhodnutí o sazbách) · ruční override možný'),
      h('div',{style:{fontSize:11,color:'#8b93a3',background:'rgba(46,211,160,.07)',border:'1px solid rgba(46,211,160,.2)',borderRadius:9,padding:'9px 11px',marginBottom:14,lineHeight:1.5}},
        '🔄 Sazby, CPI i policy cyklus se aktualizují ',h('b',{style:{color:'#2ed3a0'}},'automaticky'),' z kalendáře, jakmile vyjde výsledek zasedání (actual). Ručně přepisuj jen když chceš předběhnout kalendář.',
        h('div',{style:{marginTop:6}},'Poslední update: '+new Date(this.state.loaded||Date.now()).toLocaleDateString('cs-CZ')+(nextDec.length?' · Další významná rozhodnutí: '+nextDec.join(', '):'')),
        last&&last.items&&last.items.length?h('div',{style:{marginTop:4,color:'#2ed3a0'}},'Naposledy auto: '+last.items.join(', ')+' · '+new Date(last.at).toLocaleDateString('cs-CZ')):null),
      h('div',{style:{display:'grid',gridTemplateColumns:'52px 90px 130px 1fr 90px',gap:10,padding:'0 0 9px',borderBottom:'1px solid #1b2130',fontSize:9.5,fontWeight:800,letterSpacing:'.06em',color:'#5a6273'}},['MĚNA','HLAVNÍ SAZBA','POSTOJ','KOMENTÁŘ','SÍLA POSTOJE'].map(x=>h('span',{key:x},x))),
      this.CUR.map(c=>{ const ps=(pol[c]&&pol[c].score)||0; const pc=ps>0?'#2ed3a0':ps<0?'#f2606e':'#e8ab3f';
        return h('div',{key:c,style:{display:'grid',gridTemplateColumns:'52px 90px 130px 1fr 90px',gap:10,alignItems:'center',padding:'10px 0',boxShadow:'0 1px 0 #14182333'}},
          h('span',{style:self.mono({fontSize:13,fontWeight:700})},c),
          h('div',{style:{display:'flex',alignItems:'center',gap:4}},h('input',{defaultValue:(rates[c]!=null?rates[c]:''),onBlur:e=>self.setCBRate(c,e.target.value),style:Object.assign(self.mono({fontSize:13,fontWeight:700,color:'#eaedf3'}),{width:52,background:'#0a0d13',border:'1px solid #1b2130',borderRadius:7,padding:'5px 7px',textAlign:'right',outline:'none'})}),h('span',{style:{fontSize:12,color:'#5a6273'}},'%')),
          h('span',{style:{fontSize:10,fontWeight:700,color:pc,background:pc+'1c',border:'1px solid '+pc+'40',borderRadius:6,padding:'3px 8px',textAlign:'center',width:'fit-content'}},stanceLabel(ps)),
          h('span',{style:{fontSize:11.5,color:'#8b93a3'}},(pol[c]&&pol[c].label)||'—'),
          h('input',{defaultValue:ps,onBlur:e=>self.setCBPolicyScore(c,e.target.value),title:'Síla postoje (−3…+3) — jestřábí kladně, holubičí záporně',style:Object.assign(self.mono({fontSize:13,fontWeight:700,color:pc}),{width:52,background:'#0a0d13',border:'1px solid #1b2130',borderRadius:7,padding:'5px 7px',textAlign:'center',outline:'none'})})); }));
  }

  renderFactorsList(){ const self=this,h=this.h;
    const pol=(typeof CB_POLICY_DATA!=='undefined')?CB_POLICY_DATA:{};
    return h('div',{style:self.card({padding:'20px 22px'})},
      self.ptitle('Hlavní faktory ovlivňující dnes',''),
      this.CUR.map(c=>h('div',{key:c,style:{display:'flex',alignItems:'flex-start',gap:10,padding:'9px 0',boxShadow:'0 1px 0 #14182333'}},
        h('span',{style:{fontSize:16,lineHeight:1.3}},CCY_FLAG[c]||'●'),
        h('div',{style:{minWidth:0}},
          h('div',{style:self.mono({fontSize:11.5,fontWeight:700})},c),
          h('div',{style:{fontSize:11,color:'#8b93a3',lineHeight:1.4,marginTop:1}},((pol[c]&&pol[c].label)||'—'))))));
  }

  renderStrength(){ const h=this.h;
    return h('div',{className:'adm-grid',style:{display:'grid',gridTemplateColumns:'minmax(0,1fr) 340px',gap:16,alignItems:'start'}},
      h('div',{style:{display:'flex',flexDirection:'column',gap:16,minWidth:0}},
        h('div',{style:this.card({padding:'20px 22px'})},this.ptitle('Ranking síly měn','Skóre = fundamenty + CB policy + real yield + COT + retail + sezónnost'),h('div',{style:{marginTop:6}},this.StrengthChart())),
        this.renderCBTable()),
      h('div',{className:'adm-side',style:{display:'flex',flexDirection:'column',gap:16}},
        h('div',{style:this.card({padding:'18px 20px'})},this.ptitle('Co síla měn znamená?',''),
          h('div',{style:{fontSize:11.5,color:'#8b93a3',lineHeight:1.7}},'Měny s vyšším skóre mají lepší kombinaci fundamentů, centrálních bank, výnosů a sentimentu. Rozdíl ve skóre ovlivňuje relativní atraktivitu měn a potenciální směr toků kapitálu.')),
        this.renderFactorsList()));
  }

  renderPlaceholder(id){ const h=this.h;

// Stejný princip jako index.html/m.html/classic.html — viz komentář tam.
// Nutná i tady samostatně: admin.html je jiná URL, index.html gate na ni
// nedosáhne, kdyby si ji někdo otevřel přímo.
class AppGate extends React.Component{
  constructor(p){ super(p); this.state={checking:true,authorized:false,email:'',pw:'',busy:false,msg:''}; this.login=this.login.bind(this); }
  componentDidMount(){
    if(!(window.Sync&&window.Sync.ready)){ this.setState({checking:false,authorized:false,msg:'⚠ Přihlašovací systém se nenačetl (internet/Supabase). Zkus obnovit stránku.'}); return; }
    const check=(s)=>{ const email=s&&s.user&&s.user.email?String(s.user.email).trim().toLowerCase():null; this.setState({checking:false,authorized:email===ADMIN_EMAIL}); };
    window.Sync.session().then(check).catch(()=>this.setState({checking:false,authorized:false}));
    window.Sync.onAuth((s)=>check(s));
  }
  async login(){
    const email=this.state.email,pw=this.state.pw;
    if(!email.trim()||pw.length<6){ this.setState({msg:'Zadej e-mail a heslo (min. 6 znaků).'}); return; }
    this.setState({busy:true,msg:'⏳ Přihlašuji…'});
    try{ await window.Sync.signInPassword(email,pw); }
    catch(e){ this.setState({busy:false,msg:'⚠ '+(e&&e.message||e)}); }
  }
  render(){
    const h=React.createElement, st=this.state;
    const wrap={minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#07080c',fontFamily:"'Manrope',sans-serif"};
    if(st.checking) return h('div',{style:Object.assign({},wrap,{color:'#8b93a3',fontSize:13})},'Načítám…');
    if(st.authorized) return h(AdminApp);
    const fld={width:'100%',padding:'11px 14px',background:'#0a0d13',border:'1px solid #1b2130',borderRadius:10,color:'#eaedf3',fontSize:13,fontFamily:"'Manrope',sans-serif",marginBottom:10,display:'block',outline:'none',boxSizing:'border-box'};
    const btn={width:'100%',padding:'12px',background:'linear-gradient(180deg,#5e7cfb,#4c63d9)',border:'1px solid #d4a72c',borderRadius:10,color:'#fff',fontSize:13,fontWeight:700,fontFamily:'inherit',cursor:'pointer'};
    return h('div',{style:Object.assign({},wrap,{padding:20})},
      h('div',{style:{width:'100%',maxWidth:360,background:'#0c0f16',border:'1px solid #1b2130',borderRadius:14,padding:'28px 26px',boxSizing:'border-box'}},
        h('div',{style:{fontSize:16,fontWeight:800,color:'#eaedf3',marginBottom:4}},'🔒 AT Trading FX'),
        h('div',{style:{fontSize:12,color:'#8b93a3',marginBottom:18,lineHeight:1.5}},'Nový vzhled je jen pro admina. Přihlas se svým účtem.'),
        h('input',{value:st.email,onChange:e=>this.setState({email:e.target.value}),placeholder:'e-mail',type:'email',autoCapitalize:'off',autoCorrect:'off',style:fld}),
        h('input',{value:st.pw,onChange:e=>this.setState({pw:e.target.value}),placeholder:'heslo',type:'password',onKeyDown:e=>{if(e.key==='Enter')this.login();},style:fld}),
        h('button',{type:'button',disabled:st.busy,onClick:this.login,style:btn},'Přihlásit'),
        st.msg&&h('div',{style:{fontSize:11.5,marginTop:12,color:/^⚠/.test(st.msg)?'#f2606e':'#8b93a3',lineHeight:1.5}},st.msg)));
  }
}
