<script type="text/babel">
const COUNTRY2CCY=(()=>{const m={};try{Object.entries(CURRENCY_COUNTRIES).forEach(([ccy,arr])=>arr.forEach(c=>{if(!m[c])m[c]=ccy;}));}catch(e){}return m;})();
function ev2ccy(e){const c=(e.country||"").toUpperCase();return COUNTRY2CCY[c]||e.currency||c;}
function impUp(s){s=String(s||"").toLowerCase();return s.includes("high")||s==="3"?"HIGH":s.includes("med")||s==="2"?"MEDIUM":"LOW";}

class FXApp extends React.Component{
  constructor(p){
    super(p);
    const h=React.createElement; this.h=h;
    this.state={ tab:'dashboard', sel:null, filter:'all', aiTf:'H4', pos:(()=>{try{return getAllPositions();}catch(e){return {};}})(), notes:(()=>{try{return loadNotes();}catch(e){return {};}})(), coachInput:'', coachMsgs:[{role:'coach',text:'Vidím tvoje živá skóre, COT i pozice. Zeptej se na dnešní top setupy, rizika nebo korelace.'}], loaded:false };
    this.CUR=(typeof CURRENCIES!=='undefined')?CURRENCIES:['USD','EUR','GBP','JPY','AUD','NZD','CAD','CHF'];
    this.NAMES=(typeof NAMES!=='undefined')?NAMES:{};
    this.D={}; this.PAIRS=[]; this.series={}; this.dates=[]; this.daily=[]; this.cbdi=50; this.PRICES={};
    this.journal={wr:0,pf:0,trades:0,avgR:0,bestR:0,buckets:[],rows:[]}; this.equity=[0];
    this.CUR.forEach(c=>{this.D[c]={score:0,fund:0,policy:0,yield:0,cot:0,sent:0,season:0,cotPct:50,chg7:0,cb:'—',inst:0,retail:50};this.series[c]=[0,0];});
    this.smooth=(pts)=>{ if(pts.length<2) return pts.length?`M ${pts[0][0]} ${pts[0][1]}`:''; let d=`M ${pts[0][0]} ${pts[0][1]}`; for(let i=0;i<pts.length-1;i++){ const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2; const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6; d+=` C ${c1x} ${c1y} ${c2x} ${c2y} ${p2[0]} ${p2[1]}`; } return d; };
    this.buildLineChart(); this.buildGauge();
  }
  componentDidMount(){ this.refreshData(); this._t=setInterval(()=>this.refreshData(),5*60*1000); this._clk=setInterval(()=>this.forceUpdate(),1000); }
  componentWillUnmount(){ clearInterval(this._t); clearInterval(this._clk); }

  async refreshData(){
    try{
      const key=(localStorage.getItem('fh')||'').trim(), fmpKey=(localStorage.getItem('fmp')||'').trim();
      let cal=[],calSource='';
      try{ const fresh=await fetchActionCalendar(); cal=mergeFFHistory(fresh); calSource='action'; }catch(e){}
      if(!cal.length&&fmpKey){ try{ cal=await fetchFMPCalendar(fmpKey,15); calSource='fmp'; }catch(e){} }
      if(!cal.length){ try{ const fr=await fetchFFEventsCached(false); cal=mergeFFHistory(fr); calSource='ff'; }catch(e){ cal=loadFFHistory(); } }
      if(calSource==='action'||calSource==='fmp'||calSource==='finnhub') g_fundConfidence=1; else g_fundConfidence=ffConfidence(cal);
      try{ autoUpdateFromCalendar(cal); }catch(e){}
      const av=(localStorage.getItem('av')||'').trim(); if(av){ try{ await fetchOilPrice(av); }catch(e){} }
      // COT na pozadí když staré
      try{ const m0=loadCOTMeta(); const age=m0&&m0.asOf?((Date.now()-new Date(m0.asOf).getTime())/86400000):NaN; if(!(age<=4)){ await fetchCOTAuto(); } }catch(e){}
      const cot=loadCOT(), sent=loadSentiment();
      const sc={}; this.CUR.forEach(c=>{ sc[c]=scoreCurrency(cal,c,cot,sent); });
      const ranked=rankPairs(sc,{});
      const up=deriveUpcomingFromEvents(cal);
      this._cal=cal; this._scores=sc; this._up=up;
      // D
      this.CUR.forEach(c=>{ const s=sc[c]||{}; this.D[c]={
        score:+(s.score||0), fund:+(s.fund_score||0), policy:+(s.policy_adj||0), yield:+(s.yield_adj||0),
        cot:+(s.cot_score||0), sent:+(s.sent_score||0), season:+(s.season_score||0),
        cotPct:(()=>{try{return getCOTPercentile(c);}catch(e){return 50;}})()||50,
        chg7:(()=>{try{return getScoreChange(c,7);}catch(e){return 0;}})()||0,
        cb:(typeof CB_POLICY_DATA!=='undefined'&&CB_POLICY_DATA[c]&&CB_POLICY_DATA[c].label)||'—',
        inst:Math.round(Math.max(-100,Math.min(100,(cot[c]||0)*12))),
        retail:Math.round(sent[c]!=null?sent[c]:50) }; });
      // PAIRS
      this.PAIRS=ranked.map(p=>{ let status='confirmed',prob=50; try{const ds=getPairDailyState(p,sc,cal,up);status=ds.level==='conflict'?'conflict':ds.level==='upcoming'?'upcoming':'confirmed';}catch(e){} try{const fc=buildForecastV5(p,sc,cal,up)||{};prob=fc.prob||50;}catch(e){}
        return {pair:p.pair,base:p.base,quote:p.quote,dir:p.dir,diff:+p.diff,conv:Math.min(5,p.conviction||0),prob,status}; });
      if(!this.state.sel&&this.PAIRS[0]) this.state.sel=this.PAIRS[0].pair;
      // series + dates
      this.CUR.forEach(c=>{ let v=[]; try{v=buildDailySeries(c,14).values;}catch(e){} this.series[c]=(v&&v.length>=2)?v:[this.D[c].score,this.D[c].score]; });
      this.dates=[]; const base=new Date(); for(let i=13;i>=0;i--){const d=new Date(base);d.setDate(d.getDate()-i);this.dates.push(d.getDate()+'.'+(d.getMonth()+1)+'.');}
      // daily events (dnes, HIGH/MED)
      this.daily=this.buildToday(cal,up);
      // cbdi
      try{ this.cbdi=(typeof calcCBDI==='function')?(calcCBDI().value!=null?calcCBDI().value:calcCBDI()):50; }catch(e){ this.cbdi=50; }
      if(typeof this.cbdi!=='number') this.cbdi=50;
      // journal
      this.buildJournal();
      // prices (statické pro AI demo math)
      this.PRICES={USDJPY:157.2,EURUSD:1.084,GBPUSD:1.271,AUDUSD:0.664,NZDUSD:0.612,USDCAD:1.372,USDCHF:0.888,CHFJPY:177,GBPJPY:199.8,EURJPY:170.4,GBPAUD:1.914,EURAUD:1.632};
      this.setState({loaded:Date.now()});
    }catch(e){ console.error('refreshData',e); this.setState({loaded:Date.now(),err:String(e&&e.message||e)}); }
  }
  buildToday(cal,up){
    const ev=(typeof buildEventWatch==='function')?buildEventWatch(cal,up):(up||[]);
    const s=new Date(); s.setHours(0,0,0,0); const e=new Date(); e.setHours(23,59,59,999);
    return ev.filter(x=>{const t=parseEventTime(x.time);if(!(t>=s.getTime()&&t<=e.getTime()))return false;const im=impUp(x.impact);return im==='HIGH'||im==='MEDIUM';})
      .sort((a,b)=>parseEventTime(a.time)-parseEventTime(b.time))
      .slice(0,8).map(x=>({ccy:ev2ccy(x),ev:x.event,t:new Date(parseEventTime(x.time)).toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'}),imp:impUp(x.impact),note:(x.estimate?('odhad '+x.estimate):'')}));
  }
  buildJournal(){
    let rows=[]; try{rows=loadJournal()||[];}catch(e){}
    const closed=rows.filter(t=>t.outcome&&t.outcome!=='open');
    const wins=closed.filter(t=>t.outcome==='win').length;
    const Rs=closed.map(t=>+(t.rMultiple||0));
    const sumPos=Rs.filter(r=>r>0).reduce((a,b)=>a+b,0), sumNeg=Math.abs(Rs.filter(r=>r<0).reduce((a,b)=>a+b,0));
    this.journal={ wr:closed.length?Math.round(wins/closed.length*100):0, pf:sumNeg?+(sumPos/sumNeg).toFixed(1):(sumPos>0?9:0), trades:rows.length, avgR:closed.length?+(Rs.reduce((a,b)=>a+b,0)/closed.length).toFixed(2):0, bestR:Rs.length?Math.max(0,...Rs):0,
      buckets:[], rows:rows.slice(0,8).map(t=>({d:(t.openedAt||'').slice(5,10).split('-').reverse().join('.'),pair:t.pair,dir:t.dir==='LONG'?'BUY':t.dir==='SHORT'?'SELL':t.dir,r:+(t.rMultiple||0),res:t.outcome==='win'?'win':t.outcome==='loss'?'loss':'open'})) };
    const eq=[0]; closed.slice().reverse().forEach(t=>eq.push(+(eq[eq.length-1]+(+(t.rMultiple||0))).toFixed(2))); this.equity=eq.length>1?eq:[0,0];
  }

  get tok(){ const a=this.props.accent||'#5e7cfb'; return {bg:'#07080c',line:'#1b2130',line2:'#262d3d',text:'#eaedf3',dim:'#8b93a3',faint:'#5a6273',green:'#2ed3a0',red:'#f2606e',amber:'#e8ab3f',accent:a,violet:'#9d7bff'}; }
  card(extra){ return Object.assign({background:'linear-gradient(180deg,#0f121a,#0b0d13)',border:'1px solid #1b2130',borderRadius:18,boxShadow:'0 18px 40px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.04)'},extra||{}); }
  mono(extra){ return Object.assign({fontFamily:"'JetBrains Mono',monospace"},extra||{}); }
  ptitle(t,sub){ const h=this.h,T=this.tok; return h('div',{style:{marginBottom:14}}, h('div',{style:{fontSize:13.5,fontWeight:800,letterSpacing:'-.01em'}},t), sub&&h('div',{style:this.mono({fontSize:10.5,color:T.faint,marginTop:3,letterSpacing:'.02em'})},sub)); }
  sgn(v,d){ return (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(d==null?1:d); }
  scol(v){ const T=this.tok; return v>0.05?T.green:v<-0.05?T.red:T.amber; }
  setPos(pair,side){ this.setState(s=>{const n=Object.assign({},s.pos,{[pair]:s.pos[pair]===side?'none':side}); try{setPosition(pair,n[pair]);}catch(e){} return {pos:n};}); }
  setNote(pair,val){ this.setState(s=>({notes:Object.assign({},s.notes,{[pair]:val})})); try{const n=loadNotes();if(val.trim())n[pair]=val;else delete n[pair];localStorage.setItem('pair_notes',JSON.stringify(n));}catch(e){} }

  buildLineChart(){ const self=this,h=this.h;
    this.LineChart=({cur1,cur2,col1,col2})=>{
      const T=self.tok, a=self.series[cur1]||[0,0], b=self.series[cur2]||[0,0], dates=self.dates, n=Math.max(a.length,2);
      const W=720,H=250,PL=10,PR=14,PT=20,PB=30, ymin=-10,ymax=10;
      const X=i=>PL+(W-PL-PR)*(i/(n-1)), Y=v=>PT+(H-PT-PB)*(1-(v-ymin)/(ymax-ymin));
      const line=arr=>self.smooth(arr.map((v,i)=>[X(i),Y(v)]));
      const [hi,setHi]=React.useState(null);
      const move=e=>{ const r=e.currentTarget.getBoundingClientRect(); const px=(e.clientX-r.left)/r.width*W; let i=Math.round((px-PL)/((W-PL-PR)/(n-1))); i=Math.max(0,Math.min(n-1,i)); setHi(i); };
      const grid=[10,5,0,-5,-10].map(g=>h('g',{key:g},
        h('line',{x1:PL,x2:W-PR,y1:Y(g),y2:Y(g),stroke:g===0?'#2a3242':'#161b27',strokeWidth:1,strokeDasharray:g===0?'none':'3 5'}),
        h('text',{x:W-PR+2,y:Y(g)+3,fontSize:9,fill:T.faint,fontFamily:"'JetBrains Mono',monospace",textAnchor:'start'},g>0?'+'+g:g)));
      const series=[{c:cur1,arr:a,col:col1,g:'g1'},{c:cur2,arr:b,col:col2,g:'g2'}];
      const area=arr=>line(arr)+` L ${X(n-1)} ${Y(ymin)} L ${X(0)} ${Y(ymin)} Z`;
      return h('div',{style:{position:'relative'}},
        h('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:{display:'block',overflow:'visible'},onMouseMove:move,onMouseLeave:()=>setHi(null)},
          h('defs',null,
            series.map(s=>h('linearGradient',{key:s.g,id:'fx'+s.g+cur1+cur2,x1:0,y1:0,x2:0,y2:1},h('stop',{offset:'0%',stopColor:s.col,stopOpacity:.28}),h('stop',{offset:'100%',stopColor:s.col,stopOpacity:0}))),
            h('filter',{id:'fxglow'+cur1,x:'-20%',y:'-20%',width:'140%',height:'140%'},h('feGaussianBlur',{stdDeviation:3,result:'b'}),h('feMerge',null,h('feMergeNode',{in:'b'}),h('feMergeNode',{in:'SourceGraphic'})))),
          grid,
          series.map(s=>h('path',{key:'a'+s.g,d:area(s.arr),fill:`url(#fx${s.g}${cur1}${cur2})`})),
          series.map(s=>h('path',{key:'l'+s.g,d:line(s.arr),fill:'none',stroke:s.col,strokeWidth:2.4,strokeLinecap:'round',filter:`url(#fxglow${cur1})`})),
          series.map(s=>h('circle',{key:'e'+s.g,cx:X(n-1),cy:Y(s.arr[s.arr.length-1]),r:3.6,fill:s.col,stroke:'#0b0d13',strokeWidth:2})),
          hi!=null&&h('g',null,h('line',{x1:X(hi),x2:X(hi),y1:PT,y2:H-PB,stroke:'#3a4459',strokeWidth:1}),series.map(s=>h('circle',{key:'h'+s.g,cx:X(hi),cy:Y(s.arr[hi]!=null?s.arr[hi]:s.arr[s.arr.length-1]),r:4.5,fill:s.col,stroke:'#0b0d13',strokeWidth:2}))),
          dates.map((d,i)=>(i%3===0||i===n-1)&&h('text',{key:'d'+i,x:X(i),y:H-10,fontSize:8.5,fill:T.faint,fontFamily:"'JetBrains Mono',monospace",textAnchor:'middle'},d)).filter(Boolean)),
        hi!=null&&h('div',{style:{position:'absolute',top:6,left:`calc(${(X(hi)/W)*100}% )`,transform:'translateX(-50%)',pointerEvents:'none'}},
          h('div',{style:self.card({padding:'7px 10px',borderRadius:9,boxShadow:'0 8px 22px rgba(0,0,0,.5)',minWidth:96})},
            h('div',{style:self.mono({fontSize:9,color:T.faint,marginBottom:4})},dates[hi]),
            [[cur1,a,col1],[cur2,b,col2]].map(([c,arr,col])=>h('div',{key:c,style:{display:'flex',justifyContent:'space-between',gap:14,fontSize:11,marginTop:2}},h('span',{style:{color:col,fontWeight:700}},c),h('span',{style:self.mono({color:T.text,fontWeight:600})},self.sgn(arr[hi]!=null?arr[hi]:0)))))));
    };
  }
  buildGauge(){ const self=this,h=this.h;
    this.Gauge=({val})=>{ const T=self.tok, R=64, cx=80, cy=80, sw=11;
      const polar=(deg)=>{ const a=(deg-180)*Math.PI/180; return [cx+R*Math.cos(a),cy+R*Math.sin(a)]; };
      const arc=(d0,d1)=>{ const [x0,y0]=polar(d0),[x1,y1]=polar(d1); const large=(d1-d0)>180?1:0; return `M ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1}`; };
      const bands=[{a:0,b:63,c:T.red},{a:63,b:108,c:T.amber},{a:108,b:180,c:T.green}];
      const needle=val*1.8,[nx,ny]=polar(needle), col=val>60?T.green:val>35?T.amber:T.red;
      return h('div',{style:{position:'relative',width:160,height:104,margin:'0 auto'}},
        h('svg',{viewBox:'0 0 160 96',width:160,height:96},
          h('path',{d:arc(0,180),fill:'none',stroke:'#161b27',strokeWidth:sw,strokeLinecap:'round'}),
          bands.map((bd,i)=>h('path',{key:i,d:arc(bd.a+(i?2:0),bd.b-(i<2?2:0)),fill:'none',stroke:bd.c,strokeWidth:sw,strokeLinecap:'round',opacity:.92})),
          h('line',{x1:cx,y1:cy,x2:nx,y2:ny,stroke:'#eef1f6',strokeWidth:2.4,strokeLinecap:'round'}),
          h('circle',{cx:cx,cy:cy,r:4.5,fill:'#0b0d13',stroke:'#eef1f6',strokeWidth:2})),
        h('div',{style:{position:'absolute',bottom:0,left:0,right:0,textAlign:'center'}},h('div',{style:self.mono({fontSize:26,fontWeight:700,color:col,lineHeight:1})},val),h('div',{style:{fontSize:9.5,color:T.faint,letterSpacing:'.1em',marginTop:2}},'DIVERGENCE')));
    };
  }
  StrengthChart(){ const self=this,h=this.h,T=this.tok; const rows=this.CUR.map(c=>Object.assign({c},this.D[c])).sort((a,b)=>b.score-a.score); const max=10;
    return h('div',{style:{display:'flex',flexDirection:'column',gap:9}},rows.map(r=>{ const pos=r.score>=0,col=pos?T.green:T.red,w=Math.abs(r.score)/max*50;
      return h('div',{key:r.c,style:{display:'grid',gridTemplateColumns:'62px 1fr 66px',alignItems:'center',gap:12}},
        h('div',{style:{display:'flex',alignItems:'center',gap:7}},h('span',{style:self.mono({fontSize:13,fontWeight:700,color:T.text})},r.c)),
        h('div',{style:{position:'relative',height:26,background:'#0a0d13',border:'1px solid #161b27',borderRadius:7}},
          h('div',{style:{position:'absolute',left:'50%',top:0,bottom:0,width:1,background:'#2a3242'}}),
          h('div',{style:{position:'absolute',top:3,bottom:3,borderRadius:5,left:pos?'50%':`calc(50% - ${w}%)`,width:w+'%',background:`linear-gradient(90deg,${pos?col+'30':col},${pos?col:col+'30'})`,boxShadow:`0 0 14px ${col}55`}})),
        h('div',{style:{textAlign:'right',display:'flex',flexDirection:'column',alignItems:'flex-end'}},h('span',{style:self.mono({fontSize:14,fontWeight:700,color:col})},self.sgn(r.score)),h('span',{style:self.mono({fontSize:9,color:r.chg7>=0?T.green:T.red})},(r.chg7>=0?'▲':'▼')+' '+Math.abs(r.chg7).toFixed(1)))); }));
  }
  DivergeChart(){ const self=this,h=this.h,T=this.tok; const rows=this.CUR.map(c=>Object.assign({c},this.D[c]));
    return h('div',{style:{display:'flex',flexDirection:'column',gap:7}},
      h('div',{style:{display:'grid',gridTemplateColumns:'56px 1fr 1fr',gap:10,paddingBottom:6,borderBottom:'1px solid #1b2130'}},h('span',{style:self.mono({fontSize:9.5,color:T.faint,letterSpacing:'.06em'})},'MĚNA'),h('span',{style:{fontSize:10,fontWeight:700,color:T.accent,textAlign:'right'}},'◀ INSTITUCE'),h('span',{style:{fontSize:10,fontWeight:700,color:T.violet}},'RETAIL % long ▶')),
      rows.map(r=>{ const extreme=(r.inst>30&&r.retail<42)||(r.inst<-30&&r.retail>58);
        return h('div',{key:r.c,style:{display:'grid',gridTemplateColumns:'56px 1fr 1fr',gap:10,alignItems:'center',padding:'4px 0'}},
          h('div',{style:{display:'flex',alignItems:'center',gap:6}},h('span',{style:self.mono({fontSize:12.5,fontWeight:700})},r.c),extreme&&h('span',{style:{width:5,height:5,borderRadius:50,background:T.amber,boxShadow:'0 0 7px '+T.amber}})),
          h('div',{style:{height:18,background:'#0a0d13',border:'1px solid #161b27',borderRadius:6,position:'relative',overflow:'hidden'}},h('div',{style:{position:'absolute',right:0,top:0,bottom:0,width:Math.abs(r.inst)+'%',background:r.inst>=0?T.accent:T.red,opacity:.85,borderRadius:6}}),h('span',{style:self.mono({position:'absolute',left:6,top:2,fontSize:10,fontWeight:600,color:T.text})},(r.inst>0?'+':'')+r.inst)),
          h('div',{style:{height:18,background:'#0a0d13',border:'1px solid #161b27',borderRadius:6,position:'relative',overflow:'hidden'}},h('div',{style:{position:'absolute',left:0,top:0,bottom:0,width:r.retail+'%',background:T.violet,opacity:.85,borderRadius:6}}),h('span',{style:self.mono({position:'absolute',right:6,top:2,fontSize:10,fontWeight:600,color:T.text})},r.retail+'%'))); }));
  }
