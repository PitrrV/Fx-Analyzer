<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0d1117"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="AT FX"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<link rel="manifest" href="manifest.json"/>
<title>AT Trading FX — Mobil</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- Cloud sync (Supabase) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- SDÍLENÝ ENGINE (plain script → běží před babel scriptem, funkce jsou globální) -->
<script src="engine.js"></script>
<script src="sync.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
  #root{min-height:100vh}
  .topbar{position:sticky;top:0;z-index:20;background:#0d1117ee;backdrop-filter:blur(8px);border-bottom:1px solid #1c2533;padding:10px 14px;display:flex;align-items:center;gap:10px;padding-top:max(10px,env(safe-area-inset-top))}
  .topbar h1{font-size:15px;font-weight:800;margin:0;flex:1;letter-spacing:.02em}
  .topbar .accent{color:#3fb950}
  .content{padding:12px 12px 88px}
  .card{background:#161b22;border:1px solid #21262d;border-radius:12px;padding:12px;margin-bottom:10px}
  .pill{font-size:12px;font-weight:800;border-radius:6px;padding:3px 9px;white-space:nowrap}
  .buy{background:#113b20;color:#3fb950;border:1px solid #3fb95033}
  .sell{background:#431819;color:#ff6a5e;border:1px solid #f8514933}
  .muted{color:#8b949e}
  .row{display:flex;align-items:center;gap:8px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .bignum{font-size:22px;font-weight:900}
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#0d1117f5;backdrop-filter:blur(10px);border-top:1px solid #1c2533;padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav button{flex:1;background:none;border:none;color:#6e7681;font-size:10px;font-weight:700;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  .bottomnav button .ic{font-size:19px;line-height:1}
  .bottomnav button.active{color:#3fb950}
  .btn{background:#1f6feb;border:none;border-radius:9px;color:#fff;font-size:14px;font-weight:700;padding:11px 14px;cursor:pointer;width:100%}
  .btn.sec{background:#21262d;border:1px solid #30363d;color:#e6edf3}
  .btn:disabled{opacity:.55}
  input.fld{width:100%;padding:11px 12px;background:#0d1117;border:1px solid #30363d;border-radius:9px;color:#e6edf3;font-size:14px;margin-bottom:10px}
  .chip{font-size:10px;border:1px solid #30363d;border-radius:5px;padding:2px 6px;color:#8b949e;white-space:nowrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ovl{position:fixed;inset:0;z-index:40;background:#0d1117;overflow-y:auto;padding:0 12px 88px;animation:sl .18s ease}
  @keyframes sl{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
  .barwrap{height:6px;background:#1a2432;border-radius:4px;overflow:hidden;margin-top:8px}
  .seg{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid #1c2533}
  .seg:last-child{border-bottom:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

// ── BARVY / FORMÁTOVAČE ─────────────────────────────────────
const cScore=v=>v>2?"#3fb950":v<-2?"#ff6a5e":v>0?"#7fc99a":v<0?"#e0857d":"#8b949e";
const cComp=v=>v>0.3?"#3fb950":v<-0.3?"#ff6a5e":"#8b949e";
const fmtNum=v=>(v>0?"+":"")+(Math.round(v*10)/10);
function impactColor(imp){const i=String(imp||"").toLowerCase();if(i.includes("high")||i==="3")return"#f85149";if(i.includes("medium")||i==="2")return"#d29922";return"#6e7681";}
function impactLabel(imp){const i=String(imp||"").toLowerCase();if(i.includes("high")||i==="3")return"HIGH";if(i.includes("medium")||i==="2")return"MED";if(i.includes("low")||i==="1")return"LOW";return"—";}
function evFlag(ev){const c=String(ev.country||ev.currency||"").toUpperCase();return COUNTRY_FLAGS[c]||"🏳️";}
function fmtDT(t){const d=new Date(parseEventTime(t));if(isNaN(d))return"";return d.toLocaleString("cs-CZ",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}

// ── DATA: stejná orchestrace jako PC (engine globals) ───────
async function loadDataMobile(){
  const key=(localStorage.getItem("fh")||"").trim();
  const fmpKey=(localStorage.getItem("fmp")||"").trim();
  let cal=[],calSource="",fmpErr="";
  const fmpBlocked=!!fmpKey&&localStorage.getItem("fmp_cal_block")===fmpKey;
  if(fmpKey&&!fmpBlocked){
    try{ cal=await fetchFMPCalendar(fmpKey,15); calSource="fmp"; localStorage.removeItem("fmp_cal_block"); }
    catch(e){ fmpErr=String(e&&e.message||e); if(/Error Message|Restricted|not available|Invalid API|Exclusive|subscription|plan|HTTP 40/i.test(fmpErr)) localStorage.setItem("fmp_cal_block",fmpKey); }
  }
  if(!cal.length&&key){
    const fhBlocked=localStorage.getItem("fh_cal_block")===key;
    if(!fhBlocked){
      try{ cal=await fetchCalendar(key,15); calSource="finnhub"; localStorage.removeItem("fh_cal_block"); }
      catch(e){ if(/Error Message|Restricted|not available|Invalid|premium|subscription|access|plan|HTTP 40/i.test(String(e&&e.message||e))) localStorage.setItem("fh_cal_block",key); }
    }
  }
  if(!cal.length){
    try{ const fresh=await fetchFFEventsCached(false); calSource="forexfactory"; cal=mergeFFHistory(fresh); }
    catch(e2){ cal=loadFFHistory(); if(cal.length) calSource="forexfactory"; }
  }
  if(calSource==="fmp"||calSource==="finnhub") g_fundConfidence=1;
  else if(calSource==="forexfactory") g_fundConfidence=ffConfidence(cal);
  else g_fundConfidence=FF_FUND_DAMP;
  try{ autoUpdateFromCalendar(cal); }catch(e){}
  const av=(localStorage.getItem("av")||"").trim();
  if(av){ try{ await fetchOilPrice(av); }catch(e){} }
  const cot=loadCOT(), sent=loadSentiment();
  const sc={}; CURRENCIES.forEach(c=>{ sc[c]=scoreCurrency(cal,c,cot,sent); });
  const ranked=rankPairs(sc,{});
  let up;
  if(calSource==="finnhub"){ try{ up=await fetchUpcoming14(key); }catch(e){ up=deriveUpcomingFromEvents(cal); } }
  else up=deriveUpcomingFromEvents(cal);
  const months=(calSource==="fmp"||calSource==="finnhub")?15:ffHistorySpanMonths(cal);
  const fc={}; ranked.forEach(p=>{ try{ fc[p.pair]=buildForecastV5(p,sc,cal,up); }catch(e){} });
  return { scores:sc, pairs:ranked, cal, upcoming:up, forecasts:fc, cotMeta:loadCOTMeta(),
    calMeta:{source:calSource||"none",months,count:cal.length,conf:Math.round((g_fundConfidence||0)*100)} };
}

// ── KARTA PÁRU ──────────────────────────────────────────────
function PairCard({p,f,daily,onTap}){
  const buy=p.dir==="BUY";
  return (
    <div className="card" onClick={onTap} style={{borderColor:buy?"#1f5c34":"#5c2626"}}>
      <div className="between">
        <div className="row" style={{gap:6}}>
          <span style={{fontSize:18,fontWeight:900}}>{FLAGS[p.base]}{FLAGS[p.quote]}</span>
          <span style={{fontWeight:900,fontSize:16}}>{p.pair}</span>
          {daily&&daily.dot&&<span style={{fontSize:13}}>{daily.dot}</span>}
          {p.conviction>=3&&<span style={{color:"#f0b429",fontSize:12}}>{"★".repeat(Math.min(5,p.conviction))}</span>}
        </div>
        <span className={"pill "+(buy?"buy":"sell")}>{p.dir}</span>
      </div>
      <div className="between" style={{marginTop:8}}>
        <div className="row" style={{gap:12}}>
          <span style={{fontSize:13}}><span className="muted">skóre </span><b style={{color:cScore(buy?p.diff:-p.diff)}}>{(buy?"+":"-")+p.diff.toFixed(1)}</b></span>
          {f&&f.prob!=null&&<span style={{fontSize:13}}><span className="muted">14d </span><b style={{color:f.prob>=65?"#3fb950":f.prob<=35?"#ff6a5e":"#d29922"}}>{f.prob+"% "+f.dir}</b></span>}
        </div>
        <div className="row" style={{gap:6}}>
          <span className="chip">{p.base} {fmtNum(p.s1)}</span>
          <span className="chip">{p.quote} {fmtNum(p.s2)}</span>
        </div>
      </div>
    </div>
  );
}

// ── DETAIL PÁRU ─────────────────────────────────────────────
function compRow(label,base,quote){
  const diff=(base||0)-(quote||0);
  return (
    <div className="seg" key={label}>
      <span className="muted">{label}</span>
      <span className="row" style={{gap:10}}>
        <b style={{color:cComp(base),minWidth:42,textAlign:"right"}}>{fmtNum(base)}</b>
        <b style={{color:cComp(-quote),minWidth:42,textAlign:"right"}}>{fmtNum(quote)}</b>
        <b style={{color:cScore(diff),minWidth:46,textAlign:"right"}}>{fmtNum(diff)}</b>
      </span>
    </div>
  );
}
function PairDetail({p,scores,f,cotData,daily,onClose}){
  const b=scores[p.base]||{}, q=scores[p.quote]||{};
  const buy=p.dir==="BUY";
  return (
    <div className="ovl">
      <div className="topbar" style={{margin:"0 -12px"}}>
        <button className="btn sec" style={{width:"auto",padding:"7px 12px"}} onClick={onClose}>← Zpět</button>
        <h1>{FLAGS[p.base]}{FLAGS[p.quote]} {p.pair}</h1>
        <span className={"pill "+(buy?"buy":"sell")}>{p.dir}</span>
      </div>
      <div style={{paddingTop:12}}>
        <div className="card">
          <div className="between">
            <div><div className="muted" style={{fontSize:12}}>Skóre páru</div><div className="bignum" style={{color:cScore(buy?p.diff:-p.diff)}}>{(buy?"+":"-")+p.diff.toFixed(1)}</div></div>
            {f&&f.prob!=null&&<div style={{textAlign:"right"}}><div className="muted" style={{fontSize:12}}>14d výhled</div><div className="bignum" style={{color:f.prob>=65?"#3fb950":f.prob<=35?"#ff6a5e":"#d29922"}}>{f.prob}%</div><div className="muted" style={{fontSize:11}}>{f.dir}</div></div>}
          </div>
          {daily&&daily.dot&&<div style={{marginTop:8,fontSize:13}}>{daily.dot} <span className="muted">{daily.level==="conflict"?"Dnešní data jdou PROTI biasu":daily.level==="confirm"?"Dnešní data potvrzují bias":daily.level==="upcoming"?"Dnes přijde důležitá zpráva":daily.level==="done"?"Dnes proběhly velké zprávy (beze změny)":""}</span></div>}
        </div>
        <div className="card">
          <div className="seg" style={{fontWeight:800,color:"#8b949e",fontSize:11}}>
            <span>KOMPONENTA</span><span className="row" style={{gap:10}}><span style={{minWidth:42,textAlign:"right"}}>{p.base}</span><span style={{minWidth:42,textAlign:"right"}}>{p.quote}</span><span style={{minWidth:46,textAlign:"right"}}>DIFF</span></span>
          </div>
          {compRow("Fundamenty",b.fund_score,q.fund_score)}
          {compRow("CB Policy",b.policy_adj,q.policy_adj)}
          {compRow("Real Yield",b.yield_adj,q.yield_adj)}
          {compRow("COT",b.cot_score,q.cot_score)}
          {compRow("Sentiment",b.sent_score,q.sent_score)}
          {compRow("Sezónnost",b.season_score,q.season_score)}
          {compRow("CELKEM",b.score,q.score)}
        </div>
        <div className="card">
          <div className="muted" style={{fontSize:12,marginBottom:6,fontWeight:700}}>COT pozice</div>
          <div className="grid2">
            <div className="between"><span>{FLAGS[p.base]} {p.base}</span><b style={{color:cScore((cotData[p.base]||0))}}>{fmtNum(cotData[p.base]||0)}</b></div>
            <div className="between"><span>{FLAGS[p.quote]} {p.quote}</span><b style={{color:cScore((cotData[p.quote]||0))}}>{fmtNum(cotData[p.quote]||0)}</b></div>
          </div>
          {p.cotPctBase!=null&&<div className="muted" style={{fontSize:11,marginTop:8}}>COT percentil {p.base}: {p.cotPctBase}p {p.cotCrowded?"· 🚨 crowded":""}</div>}
        </div>
      </div>
    </div>
  );
}

// ── ZÁLOŽKA: SIGNÁLY ────────────────────────────────────────
function SignalsTab({data,onTap}){
  if(!data) return null;
  const pairs=data.pairs||[];
  return (
    <div>
      {pairs.map(p=><PairCard key={p.pair} p={p} f={data.forecasts[p.pair]} daily={getPairDailyState(p,data.scores,data.cal,data.upcoming)} onTap={()=>onTap(p)}/>)}
      {!pairs.length&&<div className="card muted">Žádné páry. Zkus Refresh.</div>}
    </div>
  );
}

// ── ZÁLOŽKA: COT ────────────────────────────────────────────
function CotTab({data,onRefreshCot,cotLoading}){
  const cot=loadCOT(), meta=loadCOTMeta();
  return (
    <div>
      <div className="card">
        <div className="between">
          <div><div style={{fontWeight:800}}>COT pozice</div>{meta&&meta.asOf&&<div className="muted" style={{fontSize:12}}>k datu {String(meta.asOf).slice(0,10)}</div>}</div>
          <button className="btn" style={{width:"auto",padding:"9px 14px"}} disabled={cotLoading} onClick={onRefreshCot}>{cotLoading?"⏳":"⚡ Aktuální"}</button>
        </div>
      </div>
      <div className="grid2">
        {CURRENCIES.map(c=>(
          <div className="card" key={c} style={{marginBottom:0}}>
            <div className="between"><span className="row" style={{gap:6}}>{FLAGS[c]} <b>{c}</b></span><b style={{color:cScore(cot[c]||0),fontSize:18}}>{fmtNum(cot[c]||0)}</b></div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── ZÁLOŽKA: KALENDÁŘ ───────────────────────────────────────
function CalendarTab({data}){
  if(!data) return null;
  // Dnešní den (vč. už proběhlých) + 14 dní dopředu — stejné jako PC dashboard
  const evs=buildEventWatch(data.cal,data.upcoming).slice(0,80);
  const todayStr=new Date().toLocaleDateString("cs-CZ",{day:"2-digit",month:"2-digit"});
  return (
    <div>
      <div className="card muted" style={{fontSize:12}}>Události ({evs.length}) · zdroj {data.calMeta.source} · {data.calMeta.months.toFixed(0)}m · {data.calMeta.conf}%</div>
      {evs.map((e,i)=>{
        const isToday=fmtDT(e.time).startsWith(todayStr);
        return (
        <div className="card" key={i} style={{padding:"10px 12px",borderColor:isToday?"#2a3a4a":"#21262d"}}>
          <div className="between">
            <span className="row" style={{gap:7}}><span style={{fontSize:16}}>{evFlag(e)}</span><b style={{fontSize:13}}>{e.event}</b></span>
            <span className="chip" style={{color:impactColor(e.impact),borderColor:impactColor(e.impact)+"55"}}>{impactLabel(e.impact)}</span>
          </div>
          <div className="between" style={{marginTop:6}}>
            <span className="muted" style={{fontSize:12}}>{isToday?"🔵 ":""}{fmtDT(e.time)}</span>
            <span className="muted" style={{fontSize:11}}>{(e.actual?("akt "+e.actual+" · "):"")}{(e.estimate?("odhad "+e.estimate):"")}{(e.prev?(" · min "+e.prev):"")}</span>
          </div>
        </div>
        );
      })}
      {!evs.length&&<div className="card muted">Žádné události.</div>}
    </div>
  );
}

// ── CLOUD SYNC KARTA ────────────────────────────────────────
function SyncCard({onSynced}){
  const [sess,setSess]=useState(null);
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [msg,setMsg]=useState("");
  const [busy,setBusy]=useState(false);
  const avail=window.Sync&&window.Sync.ready;
  async function doSync(reload){
    setBusy(true);setMsg("⏳ Synchronizuji…");
    try{ const st=await window.Sync.syncNow();
      setMsg(`✅ Sloučeno: ${st.events} událostí · ${st.cotWeeks} COT týdnů · ${st.trades} obchodů · ${st.keys} klíčů`+(reload?" — obnovuji…":""));
      if(onSynced)onSynced();
      if(reload) setTimeout(()=>location.reload(),1000);
    }catch(e){ setMsg("⚠ "+(e&&e.message||e)); }
    setBusy(false);
  }
  useEffect(()=>{
    if(!avail){return;}
    window.Sync.session().then(s=>setSess(s));
    window.Sync.onAuth((s,event)=>{ setSess(s); if(s&&event==="SIGNED_IN") doSync(true); }); // čerstvé přihlášení → sluč + obnov (ať se ukážou klíče)
  },[]);
  async function loginOrRegister(){
    if(!email.trim()||pw.length<6){setMsg("Zadej e-mail a heslo (min. 6 znaků).");return;}
    setBusy(true);setMsg("⏳ Přihlašuji…");
    try{ await window.Sync.signInPassword(email,pw); return; } // SIGNED_IN → doSync(true) sám sloučí + obnoví
    catch(e){
      const m=String(e&&e.message||e);
      if(/invalid login credentials/i.test(m)){
        try{ const d=await window.Sync.signUpPassword(email,pw);
          if(d&&d.session){ setMsg("✅ Účet vytvořen, přihlašuji…"); }
          else { setMsg("⚠ Účet vytvořen, ale Supabase čeká na potvrzení e-mailu. Vypni 'Confirm email' (Authentication → Sign In/Providers → Email) a zkus znovu."); setBusy(false); }
        }catch(e2){
          const m2=String(e2&&e2.message||e2);
          if(/already registered|already exists|User already/i.test(m2)) setMsg("⚠ Tenhle e-mail už existuje (z dřívějšího přihlášení odkazem). Dej 'Zapomenuté heslo', nastav si heslo, pak se přihlas.");
          else setMsg("⚠ "+m2);
          setBusy(false);
        }
      } else { setMsg("⚠ "+m); setBusy(false); }
    }
  }
  async function reset(){
    if(!email.trim()){setMsg("Zadej nejdřív e-mail.");return;}
    setBusy(true);setMsg("");
    try{ await window.Sync.resetPassword(email); setMsg("📧 Poslali jsme odkaz na nastavení hesla. Otevři ho (klidně v Safari), nastav heslo, pak se sem přihlas heslem."); }
    catch(e){ setMsg("⚠ "+(e&&e.message||e)); }
    setBusy(false);
  }
  async function logout(){ await window.Sync.signOut(); setSess(null); setMsg("Odhlášeno."); }
  return (
    <div className="card">
      <div style={{fontWeight:800,marginBottom:8}}>☁️ Cloud sync</div>
      {!avail&&<div className="muted" style={{fontSize:12}}>Nedostupné (internet / Supabase se nenačetl).</div>}
      {avail&&!sess&&<>
        <label className="muted" style={{fontSize:12}}>E-mail</label>
        <input className="fld" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tvuj@email.cz" type="email" autoCapitalize="off" autoCorrect="off"/>
        <label className="muted" style={{fontSize:12}}>Heslo (stejné na PC i mobilu)</label>
        <input className="fld" value={pw} onChange={e=>setPw(e.target.value)} placeholder="min. 6 znaků" type="password" autoCapitalize="off" autoCorrect="off"/>
        <button className="btn" disabled={busy} onClick={loginOrRegister}>🔐 Přihlásit / Vytvořit účet</button>
        <button className="btn sec" style={{marginTop:8}} disabled={busy} onClick={reset}>Zapomenuté heslo</button>
      </>}
      {avail&&sess&&<>
        <div className="muted" style={{fontSize:12,marginBottom:8}}>Přihlášen: <b style={{color:"#e6edf3"}}>{sess.user&&sess.user.email}</b></div>
        <button className="btn" disabled={busy} onClick={()=>doSync(true)}>🔄 Synchronizovat teď</button>
        <button className="btn sec" style={{marginTop:8}} onClick={logout}>Odhlásit</button>
      </>}
      {msg&&<div style={{fontSize:12,marginTop:8,color:msg[0]==="⚠"?"#ff6a5e":"#3fb950",lineHeight:1.5}}>{msg}</div>}
    </div>
  );
}
// ── ZÁLOŽKA: NASTAVENÍ ──────────────────────────────────────
function SettingsTab({onSaved}){
  const [fmp,setFmp]=useState(localStorage.getItem("fmp")||"");
  const [fh,setFh]=useState(localStorage.getItem("fh")||"");
  const [av,setAv]=useState(localStorage.getItem("av")||"");
  const [or,setOr]=useState(localStorage.getItem("or_key")||"");
  const [msg,setMsg]=useState("");
  function save(){
    fmp.trim()?localStorage.setItem("fmp",fmp.trim()):localStorage.removeItem("fmp");
    fh.trim()?localStorage.setItem("fh",fh.trim()):localStorage.removeItem("fh");
    av.trim()?localStorage.setItem("av",av.trim()):localStorage.removeItem("av");
    or.trim()?localStorage.setItem("or_key",or.trim()):localStorage.removeItem("or_key");
    setMsg("✅ Uloženo — načítám znovu…"); onSaved();
  }
  return (
    <div>
      <SyncCard onSynced={onSaved}/>
      <div className="card">
        <div style={{fontWeight:800,marginBottom:10}}>API klíče</div>
        <label className="muted" style={{fontSize:12}}>FMP (kalendář)</label>

}

// ── AI ANALÝZA GRAFU (z fotky) ──────────────────────────────
async function analyzeChartMobile(file,setProg){
  const orKey=(localStorage.getItem("or_key")||"").trim();
  if(!orKey) throw new Error("Chybí OpenRouter klíč — zadej ho v Nastavení (zdarma na openrouter.ai).");
  setProg&&setProg("Připravuji obrázek…");
  const b64=await fileToBase64(file), mt=file.type||"image/jpeg";
  setProg&&setProg("Hledám AI model…");
  let visionModels=[];
  try{
    const mResp=await fetch("https://openrouter.ai/api/v1/models",{headers:{"Authorization":"Bearer "+orKey}});
    const mData=await mResp.json();
    visionModels=(mData.data||[]).filter(m=>m.id.endsWith(":free")&&((m.architecture&&m.architecture.modality)||"").includes("image")).sort((a,b)=>(b.context_length||0)-(a.context_length||0)).map(m=>m.id);
  }catch(e){}
  const manual=localStorage.getItem("or_model")||"";
  const FALLBACK=["meta-llama/llama-3.2-11b-vision-instruct:free","meta-llama/llama-3.2-90b-vision-instruct:free","qwen/qwen-2-vl-7b-instruct:free"];
  const models=[manual,...visionModels,...FALLBACK].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);
  let raw="",lastErr="";
  for(const model of models){
    setProg&&setProg("Analyzuji ("+model.split("/").pop().slice(0,16)+")…");
    try{
      const r=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+orKey,"HTTP-Referer":"https://pitrrv.github.io","X-Title":"AT Trading FX"},
        body:JSON.stringify({model,messages:[{role:"system",content:AI_SYSTEM_PROMPT},{role:"user",content:[{type:"image_url",image_url:{url:"data:"+mt+";base64,"+b64}},{type:"text",text:"Analyzuj tento FX/index graf. Return ONLY the JSON."}]}],max_tokens:2048})});
      const d=await r.json();
      if(d.error){lastErr=(d.error.message||"");continue;}
      const c=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";
      if(c){raw=c;break;}
    }catch(e){lastErr=(e&&e.message||String(e));}
  }
  if(!raw) throw new Error("Žádný free vision model nezabral. Zkus za chvíli nebo zvol model v Nastavení. "+lastErr);
  const clean=raw.replace(/```json|```/g,"").trim();
  const si=clean.indexOf("{"),ei=clean.lastIndexOf("}");
  return JSON.parse(si>=0&&ei>si?clean.slice(si,ei+1):clean);
}
function AITab(){
  const [img,setImg]=useState(null);
  const [file,setFile]=useState(null);
  const [res,setRes]=useState(null);
  const [busy,setBusy]=useState(false);
  const [prog,setProg]=useState("");
  const [err,setErr]=useState("");
  function pick(f){ if(!f)return; setFile(f);setRes(null);setErr(""); const r=new FileReader(); r.onload=()=>setImg(r.result); r.readAsDataURL(f); }
  async function run(){
    if(!file){setErr("Nejdřív vyfoť nebo nahraj graf.");return;}
    setBusy(true);setErr("");setRes(null);
    try{ setRes(await analyzeChartMobile(file,setProg)); }
    catch(e){ setErr(String(e&&e.message||e)); }
    setBusy(false);setProg("");
  }
  const bc=res&&res.bias==="BULLISH"?"#3fb950":res&&res.bias==="BEARISH"?"#ff6a5e":"#d29922";
  const es=(res&&res.entry_setup)||{}, ms=(res&&res.market_structure)||{};
  return (
    <div>
      <div className="card">
        <div style={{fontWeight:800,marginBottom:8}}>🤖 AI analýza grafu</div>
        <label className="btn sec" style={{display:"block",textAlign:"center",cursor:"pointer"}}>📷 Vyfotit / nahrát graf
          <input type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={e=>pick(e.target.files[0])}/>
        </label>
        {img&&<img src={img} alt="graf" style={{width:"100%",borderRadius:8,marginTop:10,border:"1px solid #21262d"}}/>}
        {img&&<button className="btn" style={{marginTop:10}} disabled={busy} onClick={run}>{busy?"⏳ "+(prog||"Analyzuji…"):"🔍 Analyzovat"}</button>}
        {err&&<div style={{color:"#ff6a5e",fontSize:12,marginTop:8,lineHeight:1.5}}>⚠ {err}</div>}
        <div className="muted" style={{fontSize:10,marginTop:8}}>Potřebuje OpenRouter klíč (Nastavení) — zdarma na openrouter.ai.</div>
      </div>
      {res&&<>
        <div className="card" style={{borderColor:bc+"55"}}>
          <div className="between">
            <span className="pill" style={{background:bc+"22",color:bc,border:"1px solid "+bc+"55"}}>{res.bias||"—"}</span>
            {res.confidence!=null&&<b style={{color:bc,fontSize:18}}>{res.confidence}%</b>}
          </div>
          {res.summary&&<div style={{fontSize:13,marginTop:8,lineHeight:1.5}}>{res.summary}</div>}
        </div>
        {es.direction&&<div className="card">
          <div style={{fontWeight:800,marginBottom:6}}>🎯 Vstup: <span style={{color:es.direction==="BUY"?"#3fb950":es.direction==="SELL"?"#ff6a5e":"#d29922"}}>{es.direction}</span>{es.rr_estimate?(" · RR "+es.rr_estimate):""}</div>
          {es.entry_zone&&<div className="seg"><span className="muted">Vstup</span><span>{es.entry_zone}</span></div>}
          {es.entry_trigger&&<div className="seg"><span className="muted">Trigger</span><span>{es.entry_trigger}</span></div>}
          {es.stop_loss&&<div className="seg"><span className="muted">Stop loss</span><span style={{color:"#ff6a5e"}}>{es.stop_loss}</span></div>}
          {es.tp1&&<div className="seg"><span className="muted">TP1</span><span style={{color:"#3fb950"}}>{es.tp1}</span></div>}
          {es.tp2&&<div className="seg"><span className="muted">TP2</span><span style={{color:"#3fb950"}}>{es.tp2}</span></div>}
          {es.invalidation&&<div className="seg"><span className="muted">Invalidace</span><span>{es.invalidation}</span></div>}
        </div>}
        {ms.trend&&<div className="card">
          <div style={{fontWeight:800,marginBottom:6}}>📐 Struktura: {ms.trend}</div>
          {ms.description&&<div style={{fontSize:12,color:"#c9d1d9",lineHeight:1.5}}>{ms.description}</div>}
          {ms.bos_choch&&<div style={{fontSize:11,color:"#8b949e",marginTop:4}}>{ms.bos_choch}</div>}
        </div>}
        {res.key_levels&&res.key_levels.length>0&&<div className="card">
          <div style={{fontWeight:800,marginBottom:6}}>📊 Klíčové úrovně</div>
          {res.key_levels.slice(0,6).map((l,i)=><div className="seg" key={i}><span style={{color:l.type==="RESISTANCE"?"#ff6a5e":"#3fb950"}}>{l.type==="RESISTANCE"?"⬆ R":"⬇ S"} {l.zone}</span><span className="muted" style={{fontSize:11}}>{l.strength}</span></div>)}
        </div>}
        {res.risk_warnings&&res.risk_warnings.length>0&&<div className="card" style={{borderColor:"#5c4a1f"}}>
          <div style={{fontWeight:800,marginBottom:6,color:"#d29922"}}>⚠️ Rizika</div>
          {res.risk_warnings.map((w,i)=><div key={i} style={{fontSize:12,color:"#d6c089",marginBottom:3,lineHeight:1.4}}>• {w}</div>)}
        </div>}
      </>}
    </div>
  );
}
// ── ZÁLOŽKA: SÍLA MĚN ───────────────────────────────────────
function StrengthTab({data}){
  if(!data) return null;
  const rows=CURRENCIES.map(c=>({c,score:(data.scores[c]&&data.scores[c].score)||0,chg:(typeof getScoreChange!=="undefined"?getScoreChange(c,7):null)})).sort((a,b)=>b.score-a.score);
  const max=Math.max(1,...rows.map(r=>Math.abs(r.score)));
  return (
    <div>
      <div className="card muted" style={{fontSize:12}}>Síla měn — celkové skóre enginu (−10…+10), seřazeno. ▲▼ = změna za 7 dní.</div>
      {rows.map((r,i)=>{
        const col=cScore(r.score), w=Math.round(Math.abs(r.score)/max*100);
        return (
        <div className="card" key={r.c} style={{padding:"10px 12px"}}>
          <div className="between">
            <span className="row" style={{gap:8}}><b className="muted" style={{width:16}}>{i+1}</b><span style={{fontSize:17}}>{FLAGS[r.c]}</span> <b>{r.c}</b></span>
            <span className="row" style={{gap:10}}>
              {r.chg!=null&&Math.abs(r.chg)>=0.1&&<span style={{fontSize:11,color:r.chg>0?"#3fb950":"#ff6a5e"}}>{r.chg>0?"▲":"▼"}{Math.abs(r.chg).toFixed(1)}</span>}
              <b style={{color:col,fontSize:16,minWidth:46,textAlign:"right"}}>{fmtNum(r.score)}</b>
            </span>
          </div>
          <div className="barwrap"><div style={{width:w+"%",height:"100%",background:col,borderRadius:4}}/></div>
        </div>
        );
      })}
    </div>
  );
}
// ── ZÁLOŽKA: DENÍK ──────────────────────────────────────────
function JournalTab(){
  const [list,setList]=useState(()=>{try{return JSON.parse(localStorage.getItem("journal")||"[]");}catch(e){return[];}});
  const pairOpts=(typeof STANDARD_PAIRS!=="undefined"?STANDARD_PAIRS.map(p=>p.pair):["EURUSD"]);
  const [f,setF]=useState({pair:pairOpts[0],dir:"LONG",entry:"",sl:"",tp:"",riskPct:"",outcome:"open",rMultiple:"",notes:""});
  const upd=(k,v)=>setF(p=>({...p,[k]:v}));
  function persist(arr){ setList(arr); try{localStorage.setItem("journal",JSON.stringify(arr));}catch(e){} }
  function add(){
    if(!f.pair)return;
    const now=new Date().toISOString(), closed=f.outcome&&f.outcome!=="open";
    const t={id:Date.now()+"_"+Math.random().toString(36).slice(2,7),pair:f.pair,dir:f.dir,entry:f.entry,sl:f.sl,tp:f.tp,riskPct:f.riskPct,outcome:f.outcome,rMultiple:f.rMultiple===""?null:parseFloat(f.rMultiple),notes:f.notes,openedAt:now,closedAt:closed?now:null};
    persist([t,...list]);
    setF({...f,entry:"",sl:"",tp:"",riskPct:"",outcome:"open",rMultiple:"",notes:""});
  }
  function del(id){ persist(list.filter(t=>t.id!==id)); }
  const oc={open:"#58a6ff",win:"#3fb950",loss:"#ff6a5e",be:"#d29922"};
  const closed=list.filter(t=>t.outcome&&t.outcome!=="open"), wins=closed.filter(t=>t.outcome==="win").length;
  const wr=closed.length?Math.round(wins/closed.length*100):0, totR=closed.reduce((s,t)=>s+(t.rMultiple||0),0);
  return (
    <div>
      <div className="card">
        <div style={{fontWeight:800,marginBottom:8}}>📓 Nový obchod</div>
        <div className="grid2">
          <select className="fld" value={f.pair} onChange={e=>upd("pair",e.target.value)}>{pairOpts.map(p=><option key={p} value={p}>{p}</option>)}</select>
          <select className="fld" value={f.dir} onChange={e=>upd("dir",e.target.value)}><option value="LONG">LONG</option><option value="SHORT">SHORT</option></select>
        </div>
        <div className="grid2">
          <input className="fld" value={f.entry} onChange={e=>upd("entry",e.target.value)} placeholder="Entry" inputMode="decimal"/>
          <input className="fld" value={f.sl} onChange={e=>upd("sl",e.target.value)} placeholder="SL" inputMode="decimal"/>
        </div>
        <div className="grid2">
          <input className="fld" value={f.tp} onChange={e=>upd("tp",e.target.value)} placeholder="TP" inputMode="decimal"/>
          <input className="fld" value={f.riskPct} onChange={e=>upd("riskPct",e.target.value)} placeholder="Risk %" inputMode="decimal"/>
        </div>
        <div className="grid2">
          <select className="fld" value={f.outcome} onChange={e=>upd("outcome",e.target.value)}><option value="open">Otevřený</option><option value="win">Zisk</option><option value="loss">Ztráta</option><option value="be">BE</option></select>
          <input className="fld" value={f.rMultiple} onChange={e=>upd("rMultiple",e.target.value)} placeholder="R (2 / -1)" inputMode="decimal"/>
        </div>
        <input className="fld" value={f.notes} onChange={e=>upd("notes",e.target.value)} placeholder="Poznámka"/>
        <button className="btn" onClick={add}>＋ Přidat obchod</button>
      </div>
      <div className="card"><div className="between"><span className="muted">Obchodů: <b style={{color:"#e6edf3"}}>{list.length}</b></span><span className="muted">WR <b style={{color:"#3fb950"}}>{wr}%</b> · Σ <b style={{color:totR>=0?"#3fb950":"#ff6a5e"}}>{totR>0?"+":""}{totR.toFixed(1)}R</b></span></div></div>
      {list.map(t=>(
        <div className="card" key={t.id} style={{padding:"10px 12px"}}>
          <div className="between">
            <span className="row" style={{gap:8,flexWrap:"wrap"}}><b>{t.pair}</b><span style={{color:t.dir==="LONG"?"#3fb950":"#ff6a5e",fontSize:12,fontWeight:700}}>{t.dir}</span><span className="chip" style={{color:oc[t.outcome]||"#8b949e",borderColor:(oc[t.outcome]||"#8b949e")+"55"}}>{t.outcome}{t.rMultiple!=null?(" "+(t.rMultiple>0?"+":"")+t.rMultiple+"R"):""}</span></span>
            <span onClick={()=>del(t.id)} style={{color:"#6e7681",cursor:"pointer",padding:"0 6px"}}>✕</span>
          </div>
          {(t.entry||t.sl||t.tp)&&<div className="muted" style={{fontSize:11,marginTop:4}}>{t.entry?("E "+t.entry):""} {t.sl?("· SL "+t.sl):""} {t.tp?("· TP "+t.tp):""}</div>}
          {t.notes&&<div style={{fontSize:12,marginTop:4,color:"#c9d1d9"}}>{t.notes}</div>}
          <div className="muted" style={{fontSize:9,marginTop:3}}>{(t.openedAt||"").slice(0,10)}</div>
        </div>
      ))}
      {!list.length&&<div className="card muted">Zatím žádný obchod.</div>}
    </div>
  );
}
// ── ROOT ────────────────────────────────────────────────────
function MApp(){
  const [tab,setTab]=useState("signals");
  const [moreOpen,setMoreOpen]=useState(false);
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [cotLoading,setCotLoading]=useState(false);
  const [error,setError]=useState("");
  const [sel,setSel]=useState(null);

  const load=useCallback(async()=>{
    setLoading(true);setError("");
    try{ const d=await loadDataMobile(); setData(d); }
    catch(e){ setError(String(e&&e.message||e)); }
    setLoading(false);
  },[]);

  const refreshCot=useCallback(async()=>{
    setCotLoading(true);
    try{ await fetchCOTAuto(); await load(); }
    catch(e){ setError("COT: "+String(e&&e.message||e)); }
    setCotLoading(false);
  },[load]);

  useEffect(()=>{
    (async()=>{
      // Cloud sync při startu (když přihlášen) → slije data z cloudu, pak načti
      if(window.Sync&&window.Sync.ready){ try{ const s=await window.Sync.session(); if(s) await window.Sync.syncNow(); }catch(e){} }
      load();
      // COT na pozadí, když je starší než ~4 dny (tiché při selhání)
      try{
        const m=loadCOTMeta();
        const age=m&&m.asOf?((Date.now()-new Date(m.asOf).getTime())/86400000):NaN;
        if(!(age<=4)){ await fetchCOTAuto(); load(); }
      }catch(e){}
    })();
  },[load]);

  const cm=data&&data.calMeta;
  const cot=loadCOT();
  return (
    <div>
      <div className="topbar">
        <h1><span className="accent">AT</span> Trading FX</h1>
        {cm&&<span className="chip" style={{color:cm.conf>=100?"#3fb950":"#d29922",borderColor:(cm.conf>=100?"#3fb950":"#d29922")+"55"}}>📅 {cm.conf}%</span>}
        <button className="btn sec" style={{width:"auto",padding:"7px 11px"}} disabled={loading} onClick={load}>{loading?"⏳":"↻"}</button>
      </div>
      <div className="content">
        {error&&<div className="card" style={{borderColor:"#5c2626",color:"#ff6a5e",fontSize:12}}>⚠ {error}</div>}
        {loading&&!data&&<div className="card muted">⏳ Načítám data…</div>}
        {tab==="signals"&&<SignalsTab data={data} onTap={setSel}/>}
        {tab==="cot"&&<CotTab data={data} onRefreshCot={refreshCot} cotLoading={cotLoading}/>}
        {tab==="cal"&&<CalendarTab data={data}/>}
        {tab==="ai"&&<AITab/>}
        {tab==="strength"&&<StrengthTab data={data}/>}
        {tab==="journal"&&<JournalTab/>}
        {tab==="set"&&<SettingsTab onSaved={load}/>}
      </div>
      <div className="bottomnav">
        {[["signals","🎯","Signály"],["cot","📊","COT"],["cal","📅","Kalendář"],["ai","🤖","AI"]].map(([id,ic,lbl])=>(
          <button key={id} className={tab===id?"active":""} onClick={()=>setTab(id)}><span className="ic">{ic}</span>{lbl}</button>
        ))}
        <button className={["strength","journal","set"].indexOf(tab)>=0?"active":""} onClick={()=>setMoreOpen(true)}><span className="ic">☰</span>Víc</button>
      </div>
      {moreOpen&&<div style={{position:"fixed",inset:0,zIndex:50,background:"#000a"}} onClick={()=>setMoreOpen(false)}>
        <div style={{position:"absolute",left:0,right:0,bottom:0,background:"#161b22",borderTop:"1px solid #21262d",borderTopLeftRadius:16,borderTopRightRadius:16,padding:"16px 14px",paddingBottom:"calc(20px + env(safe-area-inset-bottom))"}} onClick={e=>e.stopPropagation()}>
          <div style={{fontWeight:800,marginBottom:12}}>Víc</div>
          {[["strength","💪","Síla měn"],["journal","📓","Deník"],["set","⚙️","Nastavení"]].map(([id,ic,lbl])=>(
            <button key={id} className="btn sec" style={{textAlign:"left",marginBottom:8,fontSize:15}} onClick={()=>{setTab(id);setMoreOpen(false);}}><span style={{marginRight:8}}>{ic}</span>{lbl}</button>
          ))}
        </div>
      </div>}
      {sel&&data&&<PairDetail p={sel} scores={data.scores} f={data.forecasts[sel.pair]} cotData={cot} daily={getPairDailyState(sel,data.scores,data.cal,data.upcoming)} onClose={()=>setSel(null)}/>}
    </div>
  );
}

window.addEventListener("error",function(ev){
  var el=document.getElementById("root");
  if(el&&!el.children.length) el.innerHTML='<div style="padding:20px;color:#f85149;font-family:monospace;white-space:pre-wrap;font-size:12px">CHYBA: '+(ev.message||ev)+'</div>';
});
ReactDOM.createRoot(document.getElementById("root")).render(<MApp/>);
</script>
