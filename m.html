<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;
const ADMIN_EMAIL='p.vospalek@gmail.com';

// ── BARVY / FORMÁTOVAČE ─────────────────────────────────────
const cScore=v=>v>2?"#2ed3a0":v<-2?"#f2606e":v>0?"#7fd9b8":v<0?"#e8909a":"#8b93a3";
const cComp=v=>v>0.3?"#2ed3a0":v<-0.3?"#f2606e":"#8b93a3";
const fmtNum=v=>(v>0?"+":"")+(Math.round(v*10)/10);
// Skóre-barvy pro 14d/probabilitu (PC palette)
const cProb=v=>v>=65?"#2ed3a0":v<=35?"#f2606e":"#e8ab3f";
// Samostatný 24h Δ ukazatel páru — žádný vliv na p.diff/skóre/rank.
function pairDelta24h(p){
  let dB=null,dQ=null;
  try{ dB=getScoreDelta24h(p.base,p.s1); dQ=getScoreDelta24h(p.quote,p.s2); }catch(e){}
  if(dB==null||dQ==null) return null;
  const d=parseFloat((dB-dQ).toFixed(2)), a=Math.abs(d);
  const arrow=a<0.5?"—":d>0?"↗":"↘";
  const color=a<0.5?"#8b93a3":a<1.5?(d>0?"#7fe0bf":"#f29aa3"):(d>0?"#2ed3a0":"#f2606e");
  return {d,arrow,color,label:arrow+" "+(d>0?"+":"")+d.toFixed(1)};
}
function impactColor(imp){const i=String(imp||"").toLowerCase();if(i.includes("high")||i==="3")return"#f2606e";if(i.includes("medium")||i==="2")return"#e8ab3f";if(i.includes("low")||i==="1")return"#e3d21f";return"#5a6273";}
function impactLabel(imp){const i=String(imp||"").toLowerCase();if(i.includes("high")||i==="3")return"HIGH";if(i.includes("medium")||i==="2")return"MED";if(i.includes("low")||i==="1")return"LOW";return"—";}
function evFlag(ev){const c=String(ev.country||ev.currency||"").toUpperCase();return COUNTRY_FLAGS[c]||"🏳️";}
function fmtDT(t){const d=new Date(parseEventTime(t));if(isNaN(d))return"";return d.toLocaleString("cs-CZ",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}

// ── DENÍK: kontext obchodu (sdíleno s Classic/PC — stejná logika) ──
const PAIR_LIST_TYPE={EURUSD:"white",USDJPY:"white",GBPUSD:"white",AUDUSD:"grey",USDCAD:"grey",USDCHF:"black"};
function captureContext(pairSym,pairs,scores,calData,upcoming,aiAnalyses){
  const p=(pairs||[]).find(x=>x.pair===pairSym)||null;
  const diff=p?p.diff:null;
  const band=(typeof getDiffBand==="function")?getDiffBand(diff):null; // jednotná hranice — viz BAND_THRESHOLDS v engine.js
  let dailyLevel="none",flip=false,cbdi=null,cbStage=null;
  try{ if(p) dailyLevel=getPairDailyState(p,scores,calData,upcoming).level; }catch(e){}
  try{ flip=isPairFlipped(pairSym); }catch(e){}
  try{ cbdi=calcCBDI(); }catch(e){}
  try{ cbStage=getCBCycleStage().stage; }catch(e){}
  const ai=(aiAnalyses||{})[pairSym]||null;
  return {diff,dir:p?p.dir:null,conviction:p?p.conviction:null,band,dailyLevel,flip,cbdi,cbStage,aiBias:ai?ai.bias:null,aiConf:ai?ai.confidence:null,listType:PAIR_LIST_TYPE[pairSym]||"other"};
}
function jStat(list){
  const w=list.filter(t=>t.outcome==="win").length, l=list.filter(t=>t.outcome==="loss").length, be=list.filter(t=>t.outcome==="be").length;
  const dec=w+l, wr=dec?Math.round(w/dec*100):null;
  const rs=list.map(t=>t.outcome==="be"?0:(typeof t.rMultiple==="number"?t.rMultiple:null)).filter(x=>x!=null);
  const sumR=rs.reduce((a,b)=>a+b,0), avgR=rs.length?sumR/rs.length:null;
  const pos=rs.filter(x=>x>0).reduce((a,b)=>a+b,0), neg=Math.abs(rs.filter(x=>x<0).reduce((a,b)=>a+b,0));
  const pf=neg>0?pos/neg:(pos>0?999:null);
  return {n:list.length,w,l,be,wr,sumR,avgR,pf};
}
function SliceBarM({label,s}){
  const wr=s.wr; const col=wr==null?"#4a6a88":(wr>=60?"#2ed3a0":(wr>=50?"#d29922":"#ff4d4d"));
  return (
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,fontSize:11}}>
      <div style={{width:100,color:"#b7c3d1",flexShrink:0}}>{label}</div>
      <div style={{flex:1,height:7,background:"#0d1117",borderRadius:5,overflow:"hidden"}}><div style={{width:(wr==null?0:wr)+"%",height:"100%",background:col,borderRadius:5}}/></div>
      <div style={{width:110,textAlign:"right",color:"#8b949e",flexShrink:0,fontSize:10.5}}>{wr==null?"—":<b style={{color:col}}>{wr}%</b>} · {s.n}{s.avgR!=null?(" · "+(s.avgR>0?"+":"")+s.avgR.toFixed(1)+"R"):""}</div>
    </div>
  );
}

// ── DATA: stejná orchestrace jako PC (engine globals) ───────
async function loadDataMobile(){
  const key=(localStorage.getItem("fh")||"").trim();
  const fmpKey=(localStorage.getItem("fmp")||"").trim();
  let cal=[],calSource="",fmpErr="";
  // PRIMÁRNÍ: server-side kalendář z GitHub Action (forexfactory web — actual + plné pokrytí)
  try{ const fresh=await fetchActionCalendar(); cal=mergeFFHistory(fresh); calSource="action"; }catch(e){}
  const fmpBlocked=!!fmpKey&&localStorage.getItem("fmp_cal_block")===fmpKey;
  if(!cal.length&&fmpKey&&!fmpBlocked){
    try{ cal=await fetchFMPCalendar(fmpKey,15); calSource="fmp"; localStorage.removeItem("fmp_cal_block"); }
    catch(e){ fmpErr=String(e&&e.message||e); if(/Error Message|Restricted|not available|Invalid API|Exclusive|subscription|plan|HTTP 40/i.test(fmpErr)) localStorage.setItem("fmp_cal_block",fmpKey); }
  }
  if(!cal.length&&key){
    const fhBlocked=localStorage.getItem("fh_cal_block")===key;
    if(!fhBlocked){
      try{ cal=await fetchCalendar(key,15); calSource="finnhub"; localStorage.removeItem("fh_cal_block"); }
      catch(e){ if(/Error Message|Restricted|not available|Invalid|premium|subscription|access|plan|HTTP 40/i.test(String(e&&e.message||e))) localStorage.setItem("fh_cal_block",key); }
    }
  }
  if(!cal.length){
    try{ const fresh=await fetchFFEventsCached(false); calSource="forexfactory"; cal=mergeFFHistory(fresh); }
    catch(e2){ cal=loadFFHistory(); if(cal.length) calSource="forexfactory"; }
  }
  try{ cal=applyManualActuals(cal); }catch(e){}
  const calScoring=capEventsWindow(cal,FUND_HIST_WINDOW_WEEKS); // stejné okno pro skórování na každém zařízení — viz engine.js
  if(calSource==="action"||calSource==="fmp"||calSource==="finnhub") g_fundConfidence=1;
  else if(calSource==="forexfactory") g_fundConfidence=ffConfidence(cal);
  else g_fundConfidence=FF_FUND_DAMP;
  try{ g_calSource=calSource||"ff-hist"; }catch(e){}
  try{ autoUpdateFromCalendar(cal); }catch(e){}
  const av=(localStorage.getItem("av")||"").trim();
  if(av){ try{ await fetchOilPrice(av); }catch(e){} }
  try{ await fetchActionOil(); }catch(e){}
  try{ await fetchActionPrices(); }catch(e){}
  try{ await fetchActionVix(); }catch(e){}
  try{ applyAutoRiskSentiment(); }catch(e){}
  try{ await fetchActionCOTHistory(); }catch(e){}
  let retailLatest=null, retailHist=[]; try{ const rj=await fetchActionRetail(); if(rj&&Array.isArray(rj.points)&&rj.points.length){ retailHist=rj.points; retailLatest=rj.points[rj.points.length-1]; } }catch(e){}
  const cot=(typeof getLatestCOTScores==='function'&&getLatestCOTScores())||loadCOT(), sent=(typeof getCanonicalSent==='function'&&getCanonicalSent())||loadSentiment();
  const sc={}; CURRENCIES.forEach(c=>{ sc[c]=scoreCurrency(calScoring,c,cot,sent); });
  try{ if(typeof saveScoreDeltaSnapshot==='function') saveScoreDeltaSnapshot(sc); }catch(e){}
  try{ if(typeof saveScoreHistory==='function') saveScoreHistory(sc); }catch(e){}
  try{ if(typeof saveEngineDailySnapshot==='function') saveEngineDailySnapshot(sc); }catch(e){}
  // D = odvozená per-měna data (shodné s PC this.D) pro COT/Sentiment/Dashboard bloky
  const D={};
  CURRENCIES.forEach(c=>{ const s=sc[c]||{}; D[c]={
    score:+(s.score||0), fund:+(s.fund_score||0), policy:+(s.policy_adj||0), yield:+(s.yield_adj||0),
    cot:+(s.cot_score||0), sent:+(s.sent_score||0), season:+(s.season_score||0),
    cotPct:(()=>{try{return getCOTPercentile(c);}catch(e){return 50;}})()||50,
    cotPctDelta:(()=>{try{return getCOTPercentileChange(c);}catch(e){return null;}})(),
    chg7:(()=>{try{return getScoreChange(c,7);}catch(e){return 0;}})()||0,
    cb:(typeof CB_POLICY_DATA!=="undefined"&&CB_POLICY_DATA[c]&&CB_POLICY_DATA[c].label)||"—",
    // s.cot_score (ne raw cot[c]) — u JPY jde přes getCOTScore() fade override,
    // ať tenhle panel neukazuje jinou institucionální stranu než skutečné COT skóre.
    inst:Math.round(Math.max(-100,Math.min(100,(s.cot_score||0)*12))),
    cotLong:(()=>{try{const ls=getCOTLongShort(c);return ls?ls.long:null;}catch(e){return null;}})(),
    retail:Math.round(sent[c]!=null?sent[c]:50) }; });
  const ranked=rankPairs(sc,{});
  let up;
  if(calSource==="finnhub"){ try{ up=await fetchUpcoming14(key); }catch(e){ up=deriveUpcomingFromEvents(cal); } }
  else up=deriveUpcomingFromEvents(cal);
  const months=(calSource==="fmp"||calSource==="finnhub")?15:ffHistorySpanMonths(cal);
  const fc={}; ranked.forEach(p=>{ try{ fc[p.pair]=buildForecastV5(p,sc,calScoring,up); }catch(e){} });
  try{ if(typeof logForecastSnapshot==='function') logForecastSnapshot(fc); }catch(e){}
  // US100 (Nasdaq-100) — samostatný nástroj, stejná data appka stahuje pro PC
  // (data/us100_cot.json, data/us100_retail.json), jen tenhle mobilní load
  // musí ty samé fetch/score funkce zavolat sám (m.html je nezávislý na
  // index.html — viz CLAUDE.md). Nedotýká se ničeho výš (sc/D/ranked).
  let us100=null;
  try{
    try{ await fetchActionUS100Cot(); }catch(e){}
    try{ await fetchActionUS100Retail(); }catch(e){}
    try{ await fetchActionUS100Macro(); }catch(e){}
    us100=scoreUS100(); saveUS100ScoreHistory(us100);
  }catch(e){}
  return { scores:sc, D, pairs:ranked, cal, upcoming:up, forecasts:fc, cotMeta:loadCOTMeta(), retailLatest, retailHist, us100,
    calMeta:{source:calSource||"none",months,count:cal.length,conf:Math.round((g_fundConfidence||0)*100)} };
}

// ── KARTA PÁRU ──────────────────────────────────────────────
function PairCard({p,f,daily,onTap,isFav,onToggleFav}){
  const buy=p.dir==="BUY";
  const isCAD=p.base==='CAD'||p.quote==='CAD';
  let oilSt=null; if(isCAD){ try{oilSt=getOilStatus();}catch(e){} }
  const d24=pairDelta24h(p);
  return (
    <div className="card" onClick={onTap} style={{borderColor:buy?"#1f5c34":"#5c2626"}}>
      <div className="between">
        <div className="row" style={{gap:6}}>
          <span style={{fontSize:18,fontWeight:900}}>{FLAGS[p.base]}{FLAGS[p.quote]}</span>
          <span style={{fontWeight:900,fontSize:16}}>{p.pair}</span>
          {daily&&daily.dot&&<span style={{fontSize:13}}>{daily.dot}</span>}
          {p.conviction>=3&&<span title={(p.convictionReasons||[]).join(" · ")} style={{color:"#e8ab3f",fontSize:12}}>{(p.crowdedLate?"⚠ ":"")+"★".repeat(Math.min(5,p.conviction))}</span>}
        </div>
        <div className="row" style={{gap:5}}>
          <span title={isFav?"Odebrat z oblíbených":"Přidat do oblíbených"} onClick={e=>{e.stopPropagation();onToggleFav&&onToggleFav(p.pair);}} style={{fontSize:18,cursor:"pointer",color:isFav?"#f0b429":"#2a3348",userSelect:"none",lineHeight:1,padding:"0 2px"}}>{isFav?"★":"☆"}</span>
          <span className={"pill "+(buy?"buy":"sell")}>{p.dir}</span>
        </div>
      </div>
      <div className="between" style={{marginTop:8}}>
        <div className="row" style={{gap:12}}>
          <span style={{fontSize:13}}><span className="muted">skóre </span><b style={{color:cScore(buy?p.diff:-p.diff)}}>{(buy?"+":"-")+p.diff.toFixed(1)}</b></span>
          {f&&f.prob!=null&&<span style={{fontSize:13}}><span className="muted">14d </span><b style={{color:f.prob>=65?"#2ed3a0":f.prob<=35?"#f2606e":"#e8ab3f"}}>{f.prob+"% "+f.dir}</b></span>}
        </div>
        <div className="row" style={{gap:6}}>
          {oilSt&&<span className="chip" style={{color:oilSt.color,borderColor:oilSt.color+"55"}}>🛢 ${oilSt.price.toFixed(1)}</span>}
          {d24&&<span title="Změna skóre páru (rozdíl base−quote) za posledních ~24h" style={{display:"inline-flex",alignItems:"center",gap:4,fontFamily:"'JetBrains Mono',monospace",fontSize:12.5,fontWeight:800,letterSpacing:".02em",color:d24.color,background:d24.color+"22",border:"1.5px solid "+d24.color+"66",borderRadius:7,padding:"4px 9px"}}><span style={{fontSize:14}}>{d24.arrow}</span>{(d24.d>0?"+":"")+d24.d.toFixed(1)}</span>}
          <span className="chip">{p.base} {fmtNum(p.s1)}</span>
          <span className="chip">{p.quote} {fmtNum(p.s2)}</span>
        </div>
      </div>
    </div>
  );
}
// US100 (Nasdaq-100) — mini karta pod seznamem párů, mimo strong/sweet/favs
// filtry (ty jsou postavené na p.diff/p.pair, co US100 nemá).
function US100CardM({us100,onTap}){
  if(!us100) return null;
  const buy=us100.score>=0, col=buy?"#2ed3a0":"#f2606e";
  return (
    <div className="card" onClick={onTap} style={{borderColor:buy?"#1f5c34":"#5c2626"}}>
      <div className="between">
        <div className="row" style={{gap:6}}>
          <span style={{fontWeight:900,fontSize:16}}>US100</span>
          <span className="muted" style={{fontSize:12}}>Nasdaq-100</span>
        </div>
        <span className={"pill "+(buy?"buy":"sell")}>{buy?"BULLISH":"BEARISH"}</span>
      </div>
      <div className="between" style={{marginTop:8}}>
        <span style={{fontSize:13}}><span className="muted">skóre </span><b style={{color:cScore(us100.score)}}>{(us100.score>0?"+":"")+us100.score.toFixed(1)}</b></span>
        <div className="row" style={{gap:6}}>
          <span className="chip">COT {fmtNum(us100.cotScore)}</span>
          <span className="chip">Retail {fmtNum(us100.sentScore)}</span>
        </div>
      </div>
    </div>
  );
}

// ── MINI GRAF (SVG) ─────────────────────────────────────────
function MiniChart({values,color="#5e7cfb",height=54}){
  const vals=(values||[]).filter(v=>typeof v==="number"&&!isNaN(v));
  if(vals.length<2) return <div className="muted" style={{fontSize:11,padding:"6px 0"}}>Zatím málo historie (roste časem / po importu).</div>;

function BigChart({series,dates,height=120,yMin,yMax,mid,fmt,big}){
  const valid=(series||[]).filter(s=>s&&s.vals&&s.vals.filter(v=>typeof v==="number"&&!isNaN(v)).length>=2);
  const [hi,setHi]=useState(null);
  if(!valid.length) return <div className="muted" style={{fontSize:11,padding:"14px 0",textAlign:"center"}}>Zatím málo historie (sbírá se týdně / po importu).</div>;
  const n=Math.max(...valid.map(s=>s.vals.length));
  const all=valid.flatMap(s=>s.vals).filter(v=>typeof v==="number"&&!isNaN(v));
  let mn=yMin!=null?yMin:Math.min(...all), mx=yMax!=null?yMax:Math.max(...all);
  if(mn===mx){mn-=1;mx+=1;}
  const W=320,PT=6,PL=4,PR=big?38:4,PB=big?20:6,H=height,span=(mx-mn)||1;
  const X=i=>PL+(W-PL-PR)*(n<2?0.5:i/(n-1));
  const Y=v=>PT+(H-PT-PB)*(1-(v-mn)/span);
  const move=(cx,el)=>{const r=el.getBoundingClientRect();const px=(cx-r.left)/r.width*W;let i=Math.round((px-PL)/((W-PL-PR)/Math.max(1,n-1)));setHi(Math.max(0,Math.min(n-1,i)));};
  const idx=hi==null?n-1:Math.min(hi,n-1);
  const fm=v=>fmt?fmt(v):(Math.round(v*10)/10);
  const dfmt=d=>{const dt=new Date(d);return isNaN(dt)?"":(dt.getDate()+"."+(dt.getMonth()+1)+".");};
  const midY=mid!=null?Y(mid):null;
  return (
    <div>
    <svg viewBox={"0 0 "+W+" "+H} preserveAspectRatio="none" style={{width:"100%",height,display:"block",touchAction:big?"none":"auto"}}
      onMouseMove={e=>move(e.clientX,e.currentTarget)} onMouseLeave={()=>setHi(null)}
      onTouchStart={e=>{if(big){move(e.touches[0].clientX,e.currentTarget);}}} onTouchMove={e=>{if(big){move(e.touches[0].clientX,e.currentTarget);}}}>
      {midY!=null&&<line x1={PL} x2={W-PR} y1={midY} y2={midY} stroke="#2a3242" strokeWidth="1" strokeDasharray="3 4"/>}
      {valid.map((s,si)=>{const pts=s.vals.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");return <polyline key={si} points={pts} fill="none" stroke={s.color} strokeWidth={big?2.2:1.8} strokeLinejoin="round" strokeLinecap="round"/>;})}
      {big&&<line x1={X(idx)} x2={X(idx)} y1={PT} y2={H-PB} stroke="#5e7cfb" strokeWidth="1" strokeDasharray="3 3" opacity=".75"/>}
      {big&&valid.map((s,si)=><circle key={si} cx={X(idx)} cy={Y(s.vals[Math.min(idx,s.vals.length-1)])} r="3.5" fill={s.color} stroke="#0b0d13" strokeWidth="1.5"/>)}
    </svg>
    {big&&<div className="row" style={{justifyContent:"space-between",marginTop:8,flexWrap:"wrap",gap:8}}>
      <span className="mono" style={{fontSize:11,color:"var(--dim)"}}>{dates&&dates[idx]?dfmt(dates[idx]):("bod "+(idx+1)+"/"+n)}</span>
      <span className="row" style={{gap:12}}>{valid.map((s,si)=><b key={si} className="mono" style={{fontSize:12.5,color:s.color}}>{s.name} {fm(s.vals[Math.min(idx,s.vals.length-1)])}</b>)}</span>
    </div>}
    </div>
  );
}

        {/* Moje pozice + poznámka */}

          {p.cotPctBase!=null&&<div className="muted" style={{fontSize:11,marginTop:8}}>COT percentil {p.base}: {p.cotPctBase}p {p.cotCrowded?"· 🚨 crowded":""}</div>}
        </div>
        {(()=>{ let cf={state:"unknown",mom:null},lp=null; try{cf=getBiasConfirmation(p.pair,p.dir);lp=getPairPrice(p.pair);}catch(e){}
          const map={confirms:{c:"#2ed3a0",ic:"✓",t:"Trh POTVRZUJE "+p.dir,m:"Cena se hýbe ve směru biasu — konfluence."},
            diverges:{c:"#f2606e",ic:"⚠",t:"Trh DIVERGUJE",m:"Cena jde proti biasu — počkej na potvrzení, nehoň cenu."},
            flat:{c:"#e8ab3f",ic:"•",t:"Trh bez směru",m:"Cena stojí — bias zatím bez potvrzení trhem."},
            unknown:{c:"#5a6273",ic:"…",t:"Cenová data nabíhají",m:"Momentum z denní historie naskočí během pár dní."}};
          const v=map[cf.state]||map.unknown;
          const disc=cf.state==="confirms"?'📊 Historická data (776 dní): „POTVRZUJE" často odpovídá technicky nevýhodné (breakout) zóně — porovnej s panelem Pozice v rozpětí níže.'
            :cf.state==="diverges"?'📊 Historická data (776 dní): „DIVERGUJE" často odpovídá výhodnější (pullback) vstupní zóně — porovnej s panelem Pozice v rozpětí níže.':null;
          return (
            <div className="card" style={{borderColor:v.c+"33",borderLeft:"3px solid "+v.c}}>
              <div className="between" style={{gap:10,flexWrap:"wrap"}}>
                <div style={{minWidth:0}}>
                  <span className="vtag" style={{color:v.c,background:v.c+"1c",border:"1px solid "+v.c+"44"}}>{v.ic+" "+v.t}</span>
                  <div className="muted" style={{fontSize:11.5,marginTop:6}}>{v.m}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  {lp!=null&&<div className="mono" style={{fontSize:14,fontWeight:700}}>{lp.toFixed(p.pair.includes("JPY")?3:5)}</div>}

                </div>
              </div>
              {disc&&<div className="muted" style={{fontSize:10.5,marginTop:9,paddingTop:9,borderTop:"1px solid #ffffff12",lineHeight:1.4}}>{disc}</div>}
            </div>
          );
        })()}
        {(()=>{ let rp=null; try{rp=getRangePosition(p.pair,10);}catch(e){}
          if(!rp) return null;
          const zoneLbl={low:"spodní část rozpětí",mid:"střed rozpětí",high:"horní část rozpětí"}[rp.zone];
          return (
            <div className="card">
              <div className="between" style={{marginBottom:9}}>
                <span style={{fontSize:10.5,fontWeight:800,letterSpacing:".04em",color:"var(--dim)"}}>POZICE V 10D ROZPĚTÍ</span>
                <span className="mono" style={{fontSize:11,fontWeight:700}}>{Math.round(rp.rp*100)+"% · "+zoneLbl}</span>
              </div>
              <div style={{position:"relative",height:6,borderRadius:3,background:"#1b2130"}}>
                <div style={{position:"absolute",top:-4,left:"calc("+(rp.rp*100)+"% - 6px)",width:12,height:14,borderRadius:4,background:"var(--accent)",border:"2px solid #0b0e15"}}/>
              </div>
              <div className="muted" style={{fontSize:10.5,marginTop:8,lineHeight:1.4}}>Kde je cena mezi 10denním minimem a maximem — orientační údaj, neovlivňuje skóre ani diferenciál.</div>
            </div>
          );
        })()}
        {(()=>{
          const lim=52;
          const bS=buildDailySeries(p.base,60),qS=buildDailySeries(p.quote,60);
          const rpts=(retailHist||[]).slice(-lim);
          const rl=rpts.map(pt=>{ const d=pt.pairs&&pt.pairs[p.pair]; if(d&&isFinite(d.l)) return d.l; const b=pt.ccy&&pt.ccy[p.base],q=pt.ccy&&pt.ccy[p.quote]; return (b!=null&&q!=null)?Math.round((b+(100-q))/2):50; });
          const cb=cotLSseriesM(p.base,lim),cq=cotLSseriesM(p.quote,lim);
          const scDual=[{name:p.base,color:"#5e7cfb",vals:bS.values||[]},{name:p.quote,color:"#9d7bff",vals:qS.values||[]}];
          const scDiff=[{name:p.base+"−"+p.quote,color:"#e3d21f",vals:(bS.values||[]).map((v,i)=>+(((+(v||0))-(+((qS.values||[])[i]||0))).toFixed(2)))}];
          const scVariants={dual:{series:scDual,yMin:null,yMax:null},diff:{series:scDiff,yMin:null,yMax:null}};
          const cells=[
            {key:"sc",title:"Vývoj skóre",sub:p.base+" vs "+p.quote,dates:bS.dates,mid:0,fmt:v=>(v>0?"+":"")+v.toFixed(1),
              series:scVariants[scMode].series,variants:scVariants},
            {key:"rt",title:"Retail L/S",sub:"dav long vs short (70%+ = kontrariánsky)",dates:null,yMin:0,yMax:100,mid:50,fmt:v=>Math.round(v)+"%",
              series:[{name:"Long",color:"#2ed3a0",vals:rl},{name:"Short",color:"#f2606e",vals:rl.map(v=>100-v)}]},
            {key:"cb",title:"COT "+p.base+" L/S",sub:"smart money long vs short",dates:cb.dates,yMin:0,yMax:100,mid:50,fmt:v=>Math.round(v)+"%",
              series:[{name:"Long",color:"#2ed3a0",vals:cb.long},{name:"Short",color:"#f2606e",vals:cb.short}]},
            {key:"cq",title:"COT "+p.quote+" L/S",sub:"smart money long vs short",dates:cq.dates,yMin:0,yMax:100,mid:50,fmt:v=>Math.round(v)+"%",
              series:[{name:"Long",color:"#2ed3a0",vals:cq.long},{name:"Short",color:"#f2606e",vals:cq.short}]},
          ];
          return (
            <div className="card">
              <div style={{fontWeight:800,fontSize:13,marginBottom:2}}>📊 Grafy páru ({p.pair})</div>
              <div className="muted" style={{fontSize:10.5,marginBottom:10}}>Klikni na graf → zvětší se a můžeš po něm táhnout prstem</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
                {cells.map(c=>(
                  <div key={c.key} onClick={()=>setZoom(c)} style={{background:"var(--inp)",border:"1px solid #161b27",borderRadius:11,padding:"9px 10px",cursor:"pointer"}}>
                    <div className="between" style={{marginBottom:6}}><span style={{fontSize:10.5,fontWeight:800,color:"var(--dim)"}}>{c.title}</span>{c.key==="sc"?scToggle:<span style={{fontSize:13,color:"var(--faint)"}}>⤢</span>}</div>
                    <BigChart series={c.series} dates={c.dates} height={62} yMin={c.yMin} yMax={c.yMax} mid={c.mid} fmt={c.fmt}/>
                  </div>
                ))}
              </div>
            </div>
          );
        })()}
        {zoom&&<div onClick={()=>setZoom(null)} style={{position:"fixed",inset:0,zIndex:60,background:"rgba(7,8,12,.92)",backdropFilter:"blur(6px)",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px"}}>
          <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:560,background:"#0f1218",border:"1px solid #27304a",borderRadius:16,padding:"16px 16px 14px"}}>
            <div className="between" style={{marginBottom:4}}>
              <div><div style={{fontWeight:800,fontSize:15}}>{zoom.title}</div><div className="muted" style={{fontSize:11}}>{zoom.sub} · táhni prstem po grafu</div></div>
              <div className="row" style={{gap:8}}>{zoom.variants&&scToggle}<button onClick={()=>setZoom(null)} style={{width:34,height:34,borderRadius:9,border:"1px solid #2a3242",background:"#161b27",color:"var(--dim)",fontSize:18,cursor:"pointer"}}>×</button></div>
            </div>
            <div style={{height:1,background:"#161b27",margin:"10px 0"}}/>
            <BigChart series={zoom.variants?zoom.variants[scMode].series:zoom.series} dates={zoom.dates} height={250} yMin={zoom.variants?zoom.variants[scMode].yMin:zoom.yMin} yMax={zoom.variants?zoom.variants[scMode].yMax:zoom.yMax} mid={zoom.mid} fmt={zoom.fmt} big={true}/>
          </div>
        </div>}
      </div>
    </div>
  );
}
// ── DETAIL US100 (Nasdaq-100) ────────────────────────────────
// Samostatný, NEsdílí data s PairDetail (žádné p.base/p.quote) — vlastní

// komponenty (BigChart) jako appka ukazuje u páru.
function US100DetailM({data,onClose}){

  const buy=us100.score>=0, col=buy?"#2ed3a0":"#f2606e";
  const cotHist=(typeof loadUS100CotHistory==="function")?loadUS100CotHistory():{};
  const cotDates=Object.keys(cotHist).sort();
  const scoreHist=(typeof loadUS100ScoreHistory==="function")?loadUS100ScoreHistory():{};
  const scoreDates=Object.keys(scoreHist).sort();
  const retailHist=(typeof loadUS100RetailHistory==="function")?loadUS100RetailHistory():[];
  const lastRetail=retailHist.length?retailHist[retailHist.length-1]:null;
  const ageTxt=iso=>{ if(!iso) return "nenačteno"; const h=Math.round((Date.now()-new Date(iso).getTime())/3600000); return h<1?"právě teď":h<48?("před "+h+" h"):("před "+Math.round(h/24)+" dny"); };
  const scoreSeries=[{name:"Skóre",color:"#e3d21f",vals:scoreDates.map(d=>+(scoreHist[d].score||0))}];
  const retailSeries=[{name:"Long",color:"#2ed3a0",vals:retailHist.map(pt=>pt.l)},{name:"Short",color:"#f2606e",vals:retailHist.map(pt=>pt.s)}];
  const cotLS=(()=>{ const lng=[],sht=[]; cotDates.forEach(d=>{ const r=cotHist[d]; const l=(r&&+r.levLong)||0,s=(r&&+r.levShort)||0,tot=l+s; lng.push(tot?Math.round(l/tot*100):50); sht.push(tot?Math.round(s/tot*100):50); }); return [{name:"Long",color:"#2ed3a0",vals:lng},{name:"Short",color:"#f2606e",vals:sht}]; })();

    <div className="ovl">
      <div className="topbar" style={{margin:"0 -12px"}}>
        <button className="btn sec" style={{width:"auto",padding:"7px 12px"}} onClick={onClose}>← Zpět</button>
        <h1>US100</h1>
        <span className={"pill "+(buy?"buy":"sell")}>{buy?"BULLISH":"BEARISH"}</span>
      </div>

        <div className="card">
          <div className="between">
            <div><div className="muted" style={{fontSize:12}}>Nasdaq-100 — skóre</div><div className="bignum" style={{color:col}}>{(us100.score>0?"+":"")+us100.score.toFixed(1)}</div></div>
            <div style={{textAlign:"right"}}>
              <div className="muted" style={{fontSize:10.5}}>COT {fmtNum(us100.cotScore)} · Retail {fmtNum(us100.sentScore)}</div>
              <div className="muted" style={{fontSize:10.5,marginTop:2}}>COT {ageTxt(us100.cotAsOf)} · Retail {ageTxt(us100.retailAsOf)}</div>
            </div>
          </div>
          <div className="muted" style={{fontSize:11,marginTop:8,lineHeight:1.5}}>Index — skóre z COT + retail + makro směr (USD, VIX risk, výnosy, dolar, Fed funds); bez fundamentálního kalendáře, ten na index nesedí.</div>
        </div>

        <div className="card">
          <div className="between" style={{marginBottom:8}}>
            <span style={{fontWeight:800,fontSize:13}}>🧭 Makro komponenta</span>
            <b className="mono" style={{fontSize:13,color:us100.macroScore>=0?"#2ed3a0":"#f2606e"}}>{(us100.macroScore>0?"+":"")+us100.macroScore.toFixed(2)}</b>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            <div>
              <div className="muted" style={{fontSize:10}}>USD (inverzně){us100.usdRaw!=null?(" · "+fmtNum(us100.usdRaw)):""}</div>
              <div className="mono" style={{fontSize:12.5,fontWeight:700,color:us100.usdScore>=0?"#2ed3a0":"#f2606e"}}>{(us100.usdScore>0?"+":"")+us100.usdScore.toFixed(2)}</div>
            </div>
            <div>
              <div className="muted" style={{fontSize:10}}>Risk (VIX)</div>
              <div className="mono" style={{fontSize:12.5,fontWeight:700,color:us100.riskRegime==="RISK_ON"?"#2ed3a0":us100.riskRegime==="RISK_OFF"?"#f2606e":"#6b7688"}}>{us100.riskRegime==="RISK_ON"?"RISK-ON":us100.riskRegime==="RISK_OFF"?"RISK-OFF":us100.riskRegime==="NEUTRAL"?"neutrál":"—"}</div>
            </div>
            <div>
              <div className="muted" style={{fontSize:10}}>Výnosy 10Y{us100.macro&&us100.macro.dgs10?(" · "+us100.macro.dgs10.value.toFixed(2)+"%"):""}</div>
              <div className="mono" style={{fontSize:12.5,fontWeight:700,color:us100.yieldScore>=0?"#2ed3a0":"#f2606e"}}>{(us100.yieldScore>0?"+":"")+us100.yieldScore.toFixed(2)}</div>
            </div>

// ── CLOUD SYNC KARTA ────────────────────────────────────────
function SyncCard({onSynced}){
  const [sess,setSess]=useState(null);
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [msg,setMsg]=useState("");
  const [busy,setBusy]=useState(false);
  const avail=window.Sync&&window.Sync.ready;
  async function doSync(reload){
    setBusy(true);setMsg("⏳ Synchronizuji…");
    try{ const st=await window.Sync.syncNow();
      setMsg(`✅ Sloučeno: ${st.events} událostí · ${st.cotWeeks} COT týdnů · ${st.trades} obchodů · ${st.keys} klíčů`+(reload?" — obnovuji…":""));
      if(onSynced)onSynced();
      if(reload) setTimeout(()=>location.reload(),1000);
    }catch(e){ setMsg("⚠ "+(e&&e.message||e)); }
    setBusy(false);
  }
  useEffect(()=>{
    if(!avail){return;}
    window.Sync.session().then(s=>setSess(s));
    window.Sync.onAuth((s,event)=>{ setSess(s); if(s&&event==="SIGNED_IN") doSync(true); }); // čerstvé přihlášení → sluč + obnov (ať se ukážou klíče)
  },[]);
  async function loginOrRegister(){
    if(!email.trim()||pw.length<6){setMsg("Zadej e-mail a heslo (min. 6 znaků).");return;}
    setBusy(true);setMsg("⏳ Přihlašuji…");
    try{ await window.Sync.signInPassword(email,pw); return; } // SIGNED_IN → doSync(true) sám sloučí + obnoví
    catch(e){
      const m=String(e&&e.message||e);
      if(/invalid login credentials/i.test(m)){
        try{ const d=await window.Sync.signUpPassword(email,pw);
          if(d&&d.session){ setMsg("✅ Účet vytvořen, přihlašuji…"); }
          else { setMsg("⚠ Účet vytvořen, ale Supabase čeká na potvrzení e-mailu. Vypni 'Confirm email' (Authentication → Sign In/Providers → Email) a zkus znovu."); setBusy(false); }
        }catch(e2){
          const m2=String(e2&&e2.message||e2);
          if(/already registered|already exists|User already/i.test(m2)) setMsg("⚠ Tenhle e-mail už existuje (z dřívějšího přihlášení odkazem). Dej 'Zapomenuté heslo', nastav si heslo, pak se přihlas.");
          else setMsg("⚠ "+m2);
          setBusy(false);
        }
      } else { setMsg("⚠ "+m); setBusy(false); }
    }
  }
  async function reset(){
    if(!email.trim()){setMsg("Zadej nejdřív e-mail.");return;}
    setBusy(true);setMsg("");
    try{ await window.Sync.resetPassword(email); setMsg("📧 Poslali jsme odkaz na nastavení hesla. Otevři ho (klidně v Safari), nastav heslo, pak se sem přihlas heslem."); }
    catch(e){ setMsg("⚠ "+(e&&e.message||e)); }
    setBusy(false);
  }
  async function logout(){ await window.Sync.signOut(); setSess(null); setMsg("Odhlášeno."); }
  return (
    <div className="card">
      <div style={{fontWeight:800,marginBottom:8}}>☁️ Cloud sync</div>
      {!avail&&<div className="muted" style={{fontSize:12}}>Nedostupné (internet / Supabase se nenačetl).</div>}
      {avail&&!sess&&<>
        <label className="muted" style={{fontSize:12}}>E-mail</label>
        <input className="fld" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tvuj@email.cz" type="email" autoCapitalize="off" autoCorrect="off"/>
        <label className="muted" style={{fontSize:12}}>Heslo (stejné na PC i mobilu)</label>
        <input className="fld" value={pw} onChange={e=>setPw(e.target.value)} placeholder="min. 6 znaků" type="password" autoCapitalize="off" autoCorrect="off"/>
        <button className="btn" disabled={busy} onClick={loginOrRegister}>🔐 Přihlásit / Vytvořit účet</button>
        <button className="btn sec" style={{marginTop:8}} disabled={busy} onClick={reset}>Zapomenuté heslo</button>
      </>}
      {avail&&sess&&<>
        <div className="muted" style={{fontSize:12,marginBottom:8}}>Přihlášen: <b style={{color:"#e6edf3"}}>{sess.user&&sess.user.email}</b></div>
        <button className="btn" disabled={busy} onClick={()=>doSync(true)}>🔄 Synchronizovat teď</button>
        <button className="btn sec" style={{marginTop:8}} onClick={logout}>Odhlásit</button>
      </>}
      {msg&&<div style={{fontSize:12,marginTop:8,color:msg[0]==="⚠"?"#f2606e":"#2ed3a0",lineHeight:1.5}}>{msg}</div>}
    </div>
  );
}

  const [fmp,setFmp]=useState(localStorage.getItem("fmp")||"");

async function analyzeChartMobile(file,setProg){
  const orKey=(localStorage.getItem("or_key")||"").trim();
  if(!orKey) throw new Error("Chybí OpenRouter klíč — zadej ho v Nastavení (zdarma na openrouter.ai).");
  setProg&&setProg("Připravuji obrázek…");
  const b64=await fileToBase64(file), mt=file.type||"image/jpeg";
  setProg&&setProg("Hledám AI model…");
  let visionModels=[];
  try{
    const mResp=await fetch("https://openrouter.ai/api/v1/models",{headers:{"Authorization":"Bearer "+orKey}});
    const mData=await mResp.json();
    visionModels=(mData.data||[]).filter(m=>m.id.endsWith(":free")&&((m.architecture&&m.architecture.modality)||"").includes("image")).sort((a,b)=>(b.context_length||0)-(a.context_length||0)).map(m=>m.id);
  }catch(e){}
  const manual=localStorage.getItem("or_model")||"";
  const FALLBACK=["meta-llama/llama-3.2-11b-vision-instruct:free","meta-llama/llama-3.2-90b-vision-instruct:free","qwen/qwen-2-vl-7b-instruct:free"];
  const models=[manual,...visionModels,...FALLBACK].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);
  let raw="",lastErr="";
  for(const model of models){
    setProg&&setProg("Analyzuji ("+model.split("/").pop().slice(0,16)+")…");
    try{
      const r=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+orKey,"HTTP-Referer":"https://pitrrv.github.io","X-Title":"AT Trading FX"},
        body:JSON.stringify({model,messages:[{role:"system",content:AI_SYSTEM_PROMPT},{role:"user",content:[{type:"image_url",image_url:{url:"data:"+mt+";base64,"+b64}},{type:"text",text:"Analyzuj tento FX/index graf. Return ONLY the JSON."}]}],max_tokens:2048})});
      const d=await r.json();
      if(d.error){lastErr=(d.error.message||"");continue;}
      const c=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";
      if(c){raw=c;break;}
    }catch(e){lastErr=(e&&e.message||String(e));}
  }
  if(!raw) throw new Error("Žádný free vision model nezabral. Zkus za chvíli nebo zvol model v Nastavení. "+lastErr);
  const clean=raw.replace(/```json|```/g,"").trim();
  const si=clean.indexOf("{"),ei=clean.lastIndexOf("}");
  return JSON.parse(si>=0&&ei>si?clean.slice(si,ei+1):clean);
}

  const head={"Content-Type":"application/json","Authorization":"Bearer "+orKey,"HTTP-Referer":"https://pitrrv.github.io","X-Title":"AT Trading AI Coach"};
  const body=m=>JSON.stringify({model:m,messages:[{role:"system",content:sys}].concat(apiMsgs),max_tokens:900,temperature:0.4});
  const models=[(localStorage.getItem("or_coach_model")||"").trim()||"openrouter/free","deepseek/deepseek-chat-v3-0324:free","qwen/qwen3-8b:free","google/gemma-3-12b-it:free","meta-llama/llama-4-scout:free"].filter((v,i,a)=>v&&a.indexOf(v)===i);
  for(const m of models){ try{ const r=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:head,body:body(m)}); const d=await r.json(); if(!d.error&&d.choices&&d.choices[0]&&d.choices[0].message){return d.choices[0].message.content;} }catch(e){} }
  throw new Error("Žádný free model momentálně neodpověděl. Zkus to za chvíli.");
}
function CoachTab({data}){
  const INIT=[{role:"coach",text:"Ahoj, jsem tvůj AI Coach. Vidím tvoje živá skóre, COT i pozice — ptej se na setup, riziko nebo konflikty."}];
  const [msgs,setMsgs]=useState(()=>{try{const s=JSON.parse(localStorage.getItem("fx_coach_chat")||"null");return Array.isArray(s)&&s.length?s:INIT;}catch(e){return INIT;}});
  const [input,setInput]=useState("");
  const [pair,setPair]=useState("");
  const [busy,setBusy]=useState(false);
  const logRef=useRef(null);
  const chips=["Které páry dnes neobchodovat?","Top setupy dnes?","Co s mými pozicemi?","Kde je konflikt?"];
  const pairOpts=((data&&data.pairs)||[]).map(p=>p.pair);
  const persist=arr=>{try{localStorage.setItem("fx_coach_chat",JSON.stringify(arr.slice(-50)));}catch(e){}};
  useEffect(()=>{if(logRef.current)logRef.current.scrollTop=logRef.current.scrollHeight;},[msgs,busy]);
  async function send(text){
    const t=(text==null?input:text).trim(); if(!t||busy)return;
    const hist=msgs.concat([{role:"user",text:t}]); setInput("");setMsgs(hist);persist(hist);setBusy(true);
    try{ const ctx=buildCoachContextM(data,pair); const reply=await coachReply(ctx,hist); const m=hist.concat([{role:"coach",text:reply}]);setMsgs(m);persist(m); }
    catch(e){ const m=hist.concat([{role:"coach",text:"⚠ "+(e&&e.message||e)}]);setMsgs(m);persist(m); }
    setBusy(false);
  }
  function clear(){ setMsgs(INIT);persist(INIT); }
  return (
    <div className="chatwrap">
      <div className="between" style={{padding:"12px 14px",borderBottom:"1px solid var(--line)"}}>
        <div className="row" style={{gap:10}}>
          <div className="mono" style={{width:34,height:34,borderRadius:10,background:"linear-gradient(150deg,#10131c,#0a0c12)",border:"1px solid var(--line2)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12}}>AT</div>
          <div><div style={{fontWeight:800,fontSize:14}}>AI Coach</div><div style={{fontSize:10.5,color:"var(--green)"}}>● vidí živá skóre, COT a pozice</div></div>
        </div>
        <button className="btn sec" style={{width:"auto",padding:"7px 11px",fontSize:12}} onClick={clear}>↺</button>
      </div>
      <div style={{padding:"8px 12px 0"}}>
        <select className="fld mono" style={{marginBottom:8,fontSize:12,padding:"8px 10px"}} value={pair} onChange={e=>setPair(e.target.value)}>
          <option value="">🎯 Všechny páry</option>
          {pairOpts.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
      </div>
      <div className="chatlog" ref={logRef}>
        {msgs.map((m,i)=><div key={i} className={"bub "+(m.role==="user"?"me":"ai")}>{m.text}</div>)}
        {busy&&<div className="bub ai muted" style={{fontSize:12}}>⏳ Coach přemýšlí…</div>}
      </div>
      <div style={{padding:"10px 12px",borderTop:"1px solid var(--line)"}}>
        <div className="row" style={{gap:6,flexWrap:"wrap",marginBottom:9}}>{chips.map(c=>(
          <button key={c} onClick={()=>send(c)} style={{fontSize:11,color:"var(--dim)",background:"#0c0f16",border:"1px solid var(--line)",borderRadius:999,padding:"5px 10px",cursor:"pointer",fontFamily:"inherit"}}>{c}</button>
        ))}</div>
        <div className="row" style={{gap:8}}>
          <input className="fld" style={{marginBottom:0}} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")send(null);}} placeholder="Zeptej se na setup, riziko…"/>
          <button className="btn" style={{width:"auto",padding:"0 18px",background:"linear-gradient(180deg,#4be0a8,#2ed3a0)",color:"#06140f"}} disabled={busy} onClick={()=>send(null)}>➤</button>
        </div>
      </div>
    </div>
  );
}

// ── ROOT ────────────────────────────────────────────────────
function MApp(){
  const [tab,setTab]=useState("signals");
  const [moreOpen,setMoreOpen]=useState(false);
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [cotLoading,setCotLoading]=useState(false);
  const [retailLoading,setRetailLoading]=useState(false);
  const [calLiveLoading,setCalLiveLoading]=useState(false);
  const [calMsg,setCalMsg]=useState("");
  const [favs,setFavs]=useState(()=>new Set(loadFavoritePairs()));
  const [dataMsg,setDataMsg]=useState("");
  const [error,setError]=useState("");
  const [sel,setSel]=useState(null);

  const load=useCallback(async()=>{
    setLoading(true);setError("");
    try{ const d=await loadDataMobile(); setData(d); }
    catch(e){ setError(String(e&&e.message||e)); }
    setLoading(false);
  },[]);

  const refreshCot=useCallback(async()=>{
    setCotLoading(true);setDataMsg("⏳ Stahuji COT z CFTC…");
    try{ const {meta}=await fetchCOTAuto(); await load(); setDataMsg("✅ COT aktualizováno"+(meta&&meta.asOf?(" na "+String(meta.asOf).slice(0,10)):"")); }
    catch(e){ setDataMsg("⚠ COT stažení selhalo: "+String(e&&e.message||e)); }
    setCotLoading(false);
  },[load]);

  const refreshRetail=useCallback(async()=>{
    setRetailLoading(true);setDataMsg("⏳ Stahuji retail sentiment…");
    try{ const res=await fetchRetailSentiment(); const rs=res&&res.sentData||res; saveSentiment(rs); try{saveRetailSnapshot(rs);}catch(e){} await load(); setDataMsg("✅ Retail aktualizován · "+((res&&res.method)||"CFTC")); }
    catch(e){ try{const d=deriveRetailFromCOTData();saveSentiment(d);try{saveRetailSnapshot(d);}catch(e3){}await load();setDataMsg("⚠ Retail auto selhal — použita záloha z COT.");}catch(e2){setDataMsg("⚠ Retail selhal: "+String(e&&e.message||e));} }
    setRetailLoading(false);
  },[load]);

  // Vyžádaný refresh přímo z živého ForexFactory feedu (bez GitHub cronu) —
  // funguje pro kohokoliv s internetem, ne jen pro vlastníka GH repa.
  const refreshCalendarLive=useCallback(async()=>{
    setCalLiveLoading(true);setCalMsg("");
    try{
      const fr=await fetchFFEventsCached(true);
      mergeFFHistory(fr);
      await load();
      setCalMsg("✅ Kalendář obnoven z živého FF feedu ("+new Date().toLocaleTimeString("cs-CZ")+").");
    }catch(e){ setCalMsg("⚠ Live refresh selhal: "+String(e&&e.message||e)); }
    setCalLiveLoading(false);
  },[load]);

  const setManualActual=useCallback(async(e)=>{
    const cur=(e.actual||"").toString();
    const v=window.prompt('Ruční hodnota Actual pro "'+e.event+'" ('+(e.country||"")+'):',cur);
    if(v===null) return;
    try{ saveManualActual(ffHistKey(e),v); }catch(err){}
    await load();
  },[load]);

  const toggleFav=useCallback((pair)=>{
    setFavs(prev=>{
      const f=new Set(prev);
      if(f.has(pair))f.delete(pair);else f.add(pair);
      saveFavoritePairs([...f]);
      return f;
    });
  },[]);

  useEffect(()=>{
    (async()=>{
      // Cloud sync při startu (když přihlášen) → slije data z cloudu, pak načti
      if(window.Sync&&window.Sync.ready){ try{ const s=await window.Sync.session(); if(s) await window.Sync.syncNow(); }catch(e){} }
      load();
      // Živý COT fetch jen když je i SERVEROVÁ historie stará (>9 dní) a max 1× za
      // 6 h — stejná logika jako PC (viz komentář v index.html refreshData).
      try{
        const wk=Object.keys(loadCOTHistory()).filter(k=>typeof isValidCOTWeekKey==="function"?isValidCOTWeekKey(k):true).sort().pop();
        const age=wk?((Date.now()-new Date(wk+"T00:00:00Z").getTime())/86400000):NaN;
        const lastTry=+(localStorage.getItem("cot_auto_try_ts")||0);
        if(!(age<=9)&&(Date.now()-lastTry)>6*3600000){ try{localStorage.setItem("cot_auto_try_ts",String(Date.now()));}catch(e2){} await fetchCOTAuto(); load(); }
      }catch(e){}
    })();
  },[load]);

  const cm=data&&data.calMeta;
  const cot=loadCOT();
  return (
    <div>
      <div className="topbar">
        <h1><span className="accent">AT</span> Trading FX</h1>
        {cm&&<span className="chip" style={{color:cm.conf>=100?"#2ed3a0":"#e8ab3f",borderColor:(cm.conf>=100?"#2ed3a0":"#e8ab3f")+"55"}}>📅 {cm.conf}%</span>}
        <button className="btn sec" style={{width:"auto",padding:"7px 11px"}} disabled={loading} onClick={load}>{loading?"⏳":"↻"}</button>
      </div>
      <div className="content">
        {error&&<div className="card" style={{borderColor:"#5c2626",color:"#f2606e",fontSize:12}}>⚠ {error}</div>}
        {loading&&!data&&<div className="card muted">⏳ Načítám data…</div>}
        {tab==="signals"&&<SignalsTab data={data} onTap={setSel} favs={favs} onToggleFav={toggleFav}/>}
        {tab==="cot"&&<CotTab data={data} onRefreshCot={refreshCot} onRefreshRetail={refreshRetail} cotLoading={cotLoading} retailLoading={retailLoading} msg={dataMsg} onTapPair={setSel}/>}
        {tab==="cal"&&<CalendarTab data={data} onRefreshLive={refreshCalendarLive} liveLoading={calLiveLoading} onSetManual={setManualActual} msg={calMsg}/>}
        {tab==="ai"&&<AITab/>}
        {tab==="coach"&&<CoachTab data={data}/>}
        {tab==="strength"&&<StrengthTab data={data}/>}
        {tab==="journal"&&<JournalTab data={data}/>}
        {tab==="set"&&<SettingsTab onSaved={load}/>}
      </div>
      <div className="bottomnav">
        {[["signals","🎯","Signály"],["cot","📊","COT"],["cal","📅","Kalendář"],["ai","🤖","AI"]].map(([id,ic,lbl])=>(
          <button key={id} className={tab===id?"active":""} onClick={()=>setTab(id)}><span className="ic">{ic}</span>{lbl}</button>
        ))}
        <button className={["coach","strength","journal","set"].indexOf(tab)>=0?"active":""} onClick={()=>setMoreOpen(true)}><span className="ic">☰</span>Víc</button>
      </div>
      {moreOpen&&<div style={{position:"fixed",inset:0,zIndex:50,background:"#000a"}} onClick={()=>setMoreOpen(false)}>
        <div style={{position:"absolute",left:0,right:0,bottom:0,background:"#0f121a",borderTop:"1px solid #1b2130",borderTopLeftRadius:16,borderTopRightRadius:16,padding:"16px 14px",paddingBottom:"calc(20px + env(safe-area-inset-bottom))"}} onClick={e=>e.stopPropagation()}>
          <div style={{fontWeight:800,marginBottom:12}}>Víc</div>
          {[["coach","💬","AI Coach"],["strength","💪","Síla měn"],["journal","📓","Deník"],["set","⚙️","Nastavení"]].map(([id,ic,lbl])=>(
            <button key={id} className="btn sec" style={{textAlign:"left",marginBottom:8,fontSize:15}} onClick={()=>{setTab(id);setMoreOpen(false);}}><span style={{marginRight:8}}>{ic}</span>{lbl}</button>
          ))}
        </div>
      </div>}
      {sel==="US100"&&data&&<US100DetailM data={data} onClose={()=>setSel(null)}/>}
      {sel&&sel!=="US100"&&data&&<PairDetail p={sel} scores={data.scores} D={data.D} f={data.forecasts[sel.pair]} cotData={cot} daily={getPairDailyState(sel,data.scores,data.cal,data.upcoming)} calData={data.cal} upcoming={data.upcoming} retailHist={data.retailHist} onClose={()=>setSel(null)}/>}
    </div>
  );
}

window.addEventListener("error",function(ev){
  var el=document.getElementById("root");
  if(el&&!el.children.length) el.innerHTML='<div style="padding:20px;color:#f2606e;font-family:monospace;white-space:pre-wrap;font-size:12px">CHYBA: '+(ev.message||ev)+'</div>';
});
// ── Přístupová brána (uzavřený test — jen ADMIN_EMAIL) ─────────────────────
// Stejný princip a stejný účet jako v index.html — viz komentář tam. Appka
// nemá backend, tohle NENÍ skutečná bezpečnost, jen brání běžnému otevření.
function AppGate(){
  const [checking,setChecking]=useState(true);
  const [authorized,setAuthorized]=useState(false);
  const [email,setEmail]=useState(""), [pw,setPw]=useState("");
  const [busy,setBusy]=useState(false), [msg,setMsg]=useState("");
  useEffect(()=>{
    if(!(window.Sync&&window.Sync.ready)){ setChecking(false); setAuthorized(false); setMsg("⚠ Přihlašovací systém se nenačetl (internet/Supabase). Zkus obnovit stránku."); return; }
    const check=(s)=>{ const e=s&&s.user&&s.user.email?String(s.user.email).trim().toLowerCase():null; setChecking(false); setAuthorized(e===ADMIN_EMAIL); };
    window.Sync.session().then(check).catch(()=>{ setChecking(false); setAuthorized(false); });
    window.Sync.onAuth((s)=>check(s));
  },[]);
  async function login(){
    if(!email.trim()||pw.length<6){ setMsg("Zadej e-mail a heslo (min. 6 znaků)."); return; }
    setBusy(true); setMsg("⏳ Přihlašuji…");
    try{ await window.Sync.signInPassword(email,pw); } // úspěch → onAuth výš přepne authorized sám
    catch(e){ setBusy(false); setMsg("⚠ "+(e&&e.message||e)); }
  }
  const wrap={minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#07080c",fontFamily:"'Manrope',sans-serif"};
  if(checking) return <div style={{...wrap,color:"#8b93a3",fontSize:13}}>Načítám…</div>;
  if(authorized) return <MApp/>;
  const fld={width:"100%",padding:"11px 14px",background:"#0a0d13",border:"1px solid #1b2130",borderRadius:10,color:"#eaedf3",fontSize:13,fontFamily:"'Manrope',sans-serif",marginBottom:10,display:"block",outline:"none",boxSizing:"border-box"};
  const btn={width:"100%",padding:"12px",background:"linear-gradient(180deg,#5e7cfb,#4c63d9)",border:"1px solid #d4a72c",borderRadius:10,color:"#fff",fontSize:13,fontWeight:700,fontFamily:"inherit",cursor:"pointer"};
  return (
    <div style={{...wrap,padding:20}}>
      <div style={{width:"100%",maxWidth:360,background:"#0c0f16",border:"1px solid #1b2130",borderRadius:14,padding:"28px 26px",boxSizing:"border-box"}}>
        <div style={{fontSize:16,fontWeight:800,color:"#eaedf3",marginBottom:4}}>🔒 AT Trading FX</div>
        <div style={{fontSize:12,color:"#8b93a3",marginBottom:18,lineHeight:1.5}}>Analyzer je zatím v uzavřeném testu. Přihlas se svým účtem.</div>
        <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="e-mail" type="email" autoCapitalize="off" autoCorrect="off" style={fld}/>
        <input value={pw} onChange={e=>setPw(e.target.value)} placeholder="heslo" type="password" onKeyDown={e=>{if(e.key==="Enter")login();}} style={fld}/>
        <button type="button" disabled={busy} onClick={login} style={btn}>Přihlásit</button>
        {msg&&<div style={{fontSize:11.5,marginTop:12,color:/^⚠/.test(msg)?"#f2606e":"#8b93a3",lineHeight:1.5}}>{msg}</div>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<AppGate/>);
</script>
</body>
</html>
