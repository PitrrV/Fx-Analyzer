<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://generativelanguage.googleapis.com https://openrouter.ai https://finnhub.io https://api.rss2json.com https://en.wikipedia.org https://*.github.io https://raw.githubusercontent.com; base-uri 'none'; object-src 'none'" />
<title>AI Market Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    /* ---- dark (default) — deep indigo-aubergine + verdigris ---- */
    --bg:oklch(15% 0.02 300); --bg-2:oklch(12% 0.02 300); --panel:oklch(19% 0.018 300); --panel-2:oklch(23% 0.02 300);
    --line:oklch(31% 0.02 300); --line-2:oklch(40% 0.022 300);
    --txt:oklch(95% 0.012 75); --txt-dim:oklch(72% 0.014 70); --txt-faint:oklch(51% 0.014 68);

    /* signature accent — verdigris (oxidised copper patina), used ONLY for live/brand/interactive, never sentiment */
    --acc:oklch(72% 0.10 185); --acc-ink:#051512;
    /* importance ramp (neutral -> amber -> crimson) — the ONLY channel encoding "how important" */
    --imp-md:oklch(78% 0.13 80);
    --imp-hi:oklch(70% 0.16 50);
    --imp-max:oklch(58% 0.19 25);
    /* sentiment — muted duotone, deliberately NOT stoplight red/green (analysis tool, not a signal tool) */
    --pos:oklch(74% 0.08 145);
    --neg:oklch(66% 0.10 35);

    --shadow:0 1px 2px rgba(0,0,0,.5);
    --shadow-lg:0 26px 56px -24px rgba(0,0,0,.72);
    --display:'Instrument Serif',Georgia,serif;
    --sans:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --mono:'Space Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;
    --r:16px; --r-sm:9px; --r-xs:5px;
    --side-w:268px;
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  html[data-theme="light"]{
    --bg:oklch(97% 0.012 85); --bg-2:oklch(93% 0.017 80); --panel:oklch(99% 0.006 85); --panel-2:oklch(95% 0.015 80);
    --line:oklch(86% 0.017 78); --line-2:oklch(77% 0.02 75);
    --txt:oklch(21% 0.02 300); --txt-dim:oklch(39% 0.02 290); --txt-faint:oklch(56% 0.02 288);
    --acc:oklch(46% 0.10 185); --acc-ink:#fff;
    --imp-md:oklch(55% 0.14 80); --imp-hi:oklch(50% 0.17 48); --imp-max:oklch(45% 0.19 25);
    --pos:oklch(48% 0.09 145); --neg:oklch(46% 0.11 35);
    --shadow:0 1px 2px rgba(40,30,20,.08);
    --shadow-lg:0 22px 50px -22px rgba(40,30,20,.2);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{min-height:100vh;position:relative}
  html{transition:background .25s ease}
  ::selection{background:var(--acc);color:var(--acc-ink)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--acc)}
  button{font-family:var(--sans);cursor:pointer;color:inherit}
  input,select,textarea{font-family:var(--sans)}
  a{color:var(--acc);text-decoration:none}
  :focus-visible{outline:1.5px solid var(--acc);outline-offset:2px;border-radius:4px}
  .tnum{font-variant-numeric:tabular-nums}
  svg.ic{width:16px;height:16px;flex-shrink:0;display:block}
  .mono{font-family:var(--mono)}

  /* ================= SHELL ================= */
  #app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
  .sidebar{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 22px;z-index:50}
  .workspace{min-width:0;display:flex;flex-direction:column;min-height:100vh}

  .masthead{padding-bottom:22px;margin-bottom:20px;border-bottom:1px solid var(--line)}
  .masthead .markrow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .logo{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;position:relative;overflow:hidden;background:var(--panel-2);border:1px solid var(--line-2);flex-shrink:0}
  .logo .grid{position:absolute;inset:0;background-image:repeating-radial-gradient(circle,transparent 0,transparent 5px,var(--line) 5px,var(--line) 5.6px)}
  .logo .sweep{position:absolute;inset:-2px;background:conic-gradient(from 0deg,transparent 0deg,transparent 270deg,color-mix(in oklch,var(--acc) 55%,transparent) 315deg,var(--acc) 350deg,transparent 360deg);animation:sweep 3.2s linear infinite}
  .logo .core{width:5px;height:5px;border-radius:50%;background:var(--acc);box-shadow:0 0 7px var(--acc);z-index:2}
  @keyframes sweep{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.32}}
  .masthead .markrow b{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--txt-faint);font-weight:700;font-family:var(--mono)}
  .masthead h1{font-family:var(--display);font-style:italic;font-size:34px;font-weight:400;line-height:1;letter-spacing:-.01em;color:var(--txt)}
  .masthead .tagline{font-size:12px;color:var(--txt-dim);line-height:1.5;margin-top:9px;max-width:26ch}

  nav.tabs{display:flex;flex-direction:column;gap:3px}
  nav.tabs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:none;border-left:2px solid transparent;border-radius:0;padding:9px 0 9px 14px;transition:border-color .12s,background .12s}
  nav.tabs button .t{font-size:14px;font-weight:700;color:var(--txt-dim);letter-spacing:-.005em}
  nav.tabs button .d{font-size:10.5px;color:var(--txt-faint);line-height:1.4}
  nav.tabs button:hover{border-left-color:var(--line-2);background:color-mix(in oklch,var(--txt) 3%,transparent)}
  nav.tabs button.on{border-left-color:var(--acc);background:color-mix(in oklch,var(--acc) 8%,transparent)}
  nav.tabs button.on .t{color:var(--txt)}

  .legend{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
  .legend b{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt-faint);font-weight:700;margin-bottom:11px;font-family:var(--mono)}
  .legend .row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:11px;color:var(--txt-dim)}
  .legend .row i{width:8px;height:8px;border-radius:50%;flex-shrink:0}

  .side-foot{margin-top:auto;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .theme-btn{display:flex;align-items:center;gap:9px;width:100%;border:1px solid var(--line);background:transparent;color:var(--txt-dim);border-radius:var(--r-xs);padding:9px 11px;font-size:12px;font-weight:500;transition:.12s}
  .theme-btn:hover{color:var(--txt);border-color:var(--line-2)}
  .side-ver{font-size:9px;color:var(--txt-faint);letter-spacing:.06em;padding:0 2px;text-transform:uppercase;font-weight:600;font-family:var(--mono)}

  /* ================= TOPBAR ================= */
  .topbar{display:flex;align-items:center;gap:14px;height:48px;padding:0 24px;border-bottom:1px solid var(--line);background:color-mix(in oklch,var(--panel) 82%,transparent);backdrop-filter:saturate(1.3) blur(10px);position:sticky;top:0;z-index:40}
  .topbar .ticker{flex:1;min-width:0;overflow:hidden;height:100%;display:flex;align-items:center;-webkit-mask:linear-gradient(90deg,transparent,#000 4%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 4%,#000 92%,transparent)}
  .ticker-track{display:flex;gap:22px;white-space:nowrap;animation:scroll 80s linear infinite}
  .topbar .ticker:hover .ticker-track{animation-play-state:paused}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tk{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--txt-dim);font-family:var(--mono)}
  .tk b{color:var(--txt);font-weight:700}
  .tk .news{width:6px;height:6px;border-radius:50%;background:var(--line-2);flex-shrink:0}
  .tk .news.pos{background:var(--pos);box-shadow:0 0 6px color-mix(in oklch,var(--pos) 60%,transparent)}
  .tk .news.neg{background:var(--neg);box-shadow:0 0 6px color-mix(in oklch,var(--neg) 60%,transparent)}
  .topbar .status{display:flex;align-items:center;gap:9px;flex-shrink:0}
  .clock{font-size:11.5px;color:var(--txt-dim);font-variant-numeric:tabular-nums;letter-spacing:.02em;white-space:nowrap;font-family:var(--mono)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:5px 9px;border-radius:var(--r-xs);border:1px solid var(--line-2);font-weight:700;background:var(--panel-2);white-space:nowrap;font-family:var(--mono)}
  .pill .blip{width:5px;height:5px;border-radius:50%}
  .pill.live{color:var(--acc);border-color:color-mix(in oklch,var(--acc) 40%,transparent);background:color-mix(in oklch,var(--acc) 9%,transparent)}
  .pill.live .blip{background:var(--acc);box-shadow:0 0 6px var(--acc);animation:pulse 1.6s infinite}
  .pill.mock{color:var(--imp-md);border-color:color-mix(in oklch,var(--imp-md) 40%,transparent);background:color-mix(in oklch,var(--imp-md) 8%,transparent)}
  .pill.mock .blip{background:var(--imp-md)}
  .pill.error{color:var(--imp-max);border-color:color-mix(in oklch,var(--imp-max) 40%,transparent);background:color-mix(in oklch,var(--imp-max) 8%,transparent)}
  .pill.error .blip{background:var(--imp-max)}
  .pill.loading{color:var(--acc);border-color:color-mix(in oklch,var(--acc) 40%,transparent);background:color-mix(in oklch,var(--acc) 8%,transparent)}
  .pill.loading .blip{background:var(--acc);animation:pulse 1s infinite}
  .squawk-btn{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.01em;padding:7px 11px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--panel-2);color:var(--txt-dim);font-weight:600;transition:all .15s}
  .squawk-btn:hover{color:var(--txt);border-color:var(--txt-faint)}
  .squawk-btn.on{color:var(--acc-ink);background:var(--acc);border-color:var(--acc)}
  .squawk-btn.on svg{animation:pulse 1.3s infinite}

  /* ================= MAIN ================= */
  main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;align-items:start}
  @media(max-width:1080px){main{grid-template-columns:1fr}.rail{display:none}}
  .col{padding:28px 32px;min-width:0}
  .rail{border-left:1px solid var(--line);padding:26px 22px;position:sticky;top:48px;align-self:stretch;background:var(--bg-2);min-height:calc(100vh - 48px)}

  #main{animation:mainIn .34s var(--ease)}
  @keyframes mainIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:14px;flex-wrap:wrap}
  .sec-head h2{font-family:var(--display);font-style:italic;font-size:32px;font-weight:400;letter-spacing:-.01em;line-height:1;color:var(--txt)}
  .sec-head .meta{font-size:11px;color:var(--txt-faint);font-variant-numeric:tabular-nums;letter-spacing:.01em;font-family:var(--mono)}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
  .toolbar input,.toolbar select{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 11px;color:var(--txt);font-size:12.5px;outline:none;transition:border-color .15s}
  .toolbar input::placeholder{color:var(--txt-faint)}
  .toolbar input:focus,.toolbar select:focus{border-color:var(--acc)}
  .toolbar input[type=search]{flex:1;min-width:180px}
  .fchip{font-size:12px;padding:8px 12px;border-radius:var(--r-sm);background:var(--panel);border:1px solid var(--line-2);color:var(--txt-dim);font-weight:500;transition:all .12s}
  .fchip:hover{color:var(--txt);border-color:var(--txt-faint)}
  .fchip.on{color:var(--acc-ink);background:var(--acc);border-color:var(--acc);font-weight:600}

  /* ---------- article photo frame (shared by hero + thumbs) — real photo, subtle dark overlay, no filters.
     Photos sit in a fixed-width side panel (not stretched across the full card) so a portrait/square
     source photo never gets crammed into an ultra-wide sliver — that's what looked blurry/cropped. ---------- */
  .artwrap{position:relative;overflow:hidden;background:var(--panel-2)}
  .artwrap img{display:block;width:100%;height:100%;object-fit:cover}
  .artwrap::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.18);pointer-events:none}
  .art-credit{position:absolute;bottom:9px;left:9px;font-family:var(--mono);font-size:8.5px;color:color-mix(in oklch,var(--txt) 70%,transparent);background:color-mix(in oklch,var(--bg) 45%,transparent);padding:2px 7px;border-radius:20px;backdrop-filter:blur(6px)}
  .dualflag{display:flex;width:100%;height:100%}
  .dualflag img{width:50%;height:100%;object-fit:cover}
  .dualflag .div{width:1px;background:color-mix(in oklch,var(--txt) 25%,transparent);flex-shrink:0}
  .art-pill{position:absolute;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:20px;backdrop-filter:blur(6px);border:1px solid color-mix(in oklch,var(--txt) 16%,transparent)}
  .art-pill.age{bottom:9px;right:9px;background:color-mix(in oklch,var(--bg) 55%,transparent);color:var(--txt-dim)}
  .art-pill.age.fresh{color:var(--acc)}
  .art-pill.lead{top:9px;left:9px;background:var(--acc);color:var(--acc-ink);border-color:transparent;text-transform:uppercase}

  /* ---------- importance gauge — a solid circle badge next to the text, not a faint pill lost over a photo ---------- */
  .imp-gauge{position:absolute;top:14px;right:16px;min-width:42px;height:42px;padding:0 5px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--line-2);background:var(--bg-2);z-index:2;box-shadow:var(--shadow)}
  .imp-gauge span{font-weight:800;font-size:15px;line-height:1;font-variant-numeric:tabular-nums;font-family:var(--mono)}
  .imp-gauge small{font-size:6.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-faint);margin-top:2px;font-weight:800}
  .imp-gauge.md{border-color:color-mix(in oklch,var(--imp-md) 60%,transparent);background:color-mix(in oklch,var(--imp-md) 12%,var(--bg-2))} .imp-gauge.md span{color:var(--imp-md)}
  .imp-gauge.hi{border-color:color-mix(in oklch,var(--imp-hi) 60%,transparent);background:color-mix(in oklch,var(--imp-hi) 12%,var(--bg-2))} .imp-gauge.hi span{color:var(--imp-hi)}
  .imp-gauge.max{border-color:color-mix(in oklch,var(--imp-max) 60%,transparent);background:color-mix(in oklch,var(--imp-max) 14%,var(--bg-2))} .imp-gauge.max span{color:var(--imp-max)}
  .imp-gauge.lo span{color:var(--txt-dim)}
  .hero-body .imp-gauge{top:20px;right:24px;min-width:54px;height:54px;border-width:2.5px}
  .hero-body .imp-gauge span{font-size:20px}
  .hero-body .imp-gauge small{font-size:7.5px}

  /* ---------- HERO (top story) — photo as a fixed-width side panel, text alongside ---------- */
  .hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px;box-shadow:var(--shadow-lg);animation:cardIn .34s var(--ease) backwards;display:flex;align-items:stretch}
  @keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .hero .artwrap{border-right:1px solid var(--line);width:360px;flex:0 0 360px}
  .hero.is-fresh .artwrap{animation:heroFlash 2s var(--ease)}
  @keyframes heroFlash{0%{box-shadow:inset 0 0 0 3px var(--acc)}100%{box-shadow:inset 0 0 0 0 transparent}}
  .hero-body{padding:24px 92px 26px 28px;position:relative;flex:1;min-width:0}
  .hero .headline{font-family:var(--display);font-style:italic;font-size:30px;line-height:1.16;font-weight:400;letter-spacing:-.01em}
  @media(max-width:900px){.hero{flex-direction:column}.hero .artwrap{width:100%;flex:0 0 220px;border-right:none;border-bottom:1px solid var(--line)}.hero .headline{font-size:24px}.hero-body{padding:18px 76px 20px 18px}}

  /* ---------- bento grid of regular dispatches — same side-panel photo treatment ---------- */
  .bento{column-count:2;column-gap:16px}
  @media(max-width:900px){.bento{column-count:1}}
  .dispatch{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px;break-inside:avoid;transition:border-color .15s,box-shadow .15s,transform .15s;animation:cardIn .32s var(--ease) backwards;display:flex;align-items:stretch}
  .dispatch:nth-child(n){animation-delay:calc(var(--i,0)*18ms)}
  .dispatch:hover{border-color:var(--line-2);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .dispatch .artwrap{border-right:1px solid var(--line);width:132px;flex:0 0 132px}
  .dispatch.is-fresh .artwrap{animation:heroFlash 2s var(--ease)}
  .dispatch.isana{border-color:color-mix(in oklch,var(--acc) 34%,var(--line))}
  @media(max-width:560px){.dispatch{flex-direction:column}.dispatch .artwrap{width:100%;flex:0 0 160px;border-right:none;border-bottom:1px solid var(--line)}}

  .body{padding:16px 62px 18px 18px;min-width:0;position:relative;flex:1}
  .meta-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px;font-family:var(--mono);font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--txt-faint)}
  .meta-line .src{color:var(--txt-dim);font-weight:700}
  .meta-line .sep{opacity:.5}
  .meta-line .cbflag,.meta-line .anaflag,.meta-line .cotflag{border:1px solid color-mix(in oklch,var(--imp-md) 40%,transparent);border-radius:3px;padding:0 4px;margin-left:4px}
  .meta-line .cbflag{color:var(--imp-md)}
  .meta-line .anaflag{color:var(--acc);border-color:color-mix(in oklch,var(--acc) 40%,transparent)}
  .meta-line .cotflag{color:var(--pos);border-color:color-mix(in oklch,var(--pos) 40%,transparent)}
  .meta-line .datefull{margin-left:auto;white-space:nowrap}
  .milestoneflag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:var(--r-xs);margin:-3px 0 9px;color:var(--imp-max);background:color-mix(in oklch,var(--imp-max) 12%,transparent);border:1px solid color-mix(in oklch,var(--imp-max) 34%,transparent)}
  .milestoneflag svg{width:11px;height:11px;flex-shrink:0}
  .badge{font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:var(--r-xs);font-weight:700;font-family:var(--mono)}
  .cred{font-size:9px;letter-spacing:.03em;padding:3px 7px;border-radius:var(--r-xs);font-weight:700;display:inline-flex;align-items:center;gap:4px;font-family:var(--mono)}
  .cred .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
  .cred.conf{background:color-mix(in oklch,var(--pos) 13%,transparent);color:var(--pos);border:1px solid color-mix(in oklch,var(--pos) 34%,transparent)}
  .cred.single{background:color-mix(in oklch,var(--imp-md) 13%,transparent);color:var(--imp-md);border:1px solid color-mix(in oklch,var(--imp-md) 34%,transparent)}
  .cred.rumor{background:color-mix(in oklch,var(--neg) 13%,transparent);color:var(--neg);border:1px solid color-mix(in oklch,var(--neg) 34%,transparent)}
  .srccount{font-size:9px;font-weight:700;letter-spacing:.02em;padding:3px 7px;border-radius:var(--r-xs);background:color-mix(in oklch,var(--acc) 11%,transparent);color:var(--acc);border:1px solid color-mix(in oklch,var(--acc) 26%,transparent);cursor:default;display:inline-flex;align-items:center;gap:4px;font-family:var(--mono)}
  .tier{font-size:8.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:var(--r-xs);border:1px solid var(--line-2);color:var(--txt-faint);font-family:var(--mono)}
  .tier.t1{color:var(--pos);border-color:color-mix(in oklch,var(--pos) 40%,transparent)} .tier.t2{color:var(--acc);border-color:color-mix(in oklch,var(--acc) 35%,transparent)} .tier.t3{color:var(--txt-faint)}
  .cluster-srcs{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--txt-dim)}
  .cluster-srcs .first{color:var(--imp-md);font-weight:600}

(function(){

function safeUrl(u){ return /^https?:\/\//i.test(String(u||'').trim()) ? String(u).trim() : '#'; }

  get(k,d){ try{const v=localStorage.getItem('amr_'+k);return v?JSON.parse(v):d}catch(e){return d} },
  set(k,v){ try{localStorage.setItem('amr_'+k,JSON.stringify(v))}catch(e){} }

function topItems(items,n){ return items.slice().sort((a,b)=> (b.score||0)-(a.score||0) || new Date(b.publishedAt||0)-new Date(a.publishedAt||0)).slice(0,n); }
function dominantTheme(items){
  const catCount={}, instCount={};
  items.forEach(n=>{ catCount[n.cat]=(catCount[n.cat]||0)+1; (n.affects||[]).forEach(a=>instCount[a[0]]=(instCount[a[0]]||0)+1); });
  const topCat=Object.keys(catCount).sort((a,b)=>catCount[b]-catCount[a])[0]||'TRH';
  const insts=Object.keys(instCount).sort((a,b)=>instCount[b]-instCount[a]);
  return {topCat,insts,catCount,instCount};
}
function buildDeskFromNews(items){
  const top=topItems(items,5), th=dominantTheme(items), lead=top[0];

  ].filter(Boolean).join(' ');
  return { updatedAt:new Date().toISOString(), title: lead? lead.headline : 'Přehled dne', summary,
    points:[['Hlavní téma',th.topCat||'—'],['Nejvíc zmiňováno',insts.join(', ')||'—'],['Počet zpráv',String(items.length)]],
    sources: top.map(n=>({headline:n.headline,url:n.url,source:n.source})) };
}
function buildConnectionsFromNews(items){
  const map={}; items.forEach(n=>(n.affects||[]).forEach(a=>{ (map[a[0]]=map[a[0]]||[]).push(n); }));
  const out=[];
  Object.keys(map).sort((a,b)=>map[b].length-map[a].length).slice(0,3).forEach(sym=>{
    const arr=map[sym]; if(arr.length<2) return;
    out.push({ tag:sym+' · '+arr.length+' zpráv dnes', text:'Dnešní zprávy opakovaně zmiňují '+sym+'. Například: '+arr.slice(0,3).map(n=>'„'+n.headline+'"').join('; ')+'.', pairs:[sym] });

  return out;
}

function isoHoursAgo(h){ return new Date(Date.now()-h*3600*1000).toISOString(); }
function formatDateTime(iso){ if(!iso) return 'datum neznámé'; return new Date(iso).toLocaleString('cs-CZ',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function ageText(iso){
  if(!iso) return 'stáří neznámé';
  const mins=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));
  if(mins<60) return 'před '+mins+' min';
  const hrs=Math.floor(mins/60), rem=mins%60;
  if(hrs<24) return rem? 'před '+hrs+' h '+rem+' min' : 'před '+hrs+' h';
  return 'před '+Math.floor(hrs/24)+' dny';
}
function isOld(iso){ return iso && (Date.now()-new Date(iso).getTime())>6*3600*1000; }
function ageMins(iso){ if(!iso) return 999999; return Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000)); }
function isTodayIso(iso){ if(!iso) return true; const d=new Date(iso),n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate(); }

function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return 'h'+(h>>>0).toString(36); }
function normHeadline(s){ return (s||'').toLowerCase().replace(/[^a-z0-9á-ž ]/gi,'').replace(/\s+/g,' ').trim(); }
function dedupe(items){
  const seen=new Set(), out=[];
  for(const it of items){ const k=normHeadline(it.headline).slice(0,80); if(!k||seen.has(k)) continue; seen.add(k); out.push(it); }
  return out;
}

/* ---------- source tier + credibility (Tier / Ověřeno / Rumor) ---------- */
const SOURCE_TIERS = {
  'reuters':1,'bloomberg':1,'associated press':1,'apnews':1,' ap ':1,'wall street journal':1,'wsj':1,'financial times':1,'ft.com':1,
  'federal reserve':1,'european central bank':1,'ecb':1,'bank of england':1,'cnbc':1,
  'marketwatch':2,'investing':2,'fxstreet':2,'forexlive':2,'forex factory':2,'forexfactory':2,'yahoo':2,'business insider':2,'barron':2,'the economist':2,'guardian':2,'dailyfx':2,'actionforex':2,'marketpulse':2,'kitco':2,'tradingview':2,
  'twitter':3,'x (twitter)':3,'reddit':3,'seeking alpha':3,'seekingalpha':3,'zerohedge':3,'telegram':3,'blog':3
};
function sourceTier(name,url){
  let t=null; const s=' '+(name||'').toLowerCase()+' ';
  for(const k in SOURCE_TIERS){ if(s.indexOf(k.trim())>=0) t=Math.min(t==null?9:t,SOURCE_TIERS[k]); }
  const h=hostFromUrl(url);
  if(h) for(const k in SOURCE_TIERS){ if(h.indexOf(k.trim())>=0) t=Math.min(t==null?9:t,SOURCE_TIERS[k]); }
  return t==null?2:t;
}
const RUMOR_RE = /\b(reportedly|sources say|according to sources|people familiar|rumou?r\w*|speculat\w*|unconfirmed|allegedly|mulls?|weighs?|in talks|could|denies|denied|údajně|podle zdroj\w*|spekul\w*|nepotvrzen\w*|zvažuj\w*|jedná o|popír\w*)\b/i;
function credibility(n){
  const count=n.srcCount||1, tier=n.bestTier||sourceTier(n.source,n.url);
  const rumor=RUMOR_RE.test(n.headline)||tier>=3;
  if(rumor && count<2) return {label:'Nepotvrzeno',cls:'rumor',ico:'◌'};
  if(count>=2 && tier<=2) return {label:'Ověřeno · '+count+' zdroje',cls:'conf',ico:'✓'};
  if(tier===1) return {label:'Ověřeno',cls:'conf',ico:'✓'};
  return {label:'Jeden zdroj',cls:'single',ico:'•'};
}

/* ---------- story clustering (1 příběh / N zdrojů) ---------- */
const STOP = new Set('the a an of to in on for and or is are be as at by with from that this it its has have had will would after over into amid said says say report reports reported update updates live new news today after near amid sees set'.split(' '));
function clTokens(h){ return Array.from(new Set(normHeadline(h).split(' ').filter(w=>w.length>=4 && !STOP.has(w)))); }
function jaccard(a,b){ if(!a.length||!b.length) return 0; const B=new Set(b); let inter=0; for(const x of a){ if(B.has(x)) inter++; } return inter/(a.length+b.length-inter); }
// kanonické entity (měny, ČB, aktiva, makro) — slouží k poznání, že jde o TÉŽE téma
const ENTITY_RULES = [
  ['USD',/\b(usd|dollar|dolar|greenback)\b/],['EUR',/\b(eur|euro|eurozone|eurozón\w*)\b/],['GBP',/\b(gbp|pound|sterling|cable|libr\w*)\b/],
  ['JPY',/\b(jpy|yen|jen)\b/],['AUD',/\b(aud|aussie)\b/],['CAD',/\b(cad|loonie|canad\w*)\b/],['CHF',/\b(chf|franc|frank|swiss\w*|švýc\w*)\b/],['NZD',/\b(nzd|kiwi)\b/],
  ['GOLD',/\b(gold|xau|bullion|zlat\w*)\b/],['SILVER',/\b(silver|xag|stříbr\w*)\b/],['OIL',/\b(oil|crude|wti|brent|ropa|ropy)\b/],
  ['FED',/\b(fed|fomc|powell|federal reserve)\b/],['ECB',/\b(ecb|lagarde)\b/],['BOJ',/\b(boj|ueda)\b/],['BOE',/\b(boe|bailey)\b/],
  ['RATES',/\b(rate|rates|hike|hikes|cut|cuts|sazb\w*|úrok\w*)\b/],['CPI',/\b(cpi|inflation|inflac\w*|pce)\b/],['JOBS',/\b(nfp|payroll\w*|jobs|jobless|unemploy\w*|nezaměstn\w*)\b/],
  ['GDP',/\b(gdp|hdp|growth)\b/],['PMI',/\b(pmi)\b/],['NASDAQ',/\b(nasdaq|us100)\b/],['SP500',/\b(sp500|us500)\b/],['DOW',/\b(dow|us30)\b/],['TARIFF',/\b(tariff\w*|sanction\w*|clo|cla|sankc\w*)\b/]
];
function entities(h){
  const s=' '+(h||'').toLowerCase().replace(/[^a-z0-9á-ž]+/gi,' ').replace(/\s+/g,' ').trim()+' ', out=new Set();
  for(const r of ENTITY_RULES){ if(r[1].test(s)) out.add(r[0]); }
  const FX=['usd','eur','gbp','jpy','aud','cad','chf','nzd']; // spojené páry typu „eurusd"
  FX.forEach(a=>FX.forEach(b=>{ if(a!==b && s.indexOf(' '+a+b)>=0){ out.add(a.toUpperCase()); out.add(b.toUpperCase()); } }));
  return out;
}
function sharedCount(a,b){ let n=0; a.forEach(x=>{ if(b.has(x)) n++; }); return n; }
// slouč, když sdílí ≥2 entity a aspoň trochu se překrývají, NEBO mají silný textový překryv
function clMerge(tkA,enA,tkB,enB){ const jac=jaccard(tkA,tkB); const sh=sharedCount(enA,enB); return (sh>=2 && jac>=0.18) || jac>=0.35; }
function buildCluster(members){
  // representative = nejlepší tier, pak nejvyšší skóre, pak nejnovější
  const withTier=members.map(m=>Object.assign({_tier:sourceTier(m.source,m.url)},m));
  const rep=withTier.slice().sort((a,b)=> a._tier-b._tier || (b.score||0)-(a.score||0) || (b.image?1:0)-(a.image?1:0) || new Date(b.publishedAt||0)-new Date(a.publishedAt||0))[0];
  // unikátní zdroje
  const seen=new Set(), srcs=[];
  withTier.forEach(m=>{ const key=(m.source||'').toLowerCase(); if(key&&!seen.has(key)){ seen.add(key); srcs.push({source:m.source,url:m.url,tier:m._tier,publishedAt:m.publishedAt}); } });
  const first=srcs.slice().sort((a,b)=> new Date(a.publishedAt||0)-new Date(b.publishedAt||0))[0];
  return Object.assign({},rep,{
    srcCount:srcs.length, sources:srcs, bestTier:Math.min.apply(null,srcs.map(s=>s.tier)),
    firstSource:first?first.source:rep.source, firstAt:first?first.publishedAt:rep.publishedAt,
    isAnalysis: members.some(m=>m.isAnalysis)
  });
}
function clusterize(items){
  const clusters=[];
  for(const it of items){
    const tk=clTokens(it.headline), en=entities(it.headline); let best=null,bestJac=-1;
    for(const c of clusters){ if(clMerge(tk,en,c._tk,c._en)){ const j=jaccard(tk,c._tk); if(j>bestJac){ bestJac=j; best=c; } } }
    if(best) best.members.push(it);
    else clusters.push({_tk:tk,_en:en,members:[it]});
  }
  return clusters.map(c=>buildCluster(c.members));
}

/* ---------- audio squawk (čtené breaking news) ---------- */
function ttsSpeak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    const u=new SpeechSynthesisUtterance(text); u.lang='cs-CZ'; u.rate=1.02; u.pitch=1;
    const vs=window.speechSynthesis.getVoices()||[]; const cz=vs.find(v=>/cs|cz/i.test(v.lang));
    if(cz) u.voice=cz;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function runSquawk(){
  if(!state.settings.squawk) return;
  if(!state.squawkPrimed){ state.squawkPrimed=true; seedSpoken(); return; } // po zapnutí/otevření nečíst backlog
  const min=Number(state.settings.squawkMin||8);
  const fresh=state.news.filter(n=>(n.score||0)>=min && isTodayIso(n.publishedAt) && n.hid && !state.spoken.has(n.hid))
    .sort((a,b)=> new Date(a.publishedAt||0)-new Date(b.publishedAt||0)).slice(0,3);
  fresh.forEach(n=>{ state.spoken.add(n.hid); const title=(n.cs&&n.cs!==n.headline)?n.cs:n.headline; ttsSpeak('Důležitá zpráva, skóre '+(n.score||0)+'. '+title); });
}

function getHistory(){ return LS.get('history',[]); }
function pruneHistory(arr){ const cut=Date.now()-HISTORY_DAYS*24*3600*1000; return arr.filter(n=> new Date(n.analyzedAt||n.publishedAt||Date.now()).getTime()>=cut); }
function mergeHistory(items){
  const cur=getHistory(), byId=new Map(cur.map(n=>[n.hid,n]));
  for(const n of items){ if(n.hid && !byId.has(n.hid)) byId.set(n.hid,n); }
  const merged=pruneHistory(Array.from(byId.values())).sort((a,b)=> new Date(b.publishedAt||0)-new Date(a.publishedAt||0));
  LS.set('history',merged); return merged;
}
function getCache(){ return LS.get('analysis_cache',{}); }
const CACHE_DAYS = 14;
function pruneCache(c){
  const cut=Date.now()-CACHE_DAYS*24*3600*1000, out={};
  Object.keys(c||{}).forEach(k=>{ const rec=c[k]; const t=rec&&rec.analyzedAt?new Date(rec.analyzedAt).getTime():0; if(t>=cut) out[k]=rec; });
  return out;
}
function setCache(c){ LS.set('analysis_cache',pruneCache(c)); }
function mediaImage(history){
  const m={}; INSTRUMENTS.forEach(c=>m[c]={pos:0,neg:0});
  (history||[]).forEach(n=> (n.affects||[]).forEach(a=>{ const s=a[0],d=a[1]; if(m[s]){ if(d==='pos')m[s].pos++; else if(d==='neg')m[s].neg++; } }));
  return m;
}
function heatFromHistory(history){ const m=mediaImage(history), o={}; CURRENCIES.forEach(c=>{ o[c]=Math.max(-10,Math.min(10,(m[c]?m[c].pos:0)-(m[c]?m[c].neg:0))); }); return o; }
function dailySeriesPN(history, sym, days){
  const now=new Date(); const buckets=[];
  for(let i=days-1;i>=0;i--){
    const d=new Date(now); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
    buckets.push({key:d.toDateString(),label:d,pos:0,neg:0});
  }
  const byKey={}; buckets.forEach(b=>byKey[b.key]=b);
  (history||[]).forEach(n=>{
    if(!n.publishedAt) return; const dk=new Date(n.publishedAt).toDateString(); const b=byKey[dk]; if(!b) return;
    (n.affects||[]).forEach(a=>{ if(a[0]!==sym) return; if(a[1]==='pos') b.pos++; else if(a[1]==='neg') b.neg++; });
  });
  return buckets;
}

const FREE_MODELS = ['meta-llama/llama-3.3-70b-instruct:free','deepseek/deepseek-r1:free','google/gemini-2.0-flash-exp:free'];
function orFetch(model, messages, settings){
  return fetch('https://openrouter.ai/api/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.apiKey,'HTTP-Referer':location.origin,'X-Title':'AI Market Radar'},
    body:JSON.stringify({model:model,messages:messages,temperature:0.3})
  });
}
// Google Gemini API přímo — free tier ~1500/den, bez karty (mnohem štědřejší než OpenRouter free)
async function callGemini(messages, settings){
  const sys = (messages.find(m=>m.role==='system')||{}).content||'';
  const usr = messages.filter(m=>m.role!=='system').map(m=>m.content).join('\n\n');
  const models = [settings.geminiModel||'gemini-2.5-flash','gemini-2.0-flash','gemini-2.5-flash-lite','gemini-1.5-flash'];
  const body = { contents:[{role:'user',parts:[{text:usr}]}], generationConfig:{temperature:0.3} };
  if(sys) body.system_instruction = {parts:[{text:sys}]};
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  let lastStatus=0;
  for(let i=0;i<models.length;i++){
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(models[i])+':generateContent',{
      method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':settings.geminiKey}, body:JSON.stringify(body)
    });
    if(r.ok){ const d=await r.json(); const parts=d&&d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts; return (parts?parts.map(p=>p.text||'').join(''):''); }
    lastStatus=r.status;
    if(r.status!==503 && r.status!==500 && r.status!==429) break; // 400/403 = klíč/model → nezkoušej dál
    await sleep(700*(i+1)); // přetížení (503) je dočasné → krátký backoff + záložní Flash model
  }
  throw new Error('API '+lastStatus);
}
async function callAI(messages, settings){
  if(settings.geminiKey) return callGemini(messages, settings); // Gemini má přednost (větší free tier)
  if(!settings.apiKey) throw new Error('NO_KEY');
  let model = settings.model||'openai/gpt-4o-mini';
  let res = await orFetch(model, messages, settings);
  // Účet bez kreditu (402) na placeném modelu → automaticky zkus bezplatný :free model
  if(res.status===402 && !/:free\b/.test(model)){
    for(const fm of FREE_MODELS){
      res = await orFetch(fm, messages, settings);
      if(res.ok){
        try{ if(typeof state!=='undefined' && state.settings){ state.settings.model=fm; LS.set('settings',state.settings); state.autoFreeNote='AI nemá kredit (402) → automaticky přepnuto na bezplatný model „'+fm+'". Změníš v ⚙️ Nastavení.'; } }catch(e){}
        break;
      }
      if(res.status!==402 && res.status!==404 && res.status!==400) break; // jiná chyba → dál nezkoušej
    }
  }
  if(!res.ok) throw new Error('API '+res.status);
  const d = await res.json();
  return (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || '';
}
function parseJSON(raw){
  let s=(raw||'').replace(/```json|```/g,'').trim();
  const a=s.indexOf('{'), b=s.indexOf('[');
  let start=(a>=0&&b>=0)?Math.min(a,b):Math.max(a,b);
  if(start>=0){ const end=Math.max(s.lastIndexOf('}'),s.lastIndexOf(']')); if(end>start) s=s.slice(start,end+1); }
  return JSON.parse(s);
}

async function fetchFinnhub(settings){

      if(!r.ok){ if(!err) err='HTTP '+r.status; return []; }

      return (Array.isArray(arr)?arr:[]).slice(0,25).map(n=>({
        id:'f'+n.id, provider:'finnhub', source:n.source||'Finnhub', headline:n.headline, url:n.url,

async function fetchCBFeeds(settings){
  const active = CB_FEEDS.filter(f=> !(settings.sources && settings.sources[f.name]===false));
  if(!active.length){ SRC_DIAG.cb={n:0,err:'off'}; return []; }
  const out=[];
  for(const f of active){
    try{
      const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(f.url));
      if(r.ok){ const d=await r.json();
        (d.items||[]).slice(0,10).forEach(it=>out.push({
          id:'cb'+hashStr(it.link||it.title||''), provider:'cb', source:f.name, headline:it.title, url:it.link,
          image: /^https?:\/\//i.test(it.thumbnail||'') ? it.thumbnail : '',
          publishedAt:it.pubDate? new Date(it.pubDate).toISOString() : new Date().toISOString()
        })); }
    }catch(e){}
  }
  SRC_DIAG.cb={n:out.length, err: out.length?'':'prázdná odpověď (zkontroluj feed URL v Nastavení)'};
  return out;
}
// Oficiální CB zprávy a analytické/COT články vycházejí mnohem řidčeji než agenturní drát,
// takže čistě chronologický ořez je systematicky vyřazoval z výsledného poolu, i když se
// stáhly v pořádku (portováno z fetch-radar.js — stejná logika, stejná čísla).
function pickWithQuota(all, cbQuota, anaQuota, total){
  const byRecency=(a,b)=> new Date(b.publishedAt||0)-new Date(a.publishedAt||0);
  const sorted=all.slice().sort(byRecency);
  const cbPick = sorted.filter(n=>n.provider==='cb').slice(0,cbQuota);
  const anaPick = sorted.filter(n=>n.provider!=='cb' && n.isAnalysis).slice(0,anaQuota);
  const pickedIds = new Set(cbPick.concat(anaPick).map(n=>n.id));
  const rest = sorted.filter(n=>!pickedIds.has(n.id));
  return cbPick.concat(anaPick).concat(rest).slice(0,total).sort(byRecency);
}
async function fetchRawNews(settings){
  // Finnhub (pokud je klíč) = hlavní zdroj se skutečnými médii → lepší tiering i slučování.
  // RSS + oficiální CB feedy běží navíc kvůli křížovému potvrzení (stejná zpráva z víc zdrojů → „Ověřeno").
  SRC_DIAG.ran=true;
  const userRss = !!(settings.rssFeeds||'').trim();
  const arr = await Promise.all([fetchFinnhub(settings), fetchRSS(settings, userRss?null:DEFAULT_RSS), fetchCBFeeds(settings)]);
  let all=arr[0].concat(arr[1]).concat(arr[2]).filter(n=>n.headline && !isCryptoOnly(n.headline)); // krypto-only zprávy ven (zaměření na měny)
  all=clusterize(all);
  return pickWithQuota(all, 6, 6, 28);
}

/* ---------- backend mode (volitelné) ---------- */
async function fetchFromBackend(settings){
  const base=(settings.backendUrl||'').replace(/\/$/,'');
  const r=await fetch(base+'/api/feed');
  if(!r.ok) throw new Error('Backend '+r.status);
  const d=await r.json();
  if(Array.isArray(d.news)) mergeHistory(d.news.map(n=>Object.assign({hid:n.hid||hashStr(normHeadline(n.headline))},n)));
  return { status:'live', news:d.news||[], conns:(d.conns&&d.conns.length)?d.conns:MOCK_CONNECTIONS, desk:d.desk||Object.assign({},MOCK_DESK,{updatedAt:new Date().toISOString()}) };
}
// Statický sdílený feed z GitHub Action (scripts/fetch-radar.js, ~15min cron) — 1 AI
// analýza pro všechny návštěvníky místo N klientů = N analýz stejné zprávy. Funguje
// bez jakéhokoli nastavení; když neexistuje/je starý, appka tiše spadne na klientský
// pipeline níž (Finnhub + RSS přímo z prohlížeče, jak fungovala dřív).
const STATIC_FEED_MAX_AGE_MS = 3*3600*1000;
async function fetchStaticFeed(){
  const r = await fetch('data/radar_feed.json?h='+Math.floor(Date.now()/900000), {cache:'no-store'});
  if(!r.ok) throw new Error('static '+r.status);
  const d = await r.json();
  if(!d || !Array.isArray(d.news) || !d.news.length) throw new Error('static empty');
  const age = Date.now()-new Date(d.updatedAt||0).getTime();
  if(!(age>=0) || age>STATIC_FEED_MAX_AGE_MS) throw new Error('static stale ('+Math.round(age/60000)+' min)');
  mergeHistory(d.news.map(n=>Object.assign({hid:n.hid||hashStr(normHeadline(n.headline))},n)));
  return { status:d.status||'live', error:d.error||'', news:d.news, conns:(d.conns&&d.conns.length)?d.conns:MOCK_CONNECTIONS, desk:d.desk||Object.assign({},MOCK_DESK,{updatedAt:new Date().toISOString()}) };
}
// Sdílenou historii/heat mapu i automatické seanční reporty ze serveru natáhni jen
// jednou při startu appky (ne při každém refreshi) — jsou to doplňková, ne primární data.
let staticExtrasLoaded=false;
async function loadStaticExtrasOnce(){
  if(staticExtrasLoaded) return; staticExtrasLoaded=true;
  try{
    const r=await fetch('data/radar_hist.json?h='+Math.floor(Date.now()/1800000),{cache:'no-store'});
    if(r.ok){ const d=await r.json(); if(Array.isArray(d)&&d.length) mergeHistory(d); else if(d&&Array.isArray(d.items)) mergeHistory(d.items); }
  }catch(e){}
  try{
    const r=await fetch('data/radar_reports.json?h='+Math.floor(Date.now()/1800000),{cache:'no-store'});
    if(r.ok){ const d=await r.json(); if(d&&typeof d==='object'){ state.reports=Object.assign({},d,state.reports); LS.set('session_reports',state.reports); } }
  }catch(e){}
  // Ekonomický kalendář (konsensus/forecast/actual) — existující sdílený zdroj, plní ho
  // scripts/fetch-calendar.js (GitHub Action, ~15 min) do data/calendar.json. Tab „Výhledy" ho
  // jen čte, žádný nový scraping/fetch se nepřidává.
  try{
    const r=await fetch('data/calendar.json?h='+Math.floor(Date.now()/1800000),{cache:'no-store'});
    if(r.ok){ const d=await r.json(); if(d&&Array.isArray(d.events)) state.calendar=d.events; }
  }catch(e){}
}

/* ---------- refresh pipeline ---------- */
async function runRefresh(settings){
  if((settings.backendUrl||'').trim()){
    try{ return await fetchFromBackend(settings); }
    catch(e){
      // Backend selhal → nezamrzni na ukázce: spusť normální živý pipeline (Finnhub + RSS) a vysvětli důvod
      const r = await runRefresh(Object.assign({},settings,{backendUrl:''}));
      r.error = 'Backend nedostupný ('+e.message+') — přepnuto na živé zprávy (Finnhub + RSS). Pokud jsi „Backend URL" nevyplnil schválně, vymaž ho v ⚙️ Nastavení.' + (r.error? ' · '+r.error : '');
      return r;
    }
  }
  // Sdílený statický feed (GitHub Action) — jen když si uživatel nenastavil vlastní RSS
  // (jinak by mu appka tiše ignorovala jeho výběr zdrojů).
  if(!(settings.rssFeeds||'').trim()){
    try{ return await fetchStaticFeed(); }
    catch(e){ /* tichý fallback níž — statický feed je bonus navíc, ne požadavek */ }
  }
  // VŽDY zkus načíst reálné zprávy (uživatelův zdroj nebo výchozí RSS)
  let raw;
  try{ raw = await fetchRawNews(settings); }
  catch(e){ raw = []; }
  if(!raw.length)
    return { status:'mock', error:'Nepodařilo se načíst živé zprávy (offline / zdroj nedostupný) — zobrazuji ukázku.', news:MOCK_NEWS.slice().sort((a,b)=>b.score-a.score), conns:MOCK_CONNECTIONS, desk:MOCK_DESK };

  raw = raw.slice(0, settings.maxItems||14);

  // Bez AI klíče (nebo dočasná pauza po vyčerpání free limitu) → režim „živé titulky"
  const hasAI = !!(settings.apiKey || settings.geminiKey);
  const coolLeft = hasAI ? Math.max(0, (LS.get('ai_cooldown',0))-Date.now()) : 0;
  if(!hasAI || coolLeft>0){
    const mins=Math.ceil(coolLeft/60000);
    const aiMsg = coolLeft>0
      ? 'AI pozastavena — vyčerpaný free limit OpenRouteru. Sama to zkusí znovu cca za '+mins+' min.'
      : 'AI komentář je vypnutý. Vlož OpenRouter klíč v Nastavení a získáš interpretaci dopadu, skóre, souvislosti i šéfredaktora.';
    const items = raw.map(it=>{ const qc=quickCat(it.headline); return Object.assign({},it,{
      hid:hashStr(normHeadline(it.headline)), cat:qc[0], cb:qc[1],
      ai:aiMsg,
      story:'', affects:quickAffects(it.headline), score:clampScore(scoreFloor(it.headline)||3), milestone:quickMilestone(it.headline)
    }); });
    items.sort((a,b)=> b.score-a.score || new Date(b.publishedAt||0)-new Date(a.publishedAt||0));
    mergeHistory(items);
    const err = coolLeft>0 ? 'Free AI limit OpenRouteru je vyčerpaný (429). Běží živé titulky; AI se sama zkusí obnovit za '+mins+' min. NEJLEPŠÍ řešení: vlož v ⚙️ Nastavení Google Gemini klíč (free ~1500/den, bez karty) — limit zmizí. Případně dobij $10 na openrouter.ai/credits.' : '';
    return { status:'headlines', error:err, news:items, conns:buildConnectionsFromNews(items), desk:buildDeskFromNews(items) };
  }

  // S klíčem → plná AI analýza (cache + dávka)
  const cache=getCache(), toAnalyze=[], analyzed=[];
  for(const it of raw){
    const key=hashStr(normHeadline(it.headline));
    if(cache[key]) analyzed.push(Object.assign({},it,{hid:key},cache[key]));
    else toAnalyze.push(Object.assign({},it,{hid:key}));
  }
  if(toAnalyze.length){
    try{
      const res = await analyzeBatch(toAnalyze, settings);
      toAnalyze.forEach((it,idx)=>{
        const a = res.find(x=>x&&x.i===idx+1) || res[idx] || {};
        const rec = {
          cat: CATEGORIES.indexOf(a.cat)>=0? a.cat : 'TRH',
          cb: !!a.cb,
          cs: (a.cs && String(a.cs).trim()) ? String(a.cs).trim() : '',
          ai: a.ai || 'Bez interpretace.',
          story: a.story || '',
          affects: Array.isArray(a.affects)? a.affects.filter(p=>Array.isArray(p)&&INSTRUMENTS.indexOf(p[0])>=0) : [],
          score: clampScore(Math.max(Number(a.score)||0, scoreFloor(it.headline))),
          milestone: MILESTONE_TYPES.indexOf(a.milestone)>=0 ? a.milestone : quickMilestone(it.headline),
          analyzedAt: new Date().toISOString()
        };
        cache[it.hid]=rec;
        analyzed.push(Object.assign({},it,rec));
      });
      setCache(cache);
    }catch(e){
      // AI selhala → nezahazuj zprávy: degraduj na „živé titulky" + ukaž konkrétní důvod
      if((e.message||'').indexOf('429')>=0) LS.set('ai_cooldown', Date.now()+15*60*1000); // vyčerpaný limit → pauza, ať to neplýtvá ani nenervuje
      const items = raw.map(it=>{ const key=hashStr(normHeadline(it.headline));
        if(cache[key]) return Object.assign({},it,{hid:key},cache[key]);
        const qc=quickCat(it.headline);
        return Object.assign({},it,{ hid:key, cat:qc[0], cb:qc[1], cs:'', ai:'AI dočasně nedostupná na tomto zařízení — zobrazen titulek bez interpretace.', story:'', affects:quickAffects(it.headline), score:clampScore(scoreFloor(it.headline)||3), milestone:quickMilestone(it.headline) });
      });
      items.sort((a,b)=> b.score-a.score || new Date(b.publishedAt||0)-new Date(a.publishedAt||0));
      mergeHistory(items);
      const m=e.message||'';
      const gem = !!settings.geminiKey;
      const tip = (m.indexOf('503')>=0||m.indexOf('500')>=0) ? 'AI server je dočasně PŘETÍŽENÝ ('+(m.indexOf('503')>=0?'503':'500')+') — to je jen chvilkové, NENÍ to klíčem. Dej za chvíli ↻ Obnovit; appka už to sama párkrát zkouší.'
        : m.indexOf('402')>=0 ? 'OpenRouter účet nemá KREDIT (402). Vlož raději Google Gemini klíč (free ~1500/den) v Nastavení, nebo dobij na openrouter.ai/credits.'
        : m.indexOf('401')>=0 ? (gem?'Neplatný Gemini klíč (401/403) — zkontroluj na aistudio.google.com/apikey.':'Neplatný OpenRouter klíč (401) — zkontroluj/přegeneruj na openrouter.ai/keys.')
        : m.indexOf('429')>=0 ? (gem?'Překročen krátkodobý limit Gemini (429, ~10/min) — chvíli počkej a dej Obnovit.':'Překročen limit (429). TIP: vlož v Nastavení Google Gemini klíč (free ~1500/den) — limit zmizí.')
        : m.indexOf('403')>=0 ? (gem?'Gemini klíč odepřen (403) — zkontroluj klíč / povolení API na aistudio.google.com.':'Přístup odepřen (403) — klíč nebo zvolený model není dostupný.')
        : /network|cors|failed to fetch|load failed/i.test(m) ? 'Požadavek blokuje síť nebo rozšíření v prohlížeči (CORS) — zkus jiný prohlížeč / vypni blokátor.'
        : 'Zkontroluj AI klíč a zvolený model v ⚙️ Nastavení.';
      return { status:'headlines', error:'AI dočasně nedostupná ('+m+'). '+tip+' Zatím běží živé titulky.', news:items, conns:buildConnectionsFromNews(items), desk:buildDeskFromNews(items) };
    }
  }
  analyzed.sort((a,b)=> b.score-a.score || new Date(b.publishedAt||0)-new Date(a.publishedAt||0));
  mergeHistory(analyzed);
  // Souvislosti + šéfredaktor stojí AI volání. Generuj je JEN když přibyly nové zprávy
  // nebo je uložená verze starší než 30 min — jinak šetři free limit a použij uloženou.
  const lastDesk=LS.get('last_desk',null), lastConns=LS.get('last_conns',null);
  const deskAge = (lastDesk&&lastDesk.updatedAt) ? Date.now()-new Date(lastDesk.updatedAt).getTime() : Infinity;
  let conns, desk;
  if(toAnalyze.length>0 || !lastDesk || deskAge>30*60*1000){
    try{ conns = await generateConnections(analyzed, settings); }catch(e){ conns=lastConns||[]; }
    try{ desk  = await generateDesk(analyzed, settings); }catch(e){ desk=lastDesk||null; }
    if(conns&&conns.length) LS.set('last_conns',conns);
    if(desk) LS.set('last_desk',desk);
  } else { conns=lastConns||[]; desk=lastDesk; }
  return { status:'live', news:analyzed, conns:(conns&&conns.length)?conns:buildConnectionsFromNews(analyzed), desk:desk||buildDeskFromNews(analyzed) };
}

function topicHash(n){ const s=n.hid||n.headline||''; let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }

const CAT_TOPIC = {

  'MAKRO':['Wall Street','Financial District, Manhattan','Container ship','Federal Reserve Bank of New York','Port of Long Beach','Shipping container'],

};
// literal pair in the headline (e.g. "USDCAD", "USD/CAD") wins — keeps base/quote order for a proper pair composite
function pickPairFromHeadline(h){
  h=h||'';
  for(const p of PAIRS){
    const b=p.slice(0,3), q=p.slice(3,6);
    if(new RegExp('\\b'+b+'\\s*[/-]?\\s*'+q+'\\b','i').test(h)) return [b,q];
  }
  return null;
}
// falls back to whichever 1-2 currencies are actually named/affected, order not guaranteed
function pickCurrencies(n){
  const direct=pickPairFromHeadline(n.headline);
  if(direct) return direct;
  const h=n.headline||'', found=[];
  for(const c of Object.keys(FLAG_CC)) if(new RegExp('\\b'+c+'\\b','i').test(h)) found.push(c);
  if(found.length<2) (n.affects||[]).forEach(a=>{ if(FLAG_CC[a[0]] && found.indexOf(a[0])<0) found.push(a[0]); });
  return found.slice(0,2);
}
function articleTopic(n){
  const h=n.headline||'';
  for(const e of ENTITY_TOPICS) if(e[0].test(h)) return pickFromPool(e[1],n);
  const curs=pickCurrencies(n);
  if(curs.length===1 && CUR_TOPICS[curs[0]]) return pickFromPool(CUR_TOPICS[curs[0]],n);
  return pickFromPool(CAT_TOPIC[n.cat]||CAT_TOPIC['TRH'],n);
}
// The summary REST API only ever returns its own small default thumbnail (~320px, sometimes less),
// and guessing/rewriting the size out of its URL is unreliable (some thumb URLs don't even encode
// a width). The MediaWiki action API's `pithumbsize` parameter asks Wikipedia to render the
// thumbnail at the size we actually need (960px, capped to the source's real resolution — never
// upscaled/broken), which is what was making these photos look soft/blurry in the wider card.
// Cache key bumped (_v2) so stale low-res URLs cached by earlier visitors get refetched once.
async function wikiThumb(title){
  const cache=LS.get('wikiimg_cache_v2',{});
  const rec=cache[title];
  if(rec && (Date.now()-(rec.t||0))<30*24*3600*1000) return rec.url||'';
  let url='';
  try{
    const r=await fetch('https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=960&format=json&origin=*&titles='+encodeURIComponent(title));
    if(r.ok){
      const d=await r.json();
      const pages=d.query&&d.query.pages;
      if(pages){ const p=Object.values(pages)[0]; url=(p&&p.thumbnail&&p.thumbnail.source)||''; }
    }
  }catch(e){}
  cache[title]={url,t:Date.now()}; LS.set('wikiimg_cache_v2',cache);
  return url;
}
// resolves n.fallbackImages (pair -> two flags; otherwise one topical Wikipedia photo) for every item lacking a real n.image
async function enrichImages(items){
  const need=new Map();
  items.forEach(n=>{
    if(n.image || n.fallbackImages) return;
    const curs=pickCurrencies(n);
    if(curs.length>=2){ n.fallbackImages=curs.map(c=>flagUrl(FLAG_CC[c])); return; }
    const topic=articleTopic(n);
    n._topic=topic;
    if(!need.has(topic)) need.set(topic, wikiThumb(topic));
  });
  const entries=Array.from(need.entries());
  if(!entries.length) return;
  const urls=await Promise.all(entries.map(e=>e[1]));
  const map={}; entries.forEach((e,i)=>{ map[e[0]]=urls[i]; });
  items.forEach(n=>{ if(!n.image && !n.fallbackImages && n._topic){ const u=map[n._topic]; n.fallbackImages = u?[u]:[]; } });
}

  const isWikiFallback = imgs.length===1 && /wikimedia|wikipedia/i.test(imgs[0]);
  if(imgs.length>=2){
    return '<div class="dualflag">'+

      '</div>';
  }
  return '<img src="'+esc(imgs[0])+'" alt="" loading="lazy" onerror="this.onerror=null;this.src=\''+esc(FINAL_FALLBACK_IMG)+'\';">'+

function riverSVG(buckets){
  const w=560,h=140,pad=8, gap=(w-pad*2)/buckets.length, barW=gap*0.56;
  const max=Math.max(1,...buckets.map(b=>Math.max(b.pos,b.neg)));
  const midY=h/2, halfH=midY-18;
  let bars='', labels='';
  buckets.forEach((b,i)=>{
    const cx=pad+gap*i+gap/2;
    const ph=(b.pos/max)*halfH, nh=(b.neg/max)*halfH;
    bars+='<rect x="'+(cx-barW/2).toFixed(1)+'" y="'+(midY-ph).toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+ph.toFixed(1)+'" rx="2" style="fill:var(--pos)"/>';
    bars+='<rect x="'+(cx-barW/2).toFixed(1)+'" y="'+midY.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+nh.toFixed(1)+'" rx="2" style="fill:var(--neg)"/>';
    const dl=b.label.toLocaleDateString('cs-CZ',{weekday:'short'}).replace('.','');
    labels+='<text x="'+cx.toFixed(1)+'" y="'+(h-4)+'" text-anchor="middle" font-size="9.5" style="fill:var(--txt-faint)" font-family="var(--mono)">'+dl+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><line x1="'+pad+'" y1="'+midY+'" x2="'+(w-pad)+'" y2="'+midY+'" style="stroke:var(--line)" stroke-width="1"/>'+bars+labels+'</svg>';
}

/* ============================================================
   VÝHLEDY — čte existující sdílený ekonomický kalendář (data/calendar.json,
   plní scripts/fetch-calendar.js), žádný nový scraping. Fed „očekávání" je
   tržní konsensus z kalendáře (ForexFactory), NE CME FedWatch pravděpodobnost

function parseNumLike(s){
  if(s==null) return null;
  s=String(s).trim(); if(!s) return null;
  const neg = /^-/.test(s);
  let v = s.replace(/[,%()$]/g,'').replace(/^-/,'');
  let mult=1;
  if(/[kK]$/.test(v)){ mult=1e3; v=v.slice(0,-1); }
  else if(/[mM]$/.test(v)){ mult=1e6; v=v.slice(0,-1); }
  else if(/[bB]$/.test(v)){ mult=1e9; v=v.slice(0,-1); }
  const n=parseFloat(v);
  if(isNaN(n)) return null;
  return (neg?-1:1)*n*mult;
}
function classifySurprise(actual, forecast){
  const a=parseNumLike(actual), f=parseNumLike(forecast);
  if(a===null || f===null) return null;
  if(Math.abs(a-f) < Math.max(Math.abs(f)*0.001, 0.0005)) return 'inline';
  return a>f ? 'beat' : 'miss';
}
function fedRateSnapshot(){
  const events=state.calendar.filter(e=> e.country==='USD' && /^federal funds rate$/i.test((e.title||'').trim()));
  const now=Date.now();
  const decided=events.filter(e=>e.actual).sort((a,b)=> new Date(b.date)-new Date(a.date))[0];
  const upcoming=events.filter(e=> new Date(e.date).getTime()>=now).sort((a,b)=> new Date(a.date)-new Date(b.date))[0];
  return { current: decided?decided.actual:'', next: upcoming||null };
}
function upcomingCalEvents(days){
  const now=Date.now(), until=now+days*24*3600*1000;
  return state.calendar.filter(e=>{ const t=new Date(e.date).getTime(); return t>=now && t<=until && (e.impact==='High'||e.impact==='Medium'); })
    .sort((a,b)=> new Date(a.date)-new Date(b.date)).slice(0,25);
}
function recentReleasedEvents(days){
  const now=Date.now(), since=now-days*24*3600*1000;
  return state.calendar.filter(e=>{ const t=new Date(e.date).getTime(); return t>=since && t<=now && e.actual && e.impact==='High'; })

  const modelOpt=(v,l)=>'<option value="'+v+'"'+((s.model||'openai/gpt-4o-mini')===v?' selected':'')+'>'+l+'</option>';
  const intOpt=(v,l)=>'<option value="'+v+'"'+((s.interval||5)===v?' selected':'')+'>'+l+'</option>';
  const maxOpt=(v,l)=>'<option value="'+v+'"'+((s.maxItems||14)===v?' selected':'')+'>'+l+'</option>';
  const sqOpt=(v,l)=>'<option value="'+v+'"'+((Number(s.squawkMin)||8)===v?' selected':'')+'>'+l+'</option>';
  return '<div class="col" style="grid-column:1/-1"><div class="sec-head"><h2>Nastavení</h2></div><div class="set">'+
    '<div class="notice">'+ico('info')+'<span>Appka automaticky čte <b>sdílený feed</b>, který na serveru (GitHub Action) každých ~15 min stahuje a AI analyzuje <em>jednou pro všechny</em> — nic tu není potřeba nastavovat. Vlastní OpenRouter/Gemini klíč níže appka použije jen jako záložní klientský pipeline, kdyby sdílený feed nebyl dostupný/aktuální. Ukázková (mock) data se zobrazí jen když selže úplně vše.</span></div>'+
    '<div class="field"><label>Backend URL (volitelné — nech PRÁZDNÉ)</label><input type="text" id="set-backendUrl" value="'+esc(s.backendUrl||'')+'" placeholder="nech prázdné"><div class="hint">Sdílený feed (data/radar_feed.json z GitHub Action) se načítá automaticky bez vyplnění. Tohle pole vyplň POUZE pokud si běžíš úplně vlastní server s jiným /api/feed. Pozor: CSP appky povoluje jen předem vyjmenované domény — vlastní server musí být na stejné doméně jako appka nebo v allowlistu, jinak ho prohlížeč zablokuje.</div></div>'+
    '<div class="field"><label>OpenRouter API klíč '+(s.apiKey?'<span style="color:var(--pos)">● vyplněn → AI zapnutá</span>':'<span style="color:var(--txt-faint)">● prázdný → AI vypnutá (běží jen živé titulky)</span>')+'</label><input type="password" id="set-apiKey" value="'+esc(s.apiKey||'')+'" placeholder="sk-or-v1-… (nepovinné)"><div class="hint">Bez klíče vidíš reálné dnešní titulky s odkazy. Klíč přidá AI komentář, skóre, souvislosti a šéfredaktora. Vytvoříš na openrouter.ai/keys.</div></div>'+
    '<div class="field"><label>AI model (NENÍ to klíč — jen volba „mozku")</label><select id="set-model">'+
      '<optgroup label="ZDARMA (bez kreditu)">'+modelOpt('meta-llama/llama-3.3-70b-instruct:free','Llama 3.3 70B — ZDARMA')+modelOpt('deepseek/deepseek-r1:free','DeepSeek R1 — ZDARMA')+modelOpt('google/gemini-2.0-flash-exp:free','Gemini 2.0 Flash — ZDARMA')+'</optgroup>'+
      '<optgroup label="Placené (vyžadují kredit)">'+modelOpt('openai/gpt-4o-mini','openai/gpt-4o-mini (levný)')+modelOpt('openai/gpt-4o','openai/gpt-4o')+modelOpt('anthropic/claude-3.5-sonnet','anthropic/claude-3.5-sonnet')+modelOpt('google/gemini-1.5-flash','google/gemini-1.5-flash')+'</optgroup>'+
      '</select><div class="hint"><b>Chyba 402 = účet nemá kredit.</b> Placené modely (gpt-4o…) potřebují dobitý kredit na openrouter.ai/credits. <b>Zdarma</b> jeď s modelem končícím na <code>:free</code> (nahoře) — limit ~20/min a ~50/den. Aktuální free modely: openrouter.ai/models?max_price=0 → ID vlož níže.</div><input type="text" id="set-modelCustom" style="margin-top:7px" value="" placeholder="vlastní model ID, např. ...:free (volitelné)"></div>'+
    '<div class="field"><label>Google Gemini API klíč — AI ZDARMA ~1500/den '+(s.geminiKey?'<span style="color:var(--pos)">● vyplněn → Gemini aktivní (má přednost)</span>':'<span style="color:var(--imp-md)">● doporučeno (obejde limit OpenRouteru)</span>')+'</label><input type="password" id="set-geminiKey" value="'+esc(s.geminiKey||'')+'" placeholder="AIza… (zdarma, bez karty)"><div class="hint"><b>Nejštědřejší free AI:</b> ~1500 zpráv/den (vs OpenRouter 50/den), bez platební karty. Když je vyplněný, appka ho použije <b>místo OpenRouteru</b>. Klíč zdarma: <b>aistudio.google.com/apikey</b> → „Create API key". Model: gemini-2.5-flash (Flash je ve free tieru).</div></div>'+
    '<div class="field"><label>Finnhub API klíč — hlavní zdroj zpráv '+(s.finnhubKey?'<span style="color:var(--pos)">● vyplněn → Finnhub aktivní</span>':'<span style="color:var(--imp-md)">● doporučeno vyplnit</span>')+'</label><input type="password" id="set-finnhubKey" value="'+esc(s.finnhubKey||'')+'" placeholder="d1abcd… (zdarma na finnhub.io)"><div class="hint"><b>News endpoint je ZDARMA</b> (free tier, 60 volání/min) — narozdíl od ekonomického kalendáře, který je placený. Vrací <b>skutečná média</b> u každého článku (Reuters, Bloomberg…), takže funguje tiering i slučování („Ověřeno · N zdrojů"). <b>Můžeš použít stejný klíč jako v analyzeru.</b> Načítá kategorie general + forex (zaměřeno na měny, bez krypta).</div></div>'+
    '<div class="field"><label>RSS feedy (zdroj zpráv + analýzy)</label><textarea id="set-rssFeeds" placeholder="Nech PRÁZDNÉ → načte se automaticky ověřená sada níže. Nebo sem dej vlastní URL (jeden na řádek).">'+esc(s.rssFeeds||'')+'</textarea><div class="btn-row" style="margin-top:6px"><button class="btn ghost" id="set-rssDefaults" style="padding:7px 12px;font-size:11px">Vložit doporučené zdroje</button></div><div class="hint"><b>Nemusíš nic zadávat ručně</b> — když je pole prázdné, načte se automaticky ověřená sada: zprávy (ForexLive, FXStreet, Investing, MarketWatch) + <b>analýzy/výhledy</b> (FXStreet Analysis, DailyForex Technical &amp; Fundamental) + geopolitika (Al Jazeera). Tlačítko výše ti je předvyplní, ať je vidíš a můžeš upravit. Analytické články mají odznak ANA. rss2json (CORS), max 8 feedů.</div></div>'+
    '<div class="field"><label>Max. zpráv k analýze / refresh</label><select id="set-maxItems">'+maxOpt(8,'8 (nejlevnější)')+maxOpt(14,'14 (doporučeno)')+maxOpt(20,'20')+'</select><div class="hint">Analyzuje se dávkově v jednom AI volání. Známé titulky se berou z cache.</div></div>'+
    '<div class="field"><label>Sledované zdroje (vizuální filtr)</label><div class="src-grid">'+sources+'</div></div>'+
    '<div class="field"><label>Oficiální zdroje centrálních bank — Tier 1</label><div class="src-grid">'+cbSources+'</div><div class="hint">Tiskové zprávy přímo z Fedu/ECB/BoE, stahují se navíc vedle Finnhubu a RSS výše — SOURCE_TIERS je řadí jako nejdůvěryhodnější (Tier 1). Vypnutím se pro tebe daný zdroj přestane stahovat v klientském fallbacku (sdílený feed ze serveru je stahuje vždy pro všechny).</div></div>'+
    '<div class="field"><label>Interval obnovení</label><select id="set-interval">'+intOpt(1,'každou 1 minutu')+intOpt(5,'každých 5 minut')+intOpt(15,'každých 15 minut')+intOpt(0,'jen ručně')+'</select></div>'+
    '<div class="field"><label>Audio squawk — práh hlasitého čtení</label><select id="set-squawkMin">'+sqOpt(7,'skóre 7+ (víc zpráv)')+sqOpt(8,'skóre 8+ (doporučeno)')+sqOpt(9,'skóre 9+ (jen klíčové)')+'</select><div class="hint">Když je squawk zapnutý (tlačítko v hlavičce), hlas přečte nově příchozí zprávy s tímhle skóre a výš. Po otevření/zapnutí se backlog nečte — jen nové. <button class="btn ghost" id="set-squawkTest" style="padding:5px 10px;font-size:11px;margin-top:6px">'+ico('soundOn')+'Test hlasu</button></div></div>'+
    '<div class="btn-row"><button class="btn" id="set-save">Uložit nastavení</button><button class="btn ghost" id="set-refresh">'+ico('refresh')+'Obnovit zprávy teď</button><button class="btn ghost" id="set-clear">'+ico('trash')+'Vymazat historii &amp; cache</button><span class="saved" id="set-saved" style="display:none">'+ico('check')+'uloženo</span></div>'+
    '</div></div>';
}

function viewHTML(){
  switch(state.tab){
    case 'feed': return feedHTML();
    case 'conn': return connHTML();
    case 'out':  return outHTML();
    case 'hist': return histHTML();
    case 'rep':  return repHTML();
    case 'set':  return setHTML();
    default: return feedHTML();
  }
}

/* ============================================================
   MOUNT + EVENTS
   ============================================================ */
function mount(){
  document.getElementById('app').innerHTML =
    '<aside class="sidebar">'+
      '<div class="masthead"><div class="markrow"><div class="logo"><span class="grid"></span><span class="sweep"></span><span class="core"></span></div><b>Vydání živě</b></div>'+
        '<h1>Market Radar</h1><div class="tagline">AI finanční redakce — makro, centrální banky a měnový mediální obraz v jednom pohledu.</div></div>'+
      '<nav class="tabs" id="nav">'+TABS.map(t=>'<button data-tab="'+t[0]+'" class="'+(state.tab===t[0]?'on':'')+'"><span class="t">'+t[1]+'</span><span class="d">'+t[2]+'</span></button>').join('')+'</nav>'+
      '<div class="legend"><b>Jak číst barvy</b>'+
        '<div class="row"><i style="background:var(--acc)"></i>živé / nové — accent</div>'+
        '<div class="row"><i style="background:var(--imp-md)"></i>důležitost — střední</div>'+
        '<div class="row"><i style="background:var(--imp-hi)"></i>důležitost — vysoká</div>'+
        '<div class="row"><i style="background:var(--imp-max)"></i>důležitost — klíčová</div>'+
        '<div class="row"><i style="background:var(--pos)"></i>pozitivní zmínka v médiích</div>'+
        '<div class="row"><i style="background:var(--neg)"></i>negativní zmínka v médiích</div></div>'+
      '<div class="side-foot"><button class="theme-btn" id="themeBtn" title="Přepnout světlý / tmavý režim" aria-label="Přepnout režim"></button><div class="side-ver">AI Market Radar</div></div>'+
    '</aside>'+
    '<div class="workspace">'+
      '<header class="topbar">'+
        '<div class="ticker" id="ticker" title="Tečka = existuje dnes důležitá pozitivní/negativní zpráva pro instrument. Není to live cena ani obchodní signál.">'+tickerHTML()+'</div>'+
        '<div class="status"><div class="clock" id="clock"></div><span id="squawkwrap">'+squawkBtnHTML()+'</span><span id="pillwrap">'+pillHTML()+'</span></div>'+
      '</header>'+
      '<main id="main">'+viewHTML()+'</main>'+
      '<footer><span>AI Market Radar</span><span class="disc">Informační a vzdělávací nástroj. Negeneruje obchodní signály, vstupy ani doporučení. Každý si dělá vlastní závěr. Ilustrace jsou generovány algoritmicky z dat článku, nejde o fotografie ze zdroje.</span></footer>'+
    '</div>';
  bindView();
  bindSquawk();
  bindTheme();
  applyTheme(currentTheme());
  startClock();
}
function currentTheme(){ return document.documentElement.getAttribute('data-theme') || LS.get('theme','dark'); }
function applyTheme(t){ t = (t==='light')?'light':'dark'; document.documentElement.setAttribute('data-theme',t); LS.set('theme',t); const b=$('#themeBtn'); if(b){ b.innerHTML = (t==='light'?ico('moon'):ico('sun'))+(t==='light'?'Tmavý režim':'Světlý režim'); b.title = t==='light'?'Přepnout na tmavý režim':'Přepnout na světlý režim'; } }
function bindTheme(){ const b=$('#themeBtn'); if(b) b.onclick=()=>applyTheme(currentTheme()==='light'?'dark':'light'); }
function repaintMain(){ $('#main').innerHTML=viewHTML(); bindView(); $$('#nav button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-tab')===state.tab)); }
function repaintHeader(){ const p=$('#pillwrap'); if(p) p.innerHTML=pillHTML(); const t=$('#ticker'); if(t) t.innerHTML=tickerHTML(); }
function repaintSquawk(){ const w=$('#squawkwrap'); if(w){ w.innerHTML=squawkBtnHTML(); bindSquawk(); } }
function bindSquawk(){
  const b=$('#squawkBtn'); if(!b) return;
  b.onclick=()=>{
    state.settings.squawk=!state.settings.squawk; LS.set('settings',state.settings);
    if(state.settings.squawk){ seedSpoken(); ttsSpeak('Audio squawk zapnut. Budu číst zprávy se skóre '+(state.settings.squawkMin||8)+' a výš.'); }
    else { try{ window.speechSynthesis.cancel(); }catch(e){} }
    repaintSquawk(); if(state.tab==='set') repaintMain();
  };
}
function repaintFeedList(){ const el=$('#feed-list'); if(el) el.innerHTML=feedListHTML(); const meta=$('#main .sec-head .meta'); if(meta&&!state.loading) meta.textContent=filterList().length+' z '+state.news.length+' zpráv · řazeno dle důležitosti'; }

function startClock(){
  const upd=()=>{ const c=$('#clock'); if(c) c.textContent=new Date().toLocaleString('cs-CZ',{weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}); };
  upd(); setInterval(upd,1000);
}

function readSettingsForm(){
  const g=id=>{ const el=$('#'+id); return el?el.value:''; };
  const custom=g('set-modelCustom').trim();
  const ns=Object.assign({},state.settings,{
    backendUrl:g('set-backendUrl').trim(),
    apiKey:g('set-apiKey').trim(),
    model: custom || g('set-model'),
    geminiKey:g('set-geminiKey').trim(),
    finnhubKey:g('set-finnhubKey').trim(),
    rssFeeds:g('set-rssFeeds'),
    maxItems:Number(g('set-maxItems'))||14,
    interval:Number(g('set-interval')),
    squawkMin:Number(g('set-squawkMin'))||8
  });
  return ns;
}

function bindView(){
  // nav
  $$('#nav button').forEach(b=> b.onclick=()=>{ state.tab=b.getAttribute('data-tab'); repaintMain(); });

  if(state.tab==='feed'){
    const q=$('#f-q'); if(q) q.oninput=()=>{ state.filter.q=q.value; repaintFeedList(); };
    const cat=$('#f-cat'); if(cat) cat.onchange=()=>{ state.filter.cat=cat.value; repaintFeedList(); };
    const inst=$('#f-inst'); if(inst) inst.onchange=()=>{ state.filter.inst=inst.value; repaintFeedList(); };
    const min=$('#f-min'); if(min) min.onchange=()=>{ state.filter.min=Number(min.value); repaintFeedList(); };
    const today=$('#f-today'); if(today) today.onclick=()=>{ state.filter.today=!state.filter.today; today.classList.toggle('on',state.filter.today); repaintFeedList(); };
    const ana=$('#f-ana'); if(ana) ana.onclick=()=>{ state.filter.ana=!state.filter.ana; ana.classList.toggle('on',state.filter.ana); repaintFeedList(); };
    const cot=$('#f-cot'); if(cot) cot.onclick=()=>{ state.filter.cot=!state.filter.cot; cot.classList.toggle('on',state.filter.cot); repaintFeedList(); };
  }
  if(state.tab==='conn'){}
  if(state.tab==='hist'){ $$('[data-hist]').forEach(b=> b.onclick=()=>{ const c=b.getAttribute('data-hist'); state.histSel = state.histSel===c?null:c; repaintMain(); }); }
  if(state.tab==='out'){ $$('[data-genrise]').forEach(b=> b.onclick=()=> genSurpriseComment(b.getAttribute('data-genrise'))); }
  if(state.tab==='rep'){
    $$('[data-rep]').forEach(b=> b.onclick=()=>{ state.repTab=b.getAttribute('data-rep'); repaintMain(); });
    $$('[data-genrep]').forEach(b=> b.onclick=()=> genSessionReport(b.getAttribute('data-genrep')));
    // Auto-přehled: po otevření seance se report vygeneruje sám (má-li zprávy, klíč a ještě není hotový).
    // U „Celý den" se navíc přegeneruje, když během dne přibyly novější zprávy než minulý report.
    const cur=SESSIONS.find(x=>x[0]===state.repTab)||SESSIONS[0];
    const hasKey=state.settings.apiKey||state.settings.geminiKey;
    const inRangeNews=state.news.filter(n=>{ if(!isTodayIso(n.publishedAt)) return false; const h=new Date(n.publishedAt).getHours(); return h>=cur[2]&&h<cur[3]; });
    const saved=state.reports[repKey(cur[0])];
    let needGen=!saved;
    if(saved && cur[0]==='allday' && inRangeNews.length){
      const newest=inRangeNews.reduce((m,n)=>Math.max(m,new Date(n.publishedAt||0).getTime()),0);
      if(newest > new Date(saved.generatedAt||0).getTime()) needGen=true; // přibyly novější zprávy → osvěž celodenní přehled
    }
    if(hasKey && inRangeNews.length && needGen && !state.repLoading){ setTimeout(()=>genSessionReport(cur[0], true), 60); }
  }
  if(state.tab==='set'){
    $$('[data-src]').forEach(t=> t.onclick=()=>{ const name=t.getAttribute('data-src'); state.settings.sources=state.settings.sources||{}; state.settings.sources[name]=!(state.settings.sources[name]!==false); t.classList.toggle('on'); });
    const save=$('#set-save'); if(save) save.onclick=()=>{ state.settings=readSettingsForm(); LS.set('settings',state.settings); LS.set('ai_cooldown',0); const sv=$('#set-saved'); if(sv) sv.style.display='inline'; setupAutoRefresh(); refresh(); };
    const rf=$('#set-refresh'); if(rf) rf.onclick=()=>{ state.settings=readSettingsForm(); LS.set('settings',state.settings); LS.set('ai_cooldown',0); refresh(); };
    const cl=$('#set-clear'); if(cl) cl.onclick=()=>{ LS.set('history',[]); LS.set('analysis_cache',{}); state.heat={USD:0,EUR:0,GBP:0,JPY:0,AUD:0,CAD:0,CHF:0,NZD:0}; alert('Historie a cache vymazány.'); };
    const rd=$('#set-rssDefaults'); if(rd) rd.onclick=()=>{ const ta=$('#set-rssFeeds'); if(ta){ ta.value=DEFAULT_RSS.join('\n'); ta.focus(); } };
    const sqt=$('#set-squawkTest'); if(sqt) sqt.onclick=()=>{ const min=Number(($('#set-squawkMin')||{}).value)||state.settings.squawkMin||8; ttsSpeak('Toto je ukázka hlasu audio squawku. Budu číst zprávy se skóre '+min+' a výš.'); };
  }
}

async function genSessionReport(sessionId, silent){
  const cur=SESSIONS.find(x=>x[0]===sessionId); if(!cur || state.repLoading) return;
  if(!(state.settings.apiKey || state.settings.geminiKey)){ if(!silent) alert('Pro AI report vlož OpenRouter nebo Gemini klíč v Nastavení.'); return; }
  const today=state.news.filter(n=>isTodayIso(n.publishedAt));
  const inRange=today.filter(n=>{ const h=new Date(n.publishedAt).getHours(); return h>=cur[2]&&h<cur[3]; }).sort((a,b)=> new Date(a.publishedAt||0)-new Date(b.publishedAt||0));
  if(!inRange.length){ if(!silent) alert('Tato seance zatím nemá dnešní zprávy.'); return; }
  state.repLoading=sessionId; if(state.tab==='rep') repaintMain();
  try{
    const rep=await generateSessionReport(inRange, cur[1], state.settings);
    if(rep && rep.summary){ state.reports[repKey(sessionId)]=Object.assign({generatedAt:new Date().toISOString()}, rep); LS.set('session_reports',state.reports); }
    else if(!silent) alert('AI nevrátila report, zkus to znovu.');
  }catch(e){ if(!silent) alert('Generování reportu selhalo: '+e.message); else console.warn('[report]', e.message); }
  state.repLoading='';
  if(state.tab==='rep') repaintMain();
}

/* ============================================================
   REFRESH + auto interval
   ============================================================ */
async function refresh(){
  state.loading=true; repaintHeader(); if(state.tab==='feed') repaintFeedList();
  const prevIds = new Set(state.news.map(n=>n.hid).filter(Boolean));
  try{
    await loadStaticExtrasOnce();
    const r=await runRefresh(state.settings);
    state.news=r.news||[]; state.conns=r.conns||[]; if(r.desk) state.desk=r.desk; state.status=r.status||'mock';
    try{ await enrichImages(state.news); }catch(e){}
    state.lastError = r.error || '';
    if(state.autoFreeNote){ state.lastError = state.autoFreeNote + (state.lastError? ' · '+state.lastError : ''); state.autoFreeNote=''; }
    const h=heatFromHistory(getHistory()); if(Object.keys(h).some(k=>h[k]!==0)) state.heat=h;
    if(r.error) console.warn('[AI Market Radar]', r.error);
    if(prevIds.size){
      const fresh=new Set(); state.news.forEach(n=>{ if(n.hid && !prevIds.has(n.hid) && isTodayIso(n.publishedAt)) fresh.add(n.hid); });
      state.freshIds=fresh;
      if(freshTimer) clearTimeout(freshTimer);
      if(fresh.size) freshTimer=setTimeout(()=>{ state.freshIds=new Set(); if(state.tab==='feed') repaintFeedList(); },3200);
    }
  }catch(e){ state.status='error'; state.lastError='Neočekávaná chyba: '+(e&&e.message||e); console.error(e); }
  state.loading=false;
  repaintHeader();
  try{ runSquawk(); }catch(e){}
  // nepřekresluj formulář Nastavení (zachová rozepsaný text); jinak překresli aktuální záložku
  if(state.tab!=='set') repaintMain();
}
function setupAutoRefresh(){
  if(refreshTimer){ clearInterval(refreshTimer); refreshTimer=null; }
  const iv=Number(state.settings.interval);
  if(iv>0) refreshTimer=setInterval(refresh, iv*60000);
}

/* ---------- boot ---------- */
document.documentElement.setAttribute('data-theme', LS.get('theme','dark'));
mount();
setupAutoRefresh();
refresh();

})();
</script>
