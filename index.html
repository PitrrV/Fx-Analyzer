      const orKey=localStorage.getItem("or_key")||"";
      if(!orKey){setError("Chybí OpenRouter API klíč — přidej ho v ⚙️ Settings (zdarma na openrouter.ai)");setLoading(false);return;}

      // ── Krok 1: Stáhni aktuální seznam free vision modelů z OpenRouter ──
      let visionModels=[];
      try{
        const mResp=await fetch("https://openrouter.ai/api/v1/models",{
          headers:{"Authorization":`Bearer ${orKey}`}
        });
        const mData=await mResp.json();
        visionModels=(mData.data||[])
          .filter(m=>m.id.endsWith(":free")&&(m.architecture?.modality||"").includes("image"))
          .sort((a,b)=>(b.context_length||0)-(a.context_length||0))
          .map(m=>m.id);
      }catch(e){console.warn("Models fetch failed:",e);}

      // ── Krok 2: Sestav seznam — manuální výběr + live modely + záloha ──
      const manualModel=localStorage.getItem("or_model")||"";
      const FALLBACK=["meta-llama/llama-3.2-11b-vision-instruct:free","meta-llama/llama-3.2-90b-vision-instruct:free","qwen/qwen-2-vl-7b-instruct:free"];
      const OR_MODELS=[manualModel,...visionModels,...FALLBACK]
        .filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);

      if(OR_MODELS.length===0){setError("OpenRouter nemá momentálně žádné free vision modely. Zkus to za chvíli.");setLoading(false);return;}

      // ── Krok 3: Zkus modely postupně ──
      let raw="",usedModel="",lastErr="";
      for(const model of OR_MODELS){
        try{
          const r=await fetch("https://openrouter.ai/api/v1/chat/completions",{
            method:"POST",
            headers:{"Content-Type":"application/json","Authorization":`Bearer ${orKey}`,"HTTP-Referer":"https://attrading.netlify.app","X-Title":"AT Trading FX Analyzer"},
            body:JSON.stringify({model,messages:[{role:"system",content:AI_SYSTEM_PROMPT},{role:"user",content:[{type:"image_url",image_url:{url:`data:${mt};base64,${b64}`}},{type:"text",text:ctx}]}],max_tokens:2048})
          });
          const d=await r.json();
          if(d.error){lastErr=`${model}: ${d.error.message||JSON.stringify(d.error)}`;continue;}
          const candidate=d.choices?.[0]?.message?.content||"";
          if(candidate){raw=candidate;usedModel=model;break;}
        }catch(e){lastErr=`${model}: ${e.message}`;continue;}
      }
      if(!raw) throw new Error("Žádný free vision model není momentálně dostupný. Zkus to znovu za pár minut nebo zvol model ručně v Settings.\nDetail: "+lastErr);
      console.log("✓ AI analýza dokončena, model:",usedModel);
      const clean=raw.replace(/```json|```/g,"").trim();
      const si=clean.indexOf("{"),ei=clean.lastIndexOf("}");
      const parsed=JSON.parse(si>=0&&ei>si?clean.slice(si,ei+1):clean);
      setResult(parsed);
      if(onSave&&parsed){onSave(selPair,tf,parsed);}
    }catch(e){setError("Analýza selhala: "+(e?.message||String(e)));}
    setLoading(false);
  }

  const biasColor=result?.bias==="BULLISH"?"var(--cmd-green)":result?.bias==="BEARISH"?"var(--cmd-red)":"#d29922";
  const inp={width:"100%",padding:"7px 10px",background:"#080d14",border:"1px solid #1d2a36",borderRadius:6,color:"#e6edf3",fontSize:12,outline:"none",fontFamily:"inherit"};

  return(
    <div style={{display:"grid",gridTemplateColumns:"300px 1fr",gap:14,alignItems:"start"}}>
      {/* ── LEFT: Controls ── */}
      <div style={{display:"flex",flexDirection:"column",gap:10}}>

        {/* Upload */}
        <div className="pro-card" style={{padding:14}}>
          <div className="pro-panel-title" style={{marginBottom:9}}>📊 Screenshot grafu</div>
          <div onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={onAIDrop}
            onClick={()=>aiFileRef.current?.click()}
            style={{border:`2px dashed ${drag?"var(--cmd-green)":imgSrc?"rgba(120,242,54,.4)":"#263242"}`,borderRadius:9,minHeight:imgSrc?0:110,padding:imgSrc?0:"18px 12px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",transition:"border-color .2s",background:drag?"rgba(120,242,54,.04)":"transparent",overflow:"hidden"}}>
            {imgSrc?<img src={imgSrc} alt="chart" style={{width:"100%",borderRadius:7,display:"block"}}/>
              :<><div style={{fontSize:24,marginBottom:5}}>📈</div><div style={{fontSize:11,color:"#8b949e",textAlign:"center"}}>Přetáhni screenshot<br/>nebo klikni pro výběr</div></>}
          </div>
          <input ref={aiFileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{if(e.target.files[0])handleAIFile(e.target.files[0]);e.target.value="";}}/>
          {imgSrc&&<button onClick={()=>{setImgSrc(null);setImgFile(null);setResult(null);}} style={{marginTop:4,background:"none",border:"none",color:"#8b949e",fontSize:10,cursor:"pointer"}}>✕ Odebrat</button>}
          <div style={{marginTop:6,fontSize:10,color:"#8b949e"}}>PNG · JPG · WebP · TradingView / MT4/5</div>
        </div>

        {/* Pair + TF */}
        <div className="pro-card" style={{padding:14}}>
          <div className="pro-panel-title" style={{marginBottom:9}}>⚙️ Parametry</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <div><div style={{fontSize:10,color:"#8b949e",marginBottom:3}}>PÁR</div>
              <select value={selPair} onChange={e=>setSelPair(e.target.value)} style={{...inp,cursor:"pointer"}}>
                {STANDARD_PAIRS.map(p=><option key={p.pair} value={p.pair}>{FLAGS[p.base]}{FLAGS[p.quote]} {p.pair}</option>)}
              </select></div>
            <div><div style={{fontSize:10,color:"#8b949e",marginBottom:3}}>TIMEFRAME</div>
              <select value={tf} onChange={e=>setTf(e.target.value)} style={{...inp,cursor:"pointer"}}>
                {TF_LIST.map(t=><option key={t} value={t}>{t}</option>)}
              </select></div>
          </div>
          <div><div style={{fontSize:10,color:"#8b949e",marginBottom:3}}>AKTUÁLNÍ CENA (volitelné)</div>
            <input value={price} onChange={e=>setPrice(e.target.value)} placeholder="1.08450" style={inp}/></div>
        </div>

        {/* Fund context auto-filled */}
        {pairData&&<div style={{background:"#0b1420",border:"1px solid #1d2a36",borderRadius:10,padding:12}}>
          <div style={{fontSize:10,color:"#8b949e",marginBottom:5}}>AUTO — FUNDAMENTÁLNÍ KONTEXT</div>
          <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:3}}>
            <span style={{fontSize:12,fontWeight:700}}>{FLAGS[pairData.base]}{FLAGS[pairData.quote]} {pairData.pair}</span>
            <span style={{fontWeight:900,color:pairData.dir==="BUY"?"var(--cmd-green)":"var(--cmd-red)"}}>{pairData.dir}</span>
            <span style={{fontSize:11,color:"#8b949e"}}>diff {pairData.diff.toFixed(2)}</span>
          </div>
          <div style={{fontSize:10,color:"#8b949e"}}>
            {pairData.base}: <b style={{color:"#e6edf3"}}>{(scores[pairData.base]?.score||0).toFixed(1)}</b>
            {" · "}{pairData.quote}: <b style={{color:"#e6edf3"}}>{(scores[pairData.quote]?.score||0).toFixed(1)}</b>
          </div>
        </div>}

        {/* Notes */}
        <div className="pro-card" style={{padding:14}}>
          <div style={{fontSize:10,color:"#8b949e",marginBottom:4}}>POZNÁMKY PRO AI (volitelné)</div>
          <textarea value={notes} onChange={e=>setNotes(e.target.value)}
            placeholder="Čekám na retest, news ve 14:30, minulý týden bearish..."
            style={{...inp,minHeight:56,resize:"vertical"}}/>
        </div>

        <button onClick={runAIAnalysis} disabled={loading||!imgFile}
          style={{padding:"11px",borderRadius:9,border:"none",cursor:loading||!imgFile?"not-allowed":"pointer",background:!loading&&imgFile?"linear-gradient(135deg,var(--cmd-green),#36c94b)":"#111a26",color:!loading&&imgFile?"#041007":"#4a6a88",fontSize:13,fontWeight:900,letterSpacing:".03em",boxShadow:!loading&&imgFile?"0 0 22px rgba(120,242,54,.28)":"none",transition:"all .2s"}}>
          {loading?"⟳ Analyzuji...":"⚡ SPUSTIT AI ANALÝZU"}
        </button>
        {aiAnalyses[selPair]&&<AIStatusBar ai={aiAnalyses[selPair]}/>}

        {error&&<div style={{background:"rgba(248,81,73,.08)",border:"1px solid rgba(248,81,73,.22)",borderRadius:7,padding:"8px 11px",fontSize:11,color:"#f85149"}}>⚠ {error}</div>}
      </div>

      {/* ── RIGHT: Results ── */}
      <div>
        {!result&&!loading&&<div className="pro-card" style={{padding:44,textAlign:"center",minHeight:440,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <div style={{fontSize:38,marginBottom:11}}>🤖</div>
          <div style={{fontSize:14,fontWeight:700,color:"#4a6a88",marginBottom:5}}>Nahrej graf a spusť analýzu</div>
          <div style={{fontSize:11,color:"#263242",maxWidth:320,lineHeight:1.7,marginBottom:16}}>AI (Claude Vision) identifikuje tržní strukturu, order bloky, FVG, liquidity pools a navrhne entry setup s SL a TP.</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"center"}}>
            {["Market Structure","Order Blocks","FVG","Liquidity","S/R Zones","BOS/CHoCH","Entry Setup","RR Ratio"].map(t=>(
              <span key={t} style={{background:"rgba(120,242,54,.06)",border:"1px solid rgba(120,242,54,.14)",color:"rgba(120,242,54,.45)",borderRadius:5,padding:"2px 7px",fontSize:9}}>✓ {t}</span>
            ))}
          </div>
        </div>}

        {loading&&<div className="pro-card" style={{padding:44,textAlign:"center",minHeight:440,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14}}>
          <style>{`@keyframes ai-spin{to{transform:rotate(360deg)}}`}</style>
          <div style={{width:48,height:48,borderRadius:"50%",border:"3px solid #1d2a36",borderTop:"3px solid var(--cmd-green)",animation:"ai-spin 1s linear infinite"}}/>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:"var(--cmd-green)",marginBottom:3}}>AI analyzuje graf...</div>
            <div style={{fontSize:11,color:"#8b949e"}}>Market Structure · Order Blocks · FVG · Liquidity · Entry</div>
          </div>
        </div>}

        {result&&<div style={{display:"flex",flexDirection:"column",gap:12}}>

          {/* Bias + Confidence + Summary */}
          <div className="pro-card" style={{padding:15}}>
            <div style={{display:"flex",gap:11,alignItems:"flex-start",flexWrap:"wrap",marginBottom:11}}>
              <div style={{background:result.bias==="BULLISH"?"rgba(120,242,54,.11)":result.bias==="BEARISH"?"rgba(255,63,95,.11)":"rgba(240,180,41,.11)",border:`1px solid ${biasColor}44`,borderRadius:9,padding:"9px 15px",textAlign:"center",minWidth:85,flexShrink:0}}>
                <div style={{fontSize:9,color:"#8b949e",letterSpacing:".06em"}}>AI BIAS</div>
                <div style={{fontSize:17,fontWeight:900,color:biasColor,marginTop:2}}>{result.bias==="BULLISH"?"▲ BULL":result.bias==="BEARISH"?"▼ BEAR":"◆ SIDE"}</div>
              </div>
              <div style={{background:"#0b1420",border:"1px solid #1d2a36",borderRadius:9,padding:"9px 13px",textAlign:"center",flexShrink:0,minWidth:68}}>
                <div style={{fontSize:9,color:"#8b949e"}}>KONF.</div>
                <div style={{fontSize:20,fontWeight:900,color:result.confidence>=70?"var(--cmd-green)":result.confidence>=45?"#d29922":"var(--cmd-red)"}}>{result.confidence}</div>
                <div style={{fontSize:9,color:"#8b949e"}}>/100</div>
              </div>
              <div style={{flex:1,minWidth:160}}>
                <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:6}}>
                  <span style={{background:"rgba(47,155,255,.1)",border:"1px solid rgba(47,155,255,.28)",color:"#2f9bff",borderRadius:4,padding:"1px 7px",fontSize:9,fontWeight:700}}>{selPair}</span>
                  <span style={{background:"rgba(47,155,255,.1)",border:"1px solid rgba(47,155,255,.28)",color:"#2f9bff",borderRadius:4,padding:"1px 7px",fontSize:9,fontWeight:700}}>{tf}</span>
                  {pairData&&<span style={{background:pairData.dir==="BUY"?"rgba(120,242,54,.09)":"rgba(255,63,95,.09)",border:`1px solid ${pairData.dir==="BUY"?"rgba(120,242,54,.25)":"rgba(255,63,95,.25)"}`,color:pairData.dir==="BUY"?"var(--cmd-green)":"var(--cmd-red)",borderRadius:4,padding:"1px 7px",fontSize:9,fontWeight:700}}>Fund: {pairData.dir}</span>}
                </div>
                <div style={{fontSize:11,color:"#8b949e",lineHeight:1.65}}>{result.summary}</div>
              </div>
            </div>
            {result.risk_warnings?.length>0&&<div style={{background:"rgba(240,180,41,.05)",border:"1px solid rgba(240,180,41,.18)",borderRadius:6,padding:"6px 10px",display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
              <span style={{fontSize:10,color:"#d29922",fontWeight:700}}>⚠</span>
              {result.risk_warnings.map((w,i)=><span key={i} style={{fontSize:10,color:"#b07a28"}}>{i>0?"· ":""}{w}</span>)}
            </div>}
          </div>

          {/* Market Structure + Classical TA */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div className="pro-card" style={{padding:14}}>
              <div className="pro-panel-title" style={{marginBottom:9}}>🏗 Market Structure</div>
              {result.market_structure?.trend&&<div style={{marginBottom:7}}>
                <span style={{background:result.market_structure.trend==="UPTREND"?"rgba(120,242,54,.11)":result.market_structure.trend==="DOWNTREND"?"rgba(255,63,95,.11)":"rgba(240,180,41,.11)",border:`1px solid ${result.market_structure.trend==="UPTREND"?"rgba(120,242,54,.28)":result.market_structure.trend==="DOWNTREND"?"rgba(255,63,95,.28)":"rgba(240,180,41,.28)"}`,color:result.market_structure.trend==="UPTREND"?"var(--cmd-green)":result.market_structure.trend==="DOWNTREND"?"var(--cmd-red)":"#d29922",borderRadius:5,padding:"3px 9px",fontSize:11,fontWeight:700}}>
                  {result.market_structure.trend}
                </span>
              </div>}
              <div style={{fontSize:11,color:"#8b949e",lineHeight:1.6,marginBottom:7}}>{result.market_structure?.description}</div>
              {result.market_structure?.bos_choch&&result.market_structure.bos_choch!=="None visible"&&
                <div style={{background:"rgba(47,155,255,.06)",border:"1px solid rgba(47,155,255,.18)",borderRadius:6,padding:"6px 9px",fontSize:10,color:"#58a6ff",marginBottom:7}}>🔷 {result.market_structure.bos_choch}</div>}
              {result.market_structure?.swing_points&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:5}}>
                {[{l:"HH",v:result.market_structure.swing_points.hh,c:"#3fb950"},{l:"HL",v:result.market_structure.swing_points.hl,c:"#3fb95088"},{l:"LH",v:result.market_structure.swing_points.lh,c:"#f8514988"},{l:"LL",v:result.market_structure.swing_points.ll,c:"#f85149"}].map(({l,v,c})=>(
                  <div key={l} style={{background:"#080d14",border:`1px solid ${c}30`,borderRadius:6,padding:"5px 0",textAlign:"center"}}>
                    <div style={{fontSize:9,color:c,fontWeight:700}}>{l}</div>
                    <div style={{fontSize:15,fontWeight:900,color:c}}>{v??"—"}</div>
                  </div>
                ))}
              </div>}
            </div>
            <div className="pro-card" style={{padding:14}}>
              <div className="pro-panel-title" style={{marginBottom:9}}>📐 Classical TA</div>
              {[{l:"TRENDLINES",v:result.classical_ta?.trendlines},{l:"PATTERNS",v:result.classical_ta?.patterns},{l:"EMA STRUKTURA",v:result.classical_ta?.ema_structure},{l:"MOMENTUM",v:result.classical_ta?.momentum}].map(({l,v})=>
                v&&v!=="None identified"&&!v.toLowerCase().includes("not visible")?
                <div key={l} style={{marginBottom:8}}>
                  <div style={{fontSize:8,color:"#8b949e88",letterSpacing:".06em",fontWeight:700,marginBottom:2}}>{l}</div>
                  <div style={{fontSize:11,color:"#c0d0e0",lineHeight:1.5}}>{v}</div>
                </div>:null
              )}
            </div>
          </div>

          {/* Key Levels */}
          {result.key_levels?.length>0&&<div className="pro-card" style={{padding:14}}>
            <div className="pro-panel-title" style={{marginBottom:9}}>📏 Key Levels — S/R Zóny</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div><div style={{fontSize:9,color:"#f8514966",letterSpacing:".06em",marginBottom:5}}>RESISTANCE</div>
                {result.key_levels.filter(l=>l.type==="RESISTANCE").map((l,i)=>(
                  <div key={i} style={{background:"rgba(248,81,73,.04)",border:"1px solid rgba(248,81,73,.18)",borderLeft:"3px solid rgba(248,81,73,.6)",borderRadius:"0 6px 6px 0",padding:"5px 9px",marginBottom:5}}>
                    <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:9,fontWeight:700,color:"#f85149"}}>RES</span><span style={{fontSize:9,color:"#f8514955"}}>{l.strength==="STRONG"?"●●●":l.strength==="MEDIUM"?"●●○":"●○○"}</span></div>
                    <div style={{fontSize:11,color:"#c0d0e0",marginTop:2}}>{l.zone}</div>
                    {l.notes&&<div style={{fontSize:9,color:"#8b949e",marginTop:1}}>{l.notes}</div>}
                  </div>
                ))}</div>
              <div><div style={{fontSize:9,color:"#3fb95066",letterSpacing:".06em",marginBottom:5}}>SUPPORT</div>
                {result.key_levels.filter(l=>l.type==="SUPPORT").map((l,i)=>(
                  <div key={i} style={{background:"rgba(63,185,80,.04)",border:"1px solid rgba(63,185,80,.18)",borderLeft:"3px solid rgba(63,185,80,.6)",borderRadius:"0 6px 6px 0",padding:"5px 9px",marginBottom:5}}>
                    <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:9,fontWeight:700,color:"#3fb950"}}>SUP</span><span style={{fontSize:9,color:"#3fb95055"}}>{l.strength==="STRONG"?"●●●":l.strength==="MEDIUM"?"●●○":"●○○"}</span></div>
                    <div style={{fontSize:11,color:"#c0d0e0",marginTop:2}}>{l.zone}</div>
                    {l.notes&&<div style={{fontSize:9,color:"#8b949e",marginTop:1}}>{l.notes}</div>}
                  </div>
                ))}</div>
            </div>
          </div>}

          {/* ICT/SMC Row */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
            <div className="pro-card" style={{padding:14}}>
              <div className="pro-panel-title" style={{marginBottom:9}}>🟦 Order Blocks</div>
              {result.ict_smc?.order_blocks?.length?result.ict_smc.order_blocks.map((ob,i)=>{
                const bull=ob.type==="BULLISH",c=bull?"#3fb950":"#f85149";
                const sc=ob.significance==="HIGH"?"#d29922":ob.significance==="MEDIUM"?"#58a6ff":"#8b949e";
                return <div key={i} style={{background:"#080d14",border:`1px solid ${c}20`,borderRadius:7,padding:"6px 8px",marginBottom:5}}>
                  <div style={{display:"flex",gap:3,flexWrap:"wrap",marginBottom:3}}>
                    <span style={{background:`${c}14`,border:`1px solid ${c}30`,color:c,borderRadius:3,padding:"0 5px",fontSize:9,fontWeight:700}}>{bull?"🟢 BULL OB":"🔴 BEAR OB"}</span>
                    <span style={{background:`${sc}14`,border:`1px solid ${sc}28`,color:sc,borderRadius:3,padding:"0 5px",fontSize:9,fontWeight:700}}>{ob.significance}</span>
                    <span style={{background:"rgba(139,148,158,.08)",color:"#8b949e",borderRadius:3,padding:"0 5px",fontSize:9}}>{(ob.status||"").replace("_"," ")}</span>
                  </div>
                  <div style={{fontSize:10,color:"#8b949e"}}>{ob.location}</div>
                </div>;
              }):<div style={{fontSize:11,color:"#263242"}}>Žádné OB identifikovány</div>}
              {result.ict_smc?.premium_discount&&<div style={{background:"rgba(47,155,255,.05)",border:"1px solid rgba(47,155,255,.15)",borderRadius:6,padding:"5px 8px",marginTop:7}}>
                <div style={{fontSize:8,color:"#58a6ff77",fontWeight:700,letterSpacing:".06em"}}>PREMIUM/DISCOUNT</div>
                <div style={{fontSize:10,color:"#58a6ff",marginTop:1}}>{result.ict_smc.premium_discount}</div>
              </div>}
            </div>
            <div className="pro-card" style={{padding:14}}>
              <div className="pro-panel-title" style={{marginBottom:9}}>⬜ Fair Value Gaps</div>
              {result.ict_smc?.fvg?.length?result.ict_smc.fvg.map((fvg,i)=>{
                const bull=fvg.type==="BULLISH",c=bull?"#3fb950":"#f85149";
                const sc=fvg.status==="OPEN"?"#d29922":fvg.status==="PARTIALLY_FILLED"?"#58a6ff":"#8b949e";
                return <div key={i} style={{background:"#080d14",border:`1px solid ${c}18`,borderRadius:7,padding:"6px 8px",marginBottom:5}}>
                  <div style={{display:"flex",gap:3,marginBottom:3}}>
                    <span style={{background:`${c}14`,border:`1px solid ${c}28`,color:c,borderRadius:3,padding:"0 5px",fontSize:9,fontWeight:700}}>{bull?"FVG ▲":"FVG ▼"}</span>
                    <span style={{background:`${sc}14`,border:`1px solid ${sc}28`,color:sc,borderRadius:3,padding:"0 5px",fontSize:9}}>{(fvg.status||"").replace("_"," ")}</span>
                  </div>
                  <div style={{fontSize:10,color:"#8b949e"}}>{fvg.location}</div>
                </div>;
              }):<div style={{fontSize:11,color:"#263242"}}>Žádné FVG identifikovány</div>}
            </div>
            <div className="pro-card" style={{padding:14}}>
              <div className="pro-panel-title" style={{marginBottom:9}}>💧 Liquidity Pools</div>
              {result.ict_smc?.liquidity?.length?result.ict_smc.liquidity.map((liq,i)=>{
                const isBSL=liq.type==="BSL",c=isBSL?"#58a6ff":"#bf4cff";
                return <div key={i} style={{background:"#080d14",border:`1px solid ${c}20`,borderRadius:7,padding:"6px 8px",marginBottom:5}}>
                  <span style={{background:`${c}14`,border:`1px solid ${c}28`,color:c,borderRadius:3,padding:"0 6px",fontSize:9,fontWeight:700}}>{isBSL?"💧 BSL":"💧 SSL"}</span>
                  <div style={{fontSize:10,color:"#8b949e",marginTop:3}}>{liq.location}</div>
                  {liq.notes&&<div style={{fontSize:9,color:"#8b949e55",marginTop:1}}>{liq.notes}</div>}
                </div>;
              }):<div style={{fontSize:11,color:"#263242"}}>Žádné liquidity pools</div>}
            </div>
          </div>

          {/* Entry Setup */}
          {result.entry_setup&&<div className="pro-card" style={{padding:15}}>
            <div className="pro-panel-title" style={{marginBottom:11}}>🎯 Entry Setup</div>
            <div style={{display:"flex",gap:12,alignItems:"flex-start",marginBottom:13}}>
              <div style={{background:result.entry_setup.direction==="BUY"?"rgba(120,242,54,.09)":result.entry_setup.direction==="SELL"?"rgba(255,63,95,.09)":"rgba(240,180,41,.09)",border:`2px solid ${result.entry_setup.direction==="BUY"?"rgba(120,242,54,.36)":result.entry_setup.direction==="SELL"?"rgba(255,63,95,.36)":"rgba(240,180,41,.36)"}`,borderRadius:9,padding:"9px 16px",textAlign:"center",flexShrink:0,minWidth:76}}>
                <div style={{fontSize:9,color:"#8b949e"}}>DIR</div>
                <div style={{fontSize:18,fontWeight:900,color:result.entry_setup.direction==="BUY"?"var(--cmd-green)":result.entry_setup.direction==="SELL"?"var(--cmd-red)":"#d29922",marginTop:2}}>{result.entry_setup.direction}</div>
                <div style={{fontSize:10,color:"#8b949e",marginTop:2}}>RR {result.entry_setup.rr_estimate||"—"}</div>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:9,color:"#8b949e",marginBottom:2}}>ENTRY TRIGGER</div>
                <div style={{fontSize:11,color:"#e6edf3",marginBottom:9,lineHeight:1.5}}>{result.entry_setup.entry_trigger||"—"}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                  {[{l:"ENTRY ZONE",v:result.entry_setup.entry_zone,c:"#58a6ff"},{l:"STOP LOSS",v:result.entry_setup.stop_loss,c:"#f85149"},{l:"TP1",v:result.entry_setup.tp1,c:"#3fb950"},{l:"TP2",v:result.entry_setup.tp2,c:"#3fb95066"}].map(({l,v,c})=>(
                    <div key={l} style={{background:"#080d14",border:`1px solid ${c}22`,borderRadius:6,padding:"5px 8px"}}>
                      <div style={{fontSize:8,color:c,fontWeight:700,letterSpacing:".06em"}}>{l}</div>
                      <div style={{fontSize:10,color:"#a0b8d0",marginTop:2,lineHeight:1.4}}>{v||"—"}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            {result.entry_setup.confluence_factors?.length>0&&<div style={{marginBottom:9}}>
              <div style={{fontSize:9,color:"#8b949e",marginBottom:4,letterSpacing:".06em"}}>CONFLUENCE FAKTORY</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                {result.entry_setup.confluence_factors.map((f,i)=>(
                  <span key={i} style={{background:"rgba(120,242,54,.05)",border:"1px solid rgba(120,242,54,.15)",color:"rgba(120,242,54,.75)",borderRadius:4,padding:"1px 6px",fontSize:9}}>✓ {f}</span>
                ))}
              </div>
            </div>}
            {result.entry_setup.invalidation&&<div style={{background:"rgba(248,81,73,.05)",border:"1px solid rgba(248,81,73,.16)",borderRadius:6,padding:"6px 9px"}}>
              <div style={{fontSize:8,color:"#f85149",fontWeight:700,letterSpacing:".06em",marginBottom:1}}>⚠ INVALIDATION</div>
              <div style={{fontSize:10,color:"#c07080"}}>{result.entry_setup.invalidation}</div>
            </div>}
          </div>}

        </div>}
      </div>
    </div>
  );
}

function AIStatusBar({ai}){
  if(!ai) return null;
  const ah=Math.round((Date.now()-ai.savedAt)/3600000);
  return(
    <div style={{background:"rgba(63,185,80,.07)",border:"1px solid rgba(63,185,80,.2)",borderRadius:7,padding:"6px 9px",fontSize:10,color:"#3fb950",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <span>{"✓ Uložena: "+ai.tf+" · "+(ah<1?"<1h":ah+"h zpět")}</span>
      <span style={{color:"#4a6a88"}}>{ai.bias+" "+ai.confidence+"%"}</span>
    </div>
  );
}
function CoachContextBar({activePair,pairs,aiAnalyses,forecasts}){
  const p=(pairs||[]).find(function(x){return x.pair===activePair;});
  const ai=aiAnalyses&&aiAnalyses[activePair];
  const f=forecasts&&forecasts[activePair];
  if(!p) return null;
  return(
    <div style={{background:"#0d1117",border:"1px solid #21262d",borderRadius:8,padding:"8px 12px",display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
      <span style={{fontWeight:700,color:"#e6edf3",fontSize:12}}>{p.pair}</span>
      <span style={{color:p.dir==="BUY"?"#3fb950":"#f85149",fontWeight:700,fontSize:11}}>{p.dir+" diff:"+p.diff}</span>
      <span style={{color:"#f0b429",fontSize:11}}>{"★".repeat(p.conviction||0)+"☆".repeat(5-(p.conviction||0))+" "+(p.conviction||0)+"/5"}</span>
      {f&&<span style={{fontSize:11,color:"#8b949e"}}>{"Forecast "+f.prob+"%"}</span>}
      {ai?<span style={{fontSize:11,color:"#3fb950"}}>{"AI "+ai.tf+": "+ai.bias+" "+ai.confidence+"%"}</span>
         :<span style={{fontSize:11,color:"#4a6a88"}}>{"⚠ Bez AI analyzy"}</span>}
      <span style={{fontSize:10,color:"#4a6a88",marginLeft:"auto"}}>{"Coach vidi vsechna data"}</span>
    </div>
  );
}

function AICoachTab({scores,pairs,forecasts,aiAnalyses,cotData,selected,upcoming}){
  const defaultCoachMessage={
    role:"assistant",
    content:"Ahoj! Jsem tvůj AI trading mentor. Mám přístup ke všem datům aplikace — fundamentálnímu scoringu, COT, conviction skóre i výsledkům AI analýzy grafů.\n\nNa co se chceš zeptat?",
    ts:Date.now()
  };
  const [messages,setMessages]=useState(()=>{
    try{
      const saved=JSON.parse(localStorage.getItem("ai_coach_messages")||"null");
      return Array.isArray(saved)&&saved.length?saved:[defaultCoachMessage];
    }catch(e){return [defaultCoachMessage];}
  });
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [activePair,setActivePair]=useState(selected?.pair||"");
  const bottomRef=useRef();
  const inputRef=useRef();

  // Auto-scroll + shared history between dashboard compact panel and full AI Coach tab
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});try{localStorage.setItem("ai_coach_messages",JSON.stringify(messages.slice(-40)));}catch(e){}},[messages]);

  // Sync selected pair
  useEffect(()=>{if(selected?.pair)setActivePair(selected.pair);},[selected?.pair]);

  // ── Build context for AI ──────────────────────────────────────
  function buildContext(){
    // Top 5 pairs with full data
    const topPairs=(pairs||[]).slice(0,8).map(p=>{
      const f=forecasts?.[p.pair]||{};
      const ai=aiAnalyses?.[p.pair];
      return {
        pair:p.pair, dir:p.dir, diff:p.diff.toFixed(2),
        conviction:p.conviction||0,
        reasons:(p.convictionReasons||[]).slice(0,3),
        forecast:{dir:f.dir,prob:f.prob,newsLabel:f.newsLabel||""},
        aiAnalysis:ai?{
          bias:ai.bias, tf:ai.tf, confidence:ai.confidence,
          trend:ai.market_structure?.trend,
          keyLevels:(ai.key_levels||[]).slice(0,3).map(l=>l.type+" "+l.zone+" "+l.strength),
          entry:ai.entry_setup?{
            dir:ai.entry_setup.direction,
            zone:ai.entry_setup.entry_zone,
            sl:ai.entry_setup.stop_loss,
            tp1:ai.entry_setup.tp1,
            rr:ai.entry_setup.rr_estimate,
            trigger:ai.entry_setup.entry_trigger,
            invalidation:ai.entry_setup.invalidation
          }:null,
          summary:ai.summary
        }:null,
        crowded:p.cotCrowded?true:false,
        corrDuplicate:p.corrDuplicate?true:false
      };
    });

    // Currency scores
    const currencyScores={};
    const CURR=["USD","EUR","GBP","JPY","AUD","NZD","CAD","CHF"];
    CURR.forEach(c=>{
      const s=scores?.[c];
      if(s) currencyScores[c]={
        total:(s.score||0).toFixed(2),
        fund:(s.fund_score||0).toFixed(2),
        cot:(s.cot_score||0).toFixed(2),
        cot_pct:s.cot_pct!=null?s.cot_pct:null,
        policy_adj:(s.policy_adj||0).toFixed(2),
        momentum:(s.momentum_adj||0).toFixed(2)
      };
    });

    // CB Policy context
    const cbContext={};
    CURR.forEach(c=>{if(typeof CB_POLICY_DATA!=="undefined"&&CB_POLICY_DATA[c])cbContext[c]=CB_POLICY_DATA[c].label||"";});

    // Active pair AI analysis
    const activeAI=activePair&&aiAnalyses?.[activePair]?aiAnalyses[activePair]:null;

    // Risk sentiment
    const rsSentiment=typeof g_riskSentiment!=="undefined"?
      (g_riskSentiment>0?"RISK-ON":g_riskSentiment<0?"RISK-OFF":"NEUTRAL"):"NEUTRAL";

    return {
      timestamp:new Date().toISOString(),
      riskSentiment:rsSentiment,
      activePair:activePair||"none",
      currencyScores,
      cbPolicy:cbContext,
      topPairs,
      activeAIAnalysis:activeAI?{
        pair:activePair,
        timeframe:activeAI.tf,
        bias:activeAI.bias,
        confidence:activeAI.confidence,
        marketStructure:activeAI.market_structure,
        keyLevels:activeAI.key_levels,
        ictSmc:activeAI.ict_smc,
        classicalTA:activeAI.classical_ta,
        entrySetup:activeAI.entry_setup,
        riskWarnings:activeAI.risk_warnings,
        summary:activeAI.summary
      }:null
    };
  }

  // ── System prompt ─────────────────────────────────────────────
  function buildSystemPrompt(ctx){
    return `Jsi zkušený FX trading mentor s hlubokými znalostmi fundamentální analýzy, COT dat, ICT/SMC metodologie a risk managementu. Mluvíš česky.

AKTUÁLNÍ DATA Z FX ANALYZERU:
${JSON.stringify(ctx,null,2)}

PRAVIDLA ODPOVĚDÍ:
1. Nikdy neříkej "kup teď" nebo "prodej teď" bez podmínek
2. Formát: [bias] → [scénář] → [podmínky vstupu] → [invalidace] → [riziko]
3. Pokud vidíš konflikt (např. fundamenty BUY ale AI analýza BEARISH) — vysvětli ho
4. Buď přímý a stručný — max 3–4 odstavce
5. Vždy zmiň kde je invalidace
6. Jsi mentor, ne signální služba

STYL:
- Mluv jako zkušený trader, ne jako robot
- Pokud uživatel zmíní konkrétní pár, použij jeho data z kontextu
- Pokud není konkrétní pár, zaměř se na top conviction páry
- Buď upřímný o slabostech signálu`;
  }

  // ── Send message ──────────────────────────────────────────────
  async function sendMessage(text){
    const msg=text||input.trim();
    if(!msg||loading) return;
    setInput("");

    const userMsg={role:"user",content:msg,ts:Date.now()};
    const history=[...messages,userMsg];
    setMessages(history);
    setLoading(true);

    const orKey=localStorage.getItem("or_key")||"";
    if(!orKey){
      setMessages([...history,{role:"assistant",content:"⚠ Chybí OpenRouter API klíč — přidej ho v ⚙️ Settings.",ts:Date.now()}]);
      setLoading(false);
      return;
    }

    try{
      const ctx=buildContext();
      const sysPrompt=buildSystemPrompt(ctx);

      // Build messages for API (last 10 messages for context)
      const apiMessages=history.slice(-10).map(m=>({role:m.role,content:m.content}));

      const resp=await fetch("https://openrouter.ai/api/v1/chat/completions",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer "+orKey,
          "HTTP-Referer":"https://attrading.netlify.app",
          "X-Title":"AT Trading AI Coach"
        },
        body:JSON.stringify({
          model:(()=>{const saved=localStorage.getItem("or_coach_model")||localStorage.getItem("or_model")||"";return saved&&saved!=="meta-llama/llama-3.1-8b-instruct:free"?saved:"openrouter/free";})(),
          messages:[{role:"system",content:sysPrompt},...apiMessages],
          max_tokens:600,
          temperature:0.4
        })
      });

      const data=await resp.json();
      if(data.error){
        // Fallback to other free models
        const FALLBACKS=["openrouter/free","deepseek/deepseek-chat-v3-0324:free","qwen/qwen3-8b:free","mistralai/mistral-small-3.1-24b-instruct:free","google/gemma-3-12b-it:free","meta-llama/llama-4-scout:free"];
        let reply="";
        for(const m of FALLBACKS){
          try{
            const r2=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+orKey,"HTTP-Referer":"https://attrading.netlify.app","X-Title":"AT Trading AI Coach"},body:JSON.stringify({model:m,messages:[{role:"system",content:sysPrompt},...apiMessages],max_tokens:600,temperature:0.4})});
            const d2=await r2.json();
            if(!d2.error&&d2.choices?.[0]?.message?.content){reply=d2.choices[0].message.content;console.log("Coach model:",m);break;}
          }catch(e){}
        }
        if(!reply) throw new Error(data.error.message||"Žádný model není dostupný");
        setMessages([...history,{role:"assistant",content:reply,ts:Date.now()}]);
        setLoading(false);return;
      }
      const reply=data.choices?.[0]?.message?.content||"Nepodařilo se získat odpověď.";

      setMessages([...history,{role:"assistant",content:reply,ts:Date.now()}]);
    }catch(e){
      setMessages([...history,{role:"assistant",content:"⚠ Chyba: "+e.message,ts:Date.now()}]);
    }
    setLoading(false);
  }

  // ── Quick buttons ─────────────────────────────────────────────
  const QUICK=[
    {icon:"🎯",label:"Top 3 páry dnes",q:"Který jsou dnes top 3 páry s největší konvikcí a proč?"},
    {icon:"⚔️",label:"Hraj opačnou stranu",q:`Proč by ${activePair||"top pár"} NEMĚL jít ve směru biasu? Argumentuj opačně.`},
    {icon:"✅",label:"Pre-trade checklist",q:`Projdi pre-trade checklist pro ${activePair||"top pár"} — zkontroluj všechny faktory před vstupem.`},
    {icon:"⚠️",label:"Rizika a konflikty",q:`Jaké jsou hlavní konflikty a rizika v aktuálních datech? Kde vidíš nesoulad?`},
    {icon:"📊",label:"Vysvětli COT",q:`Vysvětli mi aktuální COT pozice — kde jsou hedge fondy a co to znamená?`},
    {icon:"🔄",label:"Scénář invalidace",q:`Pro ${activePair||"top pár"} — co musí cena udělat, aby se setup stal neplatným?`},
  ];

  // ── Format message content ────────────────────────────────────
  function formatMsg(text){
    // Convert **bold** and line breaks
    return text.split("\n").map((line,i)=>{
      const parts=line.split(/(\*\*[^*]+\*\*)/g);
      return(
        <span key={i}>
          {parts.map((p,j)=>p.startsWith("**")&&p.endsWith("**")?
            <b key={j} style={{color:"#e6edf3"}}>{p.slice(2,-2)}</b>:
            <span key={j}>{p}</span>
          )}
          {i<text.split("\n").length-1&&<br/>}
        </span>
      );
    });
  }

  const inp={
    flex:1,background:"#0d1117",border:"1px solid #30363d",borderRadius:8,
    color:"#e6edf3",fontSize:13,padding:"10px 14px",outline:"none",
    fontFamily:"inherit",resize:"none",lineHeight:1.5
  };

  return(
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 120px)",maxWidth:860,margin:"0 auto",gap:12}}>

      {/* ── Header ── */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <div>
          <div style={{fontSize:15,fontWeight:700,color:"#e6edf3"}}>🧠 AI Trading Coach</div>
          <div style={{fontSize:11,color:"#8b949e"}}>Přístup ke všem datům aplikace · OpenRouter · volný chat</div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{fontSize:10,color:"#8b949e"}}>Aktivní pár:</span>
          <select value={activePair} onChange={e=>setActivePair(e.target.value)}
            style={{background:"#0d1117",border:"1px solid #30363d",borderRadius:6,color:"#e6edf3",fontSize:12,padding:"4px 8px",cursor:"pointer"}}>
            <option value="">— žádný —</option>
            {(pairs||[]).slice(0,15).map(p=>(
              <option key={p.pair} value={p.pair}>
                {p.pair} {p.dir} {p.conviction>=3?"★".repeat(p.conviction):""}
              </option>
            ))}
          </select>
          {activePair&&aiAnalyses?.[activePair]&&(
            <span style={{fontSize:9,background:"rgba(63,185,80,.1)",border:"1px solid rgba(63,185,80,.25)",color:"#3fb950",borderRadius:4,padding:"2px 7px"}}>
              AI analýza {aiAnalyses[activePair].tf} načtena ✓
            </span>
          )}
        </div>
      </div>

      {/* ── Context preview ── */}
      {activePair&&<CoachContextBar activePair={activePair} pairs={pairs||[]} aiAnalyses={aiAnalyses||{}} forecasts={forecasts||{}}/>}

      {/* ── Messages ── */}
      <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:10,paddingRight:4}}>
        {messages.map((m,i)=>(
          <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",
            flexDirection:m.role==="user"?"row-reverse":"row"}}>
            <div style={{
              width:32,height:32,borderRadius:"50%",flexShrink:0,display:"flex",
              alignItems:"center",justifyContent:"center",fontSize:14,
              background:m.role==="user"?"rgba(47,155,255,.2)":"rgba(120,242,54,.15)",
              border:`1px solid ${m.role==="user"?"rgba(47,155,255,.3)":"rgba(120,242,54,.3)"}`
            }}>
              {m.role==="user"?"👤":"🧠"}
            </div>
            <div style={{
              maxWidth:"80%",background:m.role==="user"?"rgba(47,155,255,.08)":"rgba(13,20,30,.95)",
              border:`1px solid ${m.role==="user"?"rgba(47,155,255,.2)":"#21262d"}`,
              borderRadius:m.role==="user"?"12px 4px 12px 12px":"4px 12px 12px 12px",
              padding:"10px 14px",fontSize:13,color:"#c9d1d9",lineHeight:1.65
            }}>
              {formatMsg(m.content)}
              <div style={{fontSize:9,color:"#4a6a88",marginTop:4,textAlign:m.role==="user"?"right":"left"}}>
                {new Date(m.ts).toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"})}
              </div>
            </div>
          </div>
        ))}
        {loading&&(
          <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
            <div style={{width:32,height:32,borderRadius:"50%",background:"rgba(120,242,54,.15)",border:"1px solid rgba(120,242,54,.3)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>🧠</div>
            <div style={{background:"rgba(13,20,30,.95)",border:"1px solid #21262d",borderRadius:"4px 12px 12px 12px",padding:"10px 14px",display:"flex",gap:5,alignItems:"center"}}>
              <span style={{animation:"coach-pulse 1.2s ease-in-out infinite",display:"inline-block",width:7,height:7,borderRadius:"50%",background:"var(--cmd-green)"}}></span>
              <span style={{animation:"coach-pulse 1.2s ease-in-out .3s infinite",display:"inline-block",width:7,height:7,borderRadius:"50%",background:"var(--cmd-green)"}}></span>
              <span style={{animation:"coach-pulse 1.2s ease-in-out .6s infinite",display:"inline-block",width:7,height:7,borderRadius:"50%",background:"var(--cmd-green)"}}></span>
            </div>
          </div>
        )}
        <div ref={bottomRef}/>
      </div>

      {/* ── Quick buttons ── */}
      <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
        {QUICK.map((q,i)=>(
          <button key={i} onClick={()=>sendMessage(q.q)} disabled={loading}
            style={{background:"rgba(255,255,255,.04)",border:"1px solid #21262d",borderRadius:6,
              color:"#8b949e",fontSize:11,padding:"5px 10px",cursor:loading?"not-allowed":"pointer",
              display:"flex",gap:4,alignItems:"center",transition:"all .15s"}}
            onMouseEnter={e=>{if(!loading){e.target.style.borderColor="#58a6ff";e.target.style.color="#58a6ff";}}}
            onMouseLeave={e=>{e.target.style.borderColor="#21262d";e.target.style.color="#8b949e";}}>
            {q.icon} {q.label}
          </button>
        ))}
        <button onClick={()=>setMessages([{role:"assistant",content:"Chat vymazán. Na co se chceš zeptat?",ts:Date.now()}])}
          style={{marginLeft:"auto",background:"transparent",border:"1px solid #21262d",borderRadius:6,color:"#4a6a88",fontSize:11,padding:"5px 10px",cursor:"pointer"}}>
          🗑 Smazat
        </button>
      </div>

      {/* ── Input ── */}
      <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
        <textarea ref={inputRef} value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}}
          placeholder="Napiš otázku... (Enter = odeslat, Shift+Enter = nový řádek)"
          style={inp} rows={2}/>
        <button onClick={()=>sendMessage()} disabled={loading||!input.trim()}
          style={{padding:"10px 18px",borderRadius:8,border:"none",
            cursor:loading||!input.trim()?"not-allowed":"pointer",
            background:!loading&&input.trim()?"linear-gradient(135deg,var(--cmd-green),#36c94b)":"#21262d",
            color:!loading&&input.trim()?"#041007":"#4a6a88",fontWeight:900,fontSize:13,
            transition:"all .2s",flexShrink:0}}>
          {loading?"...":"▶"}
        </button>
      </div>

      <style>{`
        @keyframes coach-pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
      `}</style>
    </div>
  );
}

function App(){

  const [avKey,setAvKey]=useState(null);
  const [showSet,setShowSet]=useState(false);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [scores,setScores]=useState({});
  const [pairs,setPairs]=useState([]);
  const [forecasts,setForecasts]=useState({});
  const [selected,setSelected]=useState(null);
  const [upcoming,setUpcoming]=useState([]);
  const [calData,setCalData]=useState([]);
  const [lastUp,setLastUp]=useState(null);
  const [tab,setTab]=useState("pairs");
  const [cotData,setCotData]=useState(loadCOT());
  const [riskSentimentUI,setRiskSentimentUI]=useState(g_riskSentiment);
  function setRiskSent(v){g_riskSentiment=v;setRiskSentimentUI(v);localStorage.setItem("v5_risk_sent",String(v));}

  const [aiAnalyses,setAiAnalyses]=useState(()=>{try{return JSON.parse(localStorage.getItem("ai_analyses_v1")||"{}");}catch(e){return {};}});
  function saveAIResult(pair,tf,result){const u={...aiAnalyses,[pair]:{...result,pair,tf,savedAt:Date.now()}};setAiAnalyses(u);try{localStorage.setItem("ai_analyses_v1",JSON.stringify(u));}catch(e){}}
  const [cotMeta,setCotMeta]=useState(loadCOTMeta());
  const [cotLoading,setCotLoading]=useState(false);
  const [historyLoading,setHistoryLoading]=useState(false);
  const [sentData,setSentData]=useState(loadSentiment());
  const [retailLoading,setRetailLoading]=useState(false);
  const [retailMeta,setRetailMeta]=useState(null);
  const timer=useRef(null);

  async function autoRetail(){
    setRetailLoading(true);setError("");
    try{
      const result=await fetchRetailSentiment();
      const {sentData:rs,source,timestamp,method,note,rawPairs={},pairsLoaded,errors}=result;
      setSentData(rs);saveSentiment(rs);saveRetailSnapshot(rs);
      setRetailMeta({source,timestamp,method,pairs:pairsLoaded||Object.keys(rawPairs).length,note});
      const oandaEnvLabel=(localStorage.getItem("oanda_env")||"practice")==="practice"?"Practice":"Live";
      const methodLabel={
        oanda_api:     "✅ OANDA "+oandaEnvLabel+" API",
        cftc_nonreport:"✅ CFTC Non-reportable (reálný retail)",
        myfxbook:      "✅ MyFxBook Community Outlook",
        cot_derived:   "⚠️ Odvozeno z COT dat (orientační)",
      }[method]||source;
      const detail=method==="oanda_api"
        ?" · "+(pairsLoaded||0)+" párů"+(errors?.length?" · "+errors[0]:"")
        :method==="cot_derived"?" · Přidej OANDA token v Settings pro přesná data":"";
      setError(`${methodLabel}${detail}`);
      if(fhKey) await loadData(fhKey,cotData,rs);
    }catch(e){
      // Záloha: vždy nastavíme alespoň COT-derived hodnoty
      const derived=deriveRetailFromCOTData();
      setSentData(derived);saveSentiment(derived);saveRetailSnapshot(derived);
      setError("⚠️ Retail auto selhal, použita záloha z COT dat. Zkus ručně upravit slidery. Chyba: "+(e?.message||e));
    }
    setRetailLoading(false);
  }

  useEffect(()=>{
    const fh=localStorage.getItem("fh"),av=localStorage.getItem("av")||"";
    if(fh){setFhKey(fh);setAvKey(av);}
  },[]);

  const loadData=useCallback(async(key,cot,sent)=>{
    setLoading(true);setError("");
    try{
      const cal=await fetchCalendar(key,15);
      setCalData(cal);

      // AUTO-UPDATE: CB sazby, CPI, CB Policy stance z Finnhub kalendáře (bez extra API)
      const{updated}=autoUpdateFromCalendar(cal);
      if(updated.length) console.log("Auto-aktualizováno:",updated.join(" | "));

      // Oil data (AV, cachuje se 6h)
      const currentAvKey=localStorage.getItem("av")||"";
      if(currentAvKey) await fetchOilPrice(currentAvKey).catch(()=>{});

      const sc={};
      CURRENCIES.forEach(c=>{sc[c]=scoreCurrency(cal,c,cot,sent);});
      setScores(sc);
      saveScoreHistory(sc);
      const ranked=rankPairs(sc,aiAnalyses);
      setPairs(ranked);
      setSelected(p=>p||ranked[0]);
      const up=await fetchUpcoming14(key);
      setUpcoming(up);
      const fc={};ranked.forEach(p=>{fc[p.pair]=buildForecastV5(p,sc,cal,up);});
      setForecasts(fc);
      setLastUp(new Date());
    }catch(e){setError(e.message);}
    setLoading(false);
  },[]);

  useEffect(()=>{
    if(!fhKey) return;
    loadData(fhKey,cotData,sentData);
    timer.current=setInterval(()=>loadData(fhKey,cotData,sentData),5*60*1000);
    return()=>clearInterval(timer.current);
  },[fhKey]);

  async function autoCOT(){
    setCotLoading(true);setError("");
    try{
      const {scores:cs,meta}=await fetchCOTAuto();
      setCotData(cs);setCotMeta(meta);
      if(fhKey) await loadData(fhKey,cs,sentData);
    }catch(e){setError("COT auto selhal: "+(e?.message||e));}
    setCotLoading(false);
  }


  async function loadCOTHistoryNow(){
    setHistoryLoading(true);setError("");
    try{
      const y=new Date().getFullYear();
      const years=Array.from({length:6},(_,i)=>y-i); // aktuální rok + 5 let zpět
      const {scores:cs,meta,records,yearsLoaded}=await fetchCOTHistoryYears(years);
      setCotData(cs);setCotMeta(meta);
      setError(`COT historie načtena: ${records} týdnů, ${yearsLoaded} ročních souborů. Score historie doplněna zpětně.`);
      if(fhKey) await loadData(fhKey,cs,sentData);
    }catch(e){setError("Online COT historie selhala. Použij 📂 Import COT z PC. Detail: "+(e?.message||e));}
    setHistoryLoading(false);
  }

  async function loadLocalCOTHistory(files){
    setHistoryLoading(true);setError("");
    try{
      const {scores:cs,meta,records,filesLoaded,errors}=await loadCOTHistoryFromLocalFiles(files);
      setCotData(cs);setCotMeta(meta);
      const warn=errors?.length?` (${errors.length} souborů přeskočeno)` : "";
      setError(`Lokální COT historie načtena: ${records} týdnů, ${filesLoaded} souborů${warn}. Score historie doplněna zpětně.`);
      if(fhKey) await loadData(fhKey,cs,sentData);
    }catch(e){setError("Lokální COT import selhal: "+(e?.message||e));}
    setHistoryLoading(false);
  }

  if(!fhKey) return <Setup onSave={(fh,av)=>{setFhKey(fh);setAvKey(av);}}/>;

  const top=pairs,topPair=top[0];

  return(
    <div className="pro-shell">
      {showSet&&<SettingsOverlay fhKey={fhKey} avKey={avKey} onSave={(fh,av)=>{setFhKey(fh);setAvKey(av);}} onClose={()=>setShowSet(false)}/>}
      <aside className="command-sidebar">
        <div className="command-logo"><div className="command-logo-mark">AT</div><div><div className="command-logo-title">AT TRADING</div><div className="command-logo-sub">FX ANALYZER</div></div></div>
        <div className="command-nav">
          <button type="button" className={tab==="pairs"?"active":""} onClick={()=>{setTab("pairs");}}>📊 Dashboard</button>
          <button type="button" className={tab==="cot"?"active":""} onClick={()=>{setTab("cot");}}>📈 COT & Sentiment</button>
          <button type="button" className={tab==="strength"?"active":""} onClick={()=>{setTab("strength");}}>⚡ Síla měn</button>
          <button type="button" className={tab==="calendar"?"active":""} onClick={()=>{setTab("calendar");}}>🗓️ Calendar</button>
          <button type="button" className={tab==="ai"?"active":""} onClick={()=>{setTab("ai");}}>🤖 AI Analýza</button>
          <button type="button" className={tab==="coach"?"active":""} onClick={()=>{setTab("coach");}}>🧠 AI Coach</button>
          <button type="button" onClick={()=>setShowSet(true)}>⚙️ Settings</button>
        </div>
        <div className="command-bias-card">
          <div className="label">Overall FX Bias</div>
          <div className="value" style={{color:topPair?.dir==="BUY"?"var(--cmd-green)":"var(--cmd-red)"}}>{topPair?topPair.dir:"WAIT"}</div>
          <div className="label">Confidence</div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8}}><b style={{fontSize:20,color:"var(--cmd-green)"}}>{topPair?Math.min(100,Math.round((topPair.diff/10)*100)):0}%</b><div className="command-progress" style={{flex:1}}><div style={{width:(topPair?Math.min(100,Math.round((topPair.diff/10)*100)):0)+"%"}}></div></div></div>
          <CBDIWidget/>
          <AutoUpdateStatus/>
        </div>
      </aside>

      {/* HEADER */}
      <div className="pro-header" style={{padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:18}}>📊</span>
          <div>
            <div style={{fontWeight:900,fontSize:18}}>AT Trading FX Command Center <span className="command-live">● LIVE</span></div>
            <div style={{fontSize:12,color:"#8b949e"}}>FX bias engine · score, COT, sentiment, struktura · FX bias engine</div>
          </div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {loading&&<span style={{fontSize:11,color:"#58a6ff"}}>⟳ Načítám...</span>}
          {error&&<span style={{fontSize:11,color:"#f85149",maxWidth:260}}>{error}</span>}
          <button onClick={()=>loadData(fhKey,cotData,sentData)} disabled={loading}
            style={{padding:"5px 11px",background:"#21262d",border:"1px solid #30363d",borderRadius:5,color:"#e6edf3",fontSize:12,cursor:"pointer"}}>↻ Refresh</button>
          <button onClick={()=>setTab("coach")} className="command-pro" style={{display:"flex",alignItems:"center",gap:8}}>💬 AI Coach</button>
          <button onClick={()=>setShowSet(true)} className="pro-btn">PRO MODE</button>
        </div>
      </div>

      {/* TOP BANNER */}
      {topPair&&(
        <div style={{background:topPair.dir==="BUY"?"#0d2a1a":"#2a0d0d",padding:"8px 16px",borderBottom:"1px solid #30363d",display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{fontSize:11,color:"#8b949e"}}>TOP DOPORUČENÍ:</span>
          <span style={{fontWeight:700,fontSize:14,color:topPair.dir==="BUY"?"#3fb950":"#f85149"}}>{FLAGS[topPair.base]}{FLAGS[topPair.quote]} {topPair.pair} {topPair.dir}</span>
          {forecasts[topPair.pair]&&<span style={{fontSize:12,fontWeight:600,color:forecasts[topPair.pair].prob>=65?"#3fb950":forecasts[topPair.pair].prob<=35?"#f85149":"#d29922"}}>{forecasts[topPair.pair].prob}% pravděpodobnost (14 dní) V5</span>}{forecasts[topPair.pair]?.newsLabel&&<span style={{fontSize:10,color:"#d29922",marginLeft:6}}>{forecasts[topPair.pair].newsLabel}</span>}}
          {top[1]&&<span style={{fontSize:11,color:"#8b949e"}}>| #2: {FLAGS[top[1].base]}{FLAGS[top[1].quote]} {top[1].pair} {top[1].dir}{forecasts[top[1].pair]?` ${forecasts[top[1].pair].prob}%`:""}</span>}
          {top[2]&&<span style={{fontSize:11,color:"#8b949e"}}>| #3: {FLAGS[top[2].base]}{FLAGS[top[2].quote]} {top[2].pair} {top[2].dir}{forecasts[top[2].pair]?` ${forecasts[top[2].pair].prob}%`:""}</span>}
        </div>
      )}

      <div style={{background:"#0d1117",borderBottom:"1px solid #30363d",padding:"7px 16px",fontSize:11,color:"#8b949e"}}>
        V5 Engine: Fundamenty · CB Policy cycle · Real Yield · COT (CFTC) · Retail (MyFxBook) · Sezónnost 2%
        {" · "}<span style={{color:"#d29922"}}>⚡ Backtest 2018-2024: diff 2-3 → WR 65% PF 2.0</span>
        {" · "}<span style={{color:"#ff4d4d"}}>⚠ USDCHF/USDCAD nízká přesnost enginu</span>
      </div>

      {/* TABS */}
      <div style={{display:"flex",borderBottom:"1px solid #30363d",padding:"0 16px",background:"#0d1117",overflowX:"auto"}}>
        {[["pairs","🎯 Všechny páry"],["cot","📊 COT & Sentiment"],["strength","💪 Síla měn"],["calendar","📅 Kalendář"],["ai","🤖 AI Analýza"],["coach","💬 AI Coach"]].map(([id,lbl])=>(
          <button key={id} onClick={()=>setTab(id)}
            style={{padding:"10px 14px",background:"none",border:"none",borderBottom:tab===id?"2px solid #58a6ff":"2px solid transparent",
              color:tab===id?"#58a6ff":"#8b949e",fontSize:13,cursor:"pointer",fontWeight:tab===id?500:400,whiteSpace:"nowrap"}}>
            {lbl}
          </button>
        ))}
      </div>

      {/* CONTENT */}
      <div style={{padding:16,maxWidth:1540,margin:"0 auto"}}>

        {tab==="pairs"&&(
          <div className="pro-grid">
            {/* ── RISK SENTIMENT TOGGLE ── */}
            <div style={{gridColumn:"1 / -1",display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}>
              <span style={{fontSize:10,color:"#8b949e",letterSpacing:".06em"}}>RISK SENTIMENT:</span>
              {[{v:-1,l:"⛔ RISK-OFF",col:"#f85149"},{v:0,l:"○ NEUTRAL",col:"#8b949e"},{v:1,l:"🟢 RISK-ON",col:"#3fb950"}].map(function(item){
                var active=riskSentimentUI===item.v;
                return(
                  <button key={item.v} onClick={function(){setRiskSent(item.v);}} style={{padding:"3px 10px",fontSize:10,borderRadius:5,border:"1px solid "+(active?item.col:"#1d2a36"),background:active?"rgba(120,120,120,.12)":"transparent",color:active?item.col:"#4a6a88",cursor:"pointer",fontWeight:active?700:400}}>
                    {item.l}
                  </button>
                );
              })}
              {riskSentimentUI!==0&&<span style={{fontSize:9,color:"#4a6a88"}}>
                {riskSentimentUI<0?"↑ JPY/CHF · ↓ AUD/NZD":"↑ AUD/NZD · ↓ JPY/CHF"}
              </span>}
            </div>
            {/* ── HIGH CONVICTION SETY ── */}
            {top.filter(p=>p.conviction>=3).length>0&&(
              <div style={{gridColumn:"1 / -1",marginBottom:8,background:"rgba(240,180,41,.05)",border:"1px solid rgba(240,180,41,.15)",borderRadius:10,padding:"10px 14px"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#d29922",marginBottom:8}}>⭐ HIGH CONVICTION — {top.filter(p=>p.conviction>=3).length} pár{top.filter(p=>p.conviction>=3).length>1?"y":""}  (3+ faktorů)</div>
                {top.filter(p=>p.conviction>=3).slice(0,3).map(p=>(
                  <div key={p.pair} onClick={()=>setSelected({...p,rankLabel:p.pair})} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0",borderBottom:"1px solid rgba(240,180,41,.1)",cursor:"pointer"}}>
                    <span style={{fontWeight:900,fontSize:13}}>{FLAGS[p.base]}{FLAGS[p.quote]} {p.pair}</span>
                    <span style={{color:p.dir==="BUY"?"#3fb950":"#f85149",fontWeight:700,fontSize:11}}>{p.dir}</span>
                    <span style={{color:"#f0b429",fontSize:11}}>{"★".repeat(p.conviction||0)}{"☆".repeat(5-(p.conviction||0))}</span>
                    <span style={{fontSize:9,color:"#8b949e",flex:1}}>{(p.convictionReasons||[]).slice(0,2).join(" · ")}</span>
                    {forecasts[p.pair]&&<span style={{fontSize:10,color:"#8b949e"}}>{forecasts[p.pair].prob}%</span>}
                  </div>
                ))}
              </div>
            )}
            <div className="pro-card" style={{padding:14}}>
              <div className="pro-panel-title">Měnové páry</div>
              <div className="pro-pair-list">
                {loading&&!top.length?<div style={{color:"#8b949e",padding:"20px 0"}}>⏳ Načítám 15 měsíců dat...</div>
                  :top.map((p,i)=><PairRow key={p.pair} p={p} rank={i+1} selected={selected?.pair===p.pair} onClick={()=>setSelected({...p,rankLabel:(i+1)+" / "+top.length})} forecast={forecasts[p.pair]} aiData={aiAnalyses[p.pair]}/>) }
              </div>
              <div style={{borderTop:"1px solid #263242",paddingTop:12,marginTop:10,display:"flex",justifyContent:"space-between",fontSize:12,color:"#8b949e"}}><span>Celkem párů: {top.length}</span><button className="pro-btn" onClick={()=>loadData(fhKey,cotData,sentData)}>Aktualizovat</button></div>
            </div>
            <div>{selected&&<Detail pair={selected} scores={scores} forecast={forecasts[selected.pair]} cotMeta={cotMeta} cotData={cotData} sentData={sentData} aiAnalyses={aiAnalyses}/>}</div>
            <div>
              <DashboardCalendarPanel events={upcoming} pair={selected}/>
              <div className="pro-card" style={{padding:16}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><div className="pro-panel-title" style={{margin:0}}>AI Coach</div><span style={{fontSize:11,color:"#3fb950"}}>● Online</span></div>
                <div className="coach-compact"><AICoachTab scores={scores} pairs={top} forecasts={forecasts} aiAnalyses={aiAnalyses} cotData={cotData} selected={selected} upcoming={upcoming}/></div>
              </div>
            </div>
          </div>
        )}

        {tab==="cot"&&(
          <COTPanel cotData={cotData} setCotData={setCotData} sentData={sentData} setSentData={setSentData} cotMeta={cotMeta} onAutoCOT={autoCOT} onLoadCOTHistory={loadCOTHistoryNow} onLoadLocalCOT={loadLocalCOTHistory} cotLoading={cotLoading} historyLoading={historyLoading} onAutoRetail={autoRetail} retailLoading={retailLoading} retailMeta={retailMeta}/>
        )}

        {tab==="strength"&&(
          <div>
            <div style={{fontSize:11,color:"#8b949e",marginBottom:14}}>
              Celkové skóre = chytré fundamenty + auto COT + contrarian retail + seasonalita · Posledních 15 měsíců
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:10,marginBottom:16}}>
              {CURRENCIES.map(c=><ScoreBreakdown key={c} currency={c} scores={scores}/>)}
            </div>
            <div style={{maxWidth:620}}>
              {CURRENCIES.map(c=><StrengthBar key={c} currency={c} score={scores[c]?.score??0} change7d={getScoreChange(c,7)}/>)}
            </div>
          </div>
        )}

        {tab==="calendar"&&(
          <div style={{maxWidth:700}}>
            <div style={{fontSize:11,color:"#8b949e",marginBottom:14}}>Příštích 14 dní · HIGH & MEDIUM impact</div>
            <CalendarPanel events={upcoming}/>
          </div>
        )}

        {tab==="ai"&&(
          <AIAnalyzerTab scores={scores} selected={selected} pairs={top} onSave={saveAIResult} aiAnalyses={aiAnalyses}/>
        )}

        {tab==="coach"&&(
          <AICoachTab scores={scores} pairs={top} forecasts={forecasts} aiAnalyses={aiAnalyses} cotData={cotData} selected={selected} upcoming={upcoming}/>
        )}
      </div>
      <MarketStatusBar/>
    </div>
  );
}

// ── REACT ERROR BOUNDARY ─────────────────────────────────────
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null,info:null};}
  static getDerivedStateFromError(err){return{err};}
  componentDidCatch(err,info){this.setState({err,info});console.error("App crashed:",err,info);}
  render(){
    if(this.state.err){
      const e=this.state.err;
      return React.createElement('div',{style:{padding:"24px",color:"#f85149",background:"#0d1117",fontFamily:"monospace",whiteSpace:"pre-wrap",fontSize:"11px",lineHeight:"1.6"}},
        "🔴 CHYBA APLIKACE — zkopíruj text níže a pošli ho:\n\n"+
        (e.message||String(e))+"\n\n"+
        (e.stack||"")+"\n\n"+
        (this.state.info?.componentStack||"")
      );
    }
    return this.props.children;
  }
}

window.onerror=function(msg,src,line,col,err){
  var el=document.getElementById("root");
  if(el)el.innerHTML='<div style="padding:24px;color:#f85149;background:#0d1117;font-family:monospace;white-space:pre-wrap;font-size:12px">CHYBA: '+msg+'\nLine: '+line+'\n'+(err&&err.stack?err.stack:'')+'</div>';
  return false;
};
try{
  ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
}catch(err){
  document.getElementById("root").innerHTML='<div style="padding:24px;color:#f85149;background:#0d1117;font-family:system-ui">Aplikace spadla při startu: '+(err&&err.message?err.message:err)+'</div>';
}
</script>
</body>
