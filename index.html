const PAIR_LIST_TYPE={EURUSD:'white',USDJPY:'white',GBPUSD:'white',AUDUSD:'grey',USDCAD:'grey',USDCHF:'black'};
function captureContext(pairSym,pairs,scores,calData,upcoming,aiAnalyses){
  const p=(pairs||[]).find(x=>x.pair===pairSym)||null;
  const diff=p?p.diff:null;
  const band=(typeof getDiffBand==='function')?getDiffBand(diff):null; // jednotná hranice — viz BAND_THRESHOLDS v engine.js
  let dailyLevel='none',flip=false,cbdi=null,cbStage=null;
  try{ if(p) dailyLevel=getPairDailyState(p,scores,calData,upcoming).level; }catch(e){}
  try{ flip=isPairFlipped(pairSym); }catch(e){}
  try{ cbdi=calcCBDI(); }catch(e){}
  try{ cbStage=getCBCycleStage().stage; }catch(e){}
  const ai=(aiAnalyses||{})[pairSym]||null;
  return {diff:diff,dir:p?p.dir:null,conviction:p?p.conviction:null,band:band,dailyLevel:dailyLevel,flip:flip,cbdi:cbdi,cbStage:cbStage,aiBias:ai?ai.bias:null,aiConf:ai?ai.confidence:null,listType:PAIR_LIST_TYPE[pairSym]||'other'};
}
function jStat(list){
  const w=list.filter(t=>t.outcome==='win').length, l=list.filter(t=>t.outcome==='loss').length, be=list.filter(t=>t.outcome==='be').length;
  const dec=w+l, wr=dec?Math.round(w/dec*100):null;
  const rs=list.map(t=>t.outcome==='be'?0:(typeof t.rMultiple==='number'?t.rMultiple:null)).filter(x=>x!=null);
  const sumR=rs.reduce((a,b)=>a+b,0), avgR=rs.length?sumR/rs.length:null;
  const pos=rs.filter(x=>x>0).reduce((a,b)=>a+b,0), neg=Math.abs(rs.filter(x=>x<0).reduce((a,b)=>a+b,0));
  const pf=neg>0?pos/neg:(pos>0?999:null);
  return {n:list.length,w,l,be,wr,sumR,avgR,pf};
}

// ── AI Smart Alerts — no-code natural-language monitoring ──────────────────
// Admin napíše větu ("Upozorni mě, až retail sentiment na AUDUSD klesne z 80 %
// short na 70 % short."), OpenRouter LLM ji rozparsuje na STRUKTUROVANÉ
// pravidlo {metric,targetType,target,op,value}. Appka nemá backend, takže
// samotné sledování na pozadí běží stejně jako Telegram skóre alerty —
// scripts/smart-alerts.js na cronu v data-refresh.yml (15 min), nad
// data/smart_alerts.json. Prohlížeč do toho souboru zapisuje přímo přes
// GitHub Contents API (gh_pat token v Nastavení, admin-only) — stejný no-op
// pro appku jako ostatní API klíče, jen s zápisovým přístupem k tomuhle repu.
const GH_REPO='PitrrV/Fx-Analyzer';
const SMART_ALERT_METRICS=['score','retail_long_pct','retail_short_pct','efficiency_ratio'];
const SMART_ALERT_PCT_METRICS=['retail_long_pct','retail_short_pct'];
// Jak metrika M vyhodnotí "splněno" pro hodnotu v proti pravidlu r — sdíleno
// mezi submitSmartAlert/confirmSmartAlert/setSmartRuleStatus (víc míst dřív
// mělo stejnou ternárku zvlášť — reálný nález, jak vznikají tichá rozjetí
// stejné logiky mezi PC/mobil, viz CLAUDE.md). op2/value2 = volitelná DRUHÁ
// podmínka spojená přes "NEBO" (typicky pro oscilátory mimo rozsah, např.
// "ER klesne pod 0.90 NEBO stoupne nad 0.98").
function smartRuleMet(rule,v){
  if(v==null) return false;
  const test=(op,val)=>op==='gte'?v>=val:v<=val;
  if(rule.op2!=null&&rule.value2!=null) return test(rule.op,rule.value)||test(rule.op2,rule.value2);
  return test(rule.op,rule.value);
}

    +'Odpověz VÝHRADNĚ JSON, žádný další text, žádné markdown bloky (bez ```):\n'

    +'- Potřebuješ upřesnit: {"ok":false,"question":"konkrétní otázka česky"}\n\n'

}

    // z merge mapy, ne chronologické řazení). Dřív to fungovalo náhodou, protože
    // nový obchod se lokálně přidával na začátek pole — po plném cloud re-mergi

  computeSmartValue(rule){
    try{
      if(rule.metric==='score'){
        if(rule.targetType==='currency'){ const d=this.D[rule.target]; return d?parseFloat(d.score.toFixed(2)):null; }
        const p=STANDARD_PAIRS.find(x=>x.pair===rule.target); if(!p) return null;
        const sb=this.D[p.base],sq=this.D[p.quote]; if(!sb||!sq) return null;
        return parseFloat((sb.score-sq.score).toFixed(2));
      }
      if(rule.metric==='retail_long_pct'||rule.metric==='retail_short_pct'){
        const p=STANDARD_PAIRS.find(x=>x.pair===rule.target); if(!p) return null;
        const sentData={}; this.CUR.forEach(c=>{sentData[c]=this.D[c]?this.D[c].retail:50;});
        // Přímá data páru (data/retail_hist.json), když existují — stejné jako
        // dashboard chart widget (jinak appka ukazuje jiné číslo pro stejný pár
        // na dvou místech, viz komentář u getRetailPairData v engine.js).
        const latest=(this._retailHist&&this._retailHist.length)?this._retailHist[this._retailHist.length-1]:null;
        const rd=getRetailPairData(p,sentData,latest&&latest.pairs);
        return rule.metric==='retail_long_pct'?rd.retailLong:rd.retailShort;
      }
      if(rule.metric==='efficiency_ratio'){
        const p=STANDARD_PAIRS.find(x=>x.pair===rule.target); if(!p) return null;
        const er=getEfficiencyRatio(p.pair,10);
        return er?er.er:null;
      }
    }catch(e){}
    return null;

  validateSmartRule(r){
    if(!r||typeof r!=='object') return false;
    if(!SMART_ALERT_METRICS.includes(r.metric)) return false;
    if(r.metric!=='score'&&r.targetType!=='pair') return false;
    if(r.targetType==='currency'&&!this.CUR.includes(r.target)) return false;
    if(r.targetType==='pair'&&!STANDARD_PAIRS.some(p=>p.pair===r.target)) return false;
    if(r.op!=='gte'&&r.op!=='lte') return false;
    if(typeof r.value!=='number'||!isFinite(r.value)) return false;
    if(r.op2!=null){ if(r.op2!=='gte'&&r.op2!=='lte') return false; if(typeof r.value2!=='number'||!isFinite(r.value2)) return false; }
    return true;

  // Sezónní radar — bere přímo TU SAMOU roční průměrnou křivku, co appka už

  // zdarma), a u všech 28 párů hledá švih dno→vrchol (nebo vrchol→dno) kolem

  // stejná křivka.
  //
  // Algoritmus pro každý pár: v okně ±30 obchodních dní kolem dneška najdi
  // index minima a index maxima průměrné křivky. Ten, co je chronologicky
  // dřív, je začátek švihu, druhý konec — směr (RISING/FALLING) plyne z
  // pořadí. "Čistota" švihu = Efficiency Ratio (stejný koncept jako
  // getEfficiencyRatio v engine.js, jen aplikovaný na sezónní průměr místo
  // živé ceny): |čistý pohyb| / součet absolutních denních kroků. 1 = hladká
  // přímka, blízko 0 = rozkolísaný chaos. Práh (ER≥0.6, |pohyb|≥1 %,
  // dnešek uvnitř švihu) kalibrován na reálných datech — EURAUD (referenční
  // příklad) vychází ER 0.68, +1.92 % za 23 dní.
  async loadSeasonalRadar(){
    this.setState({seasRadarBusy:true,seasRadarErr:''});
    try{
      const K=30;
      const now=new Date();
      const settled=await Promise.allSettled(STANDARD_PAIRS.map(async p=>{
        const daily=await fetchFXDailyHistory(p.pair);
        const path=computeWindowAvgPath(daily,1,1,12,31,20);
        if(!path||!path.avg||path.avg.length<2*K) return null;
        const avg=path.avg,dates=path.dates;
        let todayIdx=-1,bestDist=Infinity;
        for(let i=0;i<dates.length;i++){
          const d=new Date(dates[i]); if(isNaN(d)) continue;
          const dist=Math.abs((d.getMonth()+1)-(now.getMonth()+1))*31+Math.abs(d.getDate()-now.getDate());

        if(minIdx===maxIdx) return null;

        let sumAbs=0; for(let i=s+1;i<=e;i++) sumAbs+=Math.abs(avg[i]-avg[i-1]);
        const er=sumAbs?+(Math.abs(net)/sumAbs).toFixed(3):0;

        const sd=new Date(dates[s]),ed=new Date(dates[e]);

          fromM:sd.getMonth()+1,fromD:sd.getDate(),toM:ed.getMonth()+1,toD:ed.getDate(),fromLabel:dates[s],toLabel:dates[e]};
      }));

      // používá pro RP+ER exhaustion signál), dost velký (≥1 %, ne drobný
      // drift) a musí se dneška reálně týkat (containsToday), ne dávno hotový.
      const results=rows.filter(r=>r.containsToday&&r.er>=0.6&&Math.abs(r.net)>=1.0)

  }
